name: Sudoku APP frame branch generator
on:
  push:
    branches: [ "sudoku/app-frame-chess-parity-20261005" ]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate LAB package
        run: |
          node scripts/build-sudoku-pwa.cjs
          node scripts/build-sudoku-pwa.cjs --check
          node --check tests/sudoku-unified-lab-browser.cjs
          node --test tests/sudoku-app-preview.test.cjs
          git diff --check
      - name: Commit generated release bytes
        run: |
          if git diff --quiet -- public/S/new/release.json public/S/new/sw.js; then
            echo "No generated release delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/S/new/release.json public/S/new/sw.js
          git commit -m "chore(sudoku): refresh APP frame release bytes"
          git push
