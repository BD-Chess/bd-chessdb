name: Sudoku APP Coach verify once
# restore-safe rerun
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sudoku-app-coach-verify-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/sudoku --ignore-scripts
      - run: node scripts/build-sudoku-app-preview.cjs --check
      - name: Play runtime
        run: timeout 35s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP phone Play stays simple' tests/sudoku-app-preview.test.cjs
      - name: Settings runtime
        run: timeout 35s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP settings preferences' tests/sudoku-app-preview.test.cjs
      - name: Assist runtime
        run: timeout 35s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP assisted placement' tests/sudoku-app-preview.test.cjs
      - name: Delete runtime
        run: timeout 35s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP delete clears' tests/sudoku-app-preview.test.cjs
      - name: PWA runtime
        run: timeout 45s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit tests/sudoku-app-pwa.test.cjs
      - run: python scripts/check_secret_boundary.py
