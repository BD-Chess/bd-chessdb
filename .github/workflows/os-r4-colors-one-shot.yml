name: One-shot 8Z OS R4 palette controls

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Add one-shot 8Z OS R4 palette controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded palette controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/OS/index.html)" = "8e9d3f0148a99c7cdfa84755509ecd055e6bac93"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/OS/index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new):
              global s
              assert s.count(old)==1, (old[:80], s.count(old))
              s=s.replace(old,new,1)
          one('OS-WEB-20260917-R3','OS-WEB-20260917-R4')
          one('.claustrum-controls input[type=range]{width:118px;accent-color:var(--mint)}', '.claustrum-controls input[type=range]{width:118px;accent-color:var(--mint)}.claustrum-controls input[type=color]{width:31px;height:31px;padding:2px;border:1px solid var(--line);border-radius:3px;background:#0b1014;cursor:pointer}.cl-custom-colors{gap:5px!important}.cl-custom-colors span{color:var(--muted)}')
          old='<div class="claustrum-controls"><button class="button primary" id="cl-run" type="button">Pause</button><button class="button" id="cl-reset" type="button">Reset</button><button class="button" id="cl-display" type="button">Display: enhanced</button><label>Preset <select id="cl-preset"><option value="default">Recovered default · target 15 · u 0</option><option value="u2">Diagnostic · target 15 · u 2</option><option value="target0">Diagnostic · target 0 · u 0</option></select></label><label>Speed <input id="cl-speed" type="range" min="1" max="128" value="18"/><span id="cl-speed-out">18×</span></label></div>'
          new='<div class="claustrum-controls"><button class="button primary" id="cl-run" type="button">Pause</button><button class="button" id="cl-reset" type="button">Reset</button><button class="button" id="cl-display" type="button">Display: enhanced</button><label>Preset <select id="cl-preset"><option value="default">Recovered default · target 15 · u 0</option><option value="u2">Diagnostic · target 15 · u 2</option><option value="target0">Diagnostic · target 0 · u 0</option></select></label><label>Palette <select id="cl-palette"><option value="original">Original VGA</option><option value="neon">8Z Neon</option><option value="matrix">Matrix</option><option value="fire">Fire</option><option value="ice">Ice</option><option value="violet">Violet</option><option value="mono">Mono</option><option value="custom">Custom</option></select></label><button class="button" id="cl-auto-colors" type="button" aria-pressed="false">Auto colors: off</button><label class="cl-custom-colors" id="cl-custom-colors" hidden>Custom <span>A</span><input id="cl-color-a" type="color" value="#00d9ff" aria-label="Custom palette color A"/><span>B</span><input id="cl-color-b" type="color" value="#ff4ecd" aria-label="Custom palette color B"/><span>C</span><input id="cl-color-c" type="color" value="#ffe66d" aria-label="Custom palette color C"/></label><label>Speed <input id="cl-speed" type="range" min="1" max="128" value="18"/><span id="cl-speed-out">18×</span></label></div>'
          one(old,new)
          one('The canvas pixels are computed from source-equivalent state. “Enhanced” only applies a browser display filter above those pixels; switch it off to see the unamplified VGA-style palette.', 'The canvas pixels are computed from source-equivalent state. “Enhanced” only applies a browser display filter above those pixels; switch it off to see the unamplified VGA-style palette. Palette controls likewise change only the browser-side RGB lookup table: framebuffer indices and the mathematical state remain untouched. “Auto colors” cycles display palettes without feeding anything back into the dynamics or controller.')
          old="const core=new ClaustrumCore(),img=ctx.createImageData(W,H),palette=new Uint8ClampedArray(256*3);\nfor(let n=0;n<256;n++){palette[n*3]=Math.floor(n/4)*255/63;palette[n*3+1]=Math.floor(n/8)*255/63;palette[n*3+2]=Math.floor(n/6)*255/63;}"
          new="""const core=new ClaustrumCore(),img=ctx.createImageData(W,H),palette=new Uint8ClampedArray(256*3);
const palettePresets={neon:['#00d9ff','#ff4ecd','#ffe66d'],matrix:['#003b1f','#00ff66','#d7ff7a'],fire:['#5d001e','#ff5e00','#ffe36e'],ice:['#001a66','#00d9ff','#ffffff'],violet:['#24005f','#a94cff','#ffb3f7'],mono:['#202020','#a0a0a0','#ffffff']};
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function setPalette(mode,custom){if(mode==='original'){for(let n=0;n<256;n++){palette[n*3]=Math.floor(n/4)*255/63;palette[n*3+1]=Math.floor(n/8)*255/63;palette[n*3+2]=Math.floor(n/6)*255/63;}return;}const stops=(mode==='custom'?custom:palettePresets[mode]||palettePresets.neon).map(hexRgb);for(let n=0;n<256;n++){if(n===0){palette[0]=palette[1]=palette[2]=0;continue;}const t=Math.min(1,n/63),seg=t<.5?0:1,u=t<.5?t*2:(t-.5)*2,a=stops[seg],b=stops[seg+1],j=n*3;palette[j]=Math.round(a[0]+(b[0]-a[0])*u);palette[j+1]=Math.round(a[1]+(b[1]-a[1])*u);palette[j+2]=Math.round(a[2]+(b[2]-a[2])*u);}}
setPalette('original');"""
          one(old,new)
          old="const el={step:document.getElementById('cl-step'),lz:document.getElementById('cl-lzc'),u:document.getElementById('cl-u'),hist:document.getElementById('cl-history'),state:document.getElementById('cl-state'),meter:document.getElementById('claustrum-meter-fill'),run:document.getElementById('cl-run'),reset:document.getElementById('cl-reset'),display:document.getElementById('cl-display'),preset:document.getElementById('cl-preset'),speed:document.getElementById('cl-speed'),speedOut:document.getElementById('cl-speed-out')};"
          new="const el={step:document.getElementById('cl-step'),lz:document.getElementById('cl-lzc'),u:document.getElementById('cl-u'),hist:document.getElementById('cl-history'),state:document.getElementById('cl-state'),meter:document.getElementById('claustrum-meter-fill'),run:document.getElementById('cl-run'),reset:document.getElementById('cl-reset'),display:document.getElementById('cl-display'),preset:document.getElementById('cl-preset'),palette:document.getElementById('cl-palette'),autoColors:document.getElementById('cl-auto-colors'),customColors:document.getElementById('cl-custom-colors'),colorA:document.getElementById('cl-color-a'),colorB:document.getElementById('cl-color-b'),colorC:document.getElementById('cl-color-c'),speed:document.getElementById('cl-speed'),speedOut:document.getElementById('cl-speed-out')};"
          one(old,new)
          old="el.display.addEventListener('click',()=>{const enhanced=canvas.classList.toggle('enhanced');el.display.textContent='Display: '+(enhanced?'enhanced':'authentic');});"
          new="""el.display.addEventListener('click',()=>{const enhanced=canvas.classList.toggle('enhanced');el.display.textContent='Display: '+(enhanced?'enhanced':'authentic');});
const customValues=()=>[el.colorA.value,el.colorB.value,el.colorC.value];
let autoColors=false,autoColorAt=0;const autoModes=['original','neon','matrix','fire','ice','violet','mono'];
function applyPaletteSelection(){const mode=el.palette.value;el.customColors.hidden=mode!=='custom';setPalette(mode,customValues());render();}
el.palette.addEventListener('change',()=>{autoColors=false;el.autoColors.textContent='Auto colors: off';el.autoColors.setAttribute('aria-pressed','false');applyPaletteSelection();});
[el.colorA,el.colorB,el.colorC].forEach(x=>x.addEventListener('input',()=>{el.palette.value='custom';el.customColors.hidden=false;setPalette('custom',customValues());render();}));
el.autoColors.addEventListener('click',()=>{autoColors=!autoColors;el.autoColors.textContent='Auto colors: '+(autoColors?'on':'off');el.autoColors.setAttribute('aria-pressed',String(autoColors));autoColorAt=0;});"""
          one(old,new)
          old="let last=0;function loop(ts){if(running&&onscreen&&ts-last>=12){const n=Number(el.speed.value);for(let i=0;i<n;i++)core.step();render();hud();last=ts;}requestAnimationFrame(loop);}render();hud();requestAnimationFrame(loop);"
          new="let last=0;function loop(ts){if(autoColors&&onscreen&&(autoColorAt===0||ts-autoColorAt>=3600)){const current=autoModes.indexOf(el.palette.value),next=autoModes[(current+1+autoModes.length)%autoModes.length];el.palette.value=next;el.customColors.hidden=true;setPalette(next);render();autoColorAt=ts;}if(running&&onscreen&&ts-last>=12){const n=Number(el.speed.value);for(let i=0;i<n;i++)core.step();render();hud();last=ts;}requestAnimationFrame(loop);}render();hud();requestAnimationFrame(loop);"
          one(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'OS-WEB-20260917-R4' public/OS/index.html
          grep -q 'Auto colors: off' public/OS/index.html
          grep -q "setPalette('original')" public/OS/index.html
          grep -q 'SELF-CHECK · C++ STEP 64 MATCH' public/OS/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/OS/index.html').read_text(encoding='utf-8')
          a=s.index('<script id="claustrum-live-code">')+len('<script id="claustrum-live-code">')
          b=s.index('</script>',a)
          Path('/tmp/claustrum-r4.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/claustrum-r4.js
          git config user.name "BD-Chess"
          git config user.email "bd@siol.net"
          git add public/OS/index.html
          git commit -m "OS: add manual and automatic live Claustrum palettes"
          git push origin HEAD:main
