name: Sudoku live Pages verification
on:
  push:
    branches: [main]
    paths:
      - 'public/S/new/**'
      - 'public/S/app/**'
      - '.github/workflows/sudoku-live-verify.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact Pages publication and verify live bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bd-chess.github.io/bd-chessdb/S"
          tmp="$(mktemp -d)"
          matched=0
          for i in $(seq 1 36); do
            if curl -fsSL --retry 2 --retry-delay 1 "$BASE/new/release.json?probe=$i" -o "$tmp/new-release.json" && cmp -s "$tmp/new-release.json" public/S/new/release.json; then
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" = 1
          verify () {
            local live="$1" localfile="$2" out="$3"
            curl -fsSL --retry 3 --retry-delay 1 "$live" -o "$tmp/$out"
            cmp "$tmp/$out" "$localfile"
            sha256sum "$tmp/$out"
          }
          verify "$BASE/new/" public/S/new/index.html new-index.html
          verify "$BASE/new/?view=app" public/S/new/index.html new-app-index.html
          verify "$BASE/new/app.html" public/S/new/app.html new-app.html
          verify "$BASE/new/manifest.webmanifest" public/S/new/manifest.webmanifest new-manifest.json
          verify "$BASE/new/release.json" public/S/new/release.json new-release-exact.json
          verify "$BASE/new/sw.js" public/S/new/sw.js new-sw.js
          verify "$BASE/new/presentation/bootstrap.js" public/S/new/presentation/bootstrap.js unified-bootstrap.js
          verify "$BASE/app/" public/S/app/index.html retired-app-index.html
          verify "$BASE/app/release.json" public/S/app/release.json retired-app-release.json
          verify "$BASE/" public/S/index.html current-index.html
          verify "$BASE/old/" public/S/old/index.html previous-index.html
          grep -q '"channel": "LAB"' "$tmp/new-release-exact.json"
          grep -q '"schema": "8ZSUDOKU_APP_RETIREMENT_V1"' "$tmp/retired-app-release.json"
          grep -q 'APP simulation' "$tmp/new-index.html"
          grep -q 'APP is now one source with LAB' "$tmp/retired-app-index.html"
          echo "LIVE_SUDOKU_UNIFIED_EXACT_BYTES_PASS"
