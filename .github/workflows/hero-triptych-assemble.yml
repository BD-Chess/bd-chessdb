name: Assemble hero triptych candidate

on:
  push:
    branches:
      - tmp/hero-triptych-r1
    paths:
      - .github/workflows/hero-triptych-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified landing
        shell: bash
        run: |
          set -euo pipefail
          cat .hero_upload/gz00.b64 .hero_upload/gz01.b64 .hero_upload/gz02.b64 | base64 --decode | gzip -dc > public/index.html
          echo "7a31b1dc4d4ea118819338c17f53392d7ca569e547ce55ad39f39557c8f21973  public/index.html" | sha256sum -c -
          rm -rf .hero_upload .github/workflows/hero-triptych-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble hero triptych candidate"
          git push origin HEAD:tmp/hero-triptych-r1
