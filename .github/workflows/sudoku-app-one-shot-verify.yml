# final optimized Coach verification
name: Sudoku APP one-shot verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sudoku-app-one-shot-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Sudoku test dependency
        run: npm ci --prefix tests/sudoku --ignore-scripts
      - name: Verify generated APP release is current
        run: node scripts/build-sudoku-app-preview.cjs --check
      - name: Static APP contracts
        run: timeout 30s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP preview|APP framed preview|APP phone layout|APP numpad|APP defaults|APP dock|APP iPhone polish|APP build pins' tests/sudoku-app-preview.test.cjs
      - name: Coach default runtime
        run: timeout 40s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP phone Play stays simple' tests/sudoku-app-preview.test.cjs
      - name: Coach preference runtime
        run: timeout 40s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP settings preferences' tests/sudoku-app-preview.test.cjs
      - name: Remaining APP runtime
        run: timeout 60s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit --test-name-pattern='APP assisted placement|APP delete clears' tests/sudoku-app-preview.test.cjs
      - name: Run narrow PWA tests
        run: timeout 90s env NODE_PATH=./tests/sudoku/node_modules node --test --test-force-exit tests/sudoku-app-pwa.test.cjs
      - name: Secret boundary
        run: python scripts/check_secret_boundary.py
