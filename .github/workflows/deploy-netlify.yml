name: Deploy to Netlify production

# TEMPORARY PAUSE: automatic push-triggered Netlify deploys are disabled until
# 2026-10-01 00:01 Europe/Ljubljana. Keep manual workflow_dispatch available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Prepare protected pages for browser password managers
        shell: bash
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/trading-password-shield.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js
          node --check public/Trip/old/004/private-client.js

      - name: Detect configured Netlify token
        id: netlify
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NETLIFY_AUTH_TOKEN is not configured; Netlify deployment is safely skipped."
          fi

      - name: Set up Node 22
        if: steps.netlify.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned runtime dependencies
        if: steps.netlify.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Deploy public site and functions to existing Netlify project
        if: steps.netlify.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir public \
            --functions functions \
            --skip-functions-cache \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "GitHub main ${GITHUB_SHA}" \
            --json > netlify-deploy.json
          node -e 'const d=require("./netlify-deploy.json"); console.log(JSON.stringify({deploy_id:d.deploy_id||d.deployId||null,url:d.url||d.deploy_url||null,logs:d.logs||null}))'
