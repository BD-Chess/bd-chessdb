name: Deploy to Netlify production

# BD approved 2026-10-22: every verified main update; no weekly release window.
# Native Netlify builds stay Stopped; preparation runs on GitHub Actions.
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  push:
    branches: [maintenance/netlify-prebuilt-20261022]
  workflow_dispatch:
    inputs:
      site:
        description: Existing site, or both sites
        type: choice
        default: all
        options: [all, mdlxdcc, bd-chess]
      target_sha:
        description: Optional exact main SHA; defaults to current main
        type: string
      verify_only:
        description: Prepare and test without publishing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'BD-Chess/bd-chessdb' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
      RELEASE_SITE: ${{ inputs.site || 'all' }}
      RELEASE_DIR: ${{ runner.temp }}/netlify-prebuilt
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check source identity and secret boundary before installing dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 scripts/check_secret_boundary.py
          node --check scripts/netlify-auto-release.mjs
          node --test tests/netlify-auto-release.test.mjs
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --no-audit --no-fund
      - name: Reproduce generated OmniCPQ assets and verify the application
        run: |
          node scripts/omnicpq/materialize-icons.mjs
          node scripts/omnicpq/build-shell.mjs
          node --test tests/omnicpq/demo-r4.test.mjs tests/omnicpq/ui-r4.test.mjs
      - name: Prepare protected pages and verify applications without paid calls
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/bd-owner-access-v1.js
          node --check public/js/trading-password-shield.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js
          node tests/mdlxdcc-root-pwa.test.cjs
          node --test tests/mdlxdcc-guide.test.mjs tests/api-check.test.cjs tests/dualframe-pwa.test.mjs tests/dfc-cmarvel-public.test.mjs
      - name: Preflight every function bundle without invoking handlers
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @netlify/zip-it-and-ship-it@16.4.1
          node scripts/omnicpq/check-function-bundles.mjs
      - name: Freeze complete site artifacts and fingerprints
        run: node scripts/netlify-auto-release.mjs prepare "$RELEASE_DIR" "$TARGET_SHA" "$RELEASE_SITE"
      - name: Publish unchanged tested artifacts and verify actual production
        if: github.ref == 'refs/heads/main' && github.event_name != 'push' && inputs.verify_only != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/netlify-auto-release.mjs publish "$RELEASE_DIR"
      - name: Retain manifests and actual release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-prebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/netlify-prebuilt/*.json
            ${{ runner.temp }}/password-manager-compat-report.json
          if-no-files-found: warn
          retention-days: 14
