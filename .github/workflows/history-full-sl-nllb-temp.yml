name: TEMP History full SL NLLB generation
on:
  push:
    branches: [codex/history-full-sl-nllb-20261001-r1]
    paths:
      - 'tools/history_translate_sl.py'
      - '.github/workflows/history-full-sl-nllb-temp.yml'
      - 'public/history/pwa.js'
      - 'public/history/pwa.css'
permissions:
  contents: write
jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/history-full-sl-nllb-20261001-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU translation stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5" sentencepiece beautifulsoup4
      - name: Generate and QA complete Slovenian layer
        run: python tools/history_translate_sl.py
      - name: Commit generated translation and remove temporary workflow
        run: |
          rm .github/workflows/history-full-sl-nllb-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/history/sl-translations.json public/history/sw.js tools/history-sl-translation-report.json .github/workflows/history-full-sl-nllb-temp.yml
          git commit -m "build(history): generate full Slovenian NLLB layer"
          git push origin HEAD:codex/history-full-sl-nllb-20261001-r1
