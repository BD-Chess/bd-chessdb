name: Trip LAB Netlify deploy R1

on:
  push:
    branches:
      - trip-netlify-deploy-r1
    paths:
      - .github/workflows/trip-netlify-deploy-r1.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify production source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c37d95e9042bc3a0de288c66c5a9bed19c746ee3"
          grep -Fq 'value="3600000">1 h' public/Trip/new/index.html
          grep -Fq 'Map/table refresh interval' public/Trip/new/index.html
          grep -Fq '[1000,5000,15000,30000,60000,300000,900000,3600000]' public/Trip/new/app.js
          grep -Fq 'job.lastComparisonRefresh' public/Trip/new/app.js
      - name: Deploy current main to production
        shell: bash
        run: |
          npx -y @netlify/mcp@latest --site-id 17b4124d-c197-4c0a-a711-8b2c08d91088 --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..miqUbqlv9Lbqo7Ba.XIh53XYvZJ4maJREJ-Kq4BJeCFPrmz5KGV1UKNOgZJmDsoPWDrQUgH08_Iq4-KfrfjDEPinwS84h4WpRzKbmua8dwqg8FiPK6rXXoAkE93og-KmHjKG0MG7AF0eAegUS2G6UqIbyDLGetN7muRDrT7z686owLHINLNT5u_tONXKtzoW4iTpcRvXjFsgg3DYzVPqficzUS1B5oQLGp99QGzSQdp2tQG0caVtojO_Dsw56XMsndMnJ-aKvrjntWPtUvOV3DjKu5s3Pl6DxJN3sh00a9bhMInvFKAXevRsbnnAjcgH9aj9eUUzuwbD72KkE6_Hc-vNmcoq5u8uA_Z29pXrHT1dlAO54Kd-QrU-7wgfJ1v0ZFqQcUEsF9PT8NAKLILDAoKjL.pmUgGfCr9Lfuo6DDWVnHAQ"
      - name: Verify live production
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 12); do
            html="$(curl -fsSL --max-time 20 https://www.mdlxdcc.org/trip/new/ || true)"
            app="$(curl -fsSL --max-time 20 https://www.mdlxdcc.org/trip/new/app.js || true)"
            ui="$(curl -fsSL --max-time 20 https://www.mdlxdcc.org/trip/new/ui-text.js || true)"
            if printf '%s' "$html" | grep -Fq 'value="3600000">1 h' \
              && printf '%s' "$html" | grep -Fq 'Map/table refresh interval' \
              && printf '%s' "$app" | grep -Fq '[1000,5000,15000,30000,60000,300000,900000,3600000]' \
              && printf '%s' "$app" | grep -Fq 'job.lastComparisonRefresh' \
              && printf '%s' "$ui" | grep -Fq 'Čas osveževanja mape/tabele'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
