name: Trip LAB live verify R1

on:
  push:
    branches:
      - trip-netlify-deploy-r1
    paths:
      - .github/workflows/trip-netlify-deploy-r1.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Trip LAB content
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 30 https://www.mdlxdcc.org/trip/new/)"
          app="$(curl -fsSL --max-time 30 https://www.mdlxdcc.org/trip/new/app.js)"
          ui="$(curl -fsSL --max-time 30 https://www.mdlxdcc.org/trip/new/ui-text.js)"
          echo "HTML_LABEL=$(printf '%s' "$html" | grep -Foc 'Map/table refresh interval' || true)"
          echo "HTML_5MIN=$(printf '%s' "$html" | grep -Foc 'value=\"300000\">5 min' || true)"
          echo "HTML_15MIN=$(printf '%s' "$html" | grep -Foc 'value=\"900000\">15 min' || true)"
          echo "HTML_1H=$(printf '%s' "$html" | grep -Foc 'value=\"3600000\">1 h' || true)"
          echo "APP_WHITELIST=$(printf '%s' "$app" | grep -Foc '[1000,5000,15000,30000,60000,300000,900000,3600000]' || true)"
          echo "APP_COMPARE_HELPER=$(printf '%s' "$app" | grep -Foc 'refreshComparisonAtSelectedInterval' || true)"
          echo "UI_SL=$(printf '%s' "$ui" | grep -Foc 'Čas osveževanja mape/tabele' || true)"
          printf '%s' "$html" | grep -Fq 'Map/table refresh interval'
          printf '%s' "$html" | grep -Fq 'value="300000">5 min'
          printf '%s' "$html" | grep -Fq 'value="900000">15 min'
          printf '%s' "$html" | grep -Fq 'value="3600000">1 h'
          printf '%s' "$app" | grep -Fq '[1000,5000,15000,30000,60000,300000,900000,3600000]'
          printf '%s' "$app" | grep -Fq 'refreshComparisonAtSelectedInterval'
          printf '%s' "$ui" | grep -Fq 'Čas osveževanja mape/tabele'
