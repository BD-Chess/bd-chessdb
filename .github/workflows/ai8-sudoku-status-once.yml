name: AI8 Sudoku status one-shot

on:
  push:
    branches:
      - ai8-sudoku-status-20260912

permissions:
  contents: write

concurrency:
  group: ai8-sudoku-status-20260912
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Sudoku status transition
        run: node ops/ai8-sudoku-status-once.mjs

      - name: Validate 8Z Control state
        run: node scripts/validate-8z-control-state.js

      - name: Commit verified state and publish to main
        env:
          TARGET_BRANCH: main
          TEMP_BRANCH: ai8-sudoku-status-20260912
        run: |
          set -euo pipefail
          git config user.name "BD-AI8"
          git config user.email "bd@siol.net"
          git add -A -- \
            public/data/BD_MASTER_ARENA_REGISTER_LATEST.json \
            public/data/BD_PROJECT_STATE_LATEST.json \
            public/data/BD_MORNING_DELTA_LATEST.json \
            public/data/BD_MASTER_ARENA_REGISTER_20260912_SUDOKU_FINAL_R1.json \
            public/data/BD_PROJECT_STATE_20260912_SUDOKU_FINAL_R1.json \
            public/data/BD_MORNING_DELTA_20260912_SUDOKU_FINAL_R1.json \
            public/evidence/AI8_Sudoku_R6_HF4_BOUNDED_FINAL_20260912.json \
            .github/workflows/ai8-sudoku-status-once.yml \
            ops/ai8-sudoku-status-once.mjs
          git diff --cached --check
          git commit -m "8Z Control: finalize Sudoku HF4 bounded status"
          git push origin "HEAD:${TARGET_BRANCH}"
          git push origin --delete "${TEMP_BRANCH}" || true
