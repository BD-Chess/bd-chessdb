name: Sudoku Coach final bounded verification
on:
  push:
    branches: ['work/sudoku-coach-final-20260930']
    paths: ['.github/workflows/sudoku-coach-final-20260930.yml']
permissions:
  contents: write
concurrency:
  group: sudoku-coach-final-20260930
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete read-only Coach and regenerate APP
        shell: bash
        run: |
          cat > /tmp/coach-block.js <<'COACH'
           // Coach derives statements only from visible entries, never the solved grid.
           function boardIssue(board,puzzle){
            if(!Array.isArray(board)||board.length!==81||board.some(v=>!Number.isInteger(v)||v<0||v>9))return {kind:'invalid'};
            if(Array.isArray(puzzle)&&puzzle.length===81){for(let i=0;i<81;i++)if(puzzle[i]&&puzzle[i]!==board[i])return{kind:'given',index:i};}
            for(let k=0;k<9;k++){
             const units=[Array.from({length:9},(_,x)=>k*9+x),Array.from({length:9},(_,x)=>x*9+k),Array.from({length:9},(_,x)=>(Math.floor(k/3)*3+Math.floor(x/3))*9+(k%3)*3+x%3)];
             for(let u=0;u<3;u++){const seen=new Map();for(const i of units[u]){const d=board[i];if(!d)continue;if(seen.has(d))return{kind:'duplicate',digit:d,index:i,other:seen.get(d),unit:['row','column','box'][u]};seen.set(d,i);}}
            }
            for(let i=0;i<81;i++)if(!board[i]&&!candidates(board,i).length)return{kind:'empty',index:i};
            return null;
           }
           function coachProof(before,after,index){
            if(!Number.isInteger(index)||index<0||index>=81||boardIssue(before)||boardIssue(after))return null;
            if(before[index]||!after[index]||before.some((v,i)=>i!==index&&v!==after[i]))return null;
            const all=candidateMap(before),cs=all[index],digit=after[index];
            if(!cs.includes(digit))return null;
            if(cs.length===1)return{index,digit,kind:'naked'};
            const unit=hiddenSingle(before,all,index,digit);
            return unit?{index,digit,kind:'hidden',unit}:null;
           }
           let lastBoard=null,lastPuzzle=null,lastSelected=null,lastLanguage=null,coachMoment=null,coachTimer=0,disclosed=null;
           const setText=(node,value)=>{if(node&&node.textContent!==value)node.textContent=value;};
           function setCoachText(text){setText($('appCoachCopy'),text);}
           function resetCoachMoment(){coachMoment=null;clearTimeout(coachTimer);}
           function updateCoach(showCandidates=false){
            const lab=product.view()==='lab',sl=isSl(),padOn=readUiPref('numberPad')==='on',mode=readUiPref('coach'),detail=readUiPref('coachDetail');
            if(numbersPanel)numbersPanel.hidden=lab||!padOn;
            holdTip.hidden=lab||readUiPref('holdTip')!=='on';
            setText(holdTip,sl?'Tapni in drži prazno celico za pojavni izbor številke.':'Tap & hold an empty cell to open the number picker.');
            const diff=difficulty(),allowed=mode==='always'||mode==='easy'&&(!diff||diff==='easy');
            coach.hidden=lab||padOn||mode==='off'||!allowed;
            setText(coach.querySelector('.app-coach-title'),'Sudoku Coach');
            setText($('appCoachWhy'),sl?'Zakaj?':'Why?');setText($('appCoachCandidates'),sl?'Pokaži kandidate':'Show candidates');
            if(coach.hidden){lastBoard=null;disclosed=null;resetCoachMoment();return;}
            let restoreBusy=false;try{restoreBusy=typeof restoring==='number'&&restoring>0;}catch(_){}
            if(restoreBusy){lastBoard=null;resetCoachMoment();$('appCoachWhy').disabled=true;$('appCoachCandidates').disabled=true;setCoachText(sl?'Obnavljam shranjeno igro …':'Restoring your saved game…');return;}
            const state=capture(),board=state?.board;
            if(!Array.isArray(board)||board.length!==81){lastBoard=null;resetCoachMoment();$('appCoachWhy').disabled=true;$('appCoachCandidates').disabled=true;setCoachText(sl?'Izberi težavnost. Pri lahki igri te bom sproti usmerjal.':'Choose a difficulty. On Easy, I’ll guide you as you play.');return;}
            const selected=state.selectedCell,boardKey=board.join(''),puzzleKey=JSON.stringify([state.gameId||'',state.puzzle||[]]);
            const changed=lastBoard?board.map((v,i)=>v===lastBoard[i]?-1:i).filter(i=>i>=0):[];
            const newContext=lastPuzzle!==puzzleKey||lastSelected!==selected||lastLanguage!==sl;
            if(newContext||changed.length){disclosed=null;resetCoachMoment();}
            const issue=boardIssue(board,state.puzzle);
            if(lastBoard&&lastPuzzle===puzzleKey&&changed.length===1&&!issue){
             const proof=coachProof(lastBoard,board,changed[0]);
             if(proof){coachMoment=proof;coachTimer=setTimeout(()=>{coachMoment=null;updateCoach();},5200);}
            }
            lastBoard=board.slice();lastPuzzle=puzzleKey;lastSelected=selected;lastLanguage=sl;
            $('appCoachWhy').disabled=false;$('appCoachCandidates').disabled=true;
            if(issue){
             coach.dataset.state='conflict';
             const unitSL={row:'vrstici',column:'stolpcu',box:'bloku'}[issue.unit],unitEN={row:'row',column:'column',box:'3×3 box'}[issue.unit];
             setCoachText(issue.kind==='duplicate'?(sl?'Številka '+issue.digit+' se ponovi v isti '+unitSL+' ('+rc(issue.other)+' in '+rc(issue.index)+'). Najprej preveri vnos ali uporabi Razveljavi.':'Digit '+issue.digit+' repeats in the same '+unitEN+' ('+rc(issue.other)+' and '+rc(issue.index)+'). Check the entry or use Undo first.'):
              issue.kind==='empty'?(sl?'Za '+rc(issue.index)+' ne ostane noben kandidat. Preveri zadnje vnose; zdaj ni varno sklepati naprej.':'No candidate remains for '+rc(issue.index)+'. Check recent entries before making another deduction.'):
              issue.kind==='given'?(sl?'Začetna številka v '+rc(issue.index)+' ni ohranjena. Preveri obnovljeno igro.':'The given in '+rc(issue.index)+' is not preserved. Check the restored game.'):
              (sl?'Te mreže še ne morem varno razložiti.':'This grid cannot be explained safely yet.'));
             return;
            }
            coach.dataset.state='ready';
            if(board.every(Boolean)){setCoachText(sl?'Mreža je izpolnjena: vsaka vrstica, stolpec in blok vsebuje številke 1–9 brez ponovitev.':'Grid complete: every row, column and box contains 1–9 without repeats.');$('appCoachWhy').disabled=true;return;}
            const emptySelected=Number.isInteger(selected)&&selected>=0&&selected<81&&!board[selected];
            $('appCoachCandidates').disabled=!emptySelected;
            if(showCandidates&&emptySelected)disclosed=boardKey+':'+selected;
            if(emptySelected&&disclosed===boardKey+':'+selected){
             const cs=candidates(board,selected);
             setCoachText((sl?'Kandidati za ':'Candidates for ')+rc(selected)+': '+cs.join(', ')+'. '+(sl?'Dovoljeni glede na sedanje vnose v vrstici, stolpcu in bloku.':'Allowed by the current row, column and box entries.'));return;
            }
            if(coachMoment){
             const p=coachMoment,us={row:'vrstici',column:'stolpcu',box:'bloku'}[p.unit],ue={row:'row',column:'column',box:'3×3 box'}[p.unit];
             setCoachText(p.kind==='naked'?(sl?'Vnos '+p.digit+' v '+rc(p.index)+' sledi golemu posamezniku: glede na prejšnje vnose je ostal en kandidat.':'The '+p.digit+' in '+rc(p.index)+' follows a naked single: the previous entries left one candidate.'):
              (sl?'Vnos '+p.digit+' v '+rc(p.index)+' sledi skritemu posamezniku v '+us+'.':'The '+p.digit+' in '+rc(p.index)+' follows a hidden single in its '+ue+'.'));return;
            }
            if(Number.isInteger(selected)&&selected>=0&&selected<81){
             if(board[selected]){const given=state.puzzle?.[selected]||$('grid')?.children[selected]?.classList.contains('given');setCoachText(given?(sl?'To je začetna številka. Izberi prazno celico.':'That is a given. Choose an empty cell.'):(sl?'Celica je izpolnjena. Izberi prazno celico za pregled kandidatov.':'That cell is filled. Choose an empty cell to examine candidates.'));return;}
             const all=candidateMap(board),cs=all[selected];
             if(cs.length===1){setCoachText(sl?rc(selected)+': v vrstici, stolpcu in bloku izloči že uporabljene številke. Ostane en kandidat — goli posameznik.'+(detail==='detailed'?' S »Pokaži kandidate« preveri, kateri.':''):
              rc(selected)+': eliminate digits already used in its row, column and box. One candidate remains — a naked single.'+(detail==='detailed'?' Use “Show candidates” to check which one.':''));return;}
             for(const d of cs){const unit=hiddenSingle(board,all,selected,d);if(unit){const us={row:'vrstici',column:'stolpcu',box:'3×3 bloku'}[unit],ue={row:'row',column:'column',box:'3×3 box'}[unit];setCoachText(sl?'Primerjaj kandidate v isti '+us+' kot '+rc(selected)+'. Eden je mogoč samo v tej celici — skriti posameznik.':'Compare candidates in the same '+ue+' as '+rc(selected)+'. One candidate can go only here — a hidden single.');return;}}
             setCoachText(sl?rc(selected)+' ima po osnovnem pregledu '+cs.length+' kandidatov. '+(detail==='detailed'?'Primerjaj prazne celice v isti vrstici, stolpcu in bloku; išči številko, ki ima le eno dovoljeno mesto.':'Primerjaj še vrstico, stolpec in blok.'):
              rc(selected)+' has '+cs.length+' candidates after basic checks. '+(detail==='detailed'?'Compare empty cells in the same row, column and box; look for a digit with only one allowed place.':'Compare its row, column and box.'));return;
            }
            const forced=forcedCell(board,candidateMap(board));
            if(forced){setCoachText(sl?'Poskusi '+rc(forced.index)+' — osnovni pregled tam omogoča naslednji logični korak.'+(detail==='detailed'?' Preveri ponovitve in primerjaj kandidate; številke ne vnesem namesto tebe.':''):
             'Try '+rc(forced.index)+' — basic checks identify a logical next step there.'+(detail==='detailed'?' Check used digits and compare candidates; I won’t place the number for you.':''));return;}
            setCoachText(sl?'Izberi prazno celico. Preglej vrstico, stolpec in blok; več kandidatov še ni dokaz za eno številko.':'Choose an empty cell. Check its row, column and box; several candidates do not justify one digit yet.');
           }
          COACH
          python - <<'PY_PATCH'
          from pathlib import Path
          import hashlib
          p=Path('public/S/app/app-ui.js'); raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='ef80953f76d96f618f4f358df891d58a0b467e00', 'APP UI baseline changed'
          s=raw.decode(); start=s.index(' let lastBoard='); end=s.index('\n const sync = () => {', start)
          s=s[:start]+Path('/tmp/coach-block.js').read_text()+s[end:]
          p.write_text(s)
          PY_PATCH
          cat > tests/sudoku-app-coach-final-20260930.test.cjs <<'TEST'
          'use strict';
          // APP-specific learning affordances; actual game/worker stays the packaged donor.
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const {boot,savedFixture,fixture,fixtureSolution,plain,until}=require('./sudoku-ui-harness.cjs');
          const ui=fs.readFileSync('public/S/app/app-ui.js','utf8');
          const start=ui.indexOf(' function candidates('),end=ui.indexOf(' let lastBoard=');
          assert.ok(start>=0&&end>start,'bounded read-only Coach helpers');
          const helpers=vm.runInNewContext(ui.slice(start,end)+'\n({candidates,boardIssue,coachProof})');
          const current=h=>plain(h.w.SudokuNavigator.export().session);
          const txt=h=>h.el('appCoachCopy').textContent;
          const set=(h,id,value)=>{const el=h.el(id);assert.ok(el,id);el.value=value;el.dispatchEvent(new h.w.Event('change',{bubbles:true}));};
          async function ready(t,stored={}){
           const h=await boot(t,stored,{width:390,height:844},{lane:'APP'});
           await h.w.SudokuNavigator.restore(savedFixture('0.2.0'));h.w.stopTimer();
           await until(()=>!/Restoring/.test(txt(h)),'Coach waits for saved-game restore');
           return h;
          }
          async function settings(h){
           h.el('appMore').click();
           await until(()=>h.w.document.querySelector('#navModalBody [data-menu="Settings"]'),'real More menu');
           h.w.document.querySelector('#navModalBody [data-menu="Settings"]').click();
           await until(()=>h.el('appHoldTipSetting'),'actual Settings contains APP preferences');
          }
          test('Coach proof validates the entered digit, rejects conflicts and never mutates its inputs',()=>{
           const before=[...fixture].map(Number),correct=before.slice(),wrong=before.slice();correct[40]=5;wrong[40]=1;
           assert.equal(helpers.boardIssue(before),null);
           assert.deepEqual(Array.from(helpers.candidates(before,40)),[5]);
           assert.equal(helpers.coachProof(before,correct,40)?.kind,'naked');
           assert.equal(helpers.coachProof(before,wrong,40),null,'wrong digit must never earn a naked-single explanation');
           assert.equal(helpers.boardIssue(wrong)?.kind,'duplicate');
           const multi=correct.slice();multi[2]=4;
           assert.equal(helpers.coachProof(before,multi,40),null,'restore/bulk updates are not one player move');
           assert.equal(helpers.boardIssue([1,2])?.kind,'invalid');
           assert.equal(helpers.boardIssue(Array(81).fill(0)),null);
           assert.deepEqual(before,[...fixture].map(Number));
           assert.deepEqual(correct,before.map((n,i)=>i===40?5:n));
          });
          test('actual Settings toggles number pad, Coach and independent hold tip without changing the game',async t=>{
           const h=await ready(t),before=current(h);
           assert.equal(h.el('plNumbers').hidden,true);
           assert.equal(h.el('appHoldTip').hidden,false);
           assert.equal(h.el('appCoach').hidden,false);
           assert.match(h.el('appHoldTip').textContent,/Tap & hold an empty cell/);
           await settings(h);
           assert.equal(h.el('appNumberPad').value,'off');
           assert.equal(h.el('appCoachMode').value,'easy');
           assert.equal(h.el('appCoachDetail').value,'short');
           assert.equal(h.el('appHoldTipSetting').value,'on');
           set(h,'appNumberPad','on');assert.equal(h.el('plNumbers').hidden,false);assert.equal(h.el('appCoach').hidden,true);
           set(h,'appHoldTipSetting','off');assert.equal(h.el('appHoldTip').hidden,true);
           set(h,'appNumberPad','off');assert.equal(h.el('plNumbers').hidden,true);assert.equal(h.el('appCoach').hidden,false);
           set(h,'appCoachMode','off');assert.equal(h.el('appCoach').hidden,true);
           set(h,'appHoldTipSetting','on');assert.equal(h.el('appHoldTip').hidden,false,'tip is independent of Coach');
           set(h,'appCoachMode','always');set(h,'appCoachDetail','detailed');assert.equal(h.el('appCoach').hidden,false);
           set(h,'appHoldTipSetting','off');
           for(const key of ['board','puzzle','notes','history','assistance'])assert.deepEqual(current(h)[key],before[key],key+' unchanged');
           assert.equal(h.w.localStorage.getItem('8zSudoku.app.ui.holdTip'),'off');
           assert.equal(h.w.localStorage.getItem('8zSudoku.app.ui.coach'),'always');
           assert.equal(h.w.localStorage.getItem('8zSudoku.app.ui.coachDetail'),'detailed');
           h.el('navClose').click();h.w.SudokuI18n.set('sl');
           await until(()=>/Tapni in drži prazno/.test(h.el('appHoldTip').textContent),'SL tip stays localized while hidden');
           assert.deepEqual(h.errors,[]);
          });
          test('Coach follows the selected cell, discloses candidates only on request and preserves the board',async t=>{
           const h=await ready(t),before=current(h).board;
           h.el('grid').children[40].click();
           await until(()=>current(h).selectedCell===40&&/naked single/.test(txt(h)),'selected-cell deduction');
           assert.doesNotMatch(txt(h),/only 5|candidate: 5|Candidates for R5C5: 5/,'no automatic answer');
           assert.equal(h.el('appCoachCandidates').disabled,false);
           h.el('appCoachCandidates').click();
           assert.match(txt(h),/Candidates for R5C5: 5\./);
           assert.deepEqual(current(h).board,before);
           h.el('grid').children[0].click();
           await until(()=>/given/.test(txt(h)),'selecting a given replaces stale candidate advice');
           assert.equal(h.el('appCoachCandidates').disabled,true);
           assert.deepEqual(h.errors,[]);
          });
          test('saved UI preferences survive an APP restart and Coach is off for harder games in Easy-only mode',async t=>{
           const saved={'8zSudoku.app.ui.numberPad':'on','8zSudoku.app.ui.holdTip':'off','8zSudoku.app.ui.coach':'easy','8zSudoku.app.ui.coachDetail':'detailed','8zSudoku.ui.language':'sl'};
           const h=await ready(t,saved);
           assert.equal(h.el('plNumbers').hidden,false);assert.equal(h.el('appHoldTip').hidden,true);
           await settings(h);set(h,'appNumberPad','off');h.el('navClose').click();
           const harder=savedFixture('0.2.0');harder.diff='hard';
           await h.w.SudokuNavigator.restore(harder);h.w.stopTimer();
           await until(()=>h.el('appCoach').hidden,'Easy-only Coach does not intrude on Hard');
           assert.equal(h.w.localStorage.getItem('8zSudoku.ui.language'),'sl','LAB preference untouched');
           assert.deepEqual(h.errors,[]);
          });
          TEST
          node --check public/S/app/app-ui.js
          node scripts/build-sudoku-app-preview.cjs
          node scripts/build-sudoku-app-preview.cjs --check
      - name: Install locked test dependency
        run: npm ci --prefix tests/sudoku --ignore-scripts
      - name: APP and Coach acceptance
        run: NODE_PATH=./tests/sudoku/node_modules node --test tests/sudoku-app-preview.test.cjs tests/sudoku-app-pwa.test.cjs tests/sudoku-app-coach-final-20260930.test.cjs
      - name: Integrity and secret boundary
        run: |
          git diff --check
          python scripts/check_secret_boundary.py
      - name: Stage tested source bytes without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY_STAGE'
          import os,json,pathlib,hashlib,urllib.request,subprocess,shutil
          paths=['public/S/app/app-ui.js','public/S/app/app.html','public/S/app/sw.js','public/S/app/release.json','tests/sudoku-app-coach-final-20260930.test.cjs']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<=set(paths),changed
          receipt={'base':'d0ed1b4a239c123c6e4bced79648f8325c9168ee','source_commit':os.environ['GITHUB_SHA'],'files':[],'tests':'PASS','build_check':'PASS','scope':'APP_ONLY','main_updated':False}
          out=pathlib.Path('sudoku-coach-evidence');out.mkdir()
          for path in paths:
              data=pathlib.Path(path).read_bytes(); expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
              assert result['sha']==expected,(path,'blob mismatch')
              receipt['files'].append({'path':path,'sha':expected,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              target=out/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          receipt['release_id']=json.loads(pathlib.Path('public/S/app/release.json').read_text())['release_id']
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('SUDOKU_COACH_CANDIDATE '+json.dumps(receipt))
          PY_STAGE
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-coach-final-evidence
          path: sudoku-coach-evidence/
          retention-days: 14
