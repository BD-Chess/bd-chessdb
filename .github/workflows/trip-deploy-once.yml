name: Trip one-shot hotfix deploy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trip-deploy-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trip-owner-hotfix-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One-shot Trip hotfix deployment and live acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/trip_deploy_once.mjs
