name: Chess LAB unified mobile verification
on:
  pull_request:
    paths:
      - 'public/chess-lab/**'
      - 'public/chess/app/**'
      - 'tools/chess-versioning.mjs'
      - 'tools/build-chess-channel-pwas.py'
      - 'tools/chess-pwa/lab-pwa.js'
      - '.github/workflows/chess-lab-unified.yml'
  push:
    branches: [main]
    paths:
      - 'public/chess-lab/**'
      - 'public/chess/app/**'
      - 'tools/chess-versioning.mjs'
      - 'tools/build-chess-channel-pwas.py'
      - 'tools/chess-pwa/lab-pwa.js'
      - '.github/workflows/chess-lab-unified.yml'
permissions:
  contents: read
jobs:
  unified-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated JS test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/chess-lab-deps" --no-package-lock --ignore-scripts jsdom@26.1.0 fake-indexeddb@6.0.1
          echo "NODE_PATH=$RUNNER_TEMP/chess-lab-deps/node_modules" >> "$GITHUB_ENV"
      - name: Unified desktop/mobile/native and simulation gates
        run: |
          node --test \
            public/chess-lab/research/mobile-unified.test.cjs \
            public/chess-lab/research/desktop-ux.test.cjs \
            public/chess-lab/research/lab-integration.test.cjs \
            public/chess-lab/research/sim-evaluation.test.cjs \
            public/chess-lab/research/eval-bar.test.cjs \
            public/chess-lab/research/sim-runner.test.cjs \
            public/chess-lab/research/study-ui.test.cjs
      - name: PWA release and channel topology
        run: |
          python tools/build-chess-channel-pwas.py --check
          node tools/chess-versioning.mjs
