name: One-shot Soul reader byte-preserving build
on:
  push:
    branches: [soul-reader-build-20260920-r1]
    paths: [.github/workflows/soul-reader-once.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify source, apply bounded patch, store verified blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request, zlib
          repo = 'BD-Chess/bd-chessdb'
          source_commit = '57b803c2ddeb93dc033e4c1a20030e1b98a8c428'
          expected_source = '466b2533610ec29cb05257efb84ac856ce535e82'
          expected_blob = '2798f83c73c645c379dfa06ace37da4d5219bfe3'
          expected_sha256 = 'fad23069b0be2e2b4f3887386a6091252ddab0a25016529bcb3e325d5b2d0bed'
          def blob_hash(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          source_url = 'https://raw.githubusercontent.com/'+repo+'/'+source_commit+'/public/AI8/C_soul.html'
          with urllib.request.urlopen(source_url,timeout=30) as response:
              original = response.read()
          assert blob_hash(original)==expected_source, 'Baseline mismatch; nothing uploaded'
          patch = zlib.decompress(base64.b64decode(''))
          assert len(patch) < 50000
          with tempfile.TemporaryDirectory() as folder:
              folder = pathlib.Path(folder)
              target = folder/'public/AI8/C_soul.html'
              target.parent.mkdir(parents=True)
              target.write_bytes(original)
              (folder/'reader.patch').write_bytes(patch)
              subprocess.run(['git','init','-q',str(folder)],check=True)
              subprocess.run(['git','apply','--check','reader.patch'],cwd=folder,check=True)
              subprocess.run(['git','apply','reader.patch'],cwd=folder,check=True)
              candidate = target.read_bytes()
          assert blob_hash(candidate)==expected_blob, 'Candidate mismatch; nothing uploaded'
          assert hashlib.sha256(candidate).hexdigest()==expected_sha256
          articles = lambda x: re.findall(rb'<article\b[\s\S]*?</article>', x)
          assert articles(original)==articles(candidate) and len(articles(candidate))==29
          assert len(re.findall(rb'<details class="extras-index"', candidate))==1
          assert len(re.findall(rb'<a href="#', candidate.split(b'<nav class="extras-index-list"',1)[1].split(b'</nav>',1)[0]))==19
          payload = json.dumps({'content':base64.b64encode(candidate).decode(),'encoding':'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              result=json.load(response)
          assert result['sha']==expected_blob
          receipt={'blob':result['sha'],'bytes':len(candidate),'sha256':expected_sha256,'preserved_articles':29,'extras_indexes':1,'extras_links':19,'main_modified':False}
          print(json.dumps(receipt))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Verified Soul reader candidate\n\n```json\n'+json.dumps(receipt,indent=2)+'\n```\n')
          PYCODE
