name: Flip4M 2.4.0 live verification
on:
  push:
    branches: ['flip4m/compact-rim-ai-v-ai-20260930-r1']
    paths: ['.github/workflows/flip4m-240-live.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cea721b78b47b57f54f1250b69b7c6a6f0ba75dc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify exact published manifest
        shell: python
        run: |
          import urllib.request,time
          from pathlib import Path
          local=Path('public/F4M/_shared/petrol-2.4.0/build-manifest.json').read_bytes()
          url='https://bd-chess.github.io/bd-chessdb/F4M/_shared/petrol-2.4.0/build-manifest.json?release=cea721b78b47b57f54f1250b69b7c6a6f0ba75dc'
          got=None
          for _ in range(12):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Flip4M-live-verifier'})
                  with urllib.request.urlopen(req,timeout=12) as r: got=r.read()
                  if got==local: break
              except Exception: pass
              time.sleep(5)
          assert got==local, 'published manifest does not match production commit'
      - name: Exercise live compact rim and AI vs AI
        run: python scripts/flip4m_violet/verify_240.py --out flip4m-240-live --base-url https://bd-chess.github.io/bd-chessdb/F4M/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4m-240-live-evidence
          path: flip4m-240-live
          retention-days: 7
