name: AI8 Sudoku HTML one-shot

on:
  push:
    branches:
      - ai8-sudoku-html-20260912

permissions:
  contents: write

concurrency:
  group: ai8-sudoku-html-20260912
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm current production parent
        env:
          EXPECTED_MAIN: 55bf8d72fed5dd2770da0e80e785e1c8c07f6994
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Apply reviewed Sudoku-only HTML correction
        run: node ops/ai8-sudoku-html-once.mjs

      - name: Validate 8Z Control and HTML patch
        run: |
          set -euo pipefail
          node scripts/validate-8z-control-state.js
          git diff --check
          test ! -e ops/ai8-sudoku-html-once.mjs
          test ! -e .github/workflows/ai8-sudoku-html-once.yml

      - name: Commit verified HTML and publish to main
        env:
          TARGET_BRANCH: main
          TEMP_BRANCH: ai8-sudoku-html-20260912
        run: |
          set -euo pipefail
          git config user.name "BD-AI8"
          git config user.email "bd@siol.net"
          git add -A -- \
            public/index-todo.html \
            public/evidence/AI8_Sudoku_R6_HF4_STATUS_PUBLICATION_RECEIPT_20260912.json \
            .github/workflows/ai8-sudoku-html-once.yml \
            ops/ai8-sudoku-html-once.mjs
          git diff --cached --check
          git commit -m "HTML: finalize visible Sudoku R6 status"
          git push origin "HEAD:${TARGET_BRANCH}"
          git push origin --delete "${TEMP_BRANCH}" || true
