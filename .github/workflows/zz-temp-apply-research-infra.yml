name: Apply MDLxDCC research infrastructure content
on:
  push:
    branches: [codex/mdlxdcc-research-infrastructure-20260908]
permissions:
  contents: write
jobs:
  apply-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch and QA
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/research.patch
          git apply --check /tmp/research.patch
          git apply /tmp/research.patch
          git diff --check
          python - <<'PYQA'
          from html.parser import HTMLParser
          from pathlib import Path
          needles = {'public/index-atlas.html':'MDLxDCC.org — AI-assisted research publishing infrastructure','public/BD/index.html':'From AI access to an operating research system','public/index-todo.html':'mal-chatgpt-integration'}
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs): self.ids += [v for k,v in attrs if k == 'id' and v]
          for f,n in needles.items():
              t=Path(f).read_text(encoding='utf-8'); assert n in t; p=P(); p.feed(t); assert len(p.ids)==len(set(p.ids)); assert '</html>' in t.lower()
          print('HTML QA PASS')
          PYQA
      - name: Commit content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index-atlas.html public/BD/index.html public/index-todo.html
          git commit -m 'Present MDLxDCC.org as research infrastructure'
          git push origin HEAD:${GITHUB_REF_NAME}
