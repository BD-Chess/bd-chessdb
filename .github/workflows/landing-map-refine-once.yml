name: Landing map refinement one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-map-refine-once.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine compressed project map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_MAP_REFINEMENT_20260917_R1'
          if marker in s:
              raise SystemExit(0)

          nav='''<!-- LANDING_MAP_REFINEMENT_20260917_R1 -->
<nav class="tools" aria-label="Compressed project map">
<button class="tools-heading" id="tool-more-toggle" type="button" aria-expanded="false" aria-controls="tool-more"><span><span class="en" lang="en">From ideas to experience</span><span class="sl" lang="sl">Iz idej v izkušnjo</span></span><span class="tools-toggle" aria-hidden="true"></span></button>
<div class="tool-rows">
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Apps</span><span class="sl" lang="sl">Aplikacije</span></span><div class="tool-links"><a class="tool-link" href="./Trip/">Trip<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./chess/"><span class="en" lang="en">Chess</span><span class="sl" lang="sl">Šah</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./S/">Sudoku<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./F4M/">Flip 4M<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./CW/">Crosswords<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Core</span><span class="sl" lang="sl">Jedro</span></span><div class="tool-links"><a class="tool-link" href="./crp/8z_MDLxDCC.html">MDL×DCC<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./8Z/8Z_compression.html">8Z<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./AI8/">AI8<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/MDLxDCC-Arenas.html">Arenas<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./OS/index.html">8Z OS<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-more" id="tool-more" hidden>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Research</span><span class="sl" lang="sl">Raziskave</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_CCH_Consciousness_Field.html"><span class="en" lang="en">Consciousness</span><span class="sl" lang="sl">Zavest</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/ToE.html">ToE<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./8zMaterials.html">8zMaterials<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/BD_Trading_Research_Atlas.html">Trading<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/BD_8ZRP.html">TSP<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Systems</span><span class="sl" lang="sl">Sistemi</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_AIM3_RHP.html">AIm3 / RHP<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/BD_AIM3_RHPm.html">RHPm<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/8z_shield_landing.html">8Z Shield<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./index-todo.html">8Z Control<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/Top100I.html"><span class="en" lang="en">Inventions</span><span class="sl" lang="sl">Izumi</span><span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Explore</span><span class="sl" lang="sl">Razišči</span></span><div class="tool-links"><a class="tool-link" href="./index-atlas.html">Atlas<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./index-todo.html"><span class="en" lang="en">Now &amp; next</span><span class="sl" lang="sl">Zdaj in potem</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./Nara/"><span class="en" lang="en">Stories</span><span class="sl" lang="sl">Zgodbe</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./bd/">BD<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./bd/BDR.html">BDR<span class="arrow" aria-hidden="true">↗</span></a></div></div>
</div>
</div>
</nav>'''

          pat=re.compile(r'<nav class="tools" aria-label="Compressed project map">.*?</nav>',re.S)
          s2,n=pat.subn(nav,s,count=1)
          if n!=1:
              raise SystemExit(f'expected one tools nav, got {n}')
          p.write_text(s2,encoding='utf-8',newline='\n')
          PY
      - name: Static acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          assert 'LANDING_MAP_REFINEMENT_20260917_R1' in s
          assert 'id="tool-more-toggle"' in s
          assert '+ Explore more' not in s
          assert '>Crosswords<' in s
          assert 'href="./OS/index.html">8Z OS' in s
          assert 'href="./BD/BD_8ZRP.html">TSP' in s
          assert 'href="./BD/BD_AIM3_RHPm.html">RHPm' in s
          assert s.count('class="tool-row"') >= 5
          PY
      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Refine landing compressed project map"
          git push origin HEAD:main
