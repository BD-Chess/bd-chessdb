name: ChessBest cutover one-shot

on:
  push:
    branches: ["codex/mdl-chessbest-link-cutover-20260912"]
    paths:
      - .github/workflows/chessbest-cutover-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chessbest-cutover-one-shot
  cancel-in-progress: false

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cutover branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point current MDL surfaces to standalone ChessBest.org
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          current_pages = [
              Path('public/index-atlas.html'),
              Path('public/index-todo.html'),
              Path('public/i.html'),
              Path('public/lab.html'),
              Path('public/crp/lab.html'),
              Path('public/indexp.html'),
              Path('public/BD/bd.html'),
              Path('public/BD/index.html'),
              Path('public/w/index.html'),
              Path('public/BD-work-at-a-glance.html'),
              Path('public/index-intro.html'),
              Path('public/index-chess.html'),
              Path('public/Mix/SCORING_PROMPT_FOR_ALL_MODELS2.md'),
          ]

          absolute_replacements = {
              'https://www.mdlxdcc.org/chess.html': 'https://chessbest.org/',
              'https://www.mdlxdcc.org/8zc.html': 'https://chessbest.org/',
              'https://www.mdlxdcc.org/8zc-about.html': 'https://chessbest.org/8zc-about.html',
              'https://www.mdlxdcc.org/8zc-pgn.html': 'https://chessbest.org/8zc-pgn.html',
              'https://www.mdlxdcc.org/8zc-why.html': 'https://chessbest.org/8zc-why.html',
              'https://www.mdlxdcc.org/facts.html': 'https://chessbest.org/facts.html',
              'https://www.mdlxdcc.org/games-info.html': 'https://chessbest.org/games-info.html',
          }
          href_replacements = {
              'chess.html': 'https://chessbest.org/',
              '/chess.html': 'https://chessbest.org/',
              '/chess': 'https://chessbest.org/',
              '/chess/': 'https://chessbest.org/',
              '8zc.html': 'https://chessbest.org/',
              '/8zc.html': 'https://chessbest.org/',
              '/8zc': 'https://chessbest.org/',
              '8zc-about.html': 'https://chessbest.org/8zc-about.html',
              '/8zc-about.html': 'https://chessbest.org/8zc-about.html',
              '8zc-pgn.html': 'https://chessbest.org/8zc-pgn.html',
              '/8zc-pgn.html': 'https://chessbest.org/8zc-pgn.html',
              '8zc-why.html': 'https://chessbest.org/8zc-why.html',
              '/8zc-why.html': 'https://chessbest.org/8zc-why.html',
              'facts.html': 'https://chessbest.org/facts.html',
              '/facts.html': 'https://chessbest.org/facts.html',
              'games-info.html': 'https://chessbest.org/games-info.html',
              '/games-info.html': 'https://chessbest.org/games-info.html',
          }

          changed = []
          for path in current_pages:
              if not path.exists():
                  raise SystemExit(f'Missing expected current surface: {path}')
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in absolute_replacements.items():
                  text = text.replace(old, new)
              for old, new in href_replacements.items():
                  text = text.replace(f'href="{old}"', f'href="{new}"')
                  text = text.replace(f"href='{old}'", f"href='{new}'")
              text = text.replace('<code>/chess.html</code>', '<code>ChessBest.org</code>')
              text = text.replace('<span class="link-path">/chess.html</span>', '<span class="link-path">ChessBest.org</span>')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Experimental /new/ belongs to the new standalone ChessBest domain,
          # but remains deliberately noindex until BD promotes it.
          new_index = Path('public/chess/new/index.html')
          text = new_index.read_text(encoding='utf-8')
          original = text
          text = text.replace('https://www.mdlxdcc.org/chess/new/', 'https://chessbest.org/new/')
          text = text.replace(
              '<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">',
              '<meta name="robots" content="noindex, nofollow, noarchive">',
              1,
          )
          text = text.replace(
              '<meta property="og:site_name" content="BD × AI Lab">',
              '<meta property="og:site_name" content="ChessBest.org">',
              1,
          )
          if text != original:
              new_index.write_text(text, encoding='utf-8')
              changed.append(str(new_index))

          # MDLxDCC keeps /chess/ as a compatibility mirror, while legacy root
          # entry points now send visitors to the canonical ChessBest.org product.
          redirects = Path('public/_redirects')
          text = redirects.read_text(encoding='utf-8')
          redirect_targets = {
              '/chess.html': 'https://chessbest.org/',
              '/chess': 'https://chessbest.org/',
              '/index-chess.html': 'https://chessbest.org/',
              '/8zc.html': 'https://chessbest.org/',
              '/8zc': 'https://chessbest.org/',
              '/8zc-about.html': 'https://chessbest.org/8zc-about.html',
              '/8zc-pgn.html': 'https://chessbest.org/8zc-pgn.html',
              '/8zc-why.html': 'https://chessbest.org/8zc-why.html',
              '/facts.html': 'https://chessbest.org/facts.html',
              '/games-info.html': 'https://chessbest.org/games-info.html',
              '/8zc-headless.js': 'https://chessbest.org/tools/8zc-headless.js',
          }
          for source, target in redirect_targets.items():
              pattern = re.compile(rf'(?m)^{re.escape(source)}\s+\S+\s+301!$')
              text, count = pattern.subn(f'{source:<34} {target} 301!', text)
              if count != 1:
                  raise SystemExit(f'Expected exactly one redirect for {source}; found {count}')
          redirects.write_text(text, encoding='utf-8')
          changed.append(str(redirects))

          # ChessBest has its own sitemap now; remove duplicate product URLs from
          # the MDLxDCC sitemap instead of mixing domains in one sitemap.
          sitemap = Path('public/sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          old_urls = [
              'https://www.mdlxdcc.org/chess.html',
              'https://www.mdlxdcc.org/8zc-about.html',
              'https://www.mdlxdcc.org/8zc-why.html',
              'https://www.mdlxdcc.org/8zc-pgn.html',
              'https://www.mdlxdcc.org/facts.html',
              'https://www.mdlxdcc.org/games-info.html',
          ]
          for url in old_urls:
              pattern = re.compile(
                  r'\n\s*<url>\s*\n?\s*<loc>' + re.escape(url) + r'</loc>.*?</url>\s*',
                  re.S,
              )
              text, count = pattern.subn('\n', text)
              if count != 1:
                  raise SystemExit(f'Expected exactly one sitemap entry for {url}; found {count}')
          sitemap.write_text(text, encoding='utf-8')
          changed.append(str(sitemap))

          # Safety assertions: public search page is Shield-governed and must not
          # be touched by this ordinary link-hygiene cutover.
          assert Path('public/index-search.html').exists()
          assert 'https://www.mdlxdcc.org/chess.html' not in Path('public/index-chess.html').read_text(encoding='utf-8')
          assert 'https://www.mdlxdcc.org/chess/new/' not in new_index.read_text(encoding='utf-8')
          assert 'https://chessbest.org/new/' in new_index.read_text(encoding='utf-8')
          assert '/chess/                         /chess/index.html 200!' in redirects.read_text(encoding='utf-8')
          assert 'https://www.mdlxdcc.org/chess.html' not in sitemap.read_text(encoding='utf-8')

          print('Changed surfaces:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit cutover and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/chessbest-cutover-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Point MDL surfaces to standalone ChessBest.org"
          git push origin HEAD:"${GITHUB_REF_NAME}"
