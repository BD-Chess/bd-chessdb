name: Landing link matrix one-shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/landing-link-matrix-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update landing link matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_LINK_MATRIX_6X5_20260917_R1'
          nav=r'''<!-- LANDING_LINK_MATRIX_6X5_20260917_R1 -->
          <nav class="tools" aria-label="Compressed project map">
          <button class="tools-heading" id="tool-more-toggle" type="button" aria-expanded="false" aria-controls="tool-more"><span><span class="en" lang="en">From ideas to experience</span><span class="sl" lang="sl">Iz idej v izkušnjo</span></span><span class="tools-toggle" aria-hidden="true"></span></button>
          <div class="tool-rows">
          <div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Apps</span><span class="sl" lang="sl">Aplikacije</span></span><div class="tool-links"><a class="tool-link" href="./Trip/">Trip<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./chess/"><span class="en" lang="en">Chess</span><span class="sl" lang="sl">Šah</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./S/">Sudoku<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./F4M/">Flip 4M<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./CW/">Crosswords<span class="arrow" aria-hidden="true">↗︎</span></a><span class="tool-link tool-disabled" aria-disabled="true" aria-label="Shield, coming soon" data-tooltip="Coming soon">Shield</span></div></div>
          <div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Core</span><span class="sl" lang="sl">Jedro</span></span><div class="tool-links"><a class="tool-link" href="./crp/8z_MDLxDCC.html">MDL×DCC<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./AI8/">AI8<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./BD/BD_8ZRP.html">TSP<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./8Z/8Z_compression.html">8Z<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./OS/index.html">8Z OS<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./crp/ToE.html">ToE<span class="arrow" aria-hidden="true">↗︎</span></a></div></div>
          <div class="tool-more" id="tool-more" hidden>
          <div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Research</span><span class="sl" lang="sl">Raziskave</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_CCH_Consciousness_Field.html"><span class="en" lang="en">Consciousness</span><span class="sl" lang="sl">Zavest</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./8zMaterials.html">8zMaterials<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./BD/BD_Trading_Research_Atlas.html">Trading<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./crp/MDLxDCC-Arena-AMR.html">AMR<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./crp/AI8_Sudoku_R6.html">Sudoku Research<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./BD/BD_TSP_6_ARENAS.html">TSP Research<span class="arrow" aria-hidden="true">↗︎</span></a></div></div>
          <div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Systems</span><span class="sl" lang="sl">Sistemi</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_AIM3_RHP.html">AIm3 / RHP<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./BD/BD_AIM3_RHPm.html">RHPm<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./index-todo.html">8Z Control<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./WL/">Wake Lab<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./crp/Top100I.html"><span class="en" lang="en">Inventions</span><span class="sl" lang="sl">Izumi</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./AI8/">AI8 Architecture<span class="arrow" aria-hidden="true">↗︎</span></a></div></div>
          <div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Explore</span><span class="sl" lang="sl">Razišči</span></span><div class="tool-links"><a class="tool-link" href="./index-atlas.html">Atlas<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./index-todo.html"><span class="en" lang="en">Now &amp; next</span><span class="sl" lang="sl">Zdaj in potem</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./Nara/"><span class="en" lang="en">Stories</span><span class="sl" lang="sl">Zgodbe</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./crp/Origin.html"><span class="en" lang="en">History</span><span class="sl" lang="sl">Zgodovina</span><span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./bd/">BD<span class="arrow" aria-hidden="true">↗︎</span></a><a class="tool-link" href="./bd/BDR.html">BDR<span class="arrow" aria-hidden="true">↗︎</span></a></div></div>
          </div>
          </div>
          </nav>'''
          css=r'''
          /* LANDING_LINK_MATRIX_6X5_20260917_R1 */
          .tool-disabled{position:relative;opacity:.44;cursor:default;user-select:none}
          @media(hover:hover) and (pointer:fine){
            .tool-disabled[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:25;white-space:nowrap;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);box-shadow:var(--shadow);font:500 .68rem/1.2 Consolas,monospace;letter-spacing:.03em;text-transform:none}
          }
          @media(min-width:1100px){
            .tool-row .tool-links{display:grid;grid-template-columns:repeat(6,max-content);justify-content:space-between;gap:10px 14px;width:100%}
            .tool-row .tool-link{font-size:1.05rem;gap:7px;white-space:nowrap}
          }
          @media(min-width:701px) and (max-width:1099px){
            .tool-row .tool-links{display:grid;grid-template-columns:repeat(3,max-content);justify-content:space-between;gap:8px 18px;width:100%}
            .tool-row .tool-link{font-size:1rem;gap:7px;white-space:nowrap}
          }
          '''
          nav='\n'.join(line.strip() for line in nav.splitlines())
          css='\n'.join(line.strip() for line in css.splitlines())+'\n'
          if marker not in s:
              pat=re.compile(r'<nav class="tools" aria-label="Compressed project map">.*?</nav>',re.S)
              s,n=pat.subn(nav,s,count=1)
              if n!=1: raise SystemExit(f'expected one tools nav, got {n}')
              if '</style>' not in s: raise SystemExit('style closing tag missing')
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Static acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          assert 'LANDING_LINK_MATRIX_6X5_20260917_R1' in s
          m=re.search(r'<nav class="tools" aria-label="Compressed project map">.*?</nav>',s,re.S); assert m
          nav=m.group(0)
          rows=[ln for ln in nav.splitlines() if '<div class="tool-row">' in ln]
          assert len(rows)==5, len(rows)
          for row in rows:
              n=row.count('class="tool-link"')+row.count('class="tool-link tool-disabled"')
              assert n==6, (n,row[:140])
          assert 'data-tooltip="Coming soon">Shield</span>' in nav
          assert 'href="./crp/ToE.html">ToE' in nav
          assert 'href="./crp/MDLxDCC-Arena-AMR.html">AMR' in nav
          assert 'href="./crp/AI8_Sudoku_R6.html">Sudoku Research' in nav
          assert 'href="./BD/BD_TSP_6_ARENAS.html">TSP Research' in nav
          assert 'href="./WL/">Wake Lab' in nav
          assert 'grid-template-columns:repeat(6,max-content)' in s
          for path in ['public/crp/ToE.html','public/crp/MDLxDCC-Arena-AMR.html','public/crp/AI8_Sudoku_R6.html','public/BD/BD_TSP_6_ARENAS.html','public/WL/index.html','public/crp/Origin.html']:
              assert Path(path).exists(), path
          m2=re.search(r'<script id="landing-runtime">(.*?)</script>',s,re.S); assert m2
          Path('/tmp/landing-runtime.js').write_text(m2.group(1),encoding='utf-8')
          PY
          node --check /tmp/landing-runtime.js
      - name: Commit link matrix
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Expand landing link matrix to six items per row"
          git pull --rebase origin main
          git push origin HEAD:main
