name: DGTE R5 approved production release once

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/dgte-r5-prod-once-20261020.yml ]

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release verified DGTE R5 to MDLxDCC production once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SITE: mdlxdcc
      TARGET_SHA: af23fa3613342fa1ac0d2367fa36d326a2a2b658
      EXPECTED_PUBLISHED_DEPLOY: 6ad72122a9a8b93502dc98a5
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Validate the frozen DGTE source and select MDLxDCC
        shell: bash
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full commit SHA is required.' >&2; exit 1; }
          test "$TARGET_SHA" = "af23fa3613342fa1ac0d2367fa36d326a2a2b658" || exit 1
          case "$RELEASE_SITE" in
            mdlxdcc) echo 'NETLIFY_SITE_ID=17b4124d-c197-4c0a-a711-8b2c08d91088' >> "$GITHUB_ENV" ;;
            bd-chess) echo 'NETLIFY_SITE_ID=deb1dab6-dfad-436e-ae92-4477d873c987' >> "$GITHUB_ENV" ;;
            *) echo 'Unapproved site; no deployment attempted.' >&2; exit 1 ;;
          esac

      - name: Checkout exact reviewed DGTE source commit
        uses: actions/checkout@v4
        with:
          ref: af23fa3613342fa1ac0d2367fa36d326a2a2b658

      - name: Prepare protected pages for browser password managers
        shell: bash
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/trading-password-shield.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js

      - name: Verify root PWA refresh and legacy migration
        run: node tests/mdlxdcc-root-pwa.test.cjs
      - name: Detect configured Netlify token
        id: netlify
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NETLIFY_AUTH_TOKEN is not configured; no deployment attempted." >&2
            exit 1
          fi

      - name: Set up Node 22
        if: steps.netlify.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned runtime dependencies
        if: steps.netlify.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Install isolated image-function dependencies
        if: steps.netlify.outputs.ready == 'true' && hashFiles('functions/package.json') != ''
        run: npm install --prefix functions --no-audit --no-fund

      - name: Verify the public MDLxDCC Guide
        if: steps.netlify.outputs.ready == 'true'
        run: node --test tests/mdlxdcc-guide.test.mjs

      - name: Prepare the correct publish root for the selected site
        if: steps.netlify.outputs.ready == 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ "$RELEASE_SITE" = 'bd-chess' ]; then
            publish_dir="$RUNNER_TEMP/netlify-chess-site"
            mkdir -p "$publish_dir"
            cp -a public/. "$publish_dir/"
            cp -a public/chess/. "$publish_dir/"
            cmp public/chess/index.html "$publish_dir/index.html"
            test -f "$publish_dir/Trip/index.html"
            test -f "$publish_dir/S/index.html"
          else
            publish_dir="$GITHUB_WORKSPACE/public"
          fi
          echo "PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"

      - name: Refuse to overwrite a concurrent production release
        if: steps.netlify.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://api.netlify.com/api/v1/sites/' + process.env.NETLIFY_SITE_ID, {
            headers: {Authorization: 'Bearer ' + process.env.NETLIFY_AUTH_TOKEN}
          });
          if (!response.ok) throw new Error('Production state read failed: HTTP ' + response.status);
          const site = await response.json();
          const actual = site.published_deploy?.id;
          if (actual !== process.env.EXPECTED_PUBLISHED_DEPLOY) {
            throw new Error('Production changed concurrently; release held. No deploy attempted.');
          }
          console.log('Published-deploy guard passed: ' + actual);
          JS

      - name: Deploy public site and functions to existing Netlify project
        if: steps.netlify.outputs.ready == 'true'
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir "$PUBLISH_DIR" \
            --functions functions \
            --skip-functions-cache \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$RELEASE_SITE DGTE R5 scoped snapshot $TARGET_SHA" \
            --json > netlify-deploy.json
          node -e 'const d=require("./netlify-deploy.json"); console.log(JSON.stringify({deploy_id:d.deploy_id||d.deployId||null,url:d.url||d.deploy_url||null,logs:d.logs||null}))'

      - name: Verify published DGTE HTML and every referenced image
        if: steps.netlify.outputs.ready == 'true'
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures, hashlib, json, pathlib, re, urllib.request, urllib.parse
          from html.parser import HTMLParser
          site = 'https://www.mdlxdcc.org'
          source = pathlib.Path('public/crp/DGTE.html').read_text()
          def get(path):
              req = urllib.request.Request(site + path, headers={'Cache-Control':'no-cache','User-Agent':'DGTE-R5-release-verification'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.status, r.read()
          class Tokens(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.tokens=[]; self.assets=set()
              def handle_starttag(self,tag,attrs):
                  values=[]
                  for k,v in attrs:
                      if k=='href' and v:
                          u=urllib.parse.urlsplit(urllib.parse.urljoin(site+'/crp/DGTE.html',v))
                          path=u.path
                          if path.endswith('/index.html'): path=path[:-10]
                          elif path.endswith('.html'): path=path[:-5].lower()
                          v=urllib.parse.urlunsplit((u.scheme,u.netloc,path,u.query,u.fragment))
                      values.append((k,v))
                  self.tokens.append(('start',tag,sorted(values)))
                  a=dict(attrs)
                  if tag=='img':
                      if a.get('src'):self.assets.add(a['src'])
                      for part in a.get('srcset','').split(','):
                          if part.strip():self.assets.add(part.strip().split()[0])
              def handle_endtag(self,tag):self.tokens.append(('end',tag))
              def handle_data(self,d):
                  if d.strip():self.tokens.append(('data',d.strip()))
          expected=Tokens();expected.feed(source)
          status,data=get('/crp/dgte?release=three-designs-20261020-r5')
          actual=Tokens();actual.feed(data.decode())
          if actual.tokens!=expected.tokens:raise RuntimeError('Published HTML differs from reviewed source beyond URL rewrites')
          def verify_asset(rel):
              code,raw=get('/crp/'+rel)
              local=pathlib.Path('public/crp')/rel
              if raw!=local.read_bytes():raise RuntimeError('Asset byte mismatch: '+rel)
              return {'path':rel,'http_status':code,'sha256':hashlib.sha256(raw).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              assets=list(pool.map(verify_asset,sorted(expected.assets)))
          receipt={'release':'three-designs-20261020-r5','source_commit':'af23fa3613342fa1ac0d2367fa36d326a2a2b658','html_status':status,'html_dom_parity':True,'html_tokens':len(actual.tokens),'assets':assets,'browser_interaction':'NOT_RUN','physical_mobile':'NOT_RUN'}
          pathlib.Path('dgte-r5-production-verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'html_dom_parity':True,'assets_exact':len(assets),'release':receipt['release']}))
          PY

      - name: Retain the actual deployment receipt
        if: steps.netlify.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mdlxdcc-${{ github.run_id }}
          path: |
            netlify-deploy.json
            dgte-r5-production-verification.json
          if-no-files-found: error
          retention-days: 30
