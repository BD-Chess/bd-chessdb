name: Shield email gate E2E

on:
  push:
    branches:
      - codex/shield-email-access-20260909

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify Deploy Preview
        shell: bash
        run: |
          set -euo pipefail
          preview='https://deploy-preview-5--chessbd.netlify.app'
          for i in $(seq 1 40); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$preview/index-search.html" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo 'Deploy Preview did not become ready in time.' >&2
          exit 1

      - name: Validate syntax gate and both protected pages
        shell: bash
        run: |
          set -euo pipefail
          preview='https://deploy-preview-5--chessbd.netlify.app'

          invalid_code=$(curl -sSL -o /tmp/invalid.json -w '%{http_code}' \
            -X POST "$preview/api/shield-email-access" \
            -H 'Content-Type: application/json' \
            --data '{"email":"not-an-email","page":"/index-search.html"}')
          test "$invalid_code" = '400'
          python - <<'PY'
          import json
          with open('/tmp/invalid.json', encoding='utf-8') as f:
              x=json.load(f)
          assert x.get('ok') is False and x.get('error')=='email'
          PY

          valid_code=$(curl -sSL -o /tmp/valid.json -w '%{http_code}' \
            -X POST "$preview/api/shield-email-access" \
            -H 'Content-Type: application/json' \
            --data '{"email":"bd@siol.net","page":"/index-search.html"}')
          test "$valid_code" = '200'

          second_code=$(curl -sSL -o /tmp/valid2.json -w '%{http_code}' \
            -X POST "$preview/api/shield-email-access" \
            -H 'Content-Type: application/json' \
            --data '{"email":"bd@siol.net","page":"/crp/8z_MDLxDCC.html"}')
          test "$second_code" = '200'

          python - <<'PY'
          import json,re
          for path in ('/tmp/valid.json','/tmp/valid2.json'):
              with open(path, encoding='utf-8') as f:
                  x=json.load(f)
              assert x.get('ok') is True
              assert re.fullmatch(r'[A-Za-z0-9+/]{43}=', x.get('credential',''))
              assert isinstance(x.get('accessedAt'), str) and x['accessedAt'].endswith('Z')
              assert isinstance(x.get('ip'), str)
          PY

          curl -sSL "$preview/index-search.html" -o /tmp/index-search.html
          curl -sSL "$preview/crp/8z_MDLxDCC.html" -o /tmp/mdlxdcc.html

      - name: Prove returned credential decrypts Shield ciphertext on both pages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');

          const M = (1n << 64n) - 1n;
          class XS {
            constructor(seed) {
              const v = seed & M;
              this.state = v === 0n ? 0x9E3779B97F4A7C15n : v;
            }
            next() {
              let x = this.state;
              x = (x ^ ((x >> 12n) & M)) & M;
              x = (x ^ ((x << 25n) & M)) & M;
              x = (x ^ ((x >> 27n) & M)) & M;
              this.state = x;
              return (x * 2685821657736338717n) & M;
            }
          }
          function b2u(buf) {
            let v = 0n;
            for (const byte of buf) v = (v << 8n) | BigInt(byte);
            return v;
          }
          function u2b(v) {
            const b = Buffer.alloc(8);
            for (let i = 7; i >= 0; i--) { b[i] = Number(v & 0xffn); v >>= 8n; }
            return b;
          }
          function sha(...parts) {
            const h = crypto.createHash('sha256');
            for (const p of parts) h.update(p);
            return h.digest();
          }
          function firstBlob(path) {
            const html = fs.readFileSync(path, 'utf8');
            const m = html.match(/data-8z-blob="([A-Za-z0-9+/=]+)"/);
            if (!m) throw new Error(`No Shield blob in ${path}`);
            return m[1];
          }
          function decrypt(blob64, credential64) {
            const ph = Buffer.from(credential64, 'base64');
            if (ph.length !== 32) throw new Error('credential length');
            const raw = Buffer.from(blob64, 'base64');
            if (raw.length < 60) throw new Error('payload length');
            const salt = raw.subarray(0, 32);
            const iv = raw.subarray(32, 44);
            const encrypted = raw.subarray(44);
            const material = sha(ph, salt, Buffer.from('8Z_AUTH_V1', 'utf8'));
            const rng = new XS(b2u(material.subarray(0, 8)));
            for (let i = 0; i < 1024; i++) rng.next();
            const sh = sha(u2b(rng.state));
            const key = crypto.pbkdf2Sync(Buffer.concat([ph, sh]), salt, 500000, 32, 'sha256');
            const tag = encrypted.subarray(encrypted.length - 16);
            const ct = encrypted.subarray(0, encrypted.length - 16);
            const dec = crypto.createDecipheriv('aes-256-gcm', key, iv);
            dec.setAuthTag(tag);
            const compressed = Buffer.concat([dec.update(ct), dec.final()]);
            const clear = zlib.gunzipSync(compressed).toString('utf8');
            if (!clear.trim()) throw new Error('empty plaintext');
            return clear.length;
          }

          const gate1 = JSON.parse(fs.readFileSync('/tmp/valid.json', 'utf8'));
          const gate2 = JSON.parse(fs.readFileSync('/tmp/valid2.json', 'utf8'));
          if (gate1.credential !== gate2.credential) throw new Error('credential mismatch');
          const n1 = decrypt(firstBlob('/tmp/index-search.html'), gate1.credential);
          const n2 = decrypt(firstBlob('/tmp/mdlxdcc.html'), gate1.credential);
          if (!(n1 > 0 && n2 > 0)) throw new Error('decryption failed');
          console.log('Shield ciphertext decryption passed on both pages; credential/plaintext not printed.');
          NODE
