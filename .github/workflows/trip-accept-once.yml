name: Trip live unlock acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trip-accept-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trip-owner-live-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live Trip owner unlock acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/trip_acceptance_once.mjs
