name: Apply root site search
on:
  push:
    branches: [codex/mdlxdcc-research-infrastructure-20260908]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed root search change
        env:
          APPLY_B64: 
        run: |
          printf '%s' "$APPLY_B64" | base64 -d | gzip -d > /tmp/apply_root_search.py
          python /tmp/apply_root_search.py
          git diff --check
      - name: Static acceptance
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess
          p=Path('public/index.html'); s=p.read_text(encoding='utf-8')
          for needle in ['id="site-search-toggle"','id="site-search-dialog"','id="site-search-runtime"',"fetchText('/sitemap.xml')","fetchText('/index-search.html')"]: assert needle in s, needle
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs): self.ids += [v for k,v in attrs if k=='id' and v]
          h=P(); h.feed(s); assert len(h.ids)==len(set(h.ids))
          m=re.search(r'<script id="site-search-runtime">(.*?)</script>',s,re.S); assert m
          Path('/tmp/site-search-runtime.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/site-search-runtime.js'],check=True)
          print('ROOT SEARCH STATIC QA PASS')
          PY
      - name: Commit root search only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Add site-wide search to root landing'
          git push origin HEAD:${GITHUB_REF_NAME}
