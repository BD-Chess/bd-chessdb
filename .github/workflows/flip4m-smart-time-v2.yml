name: Flip4M Smart Time v2 verification
on:
  push:
    branches: ['flip4m/smart-time-v2-241-20260930-r1']
    paths:
      - 'scripts/flip4m_violet/**'
      - '.github/workflows/flip4m-smart-time-v2.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flip4m/smart-time-v2-241-20260930-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-change APP archive is immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/F4M/app/old/001/index.html)" = "86d028dace1ad80e9cc5053001cb6f4b3d0e44a4"
          test "$(git hash-object public/F4M/app/old/001/manifest.webmanifest)" = "ab15d02ca7d0aa9702a6b6a55d49da3395f989be"
          test "$(git hash-object public/F4M/app/old/001/release.json)" = "5f0adc076da084a33d35f54c21b2c97398680da1"
          test "$(git hash-object public/F4M/app/old/001/sw.js)" = "35864424d710f3e42b73f36eb7a145029147fa92"
      - name: Build immutable Petrol 2.4.1 channels
        run: python scripts/flip4m_violet/build.py --public public
      - name: Smart Time v2 deterministic budget checks
        run: node scripts/flip4m_violet/verify-smart-time-v2.cjs | tee smart-time-v2.jsonl
      - name: Install pinned browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing bounded channel regression
        run: python scripts/flip4m_violet/verify.py --public public --out flip4m-evidence
      - name: Compact rim and AI-vs-AI regression on 2.4.1
        run: python scripts/flip4m_violet/verify_241.py --public public --out flip4m-241-evidence
      - name: Save verified generated outputs and remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          shared='_shared/petrol-2.4.1'
          manifest=json.loads(Path('public/F4M/'+shared+'/build-manifest.json').read_text())
          paths=['public/F4M/'+p for p in manifest]+['public/F4M/'+shared+'/build-manifest.json']
          assert all(p.startswith(('public/F4M/new/','public/F4M/app/','public/F4M/'+shared+'/','public/F4M/PWA/')) for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          protected=['public/F4M/index.html','public/F4M/old','public/chess','public/S','public/F4M/app/old/001']
          assert not subprocess.check_output(['git','diff','HEAD','--',*protected],text=True)
          PY
          git rm .github/workflows/flip4m-smart-time-v2.yml
          git config user.name 'Flip4M scoped builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(flip4m): materialize verified Smart Time v2 2.4.1 [skip ci]'
          git push origin HEAD:flip4m/smart-time-v2-241-20260930-r1
          git rev-parse HEAD > verified-commit.txt
      - name: Package evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json,zipfile,hashlib
          out=Path('flip4m-smart-time-v2-evidence');out.mkdir(exist_ok=True)
          for src in [Path('smart-time-v2.jsonl'),Path('verified-commit.txt')]:
              if src.exists(): (out/src.name).write_bytes(src.read_bytes())
          for src in [Path('flip4m-evidence/verification.json'),Path('flip4m-241-evidence/targeted-verification.json')]:
              if src.exists(): (out/src.name).write_bytes(src.read_bytes())
          manifest=Path('public/F4M/_shared/petrol-2.4.1/build-manifest.json')
          with zipfile.ZipFile(out/'Flip4M_Petrol_2_4_1_SmartTimeV2_candidate.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('scripts/flip4m_violet').glob('*'):
                  if p.is_file(): z.write(p,p.as_posix())
              if manifest.exists():
                  names=list(json.loads(manifest.read_text()))+['_shared/petrol-2.4.1/build-manifest.json']
                  for name in names:
                      p=Path('public/F4M')/name
                      if p.exists(): z.write(p,p.as_posix())
              for p in Path('public/F4M/app/old/001').iterdir():
                  if p.is_file(): z.write(p,p.as_posix())
          zip_path=out/'Flip4M_Petrol_2_4_1_SmartTimeV2_candidate.zip'
          (out/'candidate.sha256').write_text(hashlib.sha256(zip_path.read_bytes()).hexdigest()+'  '+zip_path.name+'\n')
          for folder in (Path('flip4m-evidence'),Path('flip4m-241-evidence')):
              if folder.exists():
                  for p in folder.glob('*.png'): zpath=out/p.name;zpath.write_bytes(p.read_bytes())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4m-smart-time-v2-evidence
          path: flip4m-smart-time-v2-evidence
          retention-days: 7
