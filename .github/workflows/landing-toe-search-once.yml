name: Landing ToE search one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-toe-search-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add ToE to landing search
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_TOE_SEARCH_20260917'
          if marker in s:
              raise SystemExit(0)
          anchor="['crp/MDLxDCC.html','MDL×DCC Explained','mdl dcc mdlxdcc explained domain map metoda razlaga','MDL×DCC explanation and domain map.','Razlaga MDL×DCC in zemljevid domen.'],"
          toe="['crp/ToE.html','8Z × CFH ToE','toe theory of encoding theory of everything 8z cfh cch compression entropy information physics consciousness encoding zavest entropija fizika','8Z × CFH Theory of Encoding research programme.','Raziskovalni program 8Z × CFH Theory of Encoding.'],"
          if toe not in s:
              if anchor not in s: raise SystemExit('search seed anchor not found')
              s=s.replace(anchor,anchor+'\n'+toe,1)
          s=s.replace("text('Trip, MDL×DCC, consciousness…','Trip, MDL×DCC, zavest…')","text('Trip, MDL×DCC, ToE, consciousness…','Trip, MDL×DCC, ToE, zavest…')")
          s=s.replace('<!-- LANDING_COMPRESSED_LINKS_20260917 -->','<!-- LANDING_COMPRESSED_LINKS_20260917 -->\n<!-- LANDING_TOE_SEARCH_20260917 -->',1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit landing search update
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Add ToE to landing search"
          git push origin HEAD:main
