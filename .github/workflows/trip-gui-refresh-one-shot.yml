name: Trip LAB one-shot refresh patch
on:
  push:
    paths:
      - '.github/workflows/trip-gui-refresh-one-shot.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Trip LAB refresh control
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('public/Trip/new/index.html')
          app = Path('public/Trip/new/app.js')
          s = index.read_text()
          old = '<label class="map-refresh-control" for="mapRefreshInterval"><span data-ui-text="Map refresh interval">Map refresh interval</span>\n        <select id="mapRefreshInterval"><option value="1000">1 s</option><option value="5000" selected>5 s</option><option value="15000">15 s</option><option value="30000">30 s</option><option value="60000">1 min</option></select>'
          new = '<label class="map-refresh-control" for="mapRefreshInterval"><span data-ui-text="Map/table refresh interval">Map/table refresh interval</span>\n        <select id="mapRefreshInterval"><option value="1000">1 s</option><option value="5000" selected>5 s</option><option value="15000">15 s</option><option value="30000">30 s</option><option value="60000">1 min</option><option value="300000">5 min</option><option value="900000">15 min</option><option value="3600000">1 h</option></select>'
          assert s.count(old) == 1
          index.write_text(s.replace(old, new))
          s = app.read_text()
          a = "return [1000,5000,15000,30000,60000].includes(selected) ? selected : 5000;"
          b = "return [1000,5000,15000,30000,60000,300000,900000,3600000].includes(selected) ? selected : 5000;"
          assert s.count(a) == 1
          s = s.replace(a,b)
          marker = "  function displayBruteProgress(msg, job) {"
          helper = "  function refreshComparisonAtSelectedInterval(msg, job) {\n    const now = performance.now();\n    if (now - (job.lastComparisonRefresh || 0) < mapRefreshInterval()) return;\n    job.lastComparisonRefresh = now;\n    displayComparison(msg, job);\n  }\n\n"
          assert s.count(marker) == 1
          s = s.replace(marker, helper + marker)
          a = "    displayComparison(msg, job);\n  }\n\n  function showSavings"
          b = "    refreshComparisonAtSelectedInterval(msg, job);\n  }\n\n  function showSavings"
          assert s.count(a) == 1
          s = s.replace(a,b)
          a = "if (msg.type === 'progress') {\n      job.latest = msg; displaySearchProgress(msg, job); refreshBruteMap(msg, job);\n    }"
          b = "if (msg.type === 'progress') {\n      job.latest = msg; displaySearchProgress(msg, job); refreshComparisonAtSelectedInterval(msg, job); refreshBruteMap(msg, job);\n    }"
          assert s.count(a) == 1
          app.write_text(s.replace(a,b))
          PY
          node --check public/Trip/new/app.js
          grep -q 'value="300000">5 min' public/Trip/new/index.html
          grep -q 'value="900000">15 min' public/Trip/new/index.html
          grep -q 'value="3600000">1 h' public/Trip/new/index.html
          grep -q 'refreshComparisonAtSelectedInterval' public/Trip/new/app.js
      - name: Commit surgical patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trip-gui-refresh-one-shot.yml
          git add public/Trip/new/index.html public/Trip/new/app.js
          git diff --cached --check
          git commit -m 'Trip LAB: share map and comparison refresh interval'
          git push origin HEAD:main
