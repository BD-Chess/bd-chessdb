name: Trip LAB one-shot refresh patch
on:
  push:
    paths:
      - '.github/workflows/trip-gui-refresh-one-shot.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize Trip LAB shared refresh control
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('public/Trip/new/index.html')
          app = Path('public/Trip/new/app.js')
          h = index.read_text()
          assert 'Map/table refresh interval' in h
          for v,label in [('300000','5 min'),('900000','15 min'),('3600000','1 h')]:
              assert f'value="{v}">{label}' in h
          s = app.read_text()
          old = 'return [1000,5000,15000,30000,60000].includes(selected) ? selected : 5000;'
          new = 'return [1000,5000,15000,30000,60000,300000,900000,3600000].includes(selected) ? selected : 5000;'
          if old in s:
              s = s.replace(old,new,1)
          assert new in s
          helper = "  function refreshComparisonAtSelectedInterval(msg, job) {\n    const now = performance.now();\n    if (now - (job.lastComparisonRefresh || 0) < mapRefreshInterval()) return;\n    job.lastComparisonRefresh = now;\n    displayComparison(msg, job);\n  }\n\n"
          marker = '  function displayBruteProgress(msg, job) {'
          if 'function refreshComparisonAtSelectedInterval' not in s:
              assert s.count(marker) == 1
              s = s.replace(marker,helper+marker,1)
          a = "    displayComparison(msg, job);\n  }\n\n  function showSavings"
          b = "    refreshComparisonAtSelectedInterval(msg, job);\n  }\n\n  function showSavings"
          if a in s:
              s = s.replace(a,b,1)
          assert b in s
          a = "job.latest = msg; displaySearchProgress(msg, job); displayComparison(msg, job); refreshBruteMap(msg, job);"
          b = "job.latest = msg; displaySearchProgress(msg, job); refreshComparisonAtSelectedInterval(msg, job); refreshBruteMap(msg, job);"
          if a in s:
              s = s.replace(a,b,1)
          assert b in s
          app.write_text(s)
          PY
          node --check public/Trip/new/app.js
          git diff --check
      - name: Commit final patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trip-gui-refresh-one-shot.yml
          git add public/Trip/new/index.html public/Trip/new/app.js
          git diff --cached --check
          git commit -m 'Trip LAB: throttle comparison with map refresh setting'
          git push origin HEAD:main
