name: Sudoku unified LAB APP
on:
  push:
    branches: [ "sudoku/unified-lab-app-20261002" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned DOM test dependency
        run: npm ci --prefix tests/sudoku
      - name: Generate exact unified packages
        run: |
          node scripts/build-sudoku-pwa.cjs
          node scripts/build-sudoku-app-retirement.cjs
          node scripts/build-sudoku-pwa.cjs --check
          node scripts/build-sudoku-app-retirement.cjs --check
          node --check public/S/new/presentation/bootstrap.js
          node --check public/S/new/presentation/app-ui.js
          node --check public/S/new/presentation/app-solve-playback.js
          node --check public/S/new/presentation/pwa.js
          git diff --check
      - name: Focused Node regression
        env:
          NODE_PATH: ${{ github.workspace }}/tests/sudoku/node_modules
        run: |
          node --test tests/sudoku-unified-lab-app.test.cjs tests/sudoku-app-preview.test.cjs tests/sudoku-app-pwa.test.cjs tests/sudoku-app-coach-final-20260930.test.cjs tests/sudoku-engine-core.test.cjs tests/sudoku-engine-proof.test.cjs tests/sudoku-play-learn.test.cjs tests/sudoku-pwa.test.cjs tests/sudoku-desktop-hold.test.cjs
      - name: Install browser engines
        run: |
          mkdir -p /tmp/sudoku-pw
          cd /tmp/sudoku-pw
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Unified presentation browser acceptance
        shell: bash
        env:
          NODE_PATH: /tmp/sudoku-pw/node_modules
          SUDOKU_EVIDENCE_DIR: ${{ runner.temp }}/sudoku-unified-evidence
        run: |
          set -o pipefail
          mkdir -p ${{ runner.temp }}/sudoku-unified-evidence
          node tests/sudoku-unified-lab-browser.cjs | tee ${{ runner.temp }}/sudoku-unified-evidence/unified-browser.log
          node tests/sudoku-app-boot-r4-browser.cjs | tee ${{ runner.temp }}/sudoku-unified-evidence/app-boot.log
          node tests/sudoku-app-sensor-guide-browser.cjs | tee ${{ runner.temp }}/sudoku-unified-evidence/sensor-guide.log
      - name: Secret boundary
        run: python3 scripts/check_secret_boundary.py
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-unified-lab-app-evidence
          path: ${{ runner.temp }}/sudoku-unified-evidence
          if-no-files-found: ignore
      - name: Commit generated package bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/sudoku/unified-lab-app-20261002'
        run: |
          if git diff --quiet -- public/S/new/app.html public/S/new/release.json public/S/new/sw.js public/S/app/release.json public/S/app/sw.js; then echo "Generated bytes already committed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/S/new/app.html public/S/new/release.json public/S/new/sw.js public/S/app/release.json public/S/app/sw.js
          git commit -m "chore(sudoku): refresh unified generated packages"
          git push
