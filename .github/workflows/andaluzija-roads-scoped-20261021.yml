name: Andaluzija roads production read-only audit
# The owner-authorized production releases are complete. Deploy capability retired.
# This retained audit cannot create, change, restore or publish a Netlify deploy.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-roads-scoped-20261021.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'ANDALUZIJA-ROADS-AUDIT')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install bounded read-only browser checker
        run: npm install --prefix /tmp/roads-browser-tools --ignore-scripts --no-audit --no-fund playwright@1.58.0
      - name: Verify final deployed asset and fullscreen AI without paid calls
        env:
          NODE_PATH: /tmp/roads-browser-tools/node_modules
          ANDALUZIJA_TEST_CHROMIUM: /usr/bin/google-chrome
          ANDALUZIJA_STATIC_SMOKE_ONLY: '1'
          ANDALUZIJA_AUDIT_DEPLOY: 6ad8f36a5dbc88a9b9653680
        run: node tests/andaluzija-roads-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-roads-final-audit-${{ github.run_id }}
          path: roads-release-evidence/
          if-no-files-found: warn
          retention-days: 30
