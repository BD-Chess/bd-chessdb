name: ToE v0.4 one-shot public verification
# Netlify's automatic-deploy pause is preserved. The one-shot Netlify attempt
# stopped before deployment because NETLIFY_AUTH_TOKEN was unavailable.
# This follow-up is READ ONLY and verifies the existing Pages/public routes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/toe-v04-publish-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify ToE v0.4 public endpoints after existing Pages deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public endpoints and report exact evidence
        shell: python
        run: |
          import hashlib,json,urllib.request,urllib.error
          expected='0df0a1d70e5251d424657ef5364606dceafca721f00a5953f6e2e5e595c0aa34'
          urls=['https://www.mdlxdcc.org/crp/ToE.html','https://www.mdlxdcc.org/crp/ToE.html?toe_v04_release=78d4df2434628efe73fc743d9917c1e7a4350367','https://bd-chess.github.io/bd-chessdb/crp/ToE.html']
          for url in urls:
              row={'url':url,'expected_sha256':expected}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BD-ToE-release-verification/0.4','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read(500001)
                      text=raw.decode('utf-8','replace')
                      digest=hashlib.sha256(raw).hexdigest()
                      row.update(status=response.status,final_url=response.url,bytes=len(raw),sha256=digest,exact_match=digest==expected,has_v04='ToE v0.4' in text,has_payload='6923.9339891374' in text,has_next_action='Does the representation help us choose' in text)
              except Exception as e:
                  row.update(error=type(e).__name__+': '+str(e))
              print('::notice title=ToE v0.4 public endpoint::'+json.dumps(row,separators=(',',':')))
