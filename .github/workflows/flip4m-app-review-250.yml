name: Flip4M APP Review 2.5.0 verification
on:
  push:
    branches: ['flip4m/app-review-250-20261001-r1']
    paths:
      - 'scripts/flip4m_violet/review-2.5.0.*'
      - 'scripts/flip4m_violet/upgrade_review_250.py'
      - 'scripts/flip4m_violet/verify_review_250.py'
      - '.github/workflows/flip4m-app-review-250.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flip4m/app-review-250-20261001-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize APP-only Review 2.5.0
        run: python scripts/flip4m_violet/upgrade_review_250.py --public public
      - name: Install bounded browser dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify Review behavior
        run: python scripts/flip4m_violet/verify_review_250.py --public public --out flip4m-review-evidence
      - name: Commit only verified APP release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/F4M/_shared/petrol-2.5.0 public/F4M/app/index.html public/F4M/app/manifest.webmanifest public/F4M/app/release.json public/F4M/app/sw.js
          test -z "$(git diff --cached --name-only | grep -Ev '^(public/F4M/_shared/petrol-2\.5\.0/|public/F4M/app/(index\.html|manifest\.webmanifest|release\.json|sw\.js)$)' || true)"
          test -z "$(git diff HEAD -- public/F4M/app/old/002 public/F4M/new public/F4M/index.html public/F4M/old public/chess public/S)"
          git rm .github/workflows/flip4m-app-review-250.yml
          git config user.name 'Flip4M scoped builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(flip4m): materialize verified APP Review 2.5.0 [skip ci]'
          git push origin HEAD:flip4m/app-review-250-20261001-r1
          git rev-parse HEAD > flip4m-review-evidence/verified-commit.txt
      - name: Package evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import zipfile,hashlib,json
          out=Path('flip4m-review-evidence');out.mkdir(exist_ok=True)
          zpath=out/'Flip4M_APP_Review_2_5_0_candidate.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for base in [Path('scripts/flip4m_violet')]:
                  for p in base.glob('*review*'):
                      if p.is_file(): z.write(p,p.as_posix())
              for p in Path('public/F4M/_shared/petrol-2.5.0').glob('*'):
                  if p.is_file(): z.write(p,p.as_posix())
              for name in ['index.html','manifest.webmanifest','release.json','sw.js']:
                  p=Path('public/F4M/app')/name
                  if p.exists(): z.write(p,p.as_posix())
              for name in ['index.html','manifest.webmanifest','release.json','sw.js']:
                  p=Path('public/F4M/app/old/002')/name
                  if p.exists(): z.write(p,p.as_posix())
          (out/'candidate.sha256').write_text(hashlib.sha256(zpath.read_bytes()).hexdigest()+'  '+zpath.name+'\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4m-app-review-250-evidence
          path: flip4m-review-evidence
          retention-days: 7
