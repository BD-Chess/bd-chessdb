name: Andaluzija page navigation and skill scoped production R2

# BD explicitly authorized production publication after the login and Shield checks.
# A one-shot path guard leaves the normal manual/weekly release policy unchanged.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-navigation-scoped-20261021-r2.yml]

permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'ANDALUZIJA-NAV-PROD-R2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: livebase
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout published base source
        uses: actions/checkout@v4
        with:
          ref: e8c7505f222ec3f8c1403b57a002a36222d041cf
          path: livebase
          persist-credentials: false
      - name: Checkout already published DGTE overlay
        uses: actions/checkout@v4
        with:
          ref: 9f25323895e6e1dd305a4daa88cba93c8f808753
          path: published-dgte
          persist-credentials: false
          sparse-checkout: public/crp
      - name: Checkout exact already published Andaluzija source
        uses: actions/checkout@v4
        with:
          ref: 0651335601f1fb0822a9c7bcab08261899b84651
          path: published-andaluzija
          persist-credentials: false
          sparse-checkout: |
            public/BD/O/izleti
            functions
      - name: Checkout exact reviewed Andaluzija source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: incoming
          persist-credentials: false
          sparse-checkout: |
            public/BD/O/izleti
            public/ai/skills
            public/Trip/new
            functions
            tests
            scripts
      - name: Verify current production and prepare only the scoped overlay
        run: python3 ../incoming/scripts/deploy-andaluzija-navigation-20261021.py prepare
      - name: Apply established production preparation
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node tests/mdlxdcc-root-pwa.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: livebase/package-lock.json
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts && npm ci --prefix functions --ignore-scripts
      - name: Verify the composed production functions
        run: node --test tests/andaluzija-page.test.mjs tests/andaluzija-ai.test.mjs tests/mdlxdcc-guide.test.mjs tests/mdlxdcc-guide-access.test.mjs
      - name: Recheck live base and publish once
        run: |
          python3 ../incoming/scripts/deploy-andaluzija-navigation-20261021.py preflight
          npx --yes netlify-cli@27.14.0 deploy --prod --no-build --dir public --functions functions --skip-functions-cache --site "$NETLIFY_SITE_ID" --message "Andaluzija navigation and skill 1.1 $SOURCE_SHA over published Andaluzija auth 0651335601f1fb0822a9c7bcab08261899b84651 and DGTE R8 and published e8c7505f222ec3f8c1403b57a002a36222d041cf" --json > netlify-deploy.json
      - name: Verify preservation of existing production functions
        run: python3 ../incoming/scripts/deploy-andaluzija-navigation-20261021.py receipt
      - name: Retain exact release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andaluzija-navigation-production-${{ github.run_id }}
          path: |
            livebase/andaluzija-release-scope.json
            livebase/andaluzija-release-receipt.json
            livebase/netlify-deploy.json
          if-no-files-found: warn
          retention-days: 30
