name: Andaluzija protected flights and portrait correction
# One owner-authorized five-file overlay. Normal Netlify Git CD remains unchanged.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-corrections-scoped-20261021.yml]
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'ANDALUZIJA-CORRECTIONS-RELEASE')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ALBUM_FROZEN_ROOT: /tmp/andaluzija-frozen-functions
      ALBUM_NETLIFY_TOOLS: /tmp/album-netlify-tools
      ANDALUZIJA_TEST_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin verified package manager
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies and bounded browser checker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/corrections-browser-tools --ignore-scripts --no-audit --no-fund playwright@1.58.0
      - name: Verify only changed calculator, privacy and portrait views with synthetic data
        env:
          NODE_PATH: /tmp/corrections-browser-tools/node_modules
        run: |
          node --test tests/andaluzija-corrections.test.mjs tests/andaluzija-page.test.mjs
          node tests/andaluzija-portrait-corrections-browser.mjs
      - name: Reconstruct exact published functions
        run: python3 scripts/prepare-andaluzija-legacy-functions-20261021.py
      - name: Install pinned packaging dependencies
        run: |
          npm ci --prefix "$ALBUM_FROZEN_ROOT" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$ALBUM_FROZEN_ROOT/functions" --ignore-scripts --no-audit --no-fund
          npm install --prefix "$ALBUM_NETLIFY_TOOLS" --ignore-scripts --no-audit --no-fund netlify-cli@27.14.0
      - name: Reproduce all unchanged production package hashes
        run: |
          node scripts/bundle-andaluzija-legacy-functions-20261021.mjs
          python3 scripts/prepare-andaluzija-roads-functions-20261021.py
          ANDALUZIJA_BUNDLE_NAME=bundled-upgrade node scripts/bundle-andaluzija-legacy-functions-20261021.mjs
      - name: Publish only the five reviewed static files
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: python3 scripts/deploy-andaluzija-corrections-20261021.py
      - name: Verify actual production without provider calls or private login
        env:
          NODE_PATH: /tmp/corrections-browser-tools/node_modules
          ANDALUZIJA_STATIC_SMOKE_ONLY: '1'
        run: |
          export ANDALUZIJA_AUDIT_DEPLOY="$(node -p 'JSON.parse(require("fs").readFileSync("corrections-release-evidence/receipt.json","utf8")).deploy_id')"
          node tests/andaluzija-roads-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-corrections-${{ github.run_id }}
          path: |
            corrections-release-evidence/
            roads-release-evidence/
          if-no-files-found: warn
          retention-days: 30
