name: Andaluzija corrections production read-only audit
# Owner-authorized release completed. No deploy capability or Netlify token remains.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-corrections-scoped-20261021.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'ANDALUZIJA-CORRECTIONS-AUDIT')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install bounded read-only checker
        run: npm install --prefix /tmp/corrections-browser-tools --ignore-scripts --no-audit --no-fund playwright@1.58.0
      - name: Verify published UI without provider calls or private login
        env:
          NODE_PATH: /tmp/corrections-browser-tools/node_modules
          ANDALUZIJA_TEST_CHROMIUM: /usr/bin/google-chrome
          ANDALUZIJA_STATIC_SMOKE_ONLY: '1'
          ANDALUZIJA_AUDIT_DEPLOY: 6ad8fdba3b039f12725513a2
        run: node tests/andaluzija-roads-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-corrections-audit-${{ github.run_id }}
          path: roads-release-evidence/
          if-no-files-found: warn
          retention-days: 30
