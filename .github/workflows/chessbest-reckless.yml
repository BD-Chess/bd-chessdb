name: ChessBest Reckless pinned browser build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Standard public-repository runner; no larger or paid runner/service.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust and wasm-bindgen toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.93.0 install wasm-bindgen-cli --version 0.2.123 --locked
      - name: Build actual single-thread SIMD Reckless and verify its network
        shell: bash
        run: |
          bash public/chess-lab/engines/reckless/v0.10.0-a6fa482c-r8/build.sh "$RUNNER_TEMP/reckless-source" "$RUNNER_TEMP/reckless-browser"
          cp public/chess-lab/engines/reckless/v0.10.0-a6fa482c-r8/reckless-corresponding-source.tar.gz "$RUNNER_TEMP/reckless-browser/"
          cp public/chess-lab/engines/reckless/v0.10.0-a6fa482c-r8/manifest.json "$RUNNER_TEMP/reckless-browser/committed-manifest.json"
          node --check "$RUNNER_TEMP/reckless-browser/adapter.mjs"
          node --check "$RUNNER_TEMP/reckless-browser/reckless-engine.js"
          node --check "$RUNNER_TEMP/reckless-browser/reckless-worker.js"
      - uses: actions/upload-artifact@v4
        with:
          name: chessbest-reckless-browser-a6fa482c
          path: ${{ runner.temp }}/reckless-browser/
          retention-days: 30
