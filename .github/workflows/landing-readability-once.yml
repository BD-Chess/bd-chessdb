name: Landing readability one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-readability-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase landing readability
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* LANDING_READABILITY_150_20260917 */'
          if marker in s:
              raise SystemExit(0)
          css=r'''
          /* LANDING_READABILITY_150_20260917 */
          @media(min-width:701px){
          .brand-sub{font-size:.96rem}.utility{font-size:1.125rem}.languages .utility{font-size:1.05rem}.eyebrow{font-size:.975rem}.lead{font-size:1.425rem;line-height:1.65;max-width:39ch}.idea>summary{font-size:1.32rem}.idea-copy{font-size:1.245rem;line-height:1.65}.study-top{font-size:.93rem}.art-label{font-size:13.5px}.art-label-main{font-size:16.5px}.view-switch button{font-size:1.065rem}.study-rule{font-size:1.11rem}.study-note{font-size:1.02rem}.study .fine{font-size:.87rem}.tools-heading{font-size:.945rem}.tool-link{font-size:1.365rem}.tool-link .num{font-size:.915rem}.original>summary{font-size:1.2rem}.summary-note{font-size:.915rem}.original-top,.original-grid p{font-size:1.1rem}.original-grid .door-label{font-size:.9rem}.footer{font-size:1rem}
          }
          @media(max-width:700px){
          :root[data-theme=light]{--muted:#465d54;--line:#aebcaf}.brand-mark{font-size:1.2rem}.utility{font-size:.88rem}.languages .utility{font-size:.82rem}.eyebrow{font-size:.8rem}.lead{font-size:1.16rem;line-height:1.7}.idea>summary{font-size:1.08rem}.idea-copy{font-size:1rem;line-height:1.7}.study-top{font-size:.76rem}.art-label{font-size:10.5px}.art-label-main{font-size:12.5px}.view-switch button{font-size:.86rem}.study-rule{font-size:.86rem}.study-note{font-size:.84rem}.study .fine{font-size:.7rem}.tools-heading{font-size:.78rem}.tool-link{font-size:1.12rem}.original>summary{font-size:.95rem}.summary-note{font-size:.78rem}.original-top{font-size:.95rem}.original-grid p{font-size:.95rem}.original-grid .door-label{font-size:.72rem}.footer{font-size:.86rem}
          }
          '''
          pos=s.find('</style>')
          if pos<0: raise SystemExit('main style closing tag not found')
          s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit production landing readability
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Improve landing readability on desktop and mobile"
          git push origin HEAD:main
