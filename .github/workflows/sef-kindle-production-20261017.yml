name: Owner-authorized Sef Kindle encrypted correction 20261017
on:
  push:
    branches: [main]
    paths:
      - 'public/BD/O/sef.js'
      - 'public/BD/O/sef-kindle.json'
      - 'public/BD/O/sef-kindle-20261017-r1.enc.txt'
      - 'scripts/sef-kindle-production-20261017.mjs'
      - '.github/workflows/sef-kindle-production-20261017.yml'
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  release:
    if: "${{ startsWith(github.event.head_commit.message, 'release: sef-kindle 20261017-r1') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify encrypted publication boundary
        run: |
          node --check public/BD/O/sef.js
          node --check scripts/sef-kindle-production-20261017.mjs
          python3 scripts/check_secret_boundary.py
      - name: Verify that only the three approved public source files differ from production
        run: |
          git fetch --no-tags --depth 1 origin 95905176c313c2c3577d242bb55d5d3e2af594d2
          node scripts/sef-kindle-production-20261017.mjs --snapshot
      - name: Prepare the same password-manager integration as the existing production release
        run: python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/sef-password-manager.json"
      - name: Verify the existing publication checks
        run: node tests/mdlxdcc-root-pwa.test.cjs
      - name: Install the existing pinned runtime dependencies
        run: |
          npm ci --ignore-scripts
          if [ -f functions/package.json ]; then npm install --prefix functions --no-audit --no-fund; fi
      - name: Check the production lease and publish through the established Netlify CLI
        run: |
          node scripts/sef-kindle-production-20261017.mjs --guard
          npx --yes netlify-cli@26.2.0 deploy --prod --no-build --dir public --functions functions --skip-functions-cache --site "$NETLIFY_SITE_ID" --message "BD Sef encrypted Kindle $GITHUB_SHA baseline=$GITHUB_SHA" --json > sef-kindle-cli-deploy.json
      - name: Verify the complete live file inventory and retained function settings
        run: node scripts/sef-kindle-production-20261017.mjs --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sef-kindle-production-20261017-receipt
          path: |
            sef-kindle-before.json
            sef-kindle-cli-deploy.json
            sef-kindle-production-receipt.json
          if-no-files-found: ignore
