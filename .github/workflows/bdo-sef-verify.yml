name: BD O Sef visibility and session regression
on:
  push:
    branches: [main]
    paths:
      - 'public/BD/O/**'
      - 'scripts/bdo_sef_verify.py'
      - '.github/workflows/bdo-sef-verify.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to Netlify production']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: bdo-sef-readonly-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERIFIED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only dependencies
        run: |
          python -m pip install playwright==1.57.0 cryptography==46.0.4
          python -m playwright install --with-deps chromium
      - name: Prepare checkout to match Netlify deploy-time source
        run: python scripts/inject_password_manager.py public --report "$RUNNER_TEMP/bdo-sef-pm-compat-report.json"
      - name: Verify prepared checkout with isolated synthetic browser sessions
        run: python3 scripts/bdo_sef_verify.py --local-browser
      - name: Verify published public bytes and isolated synthetic browser sessions
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/bdo_sef_verify.py --live
      - name: Preserve sanitized verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdo-sef-verification
          path: bdo-sef-verification.json
          if-no-files-found: error
          retention-days: 7

