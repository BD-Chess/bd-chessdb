name: BD O Sef visibility and session regression
on:
  push:
    branches: [main]
    paths:
      - 'public/BD/O/**'
      - 'scripts/bdo_sef_verify.py'
      - '.github/workflows/bdo-sef-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bdo-sef-readonly-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only dependencies
        run: |
          python -m pip install playwright==1.57.0 cryptography==46.0.4
          python -m playwright install --with-deps chromium
      - name: Verify local UI and live public resources with isolated synthetic session
        run: python scripts/bdo_sef_verify.py --live
      - name: Preserve sanitized verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdo-sef-verification
          path: bdo-sef-verification.json
          if-no-files-found: error
          retention-days: 7
