name: Crosswords unified LAB APP PWA
on:
  push:
    branches: [ "crosswords/unified-lab-app-pwa-20261002", "main" ]
    paths:
      - 'public/CW/**'
      - 'scripts/build-crosswords-unified.py.gz.b64'
      - 'tests/crosswords-unified-browser.cjs'
      - '.github/workflows/crosswords-unified-lab-app.yml'
  pull_request:
    paths:
      - 'public/CW/**'
      - 'scripts/build-crosswords-unified.py.gz.b64'
      - 'tests/crosswords-unified-browser.cjs'
      - '.github/workflows/crosswords-unified-lab-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Generate unified Crosswords channels
        run: |
          base64 -d scripts/build-crosswords-unified.py.gz.b64 | gzip -d > /tmp/build-crosswords-unified.py
          cp /tmp/build-crosswords-unified.py scripts/build-crosswords-unified.py
          python -m py_compile scripts/build-crosswords-unified.py
          python scripts/build-crosswords-unified.py
          python scripts/build-crosswords-unified.py --check
          node --check public/CW/new/pwa.js
          node --check public/CW/new/sw.js
          git diff --check
      - name: Verify immutable archive and preserved tooling
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          def g(p):
            b=Path(p).read_bytes();return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          assert g('public/CW/old/001/index.html') == 'efc5203075ba935460bdb017d893a7c1c485da6c'
          assert g('public/CW/8z_CW_viewer.html') == 'fec3775784535b35f475a8085d8614904169d7d9'
          assert g('public/CW/cw_arena_export_html.py') == '890bd9ec7b48ec06c50992ab43ad0fefb0636391'
          assert g('public/CW/cw_build_words.py') == '03bfd29b3cf3d374299e81dc8761a08917078cc2'
          assert g('public/CW/cw_score_words.py') == 'a8d82a1341a9ee15c3db656f8909f7627fcf8855'
          assert g('public/CW/Origin.html') == '2ed9bcaea8d21faf7a4d8077a5ab7e0bb3b5d74c'
          assert not Path('public/CW/app').exists()
          assert not Path('public/CW/PWA').exists()
          print('archive/viewer/python/origin invariants PASS')
      - name: Install isolated browser test dependency
        run: |
          mkdir -p /tmp/cw-pw
          cd /tmp/cw-pw
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser + PWA acceptance
        shell: bash
        env:
          NODE_PATH: /tmp/cw-pw/node_modules
          CW_EVIDENCE_DIR: ${{ runner.temp }}/crosswords-unified-evidence
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory public >${{ runner.temp }}/cw-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/CW/new/ >/dev/null && break; sleep 0.2; done
          node tests/crosswords-unified-browser.cjs | tee ${{ runner.temp }}/crosswords-unified-evidence.log
          mkdir -p ${{ runner.temp }}/crosswords-unified-evidence
          cp ${{ runner.temp }}/crosswords-unified-evidence.log ${{ runner.temp }}/crosswords-unified-evidence/browser.log
      - name: Secret boundary
        run: python3 scripts/check_secret_boundary.py
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosswords-unified-evidence
          path: ${{ runner.temp }}/crosswords-unified-evidence
          if-no-files-found: ignore
      - name: Commit deterministic generated bytes to integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/crosswords/unified-lab-app-pwa-20261002'
        run: |
          if git diff --quiet -- public/CW/index.html public/CW/old public/CW/new; then echo "Generated bytes already committed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/CW/index.html public/CW/old public/CW/new
          git commit -m "feat(crosswords): generate unified CURRENT PREVIOUS LAB APP PWA"
          git push
