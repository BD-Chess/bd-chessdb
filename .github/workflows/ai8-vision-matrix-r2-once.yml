name: AI8 vision R2 — build, test and publish once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ai8-vision-matrix-r2-once.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: ai8-vision-matrix-r2-20260929
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify source and install bounded renderer dependencies
        run: |
          set -euo pipefail
          python -m py_compile tools/ai8_vision_r2/*.py
          python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2' 'playwright==1.57.0'
          python -m playwright install --with-deps chromium webkit
          python -m pip freeze > "$RUNNER_TEMP/ai8-render-environment.txt"
      - name: Build all eight variants and preserve numbered index backup
        run: |
          python tools/ai8_vision_r2/install.py .
          node --check public/assets/ai8-vision/r2/vision.js
          mkdir -p "$RUNNER_TEMP/ai8-matrix/local" "$RUNNER_TEMP/ai8-matrix/live"
          cp ai8-vision-r2-install.json "$RUNNER_TEMP/ai8-matrix/"
          cp "$RUNNER_TEMP/ai8-render-environment.txt" "$RUNNER_TEMP/ai8-matrix/"
      - name: Check eight combinations in Chromium and WebKit before publication
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory public > "$RUNNER_TEMP/ai8-matrix/http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          python tools/ai8_vision_r2/test_browser.py http://127.0.0.1:8766/ public/assets/ai8-vision/r2/manifest.json "$RUNNER_TEMP/ai8-matrix/local" --browser chromium
          python tools/ai8_vision_r2/test_browser.py http://127.0.0.1:8766/ public/assets/ai8-vision/r2/manifest.json "$RUNNER_TEMP/ai8-matrix/local" --browser webkit
      - name: Commit only the verified visual slice, preserving concurrent work
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Concurrent main changed; reconcile without force push.'; exit 1; }
          BACKUP=$(python -c "import json; print(json.load(open('ai8-vision-r2-install.json'))['backup'])")
          git add public/index.html "$BACKUP" public/assets/ai8-vision/r2
          git rm .github/workflows/ai8-vision-matrix-r2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AI8 vision R2: SL/EN, dark/light, desktop/mobile with verified backup'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/ai8-matrix/published-commit.txt"
          gh workflow run deploy-pages.yml --ref main
      - name: Wait for the actual R2 Pages deployment
        shell: python
        run: |
          import time, urllib.request
          url='https://bd-chess.github.io/bd-chessdb/'
          for attempt in range(36):
              try:
                  req=urllib.request.Request(url+'?ai8_verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode()
                  if 'data-revision="20260929-r2"' in data: break
              except Exception as e: print(type(e).__name__)
              time.sleep(5)
          else: raise SystemExit('Published R2 not observed within bounded deployment wait')
      - name: Verify real Pages bytes and behavior in both browser engines
        run: |
          set -euo pipefail
          python tools/ai8_vision_r2/test_browser.py https://bd-chess.github.io/bd-chessdb/ public/assets/ai8-vision/r2/manifest.json "$RUNNER_TEMP/ai8-matrix/live" --browser chromium
          python tools/ai8_vision_r2/test_browser.py https://bd-chess.github.io/bd-chessdb/ public/assets/ai8-vision/r2/manifest.json "$RUNNER_TEMP/ai8-matrix/live" --browser webkit
      - name: Assemble durable delivery package
        shell: python
        run: |
          import json,os,pathlib,zipfile,hashlib
          root=pathlib.Path('.'); ev=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai8-matrix'
          receipt=json.loads((ev/'ai8-vision-r2-install.json').read_text())
          receipt.update(status='COMPLETE_FOR_GITHUB_PAGES_SCOPE',production='https://bd-chess.github.io/bd-chessdb/',commit=(ev/'published-commit.txt').read_text().strip(),verification='8 variants plus hot-switch/resize/reopen in Chromium and WebKit, before and after publication; 36 scenario checks. No physical-device claim. No Netlify deployment or CLI settings change.')
          (ev/'RESULT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          files=[root/'public/index.html',root/receipt['backup'],root/'public/assets/ai8-lab-growth-20260929.webp']+list((root/'public/assets/ai8-vision/r2').glob('*'))+list((root/'tools/ai8_vision_r2').glob('*.py'))
          package=ev/'AI8_VISION_MATRIX_20260929_R2.zip'
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              for f in files: z.write(f,f.as_posix())
              for f in ev.rglob('*'):
                  if f.is_file() and f!=package: z.write(f,'evidence/'+f.relative_to(ev).as_posix())
          print('PACKAGE_SHA256',hashlib.sha256(package.read_bytes()).hexdigest())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai8-vision-matrix-r2-evidence
          path: ${{ runner.temp }}/ai8-matrix
          retention-days: 7
          if-no-files-found: warn
