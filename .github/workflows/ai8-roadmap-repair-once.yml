name: AI8 roadmap final browser verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ai8-roadmap-repair-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install narrow browser verification dependencies
        run: python -m pip install --quiet Pillow playwright
      - name: Verify live decoded pixels, navigation and full image
        shell: python
        run: |
          import hashlib, io, json, os, pathlib, shutil, urllib.request
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai8-final';out.mkdir()
          base='https://bd-chess.github.io/bd-chessdb/'
          sha='f7951a0f15966e7921ca034215134eab8a72cfbc92696efd4ff343b9c0b92b14'
          data=urllib.request.urlopen(base+'assets/ai8-lab-growth-20260929.webp?v='+sha[:12],timeout=20).read(1000000)
          assert hashlib.sha256(data).hexdigest()==sha
          image=Image.open(io.BytesIO(data));image.load();assert image.size==(1672,941)
          result=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
            for label,w,h,theme in [('desktop',1440,1000,'light'),('mobile',390,844,'dark')]:
              page=browser.new_page(viewport={'width':w,'height':h},reduced_motion='reduce',color_scheme=theme)
              response=page.goto(base+'?lang=sl&ai8check='+sha[:12],wait_until='domcontentloaded');assert response.status==200
              button=page.locator('#ai8-vision-open');button.scroll_into_view_if_needed()
              page.screenshot(path=str(out/(label+'-landing.png')))
              button.click();pic=page.locator('#ai8-vision-dialog img')
              pic.evaluate('(i)=>i.decode()')
              page.evaluate('()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))')
              page.wait_for_timeout(500)
              assert pic.evaluate('(i)=>i.complete && i.naturalWidth===1672 && i.naturalHeight===941')
              crop=pic.screenshot(path=str(out/(label+'-image.png')))
              variance=ImageStat.Stat(Image.open(io.BytesIO(crop)).convert('RGB')).stddev
              assert sum(variance)/3 > 15, 'Image has dimensions but blank/unpainted pixels'
              page.screenshot(path=str(out/(label+'-lightbox.png')))
              assert not page.evaluate('document.documentElement.scrollWidth > innerWidth')
              link=page.locator('#ai8-vision-dialog figure a');assert link.get_attribute('href').endswith('?v='+sha[:12])
              page.keyboard.press('Escape');assert not page.locator('#ai8-vision-dialog').evaluate('(d)=>d.open')
              assert page.evaluate("document.activeElement.id==='ai8-vision-open'")
              button.click();page.locator('#ai8-vision-close').click()
              assert not page.locator('#ai8-vision-dialog').evaluate('(d)=>d.open')
              result.append({'viewport':label,'size':[w,h],'theme':theme,'http':response.status,'image_dimensions':[1672,941],'image_sha256':sha,'image_pixel_stddev':variance,'decoded_and_painted':True,'escape_close':True,'button_close':True,'focus_return':True,'no_horizontal_overflow':True,'url':page.url})
              page.close()
            browser.close()
          report={'scope':'Live GitHub Pages Chromium desktop and mobile viewport; not physical iPhone','checks':result}
          (out/'live-final.json').write_text(json.dumps(report,indent=2));print('LIVE_FINAL_PASS',json.dumps(report))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai8-roadmap-final-browser-evidence
          path: ${{ runner.temp }}/ai8-final
          retention-days: 7
