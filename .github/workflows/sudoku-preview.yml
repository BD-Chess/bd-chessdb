name: Sudoku preview verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sudoku-preview.yml'
      - 'tools/sudoku-preview/**'
      - 'public/S/new/index.html'
concurrency:
  group: sudoku-preview-verification
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact Sudoku source and delivered bytes
        run: |
          mkdir -p sudoku-evidence
          python - <<'PY'
          import pathlib, urllib.request, hashlib, json, re, base64, gzip
          out=pathlib.Path('sudoku-evidence')
          report={}
          for name,path in [('original.html','public/S/index.html'),('preview.html','public/S/new/index.html')]:
              data=pathlib.Path(path).read_bytes(); (out/name).write_bytes(data)
              report[name]={'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'bytes':len(data)}
          try:
              with urllib.request.urlopen('https://www.mdlxdcc.org/s/new/?sudoku-ci=1',timeout=30) as response:
                  data=response.read(); (out/'live.html').write_bytes(data)
                  report['live']={'status':response.status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  match=re.search(rb"const B64='([^']*)'",data)
                  if match:
                      try:
                          decoded=gzip.decompress(base64.b64decode(match[1],validate=True))
                          report['live']['payload']='VALID'; (out/'decoded.html').write_bytes(decoded)
                      except Exception as error: report['live']['payload_error']=str(error)
          except Exception as error: report['live']={'error':str(error)}
          (out/'source-receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Build and test candidate when release sources exist
        if: ${{ hashFiles('tools/sudoku-preview/build.py') != '' }}
        run: |
          python tools/sudoku-preview/build.py
          node tools/sudoku-preview/test.cjs
      - name: Stage verified candidate as an unreferenced Git object
        if: ${{ hashFiles('tools/sudoku-preview/build.py') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,urllib.request,os
          data=pathlib.Path('sudoku-evidence/8zSudoku.html').read_bytes()
          expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          body=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==expected, 'Staged blob differs from tested bytes'
          receipt={'blob_sha':expected,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'branch_updated':False}
          pathlib.Path('sudoku-evidence/staged-blob.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('STAGED_SUDOKU_BLOB '+json.dumps(receipt))
          PY
      - name: Browser acceptance
        if: ${{ hashFiles('tools/sudoku-preview/browser.py') != '' }}
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tools/sudoku-preview/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sudoku-preview-evidence
          path: sudoku-evidence/
          retention-days: 7
