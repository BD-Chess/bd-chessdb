name: Publish Visual Lab preview (one-shot)
on:
  push:
    branches: ["work/visual-lab-20260923-r1"]
    paths: [".github/workflows/visual-lab-publish-20260923.yml"]
permissions:
  contents: write
  actions: write
concurrency:
  group: visual-lab-publish-20260923-r1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/work/visual-lab-20260923-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publish and verify only the two BD-authorized pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, re, subprocess, tempfile, urllib.request, urllib.error
          API = 'https://api.github.com/repos/BD-Chess/bd-chessdb'
          EXPECTED_INDEX = 'c9556d2192993264a5f3dc574deec28e25a305fa'
          EXPECTED_DEMO = '91012e960d47c78d72ef24c3da2233e4aab393acedf2b9103c8e616ce7a4df2b'
          TOKEN = os.environ['GH_TOKEN']
          def api(path, data=None, method=None):
              request = urllib.request.Request(API+path, data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  body=response.read()
              return json.loads(body) if body else {}
          chunks=[]
          for sha in ['b1bceb29776927f5dc92a731fe94c7b313c82155','ca9c62c6f03b50f64b496fabee27f4127a46a589','c947664904c342c66b6b16fac5a83dff51f1db38']:
              obj=api('/git/blobs/'+sha)
              assert obj['encoding']=='base64'
              chunks.append(base64.b64decode(obj['content']))
          # Reconstruct the exact locally verified transport chunk; no source mutation.
          encoded=base64.b64encode(chunks[1]).decode().rstrip('=')
          anchor='HdkfJ9+vfg2yX+eHtyb'
          assert encoded.count(anchor)==1
          encoded=encoded.replace(anchor,'HdkfJ9+'+''+'vfg2yX+eHtyb')
          chunks[1]=base64.b64decode(encoded)
          assert hashlib.sha1(b'blob 8088\0'+chunks[1]).hexdigest()=='c7acf2972e24a003f1d8fcdcc095a03feb051889'
          demo=gzip.decompress(b''.join(chunks))
          assert hashlib.sha256(demo).hexdigest() == EXPECTED_DEMO, 'Payload integrity mismatch'
          head = api('/git/ref/heads/main')['object']['sha']
          commit = api('/git/commits/'+head)
          index = api('/contents/public/index.html?ref='+head)
          assert index['sha'] == EXPECTED_INDEX, 'Concurrent landing change: stop, no overwrite'
          try:
              api('/contents/public/index-demo.html?ref='+head)
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          else:
              raise RuntimeError('Existing demo page: stop, no overwrite')
          assert api('/contents/.github/workflows/deploy-pages.yml?ref='+head)['sha']=='34a98423f0d5400cc16e617ee5dc9866c400f5ea', 'Deployment workflow changed: stop'
          original=base64.b64decode(index['content']).decode('utf-8')
          style='display:inline;margin:0;padding:0;border:0;background:none;box-shadow:none;font:inherit;letter-spacing:inherit;color:inherit;text-decoration:none'
          old_en='<span class="en" lang="en">Independent work. Shared with curiosity.</span>'
          old_sl='<span class="sl" lang="sl">Neodvisno delo. Skupna radovednost.</span>'
          new_en='<span class="en" lang="en">Independent work. Shared with <a href="index-demo.html" style="'+style+'" title="Visual DCC / MDL / 8z — demo gallery">curiosity</a>.</span>'
          new_sl='<span class="sl" lang="sl">Neodvisno delo. Skupna <a href="index-demo.html" style="'+style+'" title="Visual DCC / MDL / 8z — galerija prikazov">radovednost</a>.</span>'
          assert original.count(old_en)==1 and original.count(old_sl)==1, 'Footer anchor mismatch'
          patched=original.replace(old_en,new_en).replace(old_sl,new_sl)
          assert patched.replace(new_en,old_en).replace(new_sl,old_sl)==original
          assert re.sub('<[^>]+>','',new_en)==re.sub('<[^>]+>','',old_en)
          assert re.sub('<[^>]+>','',new_sl)==re.sub('<[^>]+>','',old_sl)
          with tempfile.TemporaryDirectory() as td:
              scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',demo.decode())
              assert len(scripts)==2
              for i,script in enumerate(scripts):
                  path=os.path.join(td,str(i)+'.js')
                  with open(path,'w',encoding='utf-8') as f:f.write(script)
                  subprocess.run(['node','--check',path],check=True)
          blobs={}
          for path,content in [('public/index-demo.html',demo.decode()),('public/index.html',patched)]:
              blobs[path]=api('/git/blobs',{'content':content,'encoding':'utf-8'})['sha']
          tree=api('/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','sha':sha} for p,sha in blobs.items()]})['sha']
          new=api('/git/commits',{'message':'Add standalone Visual Lab: 13 studies and discreet curiosity link','tree':tree,'parents':[head]})['sha']
          api('/git/refs/heads/main',{'sha':new,'force':False},method='PATCH')
          for path,sha in blobs.items():
              assert api('/contents/'+path+'?ref=main')['sha']==sha, 'Readback mismatch: '+path
          # Invoke only the existing Pages flow. No Netlify, DNS, secrets or configuration changes.
          api('/actions/workflows/deploy-pages.yml/dispatches',{'ref':'main'})
          print(json.dumps({'status':'MAIN_WRITTEN_READBACK_VERIFIED_PAGES_DISPATCHED','parent':head,'commit':new,'blobs':blobs,'demo_sha256':EXPECTED_DEMO,'demo_bytes':len(demo),'only_production_paths':list(blobs),'landing_visible_text':'UNCHANGED','netlify':'NOT_TOUCHED'},indent=2))
          # Bounded read-only acceptance; never retry or repeat publication.
          import time
          pages_url='https://bd-chess.github.io/bd-chessdb/'
          verified=False
          last='Not yet visible'
          for attempt in range(24):
              try:
                  req=urllib.request.Request(pages_url+'index-demo.html?v='+new, headers={'Cache-Control':'no-cache','User-Agent':'BD-VisualLab-acceptance'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      live=response.read(); final_url=response.geturl()
                  if hashlib.sha256(live).hexdigest()!=EXPECTED_DEMO:
                      raise ValueError('Live demo is not the committed bytes yet')
                  req=urllib.request.Request(pages_url+'index.html?v='+new, headers={'Cache-Control':'no-cache','User-Agent':'BD-VisualLab-acceptance'})
                  with urllib.request.urlopen(req,timeout=12) as response: landing=response.read().decode('utf-8')
                  if new_en not in landing or new_sl not in landing:
                      raise ValueError('Footer link not visible yet')
                  print(json.dumps({'status':'PAGES_LIVE_HTTP_READBACK_PASS','commit':new,'url':final_url,'demo_sha256':EXPECTED_DEMO,'demo_bytes':len(live),'footer_en':'PASS','footer_sl':'PASS','netlify':'NOT_TOUCHED'},indent=2))
                  verified=True
                  break
              except (urllib.error.URLError,ValueError,TimeoutError) as error:
                  last=str(error)
                  time.sleep(7)
          if not verified:
              print(json.dumps({'status':'MAIN_VERIFIED_PAGES_LIVE_PENDING','commit':new,'gap':last},indent=2))
