name: Patch tablete editable times
on:
  push:
    paths:
      - '.github/workflows/patch-tablete-editable-times.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
