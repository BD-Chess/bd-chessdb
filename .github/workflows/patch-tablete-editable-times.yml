name: Patch tablete editable times
on:
  push:
    paths:
      - '.github/workflows/patch-tablete-editable-times.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page with editable medication times
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/BD/O/tablete.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.med input{width:25px;height:25px;accent-color:#68dba2}', '.med input[type="checkbox"]{width:25px;height:25px;accent-color:#68dba2}.timeedit{min-height:32px;border:1px solid #55738f;border-radius:9px;background:#071120;color:#fff;padding:3px 7px;font:900 1em/1 system-ui;letter-spacing:.02em}.timeedit:focus{outline:2px solid #67e0d755;outline-offset:1px}')
          s=s.replace('<section class="hero"><div class="kicker">Dnevni načrt</div><h1>Tablete</h1><p class="sub">Ure se prilagodijo času vstajanja.</p></section>', '<section class="hero"><div class="kicker">Dnevni načrt</div><h1>Tablete</h1><p class="sub">Ure se prilagodijo času vstajanja. Vsako priporočeno uro lahko tudi ročno popraviš.</p></section>')
          s=re.sub(r"const regList=\[.*?const painList=\[", """const regList=[
           {id:'exforge',name:'Exforge HCT',dose:'5/160/12,5 mg',offset:30,remind:true},
           {id:'twoperday_am',name:'Two-Per-Day',dose:'1. kapsula',offset:30,remind:true},
           {id:'aspirin',name:'Aspirin Protect',dose:'100 mg',offset:300,remind:true},
           {id:'twoperday_pm',name:'Two-Per-Day',dose:'2. kapsula',offset:300,remind:true},
           {id:'sorvasta',name:'Sorvasta',dose:'20 mg',offset:720,remind:true}
          ];
          const optList=[
           {id:'claritine',name:'Claritine',dose:'10 mg',offset:720,remind:false},
           {id:'melatonin',name:'Melatonin IR/XR',dose:'1,5 mg',offset:1020,remind:false,rollover:true}
          ];
          const painList=[""", s, count=1, flags=re.S)
          s=re.sub(r"function plan\(date,wake\)\{.*?\n\}\nasync function api", """function mins(t){const [h,m]=String(t).split(':').map(Number);return h*60+m}
          function localDueEpoch(date,wake,time,x){let v=epoch(date,time);if(x.rollover&&mins(time)<mins(wake))v+=86400000;return v}
          function defaultTime(wake,x){return at(wake,x.offset)}
          function blockFor(id){return (state?.blocks||[]).find(b=>b.id==='med_'+id)}
          function displayedTime(x){const b=blockFor(x.id);if(b?.dueAt)return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(b.dueAt));return defaultTime(state.wake,x)}
          function dueFor(x){const b=blockFor(x.id);return b?.dueAt?Date.parse(b.dueAt):localDueEpoch(state.date,state.wake,defaultTime(state.wake,x),x)}
          function plan(date,wake,timeMap={}){
           const items={},blocks=[];
           for(const x of [...regList,...optList,...painList])items[x.id]={takenAt:null};
           for(const x of [...regList,...optList]){
            const time=timeMap[x.id]||defaultTime(wake,x);
            blocks.push({id:'med_'+x.id,dueAt:new Date(localDueEpoch(date,wake,time,x)).toISOString(),itemIds:[x.id],remind:x.remind!==false,label:x.name+(x.dose?' '+x.dose:'')});
           }
           return {date,wake,timezone:TZ,items,blocks}
          }
          function currentTimeMap(){const out={};for(const x of [...regList,...optList])out[x.id]=displayedTime(x);return out}
          async function api""", s, count=1, flags=re.S)
          s=re.sub(r"function card\(x,opt=false\)\{.*?\n\}\nfunction painCard", """function card(x,opt=false){
           const taken=state.items?.[x.id]?.takenAt||null,due=dueFor(x),late=state.date===today()&&!taken&&x.remind!==false&&Date.now()>due+GRACE*60000,status=taken?takenText(taken):late?'ZAMUJA':'ni še označeno',cls=taken?'done':late?'late':'',recommended=displayedTime(x);
           return `<div class=\"med ${cls}\"><input type=\"checkbox\" data-id=\"${x.id}\" ${taken?'checked':''} ${state.date>today()?'disabled':''}><span><span class=\"name\">${x.name}</span><span class=\"dose\">${x.dose}</span><span class=\"meta\"><span class=\"timepill\">Priporočeno ob <input class=\"timeedit\" type=\"time\" step=\"300\" data-time-id=\"${x.id}\" value=\"${recommended}\" aria-label=\"Priporočena ura za ${x.name}\"></span><span class=\"status\">${status}</span>${opt?'<span>po potrebi · brez e-mail alarma</span>':''}</span></span></div>`
          }
          function painCard""", s, count=1, flags=re.S)
          s=s.replace('return `<label class="med ${cls}"><input type="checkbox" data-id="${x.id}" ${taken?\'checked\':\'\'} ${state.date>today()?\'disabled\':\'\'}><span><span class="name">${x.name}</span><span class="dose">${x.dose}</span><span class="meta"><span class="timepill">Ob bolečini · brez urnika</span><span class="status">${status}</span></span></span></label>`', 'return `<div class="med ${cls}"><input type="checkbox" data-id="${x.id}" ${taken?\'checked\':\'\'} ${state.date>today()?\'disabled\':\'\'}><span><span class="name">${x.name}</span><span class="dose">${x.dose}</span><span class="meta"><span class="timepill">Ob bolečini · brez urnika</span><span class="status">${status}</span></span></span></div>`')
          s=re.sub(r"function preserveIntoPlan\(remote\)\{.*?\n\}", """function preserveIntoPlan(remote){
           const times={};for(const x of [...regList,...optList]){const b=(remote.blocks||[]).find(z=>z.id==='med_'+x.id);if(b?.dueAt)times[x.id]=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(b.dueAt))}const p=plan(remote.date,remote.wake||'08:00',times);
           for(const [id,v] of Object.entries(remote.items||{}))if(p.items[id]&&v?.takenAt)p.items[id].takenAt=v.takenAt;
           return p
          }""", s, count=1, flags=re.S)
          s=s.replace("document.querySelectorAll('.med input').forEach", "document.querySelectorAll('.med input[type=checkbox]').forEach")
          marker='function render(){'
          if 'function bindTimes(){' not in s:
           bind="""function bindTimes(){
           document.querySelectorAll('.timeedit').forEach(t=>t.onchange=async()=>{
            const times=currentTimeMap();times[t.dataset.timeId]=t.value;
            const p=plan(state.date,state.wake,times);
            for(const [id,v] of Object.entries(state.items||{}))if(v?.takenAt&&p.items[id])p.items[id].takenAt=v.takenAt;
            p.emailReady=state.emailReady;state=p;render();
            try{const j=await api('POST','',{action:'plan',plan:p});state=j.state;render()}
            catch(e){mailEl.textContent='Ura je prikazana, strežniško shranjevanje pa ni uspelo: '+e.message}
           })
          }
          """
           s=s.replace(marker,bind+marker,1)
          s=s.replace("mailEl.innerHTML=`Opomnik po <strong>${GRACE} min</strong> zamude za redna zdravila · `+(state.emailReady?'<span class=\"ok\">Gmail opomniki pripravljeni</span>':'<span class=\"warn\">Gmail opomniki še niso avtorizirani</span>');", "mailEl.innerHTML=`E-mail opomnik po <strong>${GRACE} min</strong> zamude samo za redna zdravila · `+(state.emailReady?'<span class=\"ok\">pošiljanje je vključeno</span>':'<span class=\"warn\">pošiljanje še ni povezano z Gmailom</span>');")
          s=s.replace(' bindChecks()\n}', ' bindChecks();bindTimes()\n}',1)
          s=s.replace(' state=p;state.emailReady=false;render();', ' p.emailReady=state.emailReady;state=p;render();')
          required=['class="timeedit"','function bindTimes(){',"id:'med_'+x.id",'pošiljanje je vključeno']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing expected markers: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/BD/O/tablete.html
          git commit -m 'Make medication reminder times editable'
          git push
