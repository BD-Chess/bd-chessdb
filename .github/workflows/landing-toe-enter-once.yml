name: Landing ToE Enter one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-toe-enter-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make exact ToE search open ToE
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_TOE_ENTER_20260917'
          if marker in s:
              raise SystemExit(0)
          old="$('#search-form').addEventListener('submit',e=>{e.preventDefault();const direct=PRIVATE[norm(input.value)];if(direct){location.href=new URL(direct,BASE).href;return;}const p=results[active>=0?active:0];if(p){remember(input.value);location.href=p.url;}});"
          new="/* LANDING_TOE_ENTER_20260917 */\n$('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=norm(input.value);if(q==='toe'){remember(input.value);location.href=new URL('crp/ToE.html',BASE).href;return;}const direct=PRIVATE[q];if(direct){location.href=new URL(direct,BASE).href;return;}const p=results[active>=0?active:0];if(p){remember(input.value);location.href=p.url;}});"
          if old not in s:
              raise SystemExit('search submit hook not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit ToE Enter fix
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix exact ToE search Enter navigation"
          git push origin HEAD:main
