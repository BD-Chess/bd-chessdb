name: Stop Netlify automatic Git builds once
# second-touch trigger after workflow registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-stop-auto-builds-once.yml'

permissions:
  contents: read

jobs:
  stop-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      MDLXDCC_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
      CHESSBEST_SITE_ID: deb1dab6-dfad-436e-ae92-4477d873c987
    steps:
      - name: Require configured Netlify token
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"

      - name: Stop automatic builds on both Netlify sites
        shell: bash
        run: |
          set -euo pipefail
          for site in "$MDLXDCC_SITE_ID" "$CHESSBEST_SITE_ID"; do
            curl --fail-with-body --silent --show-error               --request PATCH               --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN"               --header "Content-Type: application/json"               --data '{"build_settings":{"stop_builds":true}}'               "https://api.netlify.com/api/v1/sites/$site"               > "$RUNNER_TEMP/site-$site.json"
          done

      - name: Verify stopped-build state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          for key in ("MDLXDCC_SITE_ID", "CHESSBEST_SITE_ID"):
              site = os.environ[key]
              path = os.path.join(os.environ["RUNNER_TEMP"], f"site-{site}.json")
              data = json.load(open(path, encoding="utf-8"))
              stopped = bool((data.get("build_settings") or {}).get("stop_builds"))
              if not stopped:
                  raise SystemExit(f"{site}: stop_builds was not enabled")
              print(f"{site}: stop_builds=true")
          PY
