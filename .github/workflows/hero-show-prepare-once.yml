name: Hero show verified candidate
on:
  push:
    branches: [codex/hero-show-verify-20260918-r1]
    paths: [.github/workflows/hero-show-prepare-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hero-show-verify-20260918-r1
          fetch-depth: 5
      - name: Recover exact prepared artifact from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35314691614 --name hero-show-candidate --dir /tmp/hero-candidate
      - name: Apply exact browser-tested focus correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          source=Path('public/index.html')
          assert blob(source.read_bytes())=='74dd6ff012b7695028eb16e465d87cee4bcd4458','Concurrent index change'
          folder=Path('/tmp/hero-candidate')
          raw=(folder/'index.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='9f4b662ea1378a83941aaeba50929ca5ae6922a10f0a1093ec2df44d954df60d'
          s=raw.decode()
          a='if(heroDemoOpen&&heroDemoPaused){mainDC.stop();mainPI.stop();}if(announce)'
          b="if(heroDemoOpen&&heroDemoPaused){mainDC.stop();mainPI.stop();}if(heroDemoOpen&&!['hero-demo-close','hero-demo-pause'].includes(document.activeElement.id))$('#study').focus({preventScroll:true});if(announce)"
          assert s.count(a)==1
          out=s.replace(a,b,1).encode()
          assert hashlib.sha256(out).hexdigest()=='8392e60940288afe1a4db8616c3c1fe1a5a5cc2d8ee176a9d7760c320de5bd50','Not the tested candidate'
          backup=(folder/'index-bck3.html').read_bytes()
          assert blob(backup)=='4b84a6a2052f4be5130af4361c4291e333b7910b'
          target=Path('public/index-bck3.html')
          assert not target.exists() or target.read_bytes()==backup,'Existing bck3 conflict'
          source.write_bytes(out);target.write_bytes(backup)
          result=Path('hero-show-verified');result.mkdir()
          (result/'index.html').write_bytes(out);(result/'index-bck3.html').write_bytes(backup)
          (result/'manifest.json').write_text(json.dumps({'result_blob':blob(out),'backup_blob':blob(backup),'sha256':hashlib.sha256(out).hexdigest(),'local_browser_tests':'Chromium 144: desktop/portrait/landscape x light/dark and reduced motion PASS; physical Safari not tested'},indent=2))
          PY
      - name: Commit only the verified candidate on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hero-show-prepare-once.yml
          git add public/index.html public/index-bck3.html
          git commit -m 'Verify hero demo show, restore popup clicks, preserve bck3'
          git diff --name-only e14205ff6cc25431cbde533206d2a8e6bf00540f HEAD > hero-show-verified/changed_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          assert set(Path('hero-show-verified/changed_paths.txt').read_text().splitlines())=={'public/index.html','public/index-bck3.html'}
          PY
          git rev-parse HEAD > hero-show-verified/candidate_commit.txt
          git push origin HEAD:refs/heads/codex/hero-show-verify-20260918-r1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-show-verified
          path: hero-show-verified/
          retention-days: 7
