name: Hero show isolated preparation
on:
  push:
    branches: [codex/hero-show-verify-20260918-r1]
    paths: [.github/workflows/hero-show-prepare-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hero-show-verify-20260918-r1
          fetch-depth: 1
      - name: Apply bounded source-guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,zlib
          code=zlib.decompress(base64.b64decode(''))
          from pathlib import Path
          Path('/tmp/hero-show-patch.py').write_bytes(code)
          exec(compile(code,'hero-show-patch.py','exec'))
          Path('hero-show-artifact/patch.py').write_bytes(code)
          PY
      - name: Compile all inline scripts without executing them
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('public/index.html','utf8');let n=0;
          for(const m of s.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)){
            if(/application\/(?:ld\+)?json/.test(m[1]))continue;
            new vm.Script(m[2]);n++;
          }
          fs.writeFileSync('hero-show-artifact/syntax.json',JSON.stringify({scripts:n,syntax:'PASS'}));
          JS
      - name: Commit candidate on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hero-show-prepare-once.yml
          git add public/index.html public/index-bck3.html
          git commit -m 'Landing demo: verify popup safety, 30s show, preserve bck3'
          git rev-parse HEAD > hero-show-artifact/candidate_commit.txt
          git diff --name-only e14205ff6cc25431cbde533206d2a8e6bf00540f HEAD > hero-show-artifact/changed_paths.txt
          git push origin HEAD:refs/heads/codex/hero-show-verify-20260918-r1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-show-candidate
          path: hero-show-artifact/
          retention-days: 7
