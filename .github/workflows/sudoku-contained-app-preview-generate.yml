name: Sudoku contained APP preview generator
on:
  push:
    branches: [ "sudoku/fix-app-preview-contained-20261005" ]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate LAB release
        run: |
          node scripts/build-sudoku-pwa.cjs
          node scripts/build-sudoku-pwa.cjs --check
          node --test tests/sudoku-app-preview.test.cjs
          git diff --check
      - name: Commit generated bytes
        run: |
          if git diff --quiet -- public/S/new/release.json public/S/new/sw.js; then
            echo "No generated release delta."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/S/new/release.json public/S/new/sw.js
          git commit -m "chore(sudoku): refresh contained APP preview release"
          git push
