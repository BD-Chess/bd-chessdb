name: Sudoku APP Coach final verify once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sudoku-app-coach-final-verify-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Sudoku test dependency
        run: npm ci --prefix tests/sudoku --ignore-scripts
      - name: Verify APP release package
        run: node scripts/build-sudoku-app-preview.cjs --check
      - name: Verify final Coach, settings, APP and PWA
        run: NODE_PATH=./tests/sudoku/node_modules node --test tests/sudoku-app-coach-final-20260930.test.cjs tests/sudoku-app-preview.test.cjs tests/sudoku-app-pwa.test.cjs
      - name: Verify secret boundary
        run: python scripts/check_secret_boundary.py
