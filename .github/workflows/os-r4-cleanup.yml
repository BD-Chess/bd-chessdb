name: One-shot 8Z OS R4 cleanup

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Stage 8Z OS R4 cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean R4 temporary files and sync footer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_before=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD)" = "$main_before"
          grep -q 'OS-WEB-20260917-R4' public/OS/index.html
          grep -q 'Auto colors: off' public/OS/index.html
          grep -q "setPalette('original')" public/OS/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/OS/index.html')
          s=p.read_text(encoding='utf-8')
          old='<span class="hash">OS-WEB-20260917-R3</span>'
          new='<span class="hash">OS-WEB-20260917-R4</span>'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/os-r4-colors-one-shot.yml
          rm -f .github/workflows/os-r4-colors-one-shot-fix.yml
          rm -f .github/workflows/os-r4-colors-rebase.yml
          rm -f public/OS/.r4-palette-trigger
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/OS/index.html').read_text(encoding='utf-8')
          assert s.count('OS-WEB-20260917-R4') >= 2
          a=s.index('<script id="claustrum-live-code">')+len('<script id="claustrum-live-code">')
          b=s.index('</script>',a)
          Path('/tmp/claustrum-r4.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/claustrum-r4.js
          git config user.name "BD-Chess"
          git config user.email "bd@siol.net"
          git add -A
          git commit -m "OS: finalize R4 palette controls and cleanup"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$main_before"
          git push origin HEAD:main
