name: Andaluzija DualFrame scoped production R2
# BD explicitly authorized this one album release. Normal Git CD stays disabled.
# Retain bounded validation diagnostics when the provider rejects preparation.
# Effective default regions/memory are verified, never re-sent as new overrides.
# Reconstruct byte-identical legacy ZIPs using the locally verified tool versions.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-dualframe-scoped-20261021-r2.yml]
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-R2')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ALBUM_FROZEN_ROOT: /tmp/andaluzija-frozen-functions
      ALBUM_NETLIFY_TOOLS: /tmp/album-netlify-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin the verified packaging package manager
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify album interactions, assets and travel regressions without provider calls
        run: node --test tests/dualframe-album.test.mjs tests/andaluzija-ai.test.mjs tests/andaluzija-page.test.mjs tests/dualframe-pwa.test.mjs
      - name: Reconstruct exact published function sources
        run: python3 scripts/prepare-andaluzija-legacy-functions-20261021.py
      - name: Install pinned legacy dependencies and official packaging tools
        run: |
          npm ci --prefix "$ALBUM_FROZEN_ROOT" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$ALBUM_FROZEN_ROOT/functions" --ignore-scripts --no-audit --no-fund
          npm install --prefix "$ALBUM_NETLIFY_TOOLS" --ignore-scripts --no-audit --no-fund netlify-cli@27.14.0
      - name: Package unchanged functions using the production CLI version
        run: node scripts/bundle-andaluzija-legacy-functions-20261021.mjs
      - name: Publish only the album and backlink over the exact current snapshot
        run: python3 scripts/deploy-andaluzija-dualframe-20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-dualframe-production-${{ github.run_id }}
          path: album-release-evidence/
          if-no-files-found: warn
          retention-days: 30
