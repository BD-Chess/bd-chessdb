name: Andaluzija DualFrame scoped production R2
# BD explicitly authorized this one album release. Normal Git CD stays disabled.
# Retain bounded validation diagnostics when the provider rejects preparation.
# Effective default regions/memory are verified, never re-sent as new overrides.
# Reconstruct byte-identical legacy ZIPs using the locally verified tool versions.
# The two-file PWA correction also preserves existing function route mappings.
# Retry transient asset reads; never repeat a deploy-creation POST automatically.
# BD also explicitly authorized the photo-only fullscreen correction, 2026-10-21.
# Preserve production-only HTML preparation while updating only two cache keys.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-dualframe-scoped-20261021-r2.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-AUDIT')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39577031843
          name: andaluzija-dualframe-production-39577031843
          path: album-release-evidence/
      - name: Verify the published release without creating or changing any deploy
        run: python3 scripts/audit-andaluzija-dualframe-20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-dualframe-audit-${{ github.run_id }}
          path: album-release-evidence/
          retention-days: 30
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-R2') || contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-PWA-FIX') || contains(github.event.head_commit.message, 'ANDALUZIJA-PHOTO-ONLY-FULLSCREEN'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      ALBUM_FROZEN_ROOT: /tmp/andaluzija-frozen-functions
      ALBUM_NETLIFY_TOOLS: /tmp/album-netlify-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin the verified packaging package manager
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify album interactions, assets and travel regressions without provider calls
        run: node --test tests/dualframe-album.test.mjs tests/andaluzija-ai.test.mjs tests/andaluzija-page.test.mjs tests/dualframe-pwa.test.mjs
      - name: Reconstruct exact published function sources
        run: python3 scripts/prepare-andaluzija-legacy-functions-20261021.py
      - name: Install pinned legacy dependencies and official packaging tools
        run: |
          npm ci --prefix "$ALBUM_FROZEN_ROOT" --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$ALBUM_FROZEN_ROOT/functions" --ignore-scripts --no-audit --no-fund
          npm install --prefix "$ALBUM_NETLIFY_TOOLS" --ignore-scripts --no-audit --no-fund netlify-cli@27.14.0
      - name: Package unchanged functions using the production CLI version
        run: node scripts/bundle-andaluzija-legacy-functions-20261021.mjs
      - name: Publish only the album and backlink over the exact current snapshot
        if: contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-R2')
        run: python3 scripts/deploy-andaluzija-dualframe-20261021.py
      - name: Correct only the two live PWA metadata files and verify the actual package
        if: contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-PWA-FIX')
        run: python3 scripts/repair-andaluzija-dualframe-pwa-20261021.py
      - name: Publish only photo-only fullscreen, styles and the page cache key
        if: contains(github.event.head_commit.message, 'ANDALUZIJA-PHOTO-ONLY-FULLSCREEN')
        run: python3 scripts/deploy-andaluzija-fullscreen-20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-dualframe-production-${{ github.run_id }}
          path: album-release-evidence/
          if-no-files-found: warn
          retention-days: 30
