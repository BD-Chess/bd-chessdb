name: Andaluzija DualFrame scoped production R2
# BD explicitly authorized this one album release. Normal Git CD stays disabled.
on:
  push:
    branches: [main]
    paths: [.github/workflows/andaluzija-dualframe-scoped-20261021-r2.yml]
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BD-Chess/bd-chessdb' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'ANDALUZIJA-DUALFRAME-R2')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify album interactions, assets and travel regressions without provider calls
        run: node --test tests/dualframe-album.test.mjs tests/andaluzija-ai.test.mjs tests/andaluzija-page.test.mjs tests/dualframe-pwa.test.mjs
      - name: Publish only the album and backlink over the exact current snapshot
        run: python3 scripts/deploy-andaluzija-dualframe-20261021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andaluzija-dualframe-production-${{ github.run_id }}
          path: album-release-evidence/
          if-no-files-found: warn
          retention-days: 30
