name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare protected pages for browser password managers
        shell: bash
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/trading-password-shield.js
          node --check public/js/bd-owner-access-v1.js
          node --check public/BD/BBSH-loader.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js
          node --check public/Trip/old/004/private-client.js
      - name: Inline owner-access runtime for GitHub Pages
        shell: python
        run: |
          from pathlib import Path
          import re
          helper = Path('public/js/bd-owner-access-v1.js').read_text(encoding='utf-8')
          patterns = [
              re.compile(r'<script\s+defer(?:="")?\s+src="/js/bd-owner-access-v1\.js"></script>'),
              re.compile(r'<script\s+src="/js/bd-owner-access-v1\.js"\s+defer(?:="")?></script>'),
          ]
          replacement = '<script>\n' + helper + '\n</script>'
          changed = []
          for p in sorted(Path('public').rglob('*.html')):
              s = p.read_text(encoding='utf-8')
              if '"schema":"BD_ACCESS_V1"' not in s:
                  continue
              # BBSH.pack.html is an encrypted same-origin payload carrier. Its
              # runtime reference is intentionally inert because BBSH-loader.js
              # extracts only bd-access-data and loads the shared helper itself.
              if p.as_posix() == 'public/BD/BBSH.pack.html':
                  continue
              out = s
              n = 0
              for pat in patterns:
                  out, k = pat.subn(replacement, out)
                  n += k
              if n:
                  p.write_text(out, encoding='utf-8')
                  changed.append((p.as_posix(), n))
              else:
                  raise SystemExit(f'BD_ACCESS_V1 page lacks expected owner runtime reference: {p}')
          if not changed:
              raise SystemExit('No BD_ACCESS_V1 pages found for owner-runtime inlining')
          print('Inlined owner runtime:', changed)
          bbsh = Path('public/BD/BBSH.html').read_text(encoding='utf-8')
          bbsh_loader = Path('public/BD/BBSH-loader.js').read_text(encoding='utf-8')
          bbsh_pack = Path('public/BD/BBSH.pack.html').read_text(encoding='utf-8')
          if './BBSH-loader.js?v=20260916-bbsh2' not in bbsh or 'bbsh-loader-status' not in bbsh:
              raise SystemExit('BBSH bootstrap page guard failed')
          if 'BBSH.pack.html' not in bbsh_loader or '../js/bd-owner-access-v1.js' not in bbsh_loader:
              raise SystemExit('BBSH loader route guard failed')
          if '"schema":"BD_ACCESS_V1"' not in bbsh_pack or '"path":"BD/BBSH.html"' not in bbsh_pack:
              raise SystemExit('BBSH encrypted payload guard failed')
      - name: Route all Trip unlock clients through Cloudflare on GitHub Pages
        shell: python
        run: |
          from pathlib import Path
          root = Path('public/Trip')
          old = "fetch('/api/trip-mdl-unlock',{method:'POST',credentials:'same-origin',cache:'no-store'"
          new = "fetch('https://mdlxdcc-trip-auth.iemcccc.workers.dev/',{method:'POST',credentials:'omit',cache:'no-store'"
          changed = []
          for p in sorted(root.rglob('*.js')):
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  changed.append((p.as_posix(), n))
          if not changed:
              raise SystemExit('No Trip auth clients found to route through Cloudflare')
          print('Routed Trip auth clients:', changed)
      - name: Verify all Trip Pages auth migration
        shell: bash
        run: |
          grep -R -F "https://mdlxdcc-trip-auth.iemcccc.workers.dev/" public/Trip --include='*.js'
          if grep -R -F "fetch('/api/trip-mdl-unlock'" public/Trip --include='*.js'; then
            echo 'Found a Trip client still using the Netlify-only relative auth endpoint.' >&2
            exit 1
          fi
          while IFS= read -r f; do node --check "$f"; done < <(grep -R -l -F "https://mdlxdcc-trip-auth.iemcccc.workers.dev/" public/Trip --include='*.js')
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
