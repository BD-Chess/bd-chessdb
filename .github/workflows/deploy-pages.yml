name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages accepts only one deployment at a time. Serialize main pushes so
# rapid commits queue instead of racing and failing with an in-progress deploy.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare protected pages for browser password managers
        shell: bash
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/trading-password-shield.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js
          node --check public/Trip/old/004/private-client.js
      - name: Route Trip LAB unlock through Cloudflare on GitHub Pages
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/Trip/new/private-client.js')
          s = p.read_text(encoding='utf-8')
          old = "fetch('/api/trip-mdl-unlock',{method:'POST',credentials:'same-origin',cache:'no-store'"
          new = "fetch('https://mdlxdcc-trip-auth.iemcccc.workers.dev/',{method:'POST',credentials:'omit',cache:'no-store'"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one Trip LAB auth endpoint, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify Trip LAB Pages auth migration
        shell: bash
        run: |
          grep -F "https://mdlxdcc-trip-auth.iemcccc.workers.dev/" public/Trip/new/private-client.js
          if grep -F "fetch('/api/trip-mdl-unlock'" public/Trip/new/private-client.js; then exit 1; fi
          node --check public/Trip/new/private-client.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
