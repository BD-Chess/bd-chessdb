name: Setup medication email hook
on:
  push:
    paths:
      - '.github/workflows/setup-medication-email-hook.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
      NETLIFY_ACCOUNT_ID: 6802342a64df540aa5dc3fd4
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Wait for medication form and ensure email hook
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          auth=(-H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json")

          form_id=""
          for i in $(seq 1 30); do
            curl -fsS "${auth[@]}" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/forms" > /tmp/forms.json
            form_id="$(python - <<'PY'
          import json
          a=json.load(open('/tmp/forms.json'))
          print(next((x.get('id','') for x in a if x.get('name')=='bd-med-reminder'),''))
          PY
          )"
            [ -n "$form_id" ] && break
            sleep 5
          done
          test -n "$form_id"

          curl -fsS "${auth[@]}" "https://api.netlify.com/api/v1/accounts/$NETLIFY_ACCOUNT_ID/env/BD_MED_REMINDER_TO?site_id=$NETLIFY_SITE_ID" > /tmp/emailenv.json
          email="$(python - <<'PY'
          import json
          x=json.load(open('/tmp/emailenv.json'))
          vals=x.get('values',[])
          pref=next((v.get('value','') for v in vals if v.get('context')=='production'), '')
          if not pref: pref=next((v.get('value','') for v in vals if v.get('context')=='all'), '')
          print(pref)
          PY
          )"
          test -n "$email"

          curl -fsS "${auth[@]}" "https://api.netlify.com/api/v1/hooks?site_id=$NETLIFY_SITE_ID" > /tmp/hooks.json
          exists="$(EMAIL="$email" FORM_ID="$form_id" python - <<'PY'
          import json,os
          hooks=json.load(open('/tmp/hooks.json'))
          e=os.environ['EMAIL']; f=os.environ['FORM_ID']
          ok=any(h.get('type')=='email' and h.get('event')=='submission_created' and h.get('form_id')==f and h.get('data',{}).get('email')==e for h in hooks)
          print('1' if ok else '0')
          PY
          )"
          if [ "$exists" = "1" ]; then
            echo "Medication email hook already configured."
            exit 0
          fi

          EMAIL="$email" FORM_ID="$form_id" SITE_ID="$NETLIFY_SITE_ID" python - <<'PY' > /tmp/hook-body.json
          import json,os
          print(json.dumps({
            'site_id':os.environ['SITE_ID'],
            'form_id':os.environ['FORM_ID'],
            'type':'email',
            'event':'submission_created',
            'data':{'email':os.environ['EMAIL']}
          }))
          PY
          curl -fsS -X POST "${auth[@]}" --data-binary @/tmp/hook-body.json "https://api.netlify.com/api/v1/hooks" > /tmp/hook-created.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/hook-created.json'))
          assert x.get('type')=='email' and x.get('event')=='submission_created'
          print('Medication email hook configured.')
          PY
