name: Landing finalize one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-finalize-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_SITE_ID: 17b4124d-c197-4c0a-a711-8b2c08d91088
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finalize landing behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_FINALIZE_20260917_R1'
          if marker in s:
              raise SystemExit(0)

          # Search seed: 8Z OS and exact public shortcuts.
          toe="['crp/ToE.html','8Z × CFH ToE','toe theory of encoding theory of everything 8z cfh cch compression entropy information physics consciousness encoding zavest entropija fizika','8Z × CFH Theory of Encoding research programme.','Raziskovalni program 8Z × CFH Theory of Encoding.'],"
          os_seed="['OS/','8Z OS','8z os os 8zos operating system 8z operating system claustrum digital claustrum','8Z OS origin story and operating-system project.','Izvorna zgodba in projekt operacijskega sistema 8Z OS.'],"
          if os_seed not in s:
              if toe not in s: raise SystemExit('ToE search seed anchor not found')
              s=s.replace(toe,toe+'\n'+os_seed,1)

          private_line="const PRIVATE=Object.freeze({bbsh:'BD/BBSH.html',wl:'WL/index.html',o:'BD/O/index.html',sef:'BD/O/sef.html'}),STORE='mdlxdcc-search-history-v1';"
          public_line="const PRIVATE=Object.freeze({bbsh:'BD/BBSH.html',wl:'WL/index.html',o:'BD/O/index.html',sef:'BD/O/sef.html'}),PUBLIC_DIRECT=Object.freeze({toe:'crp/ToE.html','8z os':'OS/',os:'OS/',8zos:'OS/'}),STORE='mdlxdcc-search-history-v1';"
          if private_line not in s: raise SystemExit('search shortcut anchor not found')
          s=s.replace(private_line,public_line,1)

          old_submit="$('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=norm(input.value);if(q==='toe'){remember(input.value);location.href=new URL('crp/ToE.html',BASE).href;return;}const direct=PRIVATE[q];if(direct){location.href=new URL(direct,BASE).href;return;}const p=results[active>=0?active:0];if(p){remember(input.value);location.href=p.url;}});"
          new_submit="$('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=norm(input.value),publicDirect=PUBLIC_DIRECT[q];if(publicDirect){remember(input.value);location.assign(new URL(publicDirect,BASE).href);return;}const direct=PRIVATE[q];if(direct){location.assign(new URL(direct,BASE).href);return;}const p=results[active>=0?active:0];if(p){remember(input.value);location.assign(p.url);}});"
          if old_submit not in s: raise SystemExit('search submit anchor not found')
          s=s.replace(old_submit,new_submit,1)

          # Third visible row: + Explore more.
          anchor='<div class="tool-more" id="tool-more" hidden>'
          toggle='''<button class="tool-explore-more" id="tool-more-toggle" type="button" aria-expanded="false" aria-controls="tool-more"><span class="en" lang="en"><span class="tool-more-sign">+</span> Explore more</span><span class="sl" lang="sl"><span class="tool-more-sign">+</span> Razišči več</span></button>\n'''
          if 'id="tool-more-toggle"' not in s:
              if anchor not in s: raise SystemExit('tool-more anchor not found')
              s=s.replace(anchor,toggle+anchor,1)

          # JS: both heading and third-row control expand/collapse the compressed map.
          old_js="const toolMapToggle=$('#tool-map-toggle'),toolMore=$('#tool-more');\nfunction setToolMap(open,persist=true){if(!toolMapToggle||!toolMore)return;toolMapToggle.setAttribute('aria-expanded',String(open));toolMore.hidden=!open;if(persist)save('mdlxdcc-tools-expanded',open?'1':'0');labels();}\nif(toolMapToggle&&toolMore){setToolMap(read('mdlxdcc-tools-expanded','0')==='1',false);toolMapToggle.addEventListener('click',()=>setToolMap(toolMapToggle.getAttribute('aria-expanded')!=='true'));};"
          if old_js not in s:
              old_js="const toolMapToggle=$('#tool-map-toggle'),toolMore=$('#tool-more');\nfunction setToolMap(open,persist=true){if(!toolMapToggle||!toolMore)return;toolMapToggle.setAttribute('aria-expanded',String(open));toolMore.hidden=!open;if(persist)save('mdlxdcc-tools-expanded',open?'1':'0');labels();}\nif(toolMapToggle&&toolMore){setToolMap(read('mdlxdcc-tools-expanded','0')==='1',false);toolMapToggle.addEventListener('click',()=>setToolMap(toolMapToggle.getAttribute('aria-expanded')!=='true'));}"
          new_js="const toolMapToggle=$('#tool-map-toggle'),toolMoreToggle=$('#tool-more-toggle'),toolMore=$('#tool-more');\nfunction setToolMap(open,persist=true){if(!toolMapToggle||!toolMore)return;toolMapToggle.setAttribute('aria-expanded',String(open));if(toolMoreToggle)toolMoreToggle.setAttribute('aria-expanded',String(open));toolMore.hidden=!open;$$('.tool-more-sign').forEach(n=>n.textContent=open?'−':'+');if(persist)save('mdlxdcc-tools-expanded',open?'1':'0');labels();}\nif(toolMapToggle&&toolMore){setToolMap(read('mdlxdcc-tools-expanded','0')==='1',false);toolMapToggle.addEventListener('click',()=>setToolMap(toolMapToggle.getAttribute('aria-expanded')!=='true'));if(toolMoreToggle)toolMoreToggle.addEventListener('click',()=>setToolMap(toolMapToggle.getAttribute('aria-expanded')!=='true'));}"
          if old_js not in s: raise SystemExit('tool map JS anchor not found')
          s=s.replace(old_js,new_js,1)

          old_label="$('.tools').setAttribute('aria-label',text('Compressed project map','Stisnjen zemljevid projektov'));const mt=$('#tool-map-toggle');if(mt)mt.setAttribute('aria-label',mt.getAttribute('aria-expanded')==='true'?text('Collapse project links','Strni projektne povezave'):text('Expand project links','Razgrni projektne povezave'));$('.footer-links').setAttribute('aria-label',text('About the makers','O ustvarjalcih'));"
          new_label="$('.tools').setAttribute('aria-label',text('Compressed project map','Stisnjen zemljevid projektov'));const mt=$('#tool-map-toggle'),mmt=$('#tool-more-toggle');if(mt)mt.setAttribute('aria-label',mt.getAttribute('aria-expanded')==='true'?text('Collapse project links','Strni projektne povezave'):text('Expand project links','Razgrni projektne povezave'));if(mmt)mmt.setAttribute('aria-label',mmt.getAttribute('aria-expanded')==='true'?text('Collapse extra project links','Strni dodatne projektne povezave'):text('Explore more project links','Razišči več projektnih povezav'));$('.footer-links').setAttribute('aria-label',text('About the makers','O ustvarjalcih'));"
          if old_label not in s: raise SystemExit('labels anchor not found')
          s=s.replace(old_label,new_label,1)

          css='''\n/* LANDING_FINALIZE_20260917_R1 */\n.tool-explore-more{width:100%;min-height:54px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);text-align:left;padding:0;font:600 .9rem/1.4 Consolas,monospace;letter-spacing:.08em;cursor:pointer}.tool-explore-more:hover{color:var(--ink)}\n@media(hover:hover) and (pointer:fine){.original-grid .door{opacity:.58;filter:saturate(.72);transform:scale(.992);transition:opacity .22s ease,filter .22s ease,transform .22s ease,box-shadow .22s ease,border-color .22s ease}.original-grid .door:hover,.original-grid .door:focus-visible{opacity:1;filter:none;transform:translateY(-3px) scale(1);box-shadow:0 18px 44px #0003;border-color:var(--accent)}}\n@media(max-width:700px){.tool-explore-more{min-height:48px;font-size:.84rem}}\n'''
          pos=s.find('</style>')
          if pos<0: raise SystemExit('style closing tag not found')
          s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8',newline='\n')

      - name: Commit landing changes
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Finalize landing search and compressed navigation"
          git push origin HEAD:main

      - name: Prepare protected pages for production
        shell: bash
        run: |
          python3 scripts/inject_password_manager.py public --report "$RUNNER_TEMP/password-manager-compat-report.json"
          node --check public/js/bd-password-manager.js
          node --check public/js/trading-password-shield.js
          node --check public/BD/O/vault.js
          node --check public/WL/reader.js
          node --check public/WL/BD/reader.js
          node --check public/Trip/private-client.js
          node --check public/Trip/new/private-client.js
          node --check public/Trip/old/004/private-client.js

      - name: Set up Node 22
        if: env.NETLIFY_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npm ci --ignore-scripts

      - name: Deploy exact worktree to Netlify production
        if: env.NETLIFY_AUTH_TOKEN != ''
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir public \
            --functions functions \
            --skip-functions-cache \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Landing finalize ${GITHUB_SHA}" \
            --json > netlify-deploy.json
          node -e 'const d=require("./netlify-deploy.json"); console.log(JSON.stringify({deploy_id:d.deploy_id||d.deployId||null,url:d.url||d.deploy_url||null,logs:d.logs||null}))'
