name: Vault v11 bounded staging only
on:
  push:
    branches: [maintenance/vault-v11-20260920-bd]
    paths: [.github/workflows/vault-v11-stage-only.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize reviewed files; create blobs only, never update refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .vault-stage/stage.py
      - uses: actions/upload-artifact@v4
        with:
          name: vault-v11-staged-exact
          path: vault-output/
          retention-days: 7
          if-no-files-found: error
