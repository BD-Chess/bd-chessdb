name: Trip GUI refresh patch R1

on:
  push:
    branches:
      - trip-gui-refresh-r1
    paths:
      - .github/workflows/trip-gui-refresh-r1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trip-gui-refresh-r1
      - name: Apply surgical Trip LAB patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = 'public/Trip/new/index.html'
          app = 'public/Trip/new/app.js'
          ui = 'public/Trip/new/ui-text.js'

          replace_once(
              index,
              '<span data-ui-text="Map refresh interval">Map refresh interval</span>',
              '<span data-ui-text="Map/table refresh interval">Map/table refresh interval</span>'
          )
          replace_once(
              index,
              '<select id="mapRefreshInterval"><option value="1000">1 s</option><option value="5000" selected>5 s</option><option value="15000">15 s</option><option value="30000">30 s</option><option value="60000">1 min</option></select>',
              '<select id="mapRefreshInterval"><option value="1000">1 s</option><option value="5000" selected>5 s</option><option value="15000">15 s</option><option value="30000">30 s</option><option value="60000">1 min</option><option value="300000">5 min</option><option value="900000">15 min</option><option value="3600000">1 h</option></select>'
          )

          replace_once(
              ui,
              '"Map refresh interval":"Čas osveževanja mape",',
              '"Map/table refresh interval":"Čas osveževanja mape/tabele",'
          )

          replace_once(
              app,
              'return [1000,5000,15000,30000,60000].includes(selected) ? selected : 5000;',
              'return [1000,5000,15000,30000,60000,300000,900000,3600000].includes(selected) ? selected : 5000;'
          )

          replace_once(
              app,
              '  function displayComparison(msg, job) {\n    const name =',
              "  function displayComparison(msg, job) {\n    const running = msg?.type === 'progress' || msg?.type === 'brute-progress';\n    if (running) {\n      const now = performance.now();\n      if (now - (job.lastComparisonRefresh ?? -Infinity) < mapRefreshInterval()) return;\n      job.lastComparisonRefresh = now;\n    }\n    const name ="
          )

          replace_once(
              app,
              'job.latest = msg; displaySearchProgress(msg, job); refreshBruteMap(msg, job);',
              'job.latest = msg; displaySearchProgress(msg, job); displayComparison(msg, job); refreshBruteMap(msg, job);'
          )

          replace_once(
              app,
              'Map refresh interval is selectable: 1, 5, 15, 30 or 60 seconds, default 5; only improved routes are redrawn.',
              'Map/table refresh interval is selectable: 1, 5, 15, 30 or 60 seconds, 5 or 15 minutes, or 1 hour; default 5 seconds. It controls both improved map redraws and the active calculation-comparison row.'
          )

          # Post-patch invariants.
          it = Path(index).read_text(encoding='utf-8')
          at = Path(app).read_text(encoding='utf-8')
          ut = Path(ui).read_text(encoding='utf-8')
          for token in ['300000','900000','3600000','Map/table refresh interval']:
              if token not in it:
                  raise SystemExit(f'index invariant missing: {token}')
          if '[1000,5000,15000,30000,60000,300000,900000,3600000]' not in at:
              raise SystemExit('app interval whitelist invariant missing')
          if 'displaySearchProgress(msg, job); displayComparison(msg, job); refreshBruteMap(msg, job);' not in at:
              raise SystemExit('deep progress comparison refresh invariant missing')
          if 'job.lastComparisonRefresh' not in at:
              raise SystemExit('comparison throttle invariant missing')
          if '"Map/table refresh interval":"Čas osveževanja mape/tabele"' not in ut:
              raise SystemExit('Slovenian label invariant missing')
          PY
      - name: Validate JavaScript and existing Trip tests
        shell: bash
        run: |
          node --check public/Trip/new/app.js
          node --check public/Trip/new/ui-text.js
          node --test tests/trip-new-stops.test.mjs
          git diff --check
      - name: Commit only final Trip LAB files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trip-gui-refresh-r1.yml
          git add public/Trip/new/index.html public/Trip/new/app.js public/Trip/new/ui-text.js
          git diff --cached --stat
          git commit -m "Trip LAB: share map/table refresh interval"
          git push origin HEAD:trip-gui-refresh-r1
