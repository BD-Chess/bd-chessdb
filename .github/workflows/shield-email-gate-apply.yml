name: Apply reviewed Shield email gate

on:
  push:
    branches:
      - codex/shield-email-access-20260909

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shield-email-access-20260909
          fetch-depth: 0
      - name: Apply minimal email-gate patch
        env:
          GATE_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          gate_js = base64.b64decode(__import__('os').environ['GATE_B64']).decode('utf-8')
          gate_hash = "'sha256-" + base64.b64encode(hashlib.sha256(gate_js.encode('utf-8')).digest()).decode('ascii') + "'"
          gate_style = '''<style id="shield-email-gate-style">
          #shield-email-dialog input[type=email]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);padding:10px 12px;margin-top:6px}
          #shield-email-dialog .shield-email-note{margin:12px 0;color:var(--muted);font-size:.82rem;line-height:1.55}
          #shield-email-dialog #shield-email-status{min-height:1.5em;margin:10px 0;color:var(--warm)}
          </style>'''
          gate_dialog = '''<dialog aria-labelledby="shield-email-title" class="shield-dialog" id="shield-email-dialog"><div class="shield-dialog-head"><span class="shield-brand">8Z SHIELD</span><button aria-label="Close / Zapri" class="icon-btn" id="shield-email-close" type="button">×</button></div><h2 id="shield-email-title"><span class="en" lang="en">Unlock technical depth</span><span class="sl" lang="sl">Odkleni tehnične poglobitve</span></h2><p><span class="en" lang="en">Enter an email address to open the protected technical notes.</span><span class="sl" lang="sl">Vnesi e-poštni naslov za dostop do zaščitenih tehničnih opomb.</span></p><form id="shield-email-form"><label for="shield-email-input"><span class="en" lang="en">Email</span><span class="sl" lang="sl">E-pošta</span></label><input autocomplete="email" id="shield-email-input" maxlength="254" required spellcheck="false" type="email"><p class="shield-email-note"><span class="en" lang="en">By continuing, the email address, access time and IP address (when available) are recorded and sent to BD. The address is checked for format only; the mailbox is not verified. Access lasts up to 8 hours on this site.</span><span class="sl" lang="sl">Z nadaljevanjem se e-poštni naslov, čas dostopa in IP naslov (če je na voljo) zabeležijo in pošljejo BD-ju. Preveri se samo oblika naslova; obstoj predala se ne preverja. Dostop na tem spletišču velja do 8 ur.</span></p><div aria-live="polite" id="shield-email-status" role="status"></div><button class="btn primary" type="submit"><span class="en" lang="en">Continue &amp; unlock</span><span class="sl" lang="sl">Nadaljuj in odkleni</span></button></form><p class="shield-request"><a href="mailto:bd@siol.net?subject=MDLxDCC%20technical%20access"><span class="en" lang="en">Contact BD</span><span class="sl" lang="sl">Piši BD-ju</span></a></p></dialog>'''
          fragment = gate_style + gate_dialog + '<script id="shield-email-gate-runtime">' + gate_js + '</script>'
          targets = [Path('public/index-search.html'), Path('public/crp/8z_MDLxDCC.html')]
          blob_re = re.compile(r'data-8z-blob="([^"]+)"')
          for path in targets:
              text = path.read_bytes().decode('utf-8')
              if 'shield-email-gate-runtime' in text:
                  print(path, 'already patched')
                  continue
              before_blobs = blob_re.findall(text)
              if not before_blobs:
                  raise SystemExit(f'{path}: no Shield ciphertexts found')
              start = text.find('script-src ')
              end = text.find(';', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'{path}: CSP script-src not found')
              if gate_hash not in text[start:end]:
                  text = text[:end] + ' ' + gate_hash + text[end:]
              text = text.replace('Public results. Selected implementation details by access key.', 'Public results. Selected implementation details after a quick email check.')
              text = text.replace('Javni rezultati. Izbrane izvedbene podrobnosti z geslom.', 'Javni rezultati. Izbrane izvedbene podrobnosti po kratkem vnosu e-pošte.')
              text = text.replace('<span class="en" lang="en">Unlock once</span><span class="sl" lang="sl">Odkleni enkrat</span>', '<span class="en" lang="en">Open access</span><span class="sl" lang="sl">Odpri dostop</span>')
              if '</body>' not in text:
                  raise SystemExit(f'{path}: </body> not found')
              text = text.replace('</body>', fragment + '</body>', 1)
              after_blobs = blob_re.findall(text)
              if before_blobs != after_blobs:
                  raise SystemExit(f'{path}: Shield ciphertext changed')
              path.write_bytes(text.encode('utf-8'))
              print(path, 'patched; ciphertexts', len(before_blobs), 'CSP', gate_hash)
          PY
          git diff --check
      - name: Commit reviewed patch
        run: |
          if git diff --quiet -- public/index-search.html public/crp/8z_MDLxDCC.html; then
            echo "No HTML changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index-search.html public/crp/8z_MDLxDCC.html
          git commit -m "Use email gate for 8Z Shield access"
          git push origin HEAD:codex/shield-email-access-20260909
