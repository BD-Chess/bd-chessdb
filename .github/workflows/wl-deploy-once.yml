name: WL live acceptance
# R2: open the control disclosure before testing its buttons; never force clicks.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wl-deploy-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wl-owner-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live private browser acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wl_acceptance_once.mjs
