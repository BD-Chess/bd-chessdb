name: Temporary research page evidence refresh 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp_refresh_research_pages_20260913.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch verified evidence surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          # Sudoku R6: current status and evidence surface only.
          p = Path('public/crp/AI8_Sudoku_R6.html')
          s = p.read_text(encoding='utf-8')
          old = '<body><section id="hf4-current-20260912" style="margin:18px auto;max-width:1180px;border:1px solid rgba(34,211,238,.35);border-radius:16px;padding:18px;background:rgba(34,211,238,.055)"><p style="margin:0 0 6px;font:700 12px ui-monospace,Consolas,monospace;color:#22d3ee">CURRENT VERIFIED STATUS · 12 SEP 2026</p><h2 style="margin:.2em 0">HF4 acceptance is running</h2><p><strong>3/5 Selftest:</strong> 258/443 complete · failures 0 · errors 0. Package verification PASS (245 members) and field regression PASS (23/23). Protected/long scientific campaign executions remain <strong>0</strong>; <code>scientific_final=false</code>.</p><p>The current RUNNING state therefore means <strong>engineering acceptance</strong>, not that the long scientific campaign has started or that a representation advantage has been established. <a href="/evidence/AI8_Sudoku_R6_20260912.json">12 Sep evidence JSON →</a></p></section>'
          new = '<body><section id="hf4-current-20260912" style="margin:18px auto;max-width:1180px;border:1px solid rgba(34,211,238,.35);border-radius:16px;padding:18px;background:rgba(34,211,238,.055)"><p style="margin:0 0 6px;font:700 12px ui-monospace,Consolas,monospace;color:#22d3ee">CURRENT VERIFIED STATUS · 12 SEP 2026 · FINAL BOUNDED CUT</p><h2 style="margin:.2em 0">HF4 bounded acceptance is complete</h2><p><strong>Master 5/5 PASS</strong> · selftest <strong>444/444</strong> with 3 allowed SKIP · smoke <strong>4/4 PASS</strong> · P1/P2/P3 <strong>PASS</strong>. The final extract contains 467 unique runtime task IDs: 335 SOLVED and 132 LIMIT.</p><p>The arena is now <strong>STANDBY</strong>. Protected/long scientific campaign executions remain <strong>0</strong>; <code>scientific_final=false</code> and semantic proof replay remains <code>NOT_RUN</code>. This is bounded engineering acceptance, not a scientific-superiority claim. <a href="/evidence/AI8_Sudoku_R6_HF4_BOUNDED_FINAL_20260912.json">Final bounded evidence →</a></p></section>'
          s = replace_once(s, old, new, 'Sudoku current status')
          s = replace_once(s, 'Delivered arena · R6 HF3 HF1 · Updated 10 September 2026', 'Delivered arena · R6 HF4 bounded final · Updated 13 September 2026', 'Sudoku hero date')
          start = s.index('<section class="section" id="evidence">')
          end = s.index('  <div class="grid">', start)
          final_evidence = '''<section class="section" id="evidence">
            <div class="eyebrow">Evidence · final bounded cut verified 12–13 September 2026</div>
            <h2>Engineering acceptance passed. Scientific superiority remains open.</h2>
            <p class="section-intro">
              The bounded HF4 acceptance chain is complete and internally consistent. It validates the arena, proofs and pilot orchestration; it does not substitute for the separate long scientific campaign, which was not started.
            </p>
            <div class="table-scroll" role="region" aria-label="Sudoku evidence by version" tabindex="0">
              <table class="evidence-table">
                <thead><tr><th scope="col">Evidence</th><th scope="col">Observed result</th><th scope="col">Scope</th></tr></thead>
                <tbody>
                  <tr><th scope="row">HF4 bounded master</th><td>5/5 PASS</td><td>Package, Windows/preflight, selftest, smoke and bounded pilot stages completed successfully.</td></tr>
                  <tr><th scope="row">Selftest + smoke</th><td>444/444 assertions; 3 allowed SKIP · smoke 4/4 PASS</td><td>Engineering acceptance of the delivered arena; allowed skips are retained explicitly rather than hidden.</td></tr>
                  <tr><th scope="row">P1 / P2 / P3 pilots</th><td>PASS · 467 unique runtime tasks = 335 SOLVED + 132 LIMIT</td><td>One bounded development experiment. These counts are not an independent scientific replication.</td></tr>
                  <tr><th scope="row">Scientific status</th><td>Long campaign executions 0 · <code>scientific_final=false</code></td><td>Semantic proof replay is <code>NOT_RUN</code>; no representation, MDL or DCC superiority is promoted from this cut.</td></tr>
                </tbody>
              </table>
            </div>
            <p class="section-intro">The earlier main P1 comparison remains an important negative control: MDL_DCC solved no more puzzles than the matched constant-predictor actuator and cost about 37.8% more WU; Seeded MRV and Luby restarts were cheaper. The final bounded acceptance does not reverse that result.</p>
            <details class="audit-details">
              <summary>Exact artifact identities and evidence provenance</summary>
              <p>Final bounded live extract: <code>HF3_ALL_LIVE_1789236581472973300.zip</code> · 13,722,495 bytes · 3,021 members.</p>
              <p>Final extract SHA-256:<br><code>e1c5b282beaa0ef14a7ff15cc166852ca5e05c9ef459f9521243ca99f42a2b5f</code></p>
              <p>The included verifier returned <code>VERIFIED</code>; its manifest SHA3-256 is <code>722125503ce7c1e918eab328082c2d7088ae9dd7d947667db4dba58955fb0ace</code>.</p>
              <p>Release receipt retained for lineage: <code>AI8_Sudoku_R6_Program_v0_2_0_R1_HF3_HF1.zip</code> · 2,765,694 bytes · 214 members.</p>
              <p>Earlier qualification snapshot retained for history: <code>HF3_LONG_FAST_LIVE_1789073761629256000.zip</code>. The final bounded extract above supersedes it for current status.</p>
              <p><a href="/evidence/AI8_Sudoku_R6_HF4_BOUNDED_FINAL_20260912.json">Final bounded public evidence receipt ↗</a></p>
              <p><a href="/c/Sudoku_R3L1_Live_Snapshot_20260904.html">Earlier R3L1 evidence, preserved under its original version ↗</a></p>
            </details>
          '''
          s = s[:start] + final_evidence + s[end:]
          p.write_text(s, encoding='utf-8')

          # Trading Research Atlas: add current verified runtime cut and replace stale missing-artifact claim.
          p = Path('public/BD/BD_Trading_Research_Atlas.html')
          s = p.read_text(encoding='utf-8')
          marker = '<main id="top">\n'
          if '13 SEP 2026 · VERIFIED RUNTIME UPDATE' in s:
              raise SystemExit('Trading update already present')
          banner = '<div class="results-intro" style="margin-top:1rem"><b>13 SEP 2026 · VERIFIED RUNTIME UPDATE</b><p><span class="lang-en">BD Trading Atlas v0.1.4-HF3 is now directly evidenced: selftest 142/142 PASS; numeric, compact and HF3 regression gates PASS; 1,932/2,495 tasks (77.43%) at the verified cutoff; persistent errors 0. This is operational evidence, not promotion: <code>TECHNICAL_PASS=false</code>, <code>MANDATE_COMPLETE=false</code> and <code>LONG_RUN_READY=false</code>.</span><span class="lang-sl">BD Trading Atlas v0.1.4-HF3 ima zdaj neposredno evidenco: selftest 142/142 PASS; numeric, compact in HF3 regression gates PASS; 1.932/2.495 nalog (77,43 %) pri preverjenem preseku; persistent errors 0. To je operativna evidenca, ne promocija: <code>TECHNICAL_PASS=false</code>, <code>MANDATE_COMPLETE=false</code> in <code>LONG_RUN_READY=false</code>.</span> <a href="/index-todo.html#arena=bdta-v014">8Z Control →</a></p></div>\n'
          s = replace_once(s, marker, marker + '    ' + banner, 'Trading main insertion')
          k0 = '<article class="arena"><div class="arena-top"><div><span class="arena-id">K / ATLAS</span>'
          k1 = s.index(k0)
          k2 = s.index('</article>', k1) + len('</article>')
          k_new = '''<article class="arena"><div class="arena-top"><div><span class="arena-id">K / ATLAS · v0.1.4-HF3</span><h3><span class="lang-en">BD Trading Atlas</span><span class="lang-sl">BD Trading Atlas</span></h3></div><span class="chip good">RUNNING · VERIFIED CUT</span></div><p><span class="lang-en"><b>Why:</b> bring the strongest donor mechanisms into fair common-panel comparison, ablation, cost/tail/capacity testing and synthesis.</span><span class="lang-sl"><b>Zakaj:</b> najmočnejše donor mehanizme pripeljati v pošteno common-panel primerjavo, ablation, cost/tail/capacity testiranje in sintezo.</span></p><ul><li><span class="lang-en">The verified v0.1.4-HF3 cut reached 1,932/2,495 tasks (77.43%) with persistent errors 0; selftest 142/142 and the numeric, compact and HF3 regression gates passed.</span><span class="lang-sl">Preverjeni v0.1.4-HF3 presek je dosegel 1.932/2.495 nalog (77,43 %) brez persistent errors; selftest 142/142 ter numeric, compact in HF3 regression gates so PASS.</span></li><li><span class="lang-en">Operational health is not promotion readiness: TECHNICAL_PASS, MANDATE_COMPLETE and LONG_RUN_READY remain false at this cutoff, and the SQLite/WAL close-path cause remains open.</span><span class="lang-sl">Operativno zdravje ni pripravljenost za promocijo: TECHNICAL_PASS, MANDATE_COMPLETE in LONG_RUN_READY pri tem preseku ostajajo false, vzrok SQLite/WAL close-path pa ostaja odprt.</span></li></ul><p class="source-note">DIRECT verified runtime cut · research only · no live-profitability claim.</p></article>'''
          s = s[:k1] + k_new + s[k2:]
          s = replace_once(s, 'research edition, 2026-09-09. Public copy is intentionally source-bounded.', 'research edition, updated 2026-09-13. Public copy is intentionally source-bounded.', 'Trading EN footer date')
          s = replace_once(s, 'raziskovalna izdaja, 2026-09-09. Javno besedilo je namenoma source-bounded.', 'raziskovalna izdaja, posodobljena 2026-09-13. Javno besedilo je namenoma source-bounded.', 'Trading SL footer date')
          p.write_text(s, encoding='utf-8')

          # Materials: only correct the current status banner; retain the dated baseline below.
          p = Path('public/8zMaterials.html')
          s = p.read_text(encoding='utf-8')
          m0 = s.index('<main class="wrap" id="main"><section id="evidence-20260912"')
          m1 = s.index('</section><div class="hero">', m0) + len('</section>')
          old_status = s[m0:m1]
          if '97.78% of the 72h budget elapsed' not in old_status:
              raise SystemExit('Materials legacy status precondition not found')
          m_new = '''<main class="wrap" id="main"><section id="evidence-20260912" style="margin:18px 0;border:1px solid rgba(34,211,238,.35);border-radius:16px;padding:18px;background:rgba(34,211,238,.055)"><h2 style="margin-top:0">13 Sep 2026 · current verified status</h2><p><strong>Native v0.2.0F B6/H1:</strong> next epoch 2,276 · 2,388 committed candidates · 75 qualified F2 basins · 72 work-producing L2 selections · 0 promoted rules.</p><p><strong>Legacy A3:</strong> the 72h campaign is now <strong>DONE</strong>. Its prior 1,662-epoch / 3,324-candidate checkpoint remains the last promoted numerical baseline while the final post-stop rich evidence stays separate from public claims.</p><p><strong>Claim boundary:</strong> ML screening only; no stable-material, novelty or DFT/hull claim is promoted. The detailed 11 Sep snapshot below is retained as its dated baseline. <a href="/evidence/8zMaterials_NATIVE_20260912.json">12 Sep evidence JSON →</a></p></section>'''
          s = s[:m0] + m_new + s[m1:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          files = [
            Path('public/crp/AI8_Sudoku_R6.html'),
            Path('public/BD/BD_Trading_Research_Atlas.html'),
            Path('public/8zMaterials.html'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              parser = P(convert_charrefs=True); parser.feed(text); parser.close()
              assert text.lower().count('<html') == 1
              assert text.lower().count('</html>') == 1
              assert text.lower().count('<body') == 1
              assert text.lower().count('</body>') == 1
          print('HTML parse + structural checks PASS')
          PY
          grep -q 'HF4 bounded acceptance is complete' public/crp/AI8_Sudoku_R6.html
          grep -q '1,932/2,495 tasks (77.43%)' public/BD/BD_Trading_Research_Atlas.html
          grep -q 'the 72h campaign is now <strong>DONE</strong>' public/8zMaterials.html

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_temp_refresh_research_pages_20260913.yml
          git config user.name 'BD × AI Lab'
          git config user.email 'actions@users.noreply.github.com'
          git add public/crp/AI8_Sudoku_R6.html public/BD/BD_Trading_Research_Atlas.html public/8zMaterials.html .github/workflows/_temp_refresh_research_pages_20260913.yml
          git commit -m 'Refresh verified research evidence pages'
          git pull --rebase origin main
          git push origin HEAD:main
