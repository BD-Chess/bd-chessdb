name: Dispatch BD-approved DGTE page release 20261020
# BD explicitly requested this publication after the DGTE research exchange.
# This one-shot dispatcher uses the established manual-only production workflow.
# It neither re-enables Netlify continuous deployment nor alters release checks.
on:
  push:
    branches: [main]
    paths: [.github/workflows/dgte-research-release-20261020.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: >-
      github.repository == 'BD-Chess/bd-chessdb' &&
      github.event.head_commit.message == 'release: BD-approved DGTE research update 20261020 R7'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate exact approved page and unchanged production workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '465f47fce65f6fdd74f48a37433fe850a9d37aaf'
          expected_paths=$'.github/workflows/dgte-research-release-20261020.yml\npublic/crp/DGTE.html\npublic/crp/assets/dgte/research-20261020/DGTE_PUBLIC_SUMMARY_20261020.json\npublic/crp/assets/dgte/research-20261020/DGTE_R4_PUBLIC_SELECTED_CHECKS_20261020.json'
          test "$(git diff --name-only HEAD^ HEAD)" = "$expected_paths"
          test "$(git hash-object .github/workflows/deploy-netlify.yml)" = '50ce39e4c000f312174fdc188b6c0afcf223fd18'
          echo 'd45677cfb54c9cfa643c76f9fa7f3e4c4791c9898a8f6be41cad1c83fa854747  public/crp/DGTE.html' | sha256sum -c -
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Request one manual MDLxDCC production release at this frozen main SHA
        shell: bash
        run: gh workflow run deploy-netlify.yml --repo "$GITHUB_REPOSITORY" --ref main -f site=mdlxdcc -f target_sha="$GITHUB_SHA"
