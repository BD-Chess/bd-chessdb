name: Landing compressed links one-shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/landing-links-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand compressed landing links
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='LANDING_COMPRESSED_LINKS_20260917'
          if marker in s:
              raise SystemExit(0)
          old_nav='''<nav class="tools" aria-label="Try a working tool"><p class="tools-heading"><span class="en" lang="en">From ideas to experience</span><span class="sl" lang="sl">Iz idej v izkušnjo</span></p><div class="tool-links"><a class="tool-link" href="./Trip/"><span class="num">01</span>Trip<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./chess/"><span class="num">02</span><span class="en" lang="en">Chess</span><span class="sl" lang="sl">Šah</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./S/"><span class="num">03</span>Sudoku<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./Nara/"><span class="num">04</span><span class="en" lang="en">Stories</span><span class="sl" lang="sl">Zgodbe</span><span class="arrow" aria-hidden="true">↗</span></a></div></nav>'''
          new_nav='''<!-- LANDING_COMPRESSED_LINKS_20260917 -->
<nav class="tools" aria-label="Compressed project map">
<button class="tools-heading" id="tool-map-toggle" type="button" aria-expanded="false" aria-controls="tool-more"><span><span class="en" lang="en">From ideas to experience</span><span class="sl" lang="sl">Iz idej v izkušnjo</span></span><span class="tools-toggle" aria-hidden="true"></span></button>
<div class="tool-rows">
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Apps</span><span class="sl" lang="sl">Aplikacije</span></span><div class="tool-links"><a class="tool-link" href="./Trip/">Trip<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./chess/"><span class="en" lang="en">Chess</span><span class="sl" lang="sl">Šah</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./S/">Sudoku<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./F4M/">Flip4M<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Core</span><span class="sl" lang="sl">Jedro</span></span><div class="tool-links"><a class="tool-link" href="./crp/8z_MDLxDCC.html">MDL×DCC<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./8Z/8Z_compression.html">8Z<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./AI8/">AI8<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/MDLxDCC-Arenas.html">Arenas<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-more" id="tool-more" hidden>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Research</span><span class="sl" lang="sl">Raziskave</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_CCH_Consciousness_Field.html"><span class="en" lang="en">Consciousness</span><span class="sl" lang="sl">Zavest</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/ToE.html">ToE<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./8zMaterials.html">8zMaterials<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/BD_Trading_Research_Atlas.html">Trading<span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Systems</span><span class="sl" lang="sl">Sistemi</span></span><div class="tool-links"><a class="tool-link" href="./BD/BD_AIM3_RHP.html">AIm3 / RHP<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./BD/8z_shield_landing.html">8Z Shield<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./index-todo.html">8Z Control<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./crp/Top100I.html"><span class="en" lang="en">Inventions</span><span class="sl" lang="sl">Izumi</span><span class="arrow" aria-hidden="true">↗</span></a></div></div>
<div class="tool-row"><span class="tool-row-label"><span class="en" lang="en">Explore</span><span class="sl" lang="sl">Razišči</span></span><div class="tool-links"><a class="tool-link" href="./index-atlas.html">Atlas<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./index-todo.html"><span class="en" lang="en">Now &amp; next</span><span class="sl" lang="sl">Zdaj in potem</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./Nara/"><span class="en" lang="en">Stories</span><span class="sl" lang="sl">Zgodbe</span><span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./bd/">BD<span class="arrow" aria-hidden="true">↗</span></a><a class="tool-link" href="./bd/BDR.html">BDR<span class="arrow" aria-hidden="true">↗</span></a></div></div>
</div>
</div>
</nav>'''
          if old_nav not in s:
              raise SystemExit('expected landing nav not found')
          s=s.replace(old_nav,new_nav,1)
          css='''\n/* compressed project map */\n.tools{display:block;gap:0;align-items:stretch;padding:18px 0 20px}.tools-heading{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;padding:0 0 12px;text-align:left;cursor:pointer}.tools-heading:hover{color:var(--ink)}.tools-toggle{color:var(--accent);font:500 1rem/1 Consolas,monospace}.tools-toggle:before{content:'+'}.tools-heading[aria-expanded=true] .tools-toggle:before{content:'−'}.tool-rows{display:grid}.tool-row{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;gap:20px;min-height:58px;border-top:1px solid var(--line)}.tool-row:first-child{border-top:0}.tool-row-label{font:600 .9rem/1.4 Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.tool-links{justify-content:flex-start;gap:6px 28px}.tool-more{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}.tool-more .tool-row:first-child{border-top:0}@media(max-width:700px){.tools{padding-top:17px}.tools-heading{padding-bottom:10px}.tool-row{grid-template-columns:1fr;gap:2px;padding:8px 0;min-height:0}.tool-row-label{font-size:.82rem;margin-bottom:1px}.tool-links{justify-content:flex-start;gap:2px 20px}.tools-toggle{font-size:.9rem}}\n'''
          pos=s.find('</style>')
          if pos<0: raise SystemExit('style closing tag not found')
          s=s[:pos]+css+s[pos:]
          old_label="$('.tools').setAttribute('aria-label',text('Explore tools and stories','Razišči orodja in zgodbe'));$('.footer-links').setAttribute('aria-label',text('About the makers','O ustvarjalcih'));"
          new_label="$('.tools').setAttribute('aria-label',text('Compressed project map','Stisnjen zemljevid projektov'));const mt=$('#tool-map-toggle');if(mt)mt.setAttribute('aria-label',mt.getAttribute('aria-expanded')==='true'?text('Collapse project links','Strni projektne povezave'):text('Expand project links','Razgrni projektne povezave'));$('.footer-links').setAttribute('aria-label',text('About the makers','O ustvarjalcih'));"
          if old_label not in s: raise SystemExit('label hook not found')
          s=s.replace(old_label,new_label,1)
          hook="$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));"
          js="""\nconst toolMapToggle=$('#tool-map-toggle'),toolMore=$('#tool-more');\nfunction setToolMap(open,persist=true){if(!toolMapToggle||!toolMore)return;toolMapToggle.setAttribute('aria-expanded',String(open));toolMore.hidden=!open;if(persist)save('mdlxdcc-tools-expanded',open?'1':'0');labels();}\nif(toolMapToggle&&toolMore){setToolMap(read('mdlxdcc-tools-expanded','0')==='1',false);toolMapToggle.addEventListener('click',()=>setToolMap(toolMapToggle.getAttribute('aria-expanded')!=='true'));}\n"""
          if hook not in s: raise SystemExit('view hook not found')
          s=s.replace(hook,hook+js,1)
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit compressed project map
        run: |
          if git diff --quiet -- public/index.html; then exit 0; fi
          git config user.name "BD-AI8 production bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Expand compressed landing project map"
          git push origin HEAD:main
