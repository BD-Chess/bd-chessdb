async function unlock(v,auto=false){const b=document.getElementById('go'),e=document.getElementById('err'); if(!v){if(!auto)e.textContent='Vnesi geslo.';return false}; b.disabled=true;b.textContent='Odklepam…';e.textContent='';try{const km=await crypto.subtle.importKey('raw',E.encode(v),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:B(C.s),iterations:C.n},km,{name:'AES-GCM',length:256},false,['decrypt']);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(C.i),additionalData:B(C.a)},k,B(C.c));const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();await w.write(new Uint8Array(out));await w.close();const ab=await new Response(ds.readable).arrayBuffer();const t=new TextDecoder('utf-8',{fatal:true}).decode(ab);sessionStorage.setItem(SK,v);document.open();document.write(t);document.close();return true}catch(err){if(auto)sessionStorage.removeItem(SK);else{e.textContent='Napačno geslo ali poškodovana datoteka.';document.getElementById('pw').select();}b.disabled=false;b.textContent='Odkleni';return false}}
