<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><title>BD · Osebno</title><style>
:root{color-scheme:dark;--bg:#050812;--panel:#0d1727;--line:#29415f;--text:#eef6ff;--muted:#aebdd0;--cyan:#5de1d7;--gold:#ffd56a;--red:#ff8a99}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% -8%,rgba(93,225,215,.13),transparent 32rem),linear-gradient(180deg,#050812,#08111e);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(680px,100%);border:1px solid var(--line);border-radius:27px;background:linear-gradient(180deg,#101c30,#091321);padding:clamp(24px,6vw,42px);box-shadow:0 25px 90px rgba(0,0,0,.45)}.ey{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.5rem,9vw,4.5rem);line-height:.95;letter-spacing:-.05em;margin:13px 0 16px}p{color:var(--muted);line-height:1.55;font-size:18px}.row{display:flex;gap:9px;margin-top:22px}input{min-width:0;flex:1;border:1px solid var(--line);border-radius:14px;background:#071121;color:var(--text);padding:14px 15px;font-size:18px;outline:none}input:focus{border-color:var(--cyan)}button{border:1px solid rgba(93,225,215,.45);border-radius:14px;background:rgba(93,225,215,.06);color:var(--cyan);padding:12px 17px;font-weight:900;cursor:pointer}.err{color:var(--red);min-height:1.4em;margin-top:10px;font-weight:750}.small{font-size:12px;color:#72859f;margin-top:18px}@media(max-width:520px){.row{flex-direction:column}button{width:100%}}
</style></head><body><main class="box"><div class="ey">8Z · BD · Osebno</div><h1>Osebno</h1><p>Šifrirana osebna stran. Enkratno odklepanje velja za ta zavihek tudi pri prehodu med stranmi v <strong>/BD/O/</strong>.</p><div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="Geslo"><button id="go" type="button">Odkleni</button></div><div id="err" class="err"></div><div class="small">AES-256-GCM · PBKDF2-SHA256 · 500,000 iteracij · noindex</div></main><script>
'use strict';
const C={s:"sxM9vWKdiNnHxPoCySV0ZQ==",i:"C2Bir+59JvZhGakI",a:"QkQtTy12MXx6ZHJhdmplLmh0bWw=",n:500000,parts:["zdravje-1.enc.txt", "zdravje-2.enc.txt", "zdravje-3.enc.txt", "zdravje-4.enc.txt", "zdravje-5.enc.txt"]};
const SK='_bd_o_pp'; const E=new TextEncoder();
function B(s){const x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
async function loadCipher(){if(C.c)return C.c;const rr=await Promise.all(C.parts.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.text()})));C.c=rr.join('');return C.c;}
async function unlock(v,auto=false){const b=document.getElementById('go'),e=document.getElementById('err'); if(!v){if(!auto)e.textContent='Vnesi geslo.';return false}; b.disabled=true;b.textContent='Odklepam…';e.textContent='';try{const km=await crypto.subtle.importKey('raw',E.encode(v),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:B(C.s),iterations:C.n},km,{name:'AES-GCM',length:256},false,['decrypt']);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(C.i),additionalData:B(C.a)},k,B(await loadCipher()));const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();await w.write(new Uint8Array(out));await w.close();const ab=await new Response(ds.readable).arrayBuffer();const t=new TextDecoder('utf-8',{fatal:true}).decode(ab);sessionStorage.setItem(SK,v);document.open();document.write(t);document.close();return true}catch(err){if(auto)sessionStorage.removeItem(SK);else{e.textContent='Napačno geslo ali poškodovana datoteka.';document.getElementById('pw').select();}b.disabled=false;b.textContent='Odkleni';return false}}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value);document.getElementById('pw').addEventListener('keydown',ev=>{if(ev.key==='Enter')unlock(ev.target.value)});try{const v=sessionStorage.getItem(SK);if(v)unlock(v,true);}catch(e){}
</script></body></html>
