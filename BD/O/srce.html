<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#050913;color:#f1f6ff;font-size:20px}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#152c39,transparent 65%)}main{width:min(620px,100%);padding:clamp(24px,6vw,44px);border:1px solid #2f4960;border-radius:26px;background:#0d1727;box-shadow:0 20px 60px #0006}.eyebrow{color:#6cddd5;font-size:.72rem;font-weight:800;letter-spacing:.16em}h1{font-size:clamp(2.5rem,10vw,4rem);letter-spacing:-.05em;line-height:1;margin:18px 0}p{color:#bacbdb;line-height:1.6}label{display:block;font-weight:650;margin:24px 0 8px}.field{display:flex;gap:8px}input{width:100%;min-width:0;padding:16px;border:1px solid #526881;border-radius:12px;background:#060e1c;color:#fff;font:inherit}button{font:inherit;font-weight:750;min-height:48px;padding:12px 18px;border-radius:12px;border:1px solid #64d8d0;background:#153a41;color:#e9fffb;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#show{font-size:16px;padding:8px 12px;background:transparent}#unlock{width:100%;margin-top:12px}#error{min-height:1.6em;color:#ff9eaa;font-size:.9rem}.small{font-size:.74rem;margin-bottom:0}a{color:#75d7fa}[hidden]{display:none!important}:focus-visible{outline:3px solid #ffd477;outline-offset:3px}

<body>
<main id="gate" hidden>
<div class="eyebrow">BD · OSEBNO</div>
<h1>En ključ.<br>Vse pri roki.</h1>
<p>Vnesi geslo za osebni arhiv. V tem zavihku boš lahko prehajal med vsemi podstranmi brez ponovnega vpisovanja.</p>
<form id="form" action="" method="post">
<label for="pw">Geslo</label><div class="field"><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button id="show" type="button">Pokaži</button></div>
<button id="unlock" type="submit" disabled>Odkleni</button>
<p id="error" role="status" aria-live="polite"></p>
</form>
<p class="small">Šifrirana vsebina · AES-256-GCM<br>Po uporabi izberi <strong>Zakleni</strong>.</p>
</main>
<noscript>Vsebina je zaklenjena. Za odklepanje omogoči JavaScript.</noscript>
