<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>FlipFour</title>
<style>
  :root{
    --bg:#0b0f17;
    --panel:rgba(20,26,38,0.78);
    --panel2:rgba(20,26,38,0.92);
    --text:#e9eefc;
    --muted:#a9b3cf;
    --btn:#26314a;
    --btnBorder:rgba(255,255,255,0.12);
    --shadow:rgba(0,0,0,0.45);
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;}
  #wrap{position:fixed;inset:0;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #hud{
    position:absolute;left:0;right:0;top:0;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    background:linear-gradient(to bottom, var(--panel2), rgba(20,26,38,0.0));
    pointer-events:auto;
  }
  #titleRow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  #title{font-weight:900;font-size:22px;letter-spacing:0.4px;}
  #sub{font-size:12px;color:var(--muted);}
  #statusRow{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .pill{
    background:var(--panel);
    border:1px solid var(--btnBorder);
    border-radius:14px;
    padding:8px 10px;
    box-shadow:0 8px 22px var(--shadow);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    backdrop-filter: blur(10px);
  }
  #turnBig{font-weight:950;font-size:18px;}
  #gravityInfo,#hintInfo{font-size:12px;color:var(--muted);}
  #tokens{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .pTag{display:flex;gap:8px;align-items:center}
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(255,255,255,0.22)}
  .dot.red{background:#e53935;}
  .dot.yel{background:#fdd835;}
  .count{color:var(--text);font-weight:900;}
  #btnRow{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{
    appearance:none;
    border:1px solid var(--btnBorder);
    background:var(--btn);
    color:var(--text);
    border-radius:12px;
    padding:10px 12px;
    font-weight:900;
    letter-spacing:0.2px;
    box-shadow:0 10px 24px var(--shadow);
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  button[disabled]{opacity:0.45;cursor:not-allowed;transform:none;}
  .btnSmall{padding:8px 10px;font-weight:900;font-size:12px;}
  .envBtn{
    background:linear-gradient(180deg, rgba(60,120,255,0.22), rgba(60,120,255,0.10));
    border-color:rgba(106,167,255,0.35);
  }
  .tacBtn{
    background:linear-gradient(180deg, rgba(255,204,102,0.20), rgba(255,204,102,0.10));
    border-color:rgba(255,204,102,0.35);
  }
  .dangerBtn{
    background:linear-gradient(180deg, rgba(255,107,107,0.20), rgba(255,107,107,0.10));
    border-color:rgba(255,107,107,0.35);
  }
  #motionWrap{margin-top:10px;display:none;}
  #motionBtn{
    width:100%;
    background:linear-gradient(180deg, rgba(39,209,127,0.18), rgba(39,209,127,0.08));
    border-color:rgba(39,209,127,0.35);
    padding:12px 14px;
    font-size:14px;
  }
  #overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.55);
    padding:20px;
    pointer-events:auto;
  }
  #overlayCard{
    width:min(560px, 92vw);
    background:rgba(15,19,28,0.92);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:18px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    text-align:center;
  }
  #ovTitle{font-size:22px;font-weight:1000;letter-spacing:0.2px;margin:0 0 6px 0;}
  #ovSub{margin:0 0 14px 0;color:var(--muted);font-size:13px;line-height:1.35;white-space:pre-line;text-align:left;}
  #overlayBtns{display:flex;gap:10px;}
#overlayBtns button{flex:1;}
#playAgain{padding:12px 14px;font-size:14px;}
#ovUndo{padding:12px 14px;font-size:14px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="titleRow">
      <div id="title">FlipFour</div>
      <div id="sub">Connect-4 + Gravity Flip • local 2-player</div>
    </div>

    <div id="statusRow">
      <div class="pill" id="turnPill">
        <div id="turnBig">Turn: —</div>
        <div id="gravityInfo">Gravity: — • Angle: —</div>
        <div id="hintInfo">Hint: —</div>
      </div>

      <div class="pill" id="tokenPill">
        <div id="tokens">
          <div class="pTag"><span class="dot red"></span>Red flips: <span class="count" id="rFlips">2</span> • mags: <span class="count" id="rMags">2</span></div>
          <div class="pTag"><span class="dot yel"></span>Yellow flips: <span class="count" id="yFlips">2</span> • mags: <span class="count" id="yMags">2</span></div>
        </div>
      </div>
      </div>
    </div>

    <div id="btnRow">
      <button class="tacBtn" id="tacCCW" title="Tactical Flip (consumes your flip token)">Tactical Flip ⟲</button>
      <button class="tacBtn" id="tacCW"  title="Tactical Flip (consumes your flip token)">Tactical Flip ⟳</button>
      <button class="envBtn btnSmall" id="addBtn" title="DEV: add +2 flips and +2 magnets to BOTH players">ADD +2</button>

<button class="envBtn btnSmall" id="undoBtn" title="Undo last player move">Undo</button>
      <button class="tacBtn" id="showWin" title="Find and demonstrate a winning line (depth-limited)">SHOW WIN</button>


      <button class="dangerBtn" id="newGame">New Game</button>
    </div>

    <div id="motionWrap">
      <button id="motionBtn">Enable Motion</button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlayCard">
      <h2 id="ovTitle">—</h2>
      <p id="ovSub">—</p>
      <div id="overlayBtns">
        <button id="ovUndo" class="envBtn">Undo</button>
        <button id="playAgain" class="dangerBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const COLS = 7, ROWS = 6;
  const P_EMPTY = 0, P_RED = 1, P_YEL = 2;

  // Directions: 0=DOWN, 1=LEFT, 2=UP, 3=RIGHT
  const DIRS = ["DOWN","LEFT","UP","RIGHT"];
  const ARROWS = ["↓","←","↑","→"];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const hud = document.getElementById("hud");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovSub = document.getElementById("ovSub");
  const btnOverlay = document.getElementById("playAgain");
  const btnOvUndo = document.getElementById("ovUndo");

  const elTurnBig = document.getElementById("turnBig");
  const elGravityInfo = document.getElementById("gravityInfo");
  const elHintInfo = document.getElementById("hintInfo");
  const elRFlips = document.getElementById("rFlips");
  const elYFlips = document.getElementById("yFlips");
  const elRMags  = document.getElementById("rMags");
  const elYMags  = document.getElementById("yMags");

  const btnTacCCW = document.getElementById("tacCCW");
  const btnTacCW = document.getElementById("tacCW");
  const btnShowWin = document.getElementById("showWin");
  const btnAdd = document.getElementById("addBtn");
  const btnUndo = document.getElementById("undoBtn");
  const btnNewGame = document.getElementById("newGame");

  const motionWrap = document.getElementById("motionWrap");
  const motionBtn = document.getElementById("motionBtn");

  let grid = makeEmptyGrid();
  let gravityDir = 0;
  let boardAngle = 0;
  let targetAngle = 0;
  let currentPlayer = P_RED;
  let flipTokens = { [P_RED]: 2, [P_YEL]: 2 };
  let magnetTokens = { [P_RED]: 2, [P_YEL]: 2 }; // per player
  // Magnet sides: 0=TOP, 1=RIGHT, 2=BOTTOM, 3=LEFT. Value: 0 none, 1 red, 2 yellow
  let magnetOwner = [0,0,0,0];

  let anim = null;
  let animating = false;

  let hoveredIndex = -1;

  let gameOver = false;
  let winner = 0;

  // Overlay mode: gameover | close | resume
  let overlayMode = "close";

  // Preview/demo mode
  let previewMode = false;
  let previewSnapshot = null;
  let previewRunId = 0;

  // Undo history (snapshots BEFORE each player move)
  let history = [];

  // Hint cache + debounce
  let hintTimer = null;
  let lastHintKey = null;
  let hintCache = new Map();

  // =========================
  // Utilities
  // =========================
  function makeEmptyGrid() {
    const g = new Array(ROWS);
    for (let r = 0; r < ROWS; r++) g[r] = new Array(COLS).fill(P_EMPTY);
    return g;
  }
  function cloneGrid(g) { return g.map(row => row.slice()); }
  function isVertical(dir) { return dir === 0 || dir === 2; }

  // Canvas rotation is clockwise-positive in screen coords (Y down), so use negative mapping.
  function dirToAngleRad(dir) { return -dir * (Math.PI / 2); }

  function shortestAngleDiff(a, b) {
    const TWO = Math.PI * 2;
    let d = (b - a) % TWO;
    if (d > Math.PI) d -= TWO;
    if (d <= -Math.PI) d += TWO;
    return d;
  }
  function easeInOut(t) { return t * t * (3 - 2 * t); }

  function gridIsFull(g) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (g[r][c] === P_EMPTY) return false;
    return true;
  }
  function playerName(p) { return p === P_RED ? "Red" : "Yellow"; }

  // =========================
  // Overlay / Snapshot
  // =========================
  function showOverlay(title, sub, mode) {
    overlayMode = mode || "close";
    ovTitle.textContent = title || "";
    ovSub.textContent = sub || "";
    overlay.style.display = "flex";
    if (overlayMode === "gameover") btnOverlay.textContent = "Play Again";
    else if (overlayMode === "resume") btnOverlay.textContent = "Resume";
    else btnOverlay.textContent = "Close";
    // Overlay Undo is only for real game-over (not SHOW WIN preview)
    if (btnOvUndo) {
      const showUndo = (overlayMode === "gameover") && !previewMode;
      btnOvUndo.style.display = showUndo ? "inline-block" : "none";
      btnOvUndo.disabled = !showUndo || animating || history.length === 0;
    }
  }
  function hideOverlay() { overlay.style.display = "none"; }

  function snapshotState() {
    return {
      grid: cloneGrid(grid),
      gravityDir,
      currentPlayer,
      flipR: flipTokens[P_RED],
      flipY: flipTokens[P_YEL],
      magR: magnetTokens[P_RED],
      magY: magnetTokens[P_YEL],
      mags: magnetOwner.slice(),
      gameOver,
      winner,
      boardAngle,
      targetAngle,
      hoveredIndex
    };
  }
  function applySnapshotState(s) {
    grid = cloneGrid(s.grid);
    gravityDir = s.gravityDir;
    currentPlayer = s.currentPlayer;
    flipTokens[P_RED] = s.flipR;
    flipTokens[P_YEL] = s.flipY;
    magnetTokens[P_RED] = s.magR;
    magnetTokens[P_YEL] = s.magY;
    magnetOwner = s.mags.slice();
    gameOver = s.gameOver;
    winner = s.winner;
    boardAngle = s.boardAngle;
    targetAngle = s.targetAngle;
    hoveredIndex = s.hoveredIndex;
  }

  function restoreSnapshot() {
    if (!previewSnapshot) { hideOverlay(); return; }
    const s = previewSnapshot;
    previewSnapshot = null;
    previewMode = false;

    anim = null;
    animating = false;

    applySnapshotState(s);
    hideOverlay();
    syncUI();
  }

  function pushHistorySnapshot() {
    history.push(snapshotState());
    if (history.length > 80) history.shift();
  }
  function undoLastMove() {
    if (animating || previewMode) return;
    if (history.length === 0) return;
    const s = history.pop();
    anim = null;
    animating = false;
    previewSnapshot = null;
    previewMode = false;
    applySnapshotState(s);
    hideOverlay();
    syncUI();
  }

  btnOverlay.addEventListener("click", () => {
    if (overlayMode === "gameover") { newGame(); return; }
    if (overlayMode === "resume") { restoreSnapshot(); return; }
    hideOverlay();
  });

  // =========================
  // Settling (deterministic)
  // =========================
  function settleGrid(oldG, dir) {
    const newG = makeEmptyGrid();
    const tokens = [];

    if (dir === 0 || dir === 2) {
      for (let c = 0; c < COLS; c++) {
        const col = [];
        for (let r = 0; r < ROWS; r++) {
          const p = oldG[r][c];
          if (p !== P_EMPTY) col.push({ p, r, c });
        }
        const L = col.length;
        for (let i = 0; i < L; i++) {
          const src = col[i];
          const tr = (dir === 0) ? (ROWS - L + i) : i;
          newG[tr][c] = src.p;
          tokens.push({ p: src.p, fr: src.r, fc: src.c, tr, tc: c });
        }
      }
    } else {
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const p = oldG[r][c];
          if (p !== P_EMPTY) row.push({ p, r, c });
        }
        const L = row.length;
        for (let i = 0; i < L; i++) {
          const src = row[i];
          const tc = (dir === 1) ? i : (COLS - L + i);
          newG[r][tc] = src.p;
          tokens.push({ p: src.p, fr: src.r, fc: src.c, tr: r, tc });
        }
      }
    }
    return { newG, tokens };
  }


  function gridsEqual(a,b){
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (a[r][c]!==b[r][c]) return false;
    return true;
  }

  function mapTokens(oldG, newG, dir){
    const moves = [];
    if (dir === 0 || dir === 2){
      for (let c=0;c<COLS;c++){
        for (const p of [P_RED, P_YEL]){
          const oldPos=[], newPos=[];
          for (let r=0;r<ROWS;r++){ if (oldG[r][c]===p) oldPos.push({r,c}); if (newG[r][c]===p) newPos.push({r,c}); }
          const L = Math.min(oldPos.length, newPos.length);
          for (let i=0;i<L;i++) moves.push({p, fr: oldPos[i].r, fc: c, tr: newPos[i].r, tc: c});
        }
      }
    } else {
      for (let r=0;r<ROWS;r++){
        for (const p of [P_RED, P_YEL]){
          const oldPos=[], newPos=[];
          for (let c=0;c<COLS;c++){ if (oldG[r][c]===p) oldPos.push({r,c}); if (newG[r][c]===p) newPos.push({r,c}); }
          const L = Math.min(oldPos.length, newPos.length);
          for (let i=0;i<L;i++) moves.push({p, fr: r, fc: oldPos[i].c, tr: r, tc: newPos[i].c});
        }
      }
    }
    return moves;
  }

  function settleWithPinned(g, dir, pinned){
    const out = makeEmptyGrid();
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (pinned[r][c]) out[r][c] = g[r][c];

    if (dir === 0 || dir === 2){
      for (let c=0;c<COLS;c++){
        const avail = [];
        for (let r=0;r<ROWS;r++) if (!pinned[r][c]) avail.push(r);

        const toks = [];
        for (let r=0;r<ROWS;r++) if (!pinned[r][c] && g[r][c]!==P_EMPTY) toks.push(g[r][c]);

        const L = toks.length;
        const targets = (dir===0) ? avail.slice(Math.max(0, avail.length - L)) : avail.slice(0, L);
        for (let i=0;i<L;i++) out[targets[i]][c] = toks[i];
      }
    } else {
      for (let r=0;r<ROWS;r++){
        const avail = [];
        for (let c=0;c<COLS;c++) if (!pinned[r][c]) avail.push(c);

        const toks = [];
        for (let c=0;c<COLS;c++) if (!pinned[r][c] && g[r][c]!==P_EMPTY) toks.push(g[r][c]);

        const L = toks.length;
        const targets = (dir===1) ? avail.slice(0, L) : avail.slice(Math.max(0, avail.length - L));
        for (let i=0;i<L;i++) out[r][targets[i]] = toks[i];
      }
    }
    return out;
  }

  function resolvePhysics(startG, dir, mags){
    const settled = settleGrid(startG, dir).newG;
    let g = cloneGrid(settled);

    const pinned = new Array(ROWS);
    for (let r=0;r<ROWS;r++) pinned[r] = new Array(COLS).fill(false);

    function pullTop(){
      if (mags[0]===0) return;
      for (let c=0;c<COLS;c++){
        if (g[0][c]===P_EMPTY){
          for (let r=1;r<ROWS;r++){
            if (g[r][c]!==P_EMPTY){ g[0][c]=g[r][c]; g[r][c]=P_EMPTY; break; }
          }
        }
        if (g[0][c]!==P_EMPTY) pinned[0][c]=true;
      }
    }
    function pullRight(){
      if (mags[1]===0) return;
      for (let r=0;r<ROWS;r++){
        if (g[r][COLS-1]===P_EMPTY){
          for (let c=COLS-2;c>=0;c--){
            if (g[r][c]!==P_EMPTY){ g[r][COLS-1]=g[r][c]; g[r][c]=P_EMPTY; break; }
          }
        }
        if (g[r][COLS-1]!==P_EMPTY) pinned[r][COLS-1]=true;
      }
    }
    function pullBottom(){
      if (mags[2]===0) return;
      for (let c=0;c<COLS;c++){
        if (g[ROWS-1][c]===P_EMPTY){
          for (let r=ROWS-2;r>=0;r--){
            if (g[r][c]!==P_EMPTY){ g[ROWS-1][c]=g[r][c]; g[r][c]=P_EMPTY; break; }
          }
        }
        if (g[ROWS-1][c]!==P_EMPTY) pinned[ROWS-1][c]=true;
      }
    }
    function pullLeft(){
      if (mags[3]===0) return;
      for (let r=0;r<ROWS;r++){
        if (g[r][0]===P_EMPTY){
          for (let c=1;c<COLS;c++){
            if (g[r][c]!==P_EMPTY){ g[r][0]=g[r][c]; g[r][c]=P_EMPTY; break; }
          }
        }
        if (g[r][0]!==P_EMPTY) pinned[r][0]=true;
      }
    }

    pullTop(); pullRight(); pullBottom(); pullLeft();
    return settleWithPinned(g, dir, pinned);
  }

  function applyPhysicsAnimated(onDone){
    const oldG = cloneGrid(grid);
    const newG = resolvePhysics(oldG, gravityDir, magnetOwner);
    if (gridsEqual(oldG, newG)) { onDone(); return; }
    grid = newG;
    const mapping = mapTokens(oldG, newG, gravityDir);
    startAnim({ tokens: buildAnimTokens(mapping), angleFrom: boardAngle, angleTo: targetAngle, duration: 260, onDone });
  }

  // =========================
  // Win detection
  // =========================
  function checkWins(g) {
    let red = false, yel = false;
    function mark(p) { if (p === P_RED) red = true; else if (p === P_YEL) yel = true; }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = g[r][c];
        if (p === P_EMPTY) continue;

        if (c <= COLS - 4 && g[r][c+1]===p && g[r][c+2]===p && g[r][c+3]===p) mark(p);
        if (r <= ROWS - 4 && g[r+1][c]===p && g[r+2][c]===p && g[r+3][c]===p) mark(p);
        if (r <= ROWS - 4 && c <= COLS - 4 && g[r+1][c+1]===p && g[r+2][c+2]===p && g[r+3][c+3]===p) mark(p);
        if (r <= ROWS - 4 && c >= 3 && g[r+1][c-1]===p && g[r+2][c-2]===p && g[r+3][c-3]===p) mark(p);
      }
    }
    return { red, yel };
  }

  // =========================
  // Hint + SHOW WIN (depth-limited forced win search)
  // =========================
  function stateKey(g, dir, flipT, magT, mags, player) {
    let s = "" + dir + "|" + flipT[P_RED] + "," + flipT[P_YEL] + "|" + magT[P_RED] + "," + magT[P_YEL] + "|" + mags.join("") + "|" + player + "|";
    for (let r = 0; r < ROWS; r++) s += g[r].join("");
    return s;
  }

  function legalMovesFor(state) {
    const moves = [];
    const dir = state.gravityDir;
    const g = state.grid;

    if (dir === 0 || dir === 2) {
      for (let c = 0; c < COLS; c++) {
        let ok = false;
        for (let r = 0; r < ROWS; r++) if (g[r][c] === P_EMPTY) { ok = true; break; }
        if (ok) moves.push({ type: "DROP", idx: c });
      }
    } else {
      for (let r = 0; r < ROWS; r++) {
        let ok = false;
        for (let c = 0; c < COLS; c++) if (g[r][c] === P_EMPTY) { ok = true; break; }
        if (ok) moves.push({ type: "DROP", idx: r });
      }
    }
    if (state.flipTokens[state.player] > 0) {
      moves.push({ type: "FLIP", dir: "CCW" });
      moves.push({ type: "FLIP", dir: "CW"  });
    }
    if (state.magnetTokens[state.player] > 0) {
      moves.push({ type: "MAG", side: 0 });
      moves.push({ type: "MAG", side: 1 });
      moves.push({ type: "MAG", side: 2 });
      moves.push({ type: "MAG", side: 3 });
    }
    moves.sort((a,b) => {
      const ta = (a.type === "DROP") ? 0 : 1;
      const tb = (b.type === "DROP") ? 0 : 1;
      if (ta !== tb) return ta - tb;
      if (a.type === "DROP") return a.idx - b.idx;
      if (a.dir === b.dir) return 0;
      return (a.dir === "CCW") ? -1 : 1;
    });
    return moves;
  }

  function applyMoveToState(state, move) {
    const g0 = cloneGrid(state.grid);
    let dir = state.gravityDir;
    const player = state.player;

    const nextFlip = { [P_RED]: state.flipTokens[P_RED], [P_YEL]: state.flipTokens[P_YEL] };
    const nextMagT = { [P_RED]: state.magnetTokens[P_RED], [P_YEL]: state.magnetTokens[P_YEL] };
    const nextMags = state.magnetOwner.slice();

    if (move.type === "DROP") {
      if (dir === 0) {
        const c = move.idx;
        for (let r = ROWS - 1; r >= 0; r--) if (g0[r][c] === P_EMPTY) { g0[r][c] = player; break; }
      } else if (dir === 2) {
        const c = move.idx;
        for (let r = 0; r < ROWS; r++) if (g0[r][c] === P_EMPTY) { g0[r][c] = player; break; }
      } else if (dir === 1) {
        const r = move.idx;
        for (let c = 0; c < COLS; c++) if (g0[r][c] === P_EMPTY) { g0[r][c] = player; break; }
      } else {
        const r = move.idx;
        for (let c = COLS - 1; c >= 0; c--) if (g0[r][c] === P_EMPTY) { g0[r][c] = player; break; }
      }
    } else if (move.type === "FLIP") {
      if (nextFlip[player] <= 0) return null;
      nextFlip[player] -= 1;
      dir = (dir + (move.dir === "CCW" ? +1 : -1) + 4) % 4;
    } else if (move.type === "MAG") {
      if (nextMagT[player] <= 0) return null;
      nextMagT[player] -= 1;
      const side = move.side;
      const opp = (side + 2) % 4;
      const oppOwner = nextMags[opp];
      if (oppOwner !== 0 && oppOwner !== player) { nextMags[side] = 0; nextMags[opp] = 0; }
      else { nextMags[side] = player; }
    } else return null;

    const g1 = resolvePhysics(g0, dir, nextMags);

    const w = checkWins(g1);
    let winnerNow = 0;
    if (w.red || w.yel) {
      if (w.red && w.yel) winnerNow = player;
      else if (w.red) winnerNow = P_RED;
      else winnerNow = P_YEL;
    } else if (gridIsFull(g1)) winnerNow = 0;

    const nextPlayer = (player === P_RED) ? P_YEL : P_RED;
    return { winnerNow, nextState: { grid: g1, gravityDir: dir, flipTokens: nextFlip, magnetTokens: nextMagT, magnetOwner: nextMags, player: nextPlayer } };
  }

  function invertOutcome(out) {
    if (out.status === "W") return { status: "L", ply: out.ply + 1, pv: out.pv.slice() };
    if (out.status === "L") return { status: "W", ply: out.ply + 1, pv: out.pv.slice() };
    if (out.status === "D") return { status: "D", ply: 0, pv: out.pv.slice() };
    return { status: "U", ply: 0, pv: out.pv.slice() };
  }

  function solveForcedWin(state, depth, memo) {
    const key = stateKey(state.grid, state.gravityDir, state.flipTokens, state.magnetTokens, state.magnetOwner, state.player) + "|d" + depth;
    const hit = memo.get(key);
    if (hit) return hit;
    if (depth <= 0) {
      const out = { status: "U", ply: 0, pv: [] };
      memo.set(key, out);
      return out;
    }

    const moves = legalMovesFor(state);

    let bestW=null, bestD=null, bestU=null, bestL=null;
    for (const mv of moves) {
      const applied = applyMoveToState(state, mv);
      if (!applied) continue;

      if (applied.winnerNow === state.player) {
        const cand = { status: "W", ply: 1, pv: [mv] };
        if (!bestW || cand.ply < bestW.ply) bestW = cand;
        continue;
      }

      const child = solveForcedWin(applied.nextState, depth - 1, memo);
      const inv = invertOutcome(child);
      inv.pv = [mv].concat(child.pv);

      if (inv.status === "W") {
        if (!bestW || inv.ply < bestW.ply) bestW = inv;
      } else if (inv.status === "D") {
        if (!bestD) bestD = inv;
      } else if (inv.status === "U") {
        if (!bestU) bestU = inv;
      } else {
        if (!bestL || inv.ply > bestL.ply) bestL = inv;
      }
    }

    const out = bestW || bestD || bestU || bestL || { status:"U", ply:0, pv:[] };
    memo.set(key, out);
    return out;
  }

  function computeHint(maxPlies=6) {
    const root = {
      grid: cloneGrid(grid),
      gravityDir,
      flipTokens: { [P_RED]: flipTokens[P_RED], [P_YEL]: flipTokens[P_YEL] },
      magnetTokens: { [P_RED]: magnetTokens[P_RED], [P_YEL]: magnetTokens[P_YEL] },
      magnetOwner: magnetOwner.slice(),
      player: currentPlayer
    };
    const memo = new Map();
    const out = solveForcedWin(root, maxPlies, memo);
    const movesToWin = (out.status === "W") ? Math.ceil(out.ply / 2) : null;
    return { out, movesToWin };
  }

  function scheduleHintCompute() {
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      if (animating || gameOver || previewMode) { elHintInfo.textContent = "Hint: —"; return; }
      const key = stateKey(grid, gravityDir, flipTokens, magnetTokens, magnetOwner, currentPlayer);
      if (key === lastHintKey) return;
      lastHintKey = key;

      const cached = hintCache.get(key);
      if (cached) { elHintInfo.textContent = cached; return; }

      let text = "Hint: ";
      try {
        const res = computeHint(6);
        if (res.out.status === "W") text += `Forced win in ${res.movesToWin} move(s) (search ≤3 moves).`;
        else text += "No forced win found (search ≤3 moves).";
      } catch {
        text += "—";
      }
      hintCache.set(key, text);
      elHintInfo.textContent = text;
    }, 60);
  }

  function formatPV(pv) {
    const s = snapshotState();
    let dir = s.gravityDir;
    let p = s.currentPlayer;
    const lines = [];
    for (let i = 0; i < pv.length; i++) {
      const mv = pv[i];
      const mover = (p === P_RED) ? "Red" : "Yellow";
      let desc = "";
      if (mv.type === "DROP") {
        desc = (dir === 0 || dir === 2) ? `DROP column ${mv.idx + 1}` : `DROP row ${mv.idx + 1}`;
      } else {
        desc = `Tactical Flip ${mv.dir === "CCW" ? "⟲" : "⟳"}`;
        dir = (dir + (mv.dir === "CCW" ? +1 : -1) + 4) % 4;
      }
      lines.push(`${i+1}. ${mover}: ${desc}   (gravity ${ARROWS[dir]} ${DIRS[dir]})`);
      p = (p === P_RED) ? P_YEL : P_RED;
    }
    return lines.join("\n");
  }

  function startShowWinDemo() {
    if (animating || gameOver) return;
    if (previewMode && !internal) return;

    const res = computeHint(6);
    if (res.out.status !== "W" || !res.out.pv || res.out.pv.length === 0) {
      showOverlay("SHOW WIN", "No forced win found within 3 of your moves (depth-limited search).", "close");
      return;
    }

    previewSnapshot = snapshotState();
    previewMode = true;
    previewRunId++;
    const myRun = previewRunId;

    const plyToWin = Math.max(1, Math.min(6, res.out.ply || 6));
    const pv = res.out.pv.slice(0, plyToWin);

    showOverlay("SHOW WIN demo", "Planned line (depth-limited):\n\n" + formatPV(pv) + "\n\nDemo starts now…", "close");
    setTimeout(() => { if (previewMode && myRun === previewRunId) hideOverlay(); }, 900);

    let i = 0;
    const runNext = () => {
      if (!previewMode || myRun !== previewRunId) return;
      if (i >= pv.length) {
        showOverlay("SHOW WIN demo", "Line complete (depth-limited). Tap Resume to return to your original position.", "resume");
        return;
      }
      const mv = pv[i++];
      if (mv.type === "DROP") doDrop(mv.idx, true);
      else doTacticalFlip(mv.dir === "CCW" ? +1 : -1, true);

      const waitAnim = () => {
        if (!previewMode || myRun !== previewRunId) return;
        if (animating) { setTimeout(waitAnim, 30); return; }
        setTimeout(runNext, 220);
      };
      waitAnim();
    };
    setTimeout(runNext, 260);
  }

  // =========================
  // Layout & mapping
  // =========================
  let W = 1, H = 1;
  let board = { cx:0, cy:0, w:0, h:0, cell:0 };

  function resize() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeBoardLayout();
  }

  function computeBoardLayout() {
    const hudRect = hud.getBoundingClientRect();
    const top = hudRect.height + 10;
    const margin = 14;
    const availH = Math.max(120, H - top - margin);
    const availW = Math.max(120, W - 2*margin);
    const cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
    board.cell = Math.max(20, cell);
    board.w = board.cell * COLS;
    board.h = board.cell * ROWS;
    board.cx = Math.floor(W / 2);
    board.cy = Math.floor(top + availH / 2);
  }

  function screenToBoardLocal(px, py) {
    const dx = px - board.cx;
    const dy = py - board.cy;
    const a = boardAngle;
    const ca = Math.cos(-a), sa = Math.sin(-a);
    const rx = dx * ca - dy * sa;
    const ry = dx * sa + dy * ca;
    const lx = rx + board.w / 2;
    const ly = ry + board.h / 2;
    return { lx, ly, inside: (lx >= 0 && lx <= board.w && ly >= 0 && ly <= board.h) };
  }
  function boardLocalToCell(lx, ly) { return { c: Math.floor(lx / board.cell), r: Math.floor(ly / board.cell) }; }

  // =========================
  // Rendering
  // =========================
  function drawRoundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function discGradient(p) {
    const g = ctx.createRadialGradient(-6, -8, 2, 0, 0, 18);
    if (p === P_RED) {
      g.addColorStop(0, "#ff9a96"); g.addColorStop(0.35, "#ff4d4a"); g.addColorStop(1, "#b71c1c");
    } else {
      g.addColorStop(0, "#fff6a6"); g.addColorStop(0.35, "#ffe15c"); g.addColorStop(1, "#c9a400");
    }
    return g;
  }
  function drawTokenAt(r, c, p) {
    const s = board.cell;
    const cx = (c + 0.5) * s;
    const cy = (r + 0.5) * s;
    const rad = s * 0.38;

    ctx.save();
    ctx.translate(cx, cy);

    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.ellipse(3, 4, rad*0.95, rad*0.85, 0, 0, Math.PI*2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(0, 0, rad, 0, Math.PI*2);
    ctx.fillStyle = discGradient(p);
    ctx.fill();

    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(-rad*0.25, -rad*0.28, rad*0.35, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.stroke();
    ctx.restore();
  }

  function drawBoard() {
    ctx.fillStyle = "#0b0f17";
    ctx.fillRect(0, 0, W, H);

    const vg = ctx.createRadialGradient(board.cx, board.cy, Math.min(W,H)*0.1, board.cx, board.cy, Math.max(W,H)*0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(board.cx, board.cy);
    ctx.rotate(boardAngle);
    ctx.translate(-board.w/2, -board.h/2);

    const platePad = board.cell * 0.08;
    drawRoundedRect(-platePad, -platePad, board.w + platePad*2, board.h + platePad*2, board.cell * 0.22);
    ctx.fillStyle = "#1a3a7a";
    ctx.fill();

    const pgrad = ctx.createLinearGradient(0, 0, board.w, board.h);
    pgrad.addColorStop(0, "rgba(255,255,255,0.14)");
    pgrad.addColorStop(1, "rgba(0,0,0,0.20)");
    ctx.fillStyle = pgrad;
    ctx.fill();

    // Magnet frame (clickable border)
    const mf = Math.max(10, board.cell * 0.55);
    ctx.save();
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.lineWidth = Math.max(8, board.cell * 0.18);
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    drawRoundedRect(-mf, -mf, board.w + mf*2, board.h + mf*2, board.cell * 0.28);
    ctx.stroke();

    function sideColor(owner){
      if (owner === P_RED) return "rgba(229,57,53,0.85)";
      if (owner === P_YEL) return "rgba(253,216,53,0.85)";
      return null;
    }
    const inset = mf - Math.max(6, board.cell * 0.14)*0.5;
    const leftX = -mf + inset;
    const rightX = board.w + mf - inset;
    const topY = -mf + inset;
    const botY = board.h + mf - inset;

    let col = sideColor(magnetOwner[0]);
    if (col){ ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(-mf + inset, topY); ctx.lineTo(board.w + mf - inset, topY); ctx.stroke(); }
    col = sideColor(magnetOwner[1]);
    if (col){ ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(rightX, -mf + inset); ctx.lineTo(rightX, board.h + mf - inset); ctx.stroke(); }
    col = sideColor(magnetOwner[2]);
    if (col){ ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(-mf + inset, botY); ctx.lineTo(board.w + mf - inset, botY); ctx.stroke(); }
    col = sideColor(magnetOwner[3]);
    if (col){ ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(leftX, -mf + inset); ctx.lineTo(leftX, board.h + mf - inset); ctx.stroke(); }
    ctx.restore();

    if (!gameOver && hoveredIndex >= 0 && !animating && !previewMode) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#ffffff";
      if (isVertical(gravityDir)) ctx.fillRect(hoveredIndex*board.cell, 0, board.cell, board.h);
      else ctx.fillRect(0, hoveredIndex*board.cell, board.w, board.cell);
      ctx.restore();
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cx = (c + 0.5) * board.cell;
        const cy = (r + 0.5) * board.cell;
        const rad = board.cell * 0.42;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI*2);
        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.fill();
        ctx.lineWidth = Math.max(1, board.cell * 0.04);
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.stroke();
      }
    }

    if (animating && anim) {
      for (const t of anim.tokens) drawTokenAt(t.cr, t.cc, t.p);
    } else {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (grid[r][c] !== P_EMPTY) drawTokenAt(r, c, grid[r][c]);
    }

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "rgba(233,238,252,0.70)";
    ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    const hint = isVertical(gravityDir) ? "Drop: tap/click board • or press 1–7" : "Drop: tap/click board • or press 1–6";
    ctx.fillText(hint, 12, H - 14);
    ctx.restore();
  }

  // =========================
  // Animation
  // =========================
  function startAnim({ tokens, angleFrom, angleTo, duration=260, onDone }) {
    anim = { start: performance.now(), dur: duration, tokens: tokens || [], a0: angleFrom, a1: angleTo, onDone: onDone || null };
    animating = true;
  }
  function updateAnim(now) {
    if (!animating || !anim) return;
    const t = Math.min(1, Math.max(0, (now - anim.start) / anim.dur));
    const e = easeInOut(t);

    const d = shortestAngleDiff(anim.a0, anim.a1);
    boardAngle = anim.a0 + d * e;

    for (const tok of anim.tokens) {
      tok.cr = tok.fr + (tok.tr - tok.fr) * e;
      tok.cc = tok.fc + (tok.tc - tok.fc) * e;
    }

    if (t >= 1) {
      boardAngle = anim.a1;
      animating = false;
      const done = anim.onDone;
      anim = null;
      if (done) done();
    }
  }
  function buildAnimTokens(mappingTokens, extraToken=null) {
    const out = [];
    for (const t of mappingTokens) out.push({ p:t.p, fr:t.fr, fc:t.fc, tr:t.tr, tc:t.tc, cr:t.fr, cc:t.fc });
    if (extraToken) out.push(extraToken);
    return out;
  }

  // =========================
  // Moves
  // =========================
  function findDropTarget(lineIdx) {
    if (isVertical(gravityDir)) {
      const c = lineIdx;
      if (c < 0 || c >= COLS) return null;
      if (gravityDir === 0) {
        for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c] === P_EMPTY) return { r, c };
      } else {
        for (let r = 0; r < ROWS; r++) if (grid[r][c] === P_EMPTY) return { r, c };
      }
    } else {
      const r = lineIdx;
      if (r < 0 || r >= ROWS) return null;
      if (gravityDir === 1) {
        for (let c = 0; c < COLS; c++) if (grid[r][c] === P_EMPTY) return { r, c };
      } else {
        for (let c = COLS - 1; c >= 0; c--) if (grid[r][c] === P_EMPTY) return { r, c };
      }
    }
    return null;
  }

  function doDrop(lineIdx, internal=false) {
    if (animating || gameOver) return;
    if (previewMode && !internal) return;

    const t = findDropTarget(lineIdx);
    if (!t) return;

    if (!internal) pushHistorySnapshot();

    const { r, c } = t;
    grid[r][c] = currentPlayer;

    let fr=r, fc=c;
    if (gravityDir === 0) { fr = -1.15; fc = c; }
    else if (gravityDir === 2) { fr = ROWS + 0.15; fc = c; }
    else if (gravityDir === 1) { fr = r; fc = COLS + 0.15; }
    else { fr = r; fc = -1.15; }

    const dropTok = { p: currentPlayer, fr, fc, tr:r, tc:c, cr:fr, cc:fc };

    startAnim({
      tokens: buildAnimTokens([], dropTok),
      angleFrom: boardAngle,
      angleTo: targetAngle,
      duration: 240,
      onDone: () => resolveAfterPlayerMove()
    });
  }

  function doTacticalFlip(delta, internal=false) {
    if (animating || gameOver || previewMode) return;
    if (flipTokens[currentPlayer] <= 0) return;

    if (!internal) pushHistorySnapshot();

    flipTokens[currentPlayer] -= 1;

    const oldG = cloneGrid(grid);
    gravityDir = (gravityDir + delta + 4) % 4;
    targetAngle = dirToAngleRad(gravityDir);

    const settled = settleGrid(oldG, gravityDir);
    grid = settled.newG;

    startAnim({
      tokens: buildAnimTokens(settled.tokens),
      angleFrom: boardAngle,
      angleTo: targetAngle,
      duration: 280,
      onDone: () => resolveAfterPlayerMove()
    });
  }

  function doMagnet(side, internal=false) {
    // side: 0=TOP,1=RIGHT,2=BOTTOM,3=LEFT
    if (animating || gameOver) return;
    if (previewMode && !internal) return;
    if (magnetTokens[currentPlayer] <= 0) return;

    if (!internal) pushHistorySnapshot();
    magnetTokens[currentPlayer] -= 1;

    const opp = (side + 2) % 4;
    const oppOwner = magnetOwner[opp];
    const me = currentPlayer;

    if (oppOwner !== 0 && oppOwner !== me) {
      magnetOwner[side] = 0;
      magnetOwner[opp] = 0;
    } else {
      magnetOwner[side] = me;
    }

    resolveAfterPlayerMove();
  }



  function doEnvRotate(){ /* removed */ }


  function resolveAfterPlayerMove() {
    applyPhysicsAnimated(() => {
      const w = checkWins(grid);
      if (w.red || w.yel) {
        if (w.red && w.yel) { endGame(currentPlayer, true); return; }
        if (w.red) { endGame(P_RED, false); return; }
        if (w.yel) { endGame(P_YEL, false); return; }
      }
      if (gridIsFull(grid)) { endGame(0, false); return; }

      currentPlayer = (currentPlayer === P_RED) ? P_YEL : P_RED;
      syncUI();
    });
  }

  function syncUI() {
    // Env rotate is NOT a player move => do not check wins here.
    if (gridIsFull(grid)) { endGame(0, false); return; }
    syncUI();
  }

  function endGame(who, wasTieBreak) {
    // In SHOW WIN preview mode: do NOT end the real game. Just stop demo + offer Resume.
    let title, sub;
    if (who === 0) {
      title = "Draw";
      sub = "No winner.";
    } else {
      title = `${playerName(who)} Wins`;
      sub = wasTieBreak
        ? "Tie-break: both players formed Connect-4; active player wins."
        : "Connect-4 achieved.";
    }

    if (previewMode) {
      previewRunId++;       // stop pending demo steps
      anim = null;
      animating = false;
      showOverlay("SHOW WIN demo", `${title}. ${sub}\n\nTap Resume to return to your original position.`, "resume");
      return;
    }

    gameOver = true;
    winner = who;
    showOverlay(title, sub, "gameover");
    syncUI();
  }

  function newGame() {
    previewMode = false;
    previewSnapshot = null;
    previewRunId++;
    history = [];
    hintCache.clear();
    lastHintKey = null;

    grid = makeEmptyGrid();
    gravityDir = 0;
    targetAngle = dirToAngleRad(gravityDir);
    boardAngle = targetAngle;
    currentPlayer = P_RED;
    flipTokens[P_RED] = 2;
    flipTokens[P_YEL] = 2;
    magnetTokens[P_RED] = 2;
    magnetTokens[P_YEL] = 2;
    magnetOwner = [0,0,0,0];

    anim = null;
    animating = false;
    hoveredIndex = -1;
    gameOver = false;
    winner = 0;

    hideOverlay();
    syncUI();
  }

  function syncUI() {
    elTurnBig.textContent = gameOver ? "Game Over" : `Turn: ${playerName(currentPlayer)}`;
    const deg = (gravityDir * 90) % 360;
    elGravityInfo.textContent = `Gravity: ${ARROWS[gravityDir]} ${DIRS[gravityDir]} • Angle: ${deg}°`;

    elRFlips.textContent = String(flipTokens[P_RED]);
    elYFlips.textContent = String(flipTokens[P_YEL]);
    elRMags.textContent = String(magnetTokens[P_RED]);
    elYMags.textContent = String(magnetTokens[P_YEL]);

    btnTacCCW.disabled = animating || gameOver || previewMode || flipTokens[currentPlayer] <= 0;
    btnTacCW.disabled  = animating || gameOver || previewMode || flipTokens[currentPlayer] <= 0;

    btnShowWin.disabled = animating || gameOver || previewMode;
    btnAdd.disabled = animating || gameOver || previewMode;
    btnUndo.disabled = animating || previewMode || history.length === 0;
    if (btnOvUndo) {
      const showUndo = (overlayMode === "gameover") && !previewMode;
      btnOvUndo.style.display = showUndo ? "inline-block" : "none";
      btnOvUndo.disabled = !showUndo || animating || history.length === 0;
    }

    scheduleHintCompute();
  }

  // =========================
  // Input
  // =========================
  function updateHoverFromPoint(px, py) {
    if (animating || gameOver || previewMode) { hoveredIndex = -1; return; }
    const loc = screenToBoardLocal(px, py);
    if (!loc.inside) { hoveredIndex = -1; return; }
    const cell = boardLocalToCell(loc.lx, loc.ly);
    if (isVertical(gravityDir)) hoveredIndex = (cell.c >= 0 && cell.c < COLS) ? cell.c : -1;
    else hoveredIndex = (cell.r >= 0 && cell.r < ROWS) ? cell.r : -1;
  }

  function onPointerDown(e) {
    if (e.cancelable) e.preventDefault();
    if (animating || gameOver || previewMode) return;

    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    // Board-local coords (unrotated)
    const dx = px - board.cx;
    const dy = py - board.cy;
    const a = boardAngle;
    const ca = Math.cos(-a), sa = Math.sin(-a);
    const rx = dx * ca - dy * sa;
    const ry = dx * sa + dy * ca;
    const lx = rx + board.w / 2;
    const ly = ry + board.h / 2;

    const mf = Math.max(10, board.cell * 0.55);
    const inFrame = (lx >= -mf && lx <= board.w + mf && ly >= -mf && ly <= board.h + mf);
    const inBoard = (lx >= 0 && lx <= board.w && ly >= 0 && ly <= board.h);

    if (inFrame && !inBoard) {
      const dL = Math.abs(lx - 0);
      const dR = Math.abs(lx - board.w);
      const dT = Math.abs(ly - 0);
      const dB = Math.abs(ly - board.h);

      let side = 0; // TOP
      let best = dT;
      if (dR < best) { best = dR; side = 1; }
      if (dB < best) { best = dB; side = 2; }
      if (dL < best) { best = dL; side = 3; }

      doMagnet(side);
      return;
    }

    updateHoverFromPoint(px, py);
    if (hoveredIndex >= 0) doDrop(hoveredIndex);
  }

  function onPointerMove(e) {
    if (e.cancelable) e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    updateHoverFromPoint(e.clientX - rect.left, e.clientY - rect.top);
  }

  canvas.addEventListener("pointerdown", onPointerDown, { passive:false });
  canvas.addEventListener("pointermove", onPointerMove, { passive:false });
  canvas.addEventListener("pointerleave", (e)=>{ if (e.cancelable) e.preventDefault(); hoveredIndex = -1; }, { passive:false });
  canvas.addEventListener("touchstart", (e)=>{ if (e.cancelable) e.preventDefault(); }, { passive:false });
  canvas.addEventListener("touchmove", (e)=>{ if (e.cancelable) e.preventDefault(); }, { passive:false });

  window.addEventListener("keydown", (e) => {
    if (animating || gameOver || previewMode) return;
    const k = e.key;
    if (k >= "1" && k <= "9") {
      const n = (k.charCodeAt(0) - 48);
      if (isVertical(gravityDir)) { if (n >= 1 && n <= 7) doDrop(n - 1); }
      else { if (n >= 1 && n <= 6) doDrop(n - 1); }
    }
  });

  // Buttons
  btnTacCCW.addEventListener("click", () => doTacticalFlip(+1));
  btnTacCW.addEventListener("click",  () => doTacticalFlip(-1));
  btnShowWin.addEventListener("click", () => startShowWinDemo());
  btnAdd.addEventListener("click", () => {
    if (animating || gameOver || previewMode) return;
    flipTokens[P_RED] += 2; flipTokens[P_YEL] += 2;
    magnetTokens[P_RED] += 2; magnetTokens[P_YEL] += 2;
    syncUI();
  });
  btnUndo.addEventListener("click", () => undoLastMove());
  btnOvUndo.addEventListener("click", () => undoLastMove());
  btnNewGame.addEventListener("click", () => newGame());

  // =========================
  // Device orientation
  // =========================
  function getScreenAngleDeg(){ /* removed */ }

  function desiredDirFromAngle(){ /* removed */ }

  function applyDeviceOrientationIfChanged(){ /* removed */ }

  window.addEventListener("orientationchange", () => { resize(); });
  window.addEventListener("resize", () => { resize(); });

  async function requestMotionPermissionIfNeeded() {
    const needsPermission =
      (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") ||
      (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function");
    if (!needsPermission) return false;
    motionWrap.style.display = "block";
    return true;
  }

  async function enableMotion() {
    try {
      let granted = true;
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        const res = await DeviceMotionEvent.requestPermission();
        granted = granted && (res === "granted");
      }
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const res2 = await DeviceOrientationEvent.requestPermission();
        granted = granted && (res2 === "granted");
      }
      motionWrap.style.display = "none";
      if (granted) {
        window.addEventListener("deviceorientation", () => applyDeviceOrientationIfChanged(), { passive:true });
        window.addEventListener("devicemotion", () => applyDeviceOrientationIfChanged(), { passive:true });
      } else {
        motionWrap.style.display = "block";
      }
        } catch {
      motionWrap.style.display = "block";
    }
  }
  motionBtn.addEventListener("click", enableMotion);

  // =========================
  // Main loop
  // =========================
  function frame(now) {
    updateAnim(now);
    drawBoard();
    // syncUI() is cheap; keeping it here makes UI always correct.
    syncUI();
    requestAnimationFrame(frame);
  }

  // Init
  resize();
  newGame();
  requestMotionPermissionIfNeeded();
  requestAnimationFrame(frame);
})();
</script>
</body>
