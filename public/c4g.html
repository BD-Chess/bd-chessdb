<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>FlipFour</title>
<style>
  :root{
    --bg:#0b0f17;
    --panel:rgba(20,26,38,0.78);
    --panel2:rgba(20,26,38,0.92);
    --text:#e9eefc;
    --muted:#a9b3cf;
    --accent:#6aa7ff;
    --ok:#27d17f;
    --warn:#ffcc66;
    --danger:#ff6b6b;
    --btn:#26314a;
    --btn2:#1e2a45;
    --btnBorder:rgba(255,255,255,0.12);
    --shadow:rgba(0,0,0,0.45);
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:block;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #hud{
    position:absolute;left:0;right:0;top:0;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
    background:linear-gradient(to bottom, var(--panel2), rgba(20,26,38,0.0));
    pointer-events:auto;
  }
  #titleRow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  #title{font-weight:800;font-size:22px;letter-spacing:0.4px;}
  #sub{font-size:12px;color:var(--muted);}
  #statusRow{
    margin-top:8px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  }
  .pill{
    background:var(--panel);
    border:1px solid var(--btnBorder);
    border-radius:14px;
    padding:8px 10px;
    box-shadow:0 8px 22px var(--shadow);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    backdrop-filter: blur(10px);
  }
  #turnBig{font-weight:900;font-size:18px;}
  #gravityInfo{font-size:12px;color:var(--muted);}
  #tokens{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .pTag{display:flex;gap:8px;align-items:center}
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(255,255,255,0.22)}
  .dot.red{background:#e53935;}
  .dot.yel{background:#fdd835;}
  .count{color:var(--text);font-weight:800;}
  #btnRow{
    margin-top:10px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  button{
    appearance:none;
    border:1px solid var(--btnBorder);
    background:var(--btn);
    color:var(--text);
    border-radius:12px;
    padding:10px 12px;
    font-weight:800;
    letter-spacing:0.2px;
    box-shadow:0 10px 24px var(--shadow);
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  button[disabled]{opacity:0.45;cursor:not-allowed;transform:none;}
  .btnSmall{padding:8px 10px;font-weight:800;font-size:12px;}
  .envBtn{
    background:linear-gradient(180deg, rgba(60,120,255,0.22), rgba(60,120,255,0.10));
    border-color:rgba(106,167,255,0.35);
  }
  .tacBtn{
    background:linear-gradient(180deg, rgba(255,204,102,0.20), rgba(255,204,102,0.10));
    border-color:rgba(255,204,102,0.35);
  }
  .dangerBtn{
    background:linear-gradient(180deg, rgba(255,107,107,0.20), rgba(255,107,107,0.10));
    border-color:rgba(255,107,107,0.35);
  }
  #motionWrap{margin-top:10px;display:none;}
  #motionBtn{
    width:100%;
    background:linear-gradient(180deg, rgba(39,209,127,0.18), rgba(39,209,127,0.08));
    border-color:rgba(39,209,127,0.35);
    padding:12px 14px;
    font-size:14px;
  }
  #overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.55);
    padding:20px;
    pointer-events:auto;
  }
  #overlayCard{
    width:min(520px, 92vw);
    background:rgba(15,19,28,0.92);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:18px;
    padding:18px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    text-align:center;
  }
  #ovTitle{font-size:22px;font-weight:1000;letter-spacing:0.2px;margin:0 0 6px 0;}
  #ovSub{margin:0 0 14px 0;color:var(--muted);font-size:13px;line-height:1.35;}
  #playAgain{width:100%;padding:12px 14px;font-size:14px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="titleRow">
      <div id="title">FlipFour</div>
      <div id="sub">Connect-4 + Gravity Flip • local 2-player</div>
    </div>

    <div id="statusRow">
      <div class="pill" id="turnPill">
        <div id="turnBig">Turn: —</div>
        <div id="gravityInfo">Gravity: — • Angle: —</div>
      </div>

      <div class="pill" id="tokenPill">
        <div id="tokens">
          <div class="pTag"><span class="dot red"></span>Red flips: <span class="count" id="rFlips">2</span></div>
          <div class="pTag"><span class="dot yel"></span>Yellow flips: <span class="count" id="yFlips">2</span></div>
        </div>
      </div>
    </div>

    <div id="btnRow">
      <button class="tacBtn" id="tacCCW" title="Tactical Flip (consumes your flip token)">Tactical Flip ⟲</button>
      <button class="tacBtn" id="tacCW"  title="Tactical Flip (consumes your flip token)">Tactical Flip ⟳</button>

      <button class="envBtn btnSmall" id="envCCW" title="Environment Rotate (free)">Env Rotate ⟲ (free)</button>
      <button class="envBtn btnSmall" id="envCW"  title="Environment Rotate (free)">Env Rotate ⟳ (free)</button>

      <button class="dangerBtn" id="newGame">New Game</button>
    </div>

    <div id="motionWrap">
      <button id="motionBtn">Enable Motion</button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlayCard">
      <h2 id="ovTitle">—</h2>
      <p id="ovSub">—</p>
      <button id="playAgain" class="dangerBtn">Play Again</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =========================
  // Constants / State
  // =========================
  const COLS = 7, ROWS = 6;
  const P_EMPTY = 0, P_RED = 1, P_YEL = 2;

  // Directions: 0=DOWN, 1=LEFT, 2=UP, 3=RIGHT (clockwise order if you turn device CCW -> LEFT)
  const DIRS = ["DOWN","LEFT","UP","RIGHT"];
  const ARROWS = ["↓","←","↑","→"];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const hud = document.getElementById("hud");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovSub = document.getElementById("ovSub");
  const btnPlayAgain = document.getElementById("playAgain");

  const elTurnBig = document.getElementById("turnBig");
  const elGravityInfo = document.getElementById("gravityInfo");
  const elRFlips = document.getElementById("rFlips");
  const elYFlips = document.getElementById("yFlips");

  const btnTacCCW = document.getElementById("tacCCW");
  const btnTacCW = document.getElementById("tacCW");
  const btnEnvCCW = document.getElementById("envCCW");
  const btnEnvCW = document.getElementById("envCW");
  const btnNewGame = document.getElementById("newGame");

  const motionWrap = document.getElementById("motionWrap");
  const motionBtn = document.getElementById("motionBtn");

  let grid = makeEmptyGrid();
  let gravityDir = 0;                // starts DOWN
  let boardAngle = 0;                // radians, visual
  let targetAngle = 0;               // radians
  let currentPlayer = P_RED;         // starts RED
  let flipTokens = { [P_RED]: 2, [P_YEL]: 2 };

  let anim = null;                   // {start, dur, tokens, a0, a1, onDone}
  let animating = false;

  let hoveredIndex = -1;             // column (vertical) or row (horizontal), in board coordinates
  let pointerDown = false;

  let gameOver = false;
  let winner = 0;                    // 0 draw, 1 red, 2 yellow

  // For environment/device orientation changes:
  let motionEnabled = false;
  let lastDesiredDir = gravityDir;

  // =========================
  // Utilities
  // =========================
  function makeEmptyGrid() {
    const g = new Array(ROWS);
    for (let r = 0; r < ROWS; r++) {
      g[r] = new Array(COLS).fill(P_EMPTY);
    }
    return g;
  }

  function cloneGrid(g) {
    const out = new Array(ROWS);
    for (let r = 0; r < ROWS; r++) out[r] = g[r].slice();
    return out;
  }

  function isVertical(dir) { return dir === 0 || dir === 2; }
  function dirToAngleRad(dir) { return dir * (Math.PI / 2); }

  function normAngleRad(a) {
    const TWO = Math.PI * 2;
    a = a % TWO;
    if (a < 0) a += TWO;
    return a;
  }

  function shortestAngleDiff(a, b) {
    // return diff in (-pi, pi]
    const TWO = Math.PI * 2;
    let d = (b - a) % TWO;
    if (d > Math.PI) d -= TWO;
    if (d <= -Math.PI) d += TWO;
    return d;
  }

  function easeInOut(t) {
    // smoothstep
    return t * t * (3 - 2 * t);
  }

  function gridIsFull(g) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (g[r][c] === P_EMPTY) return false;
      }
    }
    return true;
  }

  // =========================
  // Settling (deterministic, stable compaction)
  // =========================
  function settleGrid(oldG, dir) {
    const newG = makeEmptyGrid();
    const tokens = []; // all tokens with mapping: {p, fr, fc, tr, tc}

    if (dir === 0 /*DOWN*/ || dir === 2 /*UP*/) {
      for (let c = 0; c < COLS; c++) {
        const colTokens = [];
        for (let r = 0; r < ROWS; r++) {
          const p = oldG[r][c];
          if (p !== P_EMPTY) colTokens.push({ p, r, c });
        }
        const L = colTokens.length;
        for (let i = 0; i < L; i++) {
          const src = colTokens[i];
          const tr = (dir === 0) ? (ROWS - L + i) : i;
          const tc = c;
          newG[tr][tc] = src.p;
          tokens.push({ p: src.p, fr: src.r, fc: src.c, tr, tc });
        }
      }
    } else {
      // LEFT / RIGHT: operate per row
      for (let r = 0; r < ROWS; r++) {
        const rowTokens = [];
        for (let c = 0; c < COLS; c++) {
          const p = oldG[r][c];
          if (p !== P_EMPTY) rowTokens.push({ p, r, c });
        }
        const L = rowTokens.length;
        for (let i = 0; i < L; i++) {
          const src = rowTokens[i];
          const tc = (dir === 1 /*LEFT*/) ? i : (COLS - L + i);
          const tr = r;
          newG[tr][tc] = src.p;
          tokens.push({ p: src.p, fr: src.r, fc: src.c, tr, tc });
        }
      }
    }

    return { newG, tokens };
  }

  // =========================
  // Win detection
  // =========================
  function checkWins(g) {
    let red = false, yel = false;

    function mark(p) {
      if (p === P_RED) red = true;
      else if (p === P_YEL) yel = true;
    }

    // scan each cell as start of a 4-run in 4 directions
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = g[r][c];
        if (p === P_EMPTY) continue;

        // Right
        if (c <= COLS - 4) {
          if (g[r][c+1] === p && g[r][c+2] === p && g[r][c+3] === p) mark(p);
        }
        // Down
        if (r <= ROWS - 4) {
          if (g[r+1][c] === p && g[r+2][c] === p && g[r+3][c] === p) mark(p);
        }
        // Down-right diag
        if (r <= ROWS - 4 && c <= COLS - 4) {
          if (g[r+1][c+1] === p && g[r+2][c+2] === p && g[r+3][c+3] === p) mark(p);
        }
        // Down-left diag
        if (r <= ROWS - 4 && c >= 3) {
          if (g[r+1][c-1] === p && g[r+2][c-2] === p && g[r+3][c-3] === p) mark(p);
        }
      }
    }
    return { red, yel };
  }

  // =========================
  // Layout & Pointer mapping (screen -> board coords)
  // =========================
  let W = 1, H = 1;
  let board = {
    cx: 0, cy: 0,
    w: 0, h: 0,
    cell: 0,
    x0: 0, y0: 0, // top-left of unrotated board in screen coords before rotation? (we use cx/cy + transforms)
  };

  function resize() {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    computeBoardLayout();
  }

  function computeBoardLayout() {
    const hudRect = hud.getBoundingClientRect();
    const top = hudRect.height + 10;
    const margin = 14;
    const availH = Math.max(100, H - top - margin);
    const availW = Math.max(100, W - 2 * margin);

    const cell = Math.floor(Math.min(availW / COLS, availH / ROWS));
    board.cell = Math.max(20, cell);
    board.w = board.cell * COLS;
    board.h = board.cell * ROWS;
    board.cx = Math.floor(W / 2);
    board.cy = Math.floor(top + (availH / 2));
    board.x0 = board.cx - board.w / 2;
    board.y0 = board.cy - board.h / 2;
  }

  function screenToBoardLocal(px, py) {
    // Convert screen point to board-local coordinates in unrotated board frame (0..w, 0..h),
    // by inverse-rotating around board center.
    const dx = px - board.cx;
    const dy = py - board.cy;

    const a = boardAngle;
    const ca = Math.cos(-a), sa = Math.sin(-a);
    const rx = dx * ca - dy * sa;
    const ry = dx * sa + dy * ca;

    const lx = rx + board.w / 2;
    const ly = ry + board.h / 2;

    return { lx, ly, inside: (lx >= 0 && lx <= board.w && ly >= 0 && ly <= board.h) };
  }

  function boardLocalToCell(lx, ly) {
    const c = Math.floor(lx / board.cell);
    const r = Math.floor(ly / board.cell);
    return { r, c };
  }

  // =========================
  // Rendering
  // =========================
  function drawRoundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function discGradient(color) {
    const g = ctx.createRadialGradient(-6, -8, 2, 0, 0, 18);
    if (color === P_RED) {
      g.addColorStop(0, "#ff9a96");
      g.addColorStop(0.35, "#ff4d4a");
      g.addColorStop(1, "#b71c1c");
    } else {
      g.addColorStop(0, "#fff6a6");
      g.addColorStop(0.35, "#ffe15c");
      g.addColorStop(1, "#c9a400");
    }
    return g;
  }

  function drawTokenAt(cellR, cellC, p, tFactor=0) {
    const s = board.cell;
    const cx = (cellC + 0.5) * s;
    const cy = (cellR + 0.5) * s;
    const rad = s * 0.38;

    ctx.save();
    ctx.translate(cx, cy);

    // subtle bob / squash if desired (unused by default)
    if (tFactor !== 0) ctx.scale(1 + 0.02 * tFactor, 1 - 0.01 * tFactor);

    // shadow
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.ellipse(3, 4, rad * 0.95, rad * 0.85, 0, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    ctx.globalAlpha = 1;

    // disc
    ctx.beginPath();
    ctx.arc(0, 0, rad, 0, Math.PI * 2);
    ctx.fillStyle = discGradient(p);
    ctx.fill();

    // specular highlight
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(-rad*0.25, -rad*0.28, rad*0.35, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.globalAlpha = 1;

    // rim
    ctx.lineWidth = Math.max(1, s * 0.04);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.stroke();

    ctx.restore();
  }

  function drawBoard() {
    // background
    ctx.fillStyle = "#0b0f17";
    ctx.fillRect(0, 0, W, H);

    // subtle vignette
    const vg = ctx.createRadialGradient(board.cx, board.cy, Math.min(W,H)*0.1, board.cx, board.cy, Math.max(W,H)*0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(board.cx, board.cy);
    ctx.rotate(boardAngle);
    ctx.translate(-board.w/2, -board.h/2);

    // board plate
    const platePad = board.cell * 0.08;
    drawRoundedRect(0 - platePad, 0 - platePad, board.w + platePad*2, board.h + platePad*2, board.cell * 0.22);
    ctx.fillStyle = "#1a3a7a";
    ctx.fill();

    // plate shading
    const pgrad = ctx.createLinearGradient(0, 0, board.w, board.h);
    pgrad.addColorStop(0, "rgba(255,255,255,0.14)");
    pgrad.addColorStop(1, "rgba(0,0,0,0.20)");
    ctx.fillStyle = pgrad;
    ctx.fill();

    // highlight hovered line (in board coords)
    if (!gameOver && hoveredIndex >= 0) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#ffffff";
      if (isVertical(gravityDir)) {
        const x = hoveredIndex * board.cell;
        ctx.fillRect(x, 0, board.cell, board.h);
      } else {
        const y = hoveredIndex * board.cell;
        ctx.fillRect(0, y, board.w, board.cell);
      }
      ctx.restore();
    }

    // slots
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cx = (c + 0.5) * board.cell;
        const cy = (r + 0.5) * board.cell;
        const rad = board.cell * 0.42;

        // hole
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI*2);
        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.fill();

        // inner rim
        ctx.lineWidth = Math.max(1, board.cell * 0.04);
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.stroke();
      }
    }

    // tokens (either from animation positions or from grid)
    if (animating && anim && anim.tokens) {
      for (const tok of anim.tokens) {
        drawTokenAt(tok.cr, tok.cc, tok.p);
      }
    } else {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = grid[r][c];
          if (p !== P_EMPTY) drawTokenAt(r, c, p);
        }
      }
    }

    ctx.restore();

    // small hint footer (desktop)
    // kept subtle; no DOM needed.
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "rgba(233,238,252,0.70)";
    ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    const hint = isVertical(gravityDir)
      ? "Drop: tap/click board • or press 1–7"
      : "Drop: tap/click board • or press 1–6";
    const m = 12;
    ctx.fillText(hint, m + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-left"))||0), H - m - 2);
    ctx.restore();
  }

  // =========================
  // Animation system
  // =========================
  function startAnim({ tokens, angleFrom, angleTo, duration=260, onDone }) {
    anim = {
      start: performance.now(),
      dur: duration,
      tokens: tokens || [],
      a0: angleFrom,
      a1: angleTo,
      onDone: onDone || null
    };
    animating = true;
  }

  function buildAnimTokensFromMapping(mappingTokens, dropToken=null) {
    // mappingTokens: array {p, fr, fc, tr, tc}
    // returns anim tokens with interpolated (cr,cc) updated per frame.
    const out = [];
    for (const t of mappingTokens) {
      out.push({ p: t.p, fr: t.fr, fc: t.fc, tr: t.tr, tc: t.tc, cr: t.fr, cc: t.fc });
    }
    if (dropToken) out.push(dropToken);
    return out;
  }

  function updateAnim(now) {
    if (!animating || !anim) return;

    const t = Math.min(1, Math.max(0, (now - anim.start) / anim.dur));
    const e = easeInOut(t);

    // angle
    const d = shortestAngleDiff(anim.a0, anim.a1);
    boardAngle = anim.a0 + d * e;

    // tokens
    for (const tok of anim.tokens) {
      tok.cr = tok.fr + (tok.tr - tok.fr) * e;
      tok.cc = tok.fc + (tok.tc - tok.fc) * e;
    }

    if (t >= 1) {
      boardAngle = anim.a1;
      animating = false;
      const done = anim.onDone;
      anim = null;
      if (done) done();
    }
  }

  // =========================
  // Game logic: Drops & Flips
  // =========================
  function findDropTarget(lineIndex) {
    // Returns {r,c} final cell or null if no space
    if (isVertical(gravityDir)) {
      const c = lineIndex;
      if (c < 0 || c >= COLS) return null;

      if (gravityDir === 0 /*DOWN*/) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === P_EMPTY) return { r, c };
        }
      } else {
        // UP: place at first empty from top
        for (let r = 0; r < ROWS; r++) {
          if (grid[r][c] === P_EMPTY) return { r, c };
        }
      }
    } else {
      const r = lineIndex;
      if (r < 0 || r >= ROWS) return null;

      if (gravityDir === 1 /*LEFT*/) {
        // first empty from left
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === P_EMPTY) return { r, c };
        }
      } else {
        // RIGHT: first empty from right
        for (let c = COLS - 1; c >= 0; c--) {
          if (grid[r][c] === P_EMPTY) return { r, c };
        }
      }
    }
    return null;
  }

  function doDrop(lineIndex) {
    if (animating || gameOver) return;

    const target = findDropTarget(lineIndex);
    if (!target) return;

    const { r, c } = target;

    // place into grid immediately (final state)
    grid[r][c] = currentPlayer;

    // animate new token from opposite side of gravity
    let fr = r, fc = c;
    if (gravityDir === 0 /*DOWN*/) { fr = -1.15; fc = c; }
    else if (gravityDir === 2 /*UP*/) { fr = ROWS + 0.15; fc = c; }
    else if (gravityDir === 1 /*LEFT*/) { fr = r; fc = COLS + 0.15; }
    else if (gravityDir === 3 /*RIGHT*/) { fr = r; fc = -1.15; }

    const dropTok = { p: currentPlayer, fr, fc, tr: r, tc: c, cr: fr, cc: fc };

    const a0 = boardAngle;
    const a1 = targetAngle; // should already match gravityDir
    startAnim({
      tokens: buildAnimTokensFromMapping([], dropTok),
      angleFrom: a0,
      angleTo: a1,
      duration: 240,
      onDone: () => resolveAfterPlayerMove()
    });
  }

  function resolveAfterPlayerMove() {
    // After DROP or TACTICAL FLIP settles:
    const w = checkWins(grid);
    if (w.red || w.yel) {
      // tie-break: if BOTH have connect-4, active player (currentPlayer) wins
      if (w.red && w.yel) {
        endGame(currentPlayer, true);
        return;
      }
      if (w.red) { endGame(P_RED, false); return; }
      if (w.yel) { endGame(P_YEL, false); return; }
    }

    if (gridIsFull(grid)) {
      endGame(0, false);
      return;
    }

    // next player
    currentPlayer = (currentPlayer === P_RED) ? P_YEL : P_RED;
    syncUI();
  }

  function resolveAfterEnvChange() {
    // Environmental rotation settle: free, automatic, and NOT a player action.
    // Per rules: win checks happen after a PLAYER move resolves (DROP or TACTICAL FLIP),
    // so we do not end the game on an environment-only gravity change.
    if (gridIsFull(grid)) {
      // Still allow a pure draw if the board is completely full.
      endGame(0, false);
      return;
    }
    syncUI();
  }
      if (w.red) { endGame(P_RED, false); return; }
      if (w.yel) { endGame(P_YEL, false); return; }
    }
    if (gridIsFull(grid)) {
      endGame(0, false);
      return;
    }
    syncUI();
  }
      if (w.red) { endGame(P_RED, false); return; }
      if (w.yel) { endGame(P_YEL, false); return; }
    }
    if (gridIsFull(grid)) {
      endGame(0, false);
      return;
    }
    syncUI();
  }

  function doTacticalFlip(delta) {
    if (animating || gameOver) return;

    if (flipTokens[currentPlayer] <= 0) return;

    // consume
    flipTokens[currentPlayer] -= 1;

    const oldG = cloneGrid(grid);
    gravityDir = (gravityDir + delta + 4) % 4;
    targetAngle = dirToAngleRad(gravityDir);

    // settle into new gravity
    const settled = settleGrid(oldG, gravityDir);
    grid = settled.newG;

    const tokens = buildAnimTokensFromMapping(settled.tokens);
    const a0 = boardAngle;
    const a1 = targetAngle;

    startAnim({
      tokens,
      angleFrom: a0,
      angleTo: a1,
      duration: 280,
      onDone: () => resolveAfterPlayerMove()
    });

    syncUI();
  }

  function doEnvRotate(deltaOrAbsolute, absolute=false) {
    if (animating || gameOver) return;

    const oldDir = gravityDir;
    const oldG = cloneGrid(grid);

    if (absolute) gravityDir = deltaOrAbsolute;
    else gravityDir = (gravityDir + deltaOrAbsolute + 4) % 4;

    if (gravityDir === oldDir) return;

    targetAngle = dirToAngleRad(gravityDir);

    // settle into new gravity
    const settled = settleGrid(oldG, gravityDir);
    grid = settled.newG;

    const tokens = buildAnimTokensFromMapping(settled.tokens);
    const a0 = boardAngle;
    const a1 = targetAngle;

    startAnim({
      tokens,
      angleFrom: a0,
      angleTo: a1,
      duration: 280,
      onDone: () => resolveAfterEnvChange()
    });

    syncUI();
  }

  // =========================
  // UI & Game end
  // =========================
  function playerName(p) { return p === P_RED ? "Red" : "Yellow"; }

  function endGame(who, wasTieBreak) {
    // IMPORTANT:
    // - In normal play, a win ends the game.
    // - In SHOW WIN demo (previewMode), we must NOT permanently end the real game.
    //   Instead we stop the demo and offer Resume to restore the pre-demo snapshot.
    let title, sub;
    if (who === 0) {
      title = "Draw";
      sub = "No winner.";
    } else {
      title = `${playerName(who)} Wins`;
      sub = wasTieBreak
        ? "Tie-break: both players formed Connect-4; active player wins."
        : "Connect-4 achieved.";
    }

    if (previewMode) {
      // Stop any pending demo steps by invalidating the run id
      previewRunId++;
      anim = null;
      animating = false;
      showOverlay("SHOW WIN demo", `${title}. ${sub}\n\nTap Resume to return to your original position.`, "resume");
      return;
    }

    gameOver = true;
    winner = who;
    showOverlay(title, sub, "gameover");
    syncUI();
  } else {
      title = `${playerName(who)} Wins`;
      sub = wasTieBreak
        ? "Tie-break: both players formed Connect-4; active player wins."
        : "Connect-4 achieved.";
    }
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    overlay.style.display = "flex";
    syncUI();
  }

  function hideOverlay() {
    overlay.style.display = "none";
  }

  function newGame() {
    grid = makeEmptyGrid();
    gravityDir = 0;
    targetAngle = dirToAngleRad(gravityDir);
    boardAngle = targetAngle;
    currentPlayer = P_RED;
    flipTokens[P_RED] = 2;
    flipTokens[P_YEL] = 2;

    anim = null;
    animating = false;
    hoveredIndex = -1;
    pointerDown = false;

    gameOver = false;
    winner = 0;
    hideOverlay();
    syncUI();
  }

  function syncUI() {
    const turnTxt = gameOver
      ? "Game Over"
      : `Turn: ${playerName(currentPlayer)}`;

    elTurnBig.textContent = turnTxt;

    const deg = Math.round(normAngleRad(boardAngle) * 180 / Math.PI) % 360;
    elGravityInfo.textContent = `Gravity: ${ARROWS[gravityDir]} ${DIRS[gravityDir]} • Angle: ${deg}°`;

    elRFlips.textContent = String(flipTokens[P_RED]);
    elYFlips.textContent = String(flipTokens[P_YEL]);

    btnTacCCW.disabled = animating || gameOver || flipTokens[currentPlayer] <= 0;
    btnTacCW.disabled  = animating || gameOver || flipTokens[currentPlayer] <= 0;

    // Env rotate is always free; still block while animating
    btnEnvCCW.disabled = animating || gameOver;
    btnEnvCW.disabled  = animating || gameOver;

    // New game always allowed
    btnNewGame.disabled = false;
  }

  // =========================
  // Input: pointer + touch + keyboard
  // =========================
  function updateHoverFromPoint(px, py) {
    const loc = screenToBoardLocal(px, py);
    if (!loc.inside || animating || gameOver) {
      hoveredIndex = -1;
      return;
    }
    const cell = boardLocalToCell(loc.lx, loc.ly);
    if (isVertical(gravityDir)) {
      hoveredIndex = (cell.c >= 0 && cell.c < COLS) ? cell.c : -1;
    } else {
      hoveredIndex = (cell.r >= 0 && cell.r < ROWS) ? cell.r : -1;
    }
  }

  function onPointerDown(e) {
    if (e.cancelable) e.preventDefault();
    pointerDown = true;

    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    updateHoverFromPoint(px, py);
    if (hoveredIndex >= 0 && !animating && !gameOver) {
      doDrop(hoveredIndex);
    }
  }

  function onPointerMove(e) {
    if (e.cancelable) e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    updateHoverFromPoint(px, py);
  }

  function onPointerUp(e) {
    if (e.cancelable) e.preventDefault();
    pointerDown = false;
  }

  function onPointerLeave(e) {
    if (e.cancelable) e.preventDefault();
    pointerDown = false;
    hoveredIndex = -1;
  }

  function onKeyDown(e) {
    if (animating || gameOver) return;

    const k = e.key;
    if (k >= "1" && k <= "9") {
      const n = (k.charCodeAt(0) - 48); // 1..9
      if (isVertical(gravityDir)) {
        if (n >= 1 && n <= 7) doDrop(n - 1);
      } else {
        if (n >= 1 && n <= 6) doDrop(n - 1);
      }
    }
  }

  canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
  canvas.addEventListener("pointermove", onPointerMove, { passive: false });
  canvas.addEventListener("pointerup", onPointerUp, { passive: false });
  canvas.addEventListener("pointercancel", onPointerUp, { passive: false });
  canvas.addEventListener("pointerleave", onPointerLeave, { passive: false });

  // Prevent touch scroll on iOS (extra guard)
  canvas.addEventListener("touchstart", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });

  window.addEventListener("keydown", onKeyDown);

  // =========================
  // Buttons
  // =========================
  btnTacCCW.addEventListener("click", () => doTacticalFlip(+1)); // CCW in screen terms maps to dir+1 in our DIR ordering (DOWN->LEFT)
  btnTacCW.addEventListener("click",  () => doTacticalFlip(-1)); // CW: DOWN->RIGHT
  btnEnvCCW.addEventListener("click", () => doEnvRotate(+1, false));
  btnEnvCW.addEventListener("click",  () => doEnvRotate(-1, false));
  btnNewGame.addEventListener("click", () => newGame());
  btnPlayAgain.addEventListener("click", () => newGame());

  // =========================
  // Device orientation handling
  // =========================
  function getScreenAngleDeg() {
    // Prefer screen.orientation.angle, fall back to window.orientation
    const so = (screen && screen.orientation) ? screen.orientation : null;
    if (so && typeof so.angle === "number") return so.angle;
    if (typeof window.orientation === "number") return window.orientation;
    return null;
  }

  function desiredDirFromAngle(angleDeg) {
    // Mapping per requirement example:
    // Portrait upright => DOWN (0)
    // Landscape left   => LEFT (1)
    // Portrait upside  => UP   (2)
    // Landscape right  => RIGHT(3)
    // iOS can give -90; normalize.
    let a = angleDeg % 360;
    if (a < 0) a += 360;

    // Snap to nearest 90
    const snapped = (Math.round(a / 90) * 90) % 360;

    if (snapped === 0) return 0;       // DOWN
    if (snapped === 90) return 1;      // LEFT
    if (snapped === 180) return 2;     // UP
    if (snapped === 270) return 3;     // RIGHT
    return gravityDir;
  }

  function applyDeviceOrientationIfChanged() {
    const ang = getScreenAngleDeg();
    if (ang === null) return;

    const want = desiredDirFromAngle(ang);
    lastDesiredDir = want;

    if (!animating && !gameOver && want !== gravityDir) {
      doEnvRotate(want, true);
    } else {
      // still keep targetAngle in sync even if animating; it'll reconcile after
      // we won't force during animation to keep determinism stable.
    }
  }

  function scheduleDeviceRecheck() {
    // After an animation ends, re-check device orientation once to catch pending rotations.
    setTimeout(() => {
      if (!animating && !gameOver) applyDeviceOrientationIfChanged();
    }, 30);
  }

  // Listen to orientation changes that don't require motion permissions
  window.addEventListener("orientationchange", () => {
    resize();
    applyDeviceOrientationIfChanged();
  });
  window.addEventListener("resize", () => {
    resize();
    applyDeviceOrientationIfChanged();
  });

  // Optional motion permission gate for iOS
  async function requestMotionPermissionIfNeeded() {
    const needsPermission =
      (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") ||
      (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function");

    if (!needsPermission) return false;

    // Show button as requested
    motionWrap.style.display = "block";
    return true;
  }

  async function enableMotion() {
    try {
      let granted = true;

      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        const res = await DeviceMotionEvent.requestPermission();
        granted = granted && (res === "granted");
      }
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const res2 = await DeviceOrientationEvent.requestPermission();
        granted = granted && (res2 === "granted");
      }

      motionEnabled = granted;
      motionWrap.style.display = "none";

      // If granted, we still primarily use screen angle (reliable mapping),
      // but we'll listen to events to trigger rechecks promptly.
      if (motionEnabled) {
        window.addEventListener("deviceorientation", () => {
          // just trigger screen-angle re-evaluation; keeps mapping consistent
          applyDeviceOrientationIfChanged();
        }, { passive: true });

        window.addEventListener("devicemotion", () => {
          applyDeviceOrientationIfChanged();
        }, { passive: true });
      }

      applyDeviceOrientationIfChanged();
    } catch (err) {
      // If permission fails, keep UI available
      motionEnabled = false;
      motionWrap.style.display = "block";
    }
  }

  motionBtn.addEventListener("click", enableMotion);

  // =========================
  // Main loop
  // =========================
  function frame(now) {
    updateAnim(now);

    // If animation just ended, reconcile pending device rotation
    if (!animating && anim === null) {
      // (cheap) keep targetAngle aligned with gravityDir
      targetAngle = dirToAngleRad(gravityDir);
    }

    drawBoard();

    // Button states can change when anim ends
    syncUI();

    requestAnimationFrame(frame);
  }

  // Hook: when any animation ends, recheck device
  const _origStartAnim = startAnim;
  startAnim = function(opts) {
    const prevDone = opts.onDone;
    opts.onDone = () => {
      if (prevDone) prevDone();
      scheduleDeviceRecheck();
    };
    _origStartAnim(opts);
  };

  // =========================
  // Init
  // =========================
  resize();
  newGame();
  applyDeviceOrientationIfChanged();
  requestMotionPermissionIfNeeded();

  requestAnimationFrame(frame);
})();
</script>
