<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8Z Trip Optimizer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-wrapper">
    <header>
      <div class="brand">8Z <span>Optimizer</span></div>
      <nav>
        <button id="btnPlanMode" class="nav-btn">Plan</button>
        <button id="btnMapMode" class="nav-btn">Map</button>
        
        <span style="color:var(--border); margin:0 5px;">|</span>
        
        <button id="btnAbout" class="nav-btn">About</button>
        <button id="btnHelp" class="nav-btn">Help</button>
      </nav>
    </header>

    <div class="panel">
      <h3>Plan Your Trip</h3>
      
      <input type="text" id="tripSearch" placeholder="Search library..." style="margin-bottom: 8px;">
      <div id="presetTree" class="library-box">
        <div style="padding:10px; color:#64748b;">Loading trips...</div>
      </div>

      <textarea id="input" placeholder="Enter stops (e.g. Paris, London)..." spellcheck="false"></textarea>
      
      <div class="grid-2">
        <button id="btnSave" class="btn-neutral">💾 Save</button>
        <button id="btnLoad" class="btn-neutral">📂 Load</button>
        <input type="file" id="fileLoader" hidden>
      </div>

      <div class="grid-2">
        <button id="btnStandard" class="btn-primary">Optimize (Fast)</button>
        <button id="btnDeep" class="btn-secondary">Optimize (Deep)</button>
      </div>

      <div class="grid-2">
        <button id="btnDriving" class="btn-mode active">🚗 Drive</button>
        <button id="btnWalking" class="btn-mode">🚶 Walk</button>
      </div>

      <div class="options">
        <label><input type="checkbox" id="chkRoundTrip" checked> Round Trip</label>
        <label><input type="checkbox" id="chkDirect"> Direct Line</label>
        <input type="checkbox" id="chkGoogleStyle" hidden>
        <button id="btnCollapse" hidden></button>
        <button id="btnExpand" hidden></button>
        <button id="btnChatToggle" hidden></button>
      </div>
      
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <h3>Results</h3>
      
      <div class="stats">
        <div>Dist: <span id="distKm" class="val">—</span></div>
        <div>Saved: <span id="savedKm" class="saved">—</span></div>
      </div>

      <div id="mapContainer">
        <div id="mapPlaceholder">
          <p>Map Inactive</p>
          <button id="btnEnableMap" class="btn-primary" style="width:auto;">Load Map</button>
        </div>
        <div id="map"></div>
      </div>

      <ul id="routeList"></ul>
      <div id="links" class="links-area"></div>
    </div>

    <div id="chatPanel">
      <div class="chat-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="chat-title">✨ AI Trip Chatbot <small class="chat-state-text" style="opacity:0.7; font-weight:400; margin-left:8px;"></small></div>
        <div style="display:none;">
          <select id="modelSelector"></select>
          <button id="btnCloseChat"></button>
        </div>
      </div>
      
      <div id="chatHistory">
        <div class="msg ai"><strong>Gemini:</strong> Welcome to 8Z! 🌍 I can build optimized itineraries, find the perfect "Base Camp" hotel for your route, and suggest dining spots. Where are we going?</div>
      </div>
      
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Message Gemini...">
        <button id="btnSendChat">➤</button>
      </div>
    </div>

  </div> <div id="helpOverlay">
    <div class="modal-content">
      <button id="btnCloseHelp" class="close-icon">×</button>
      <div id="helpBody"></div>
    </div>
  </div>

  <script src="trips.js"></script>
  <script src="about.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>

</body>
</html>
