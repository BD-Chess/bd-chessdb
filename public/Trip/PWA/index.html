<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>8Z Trip PWA → unified LAB</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#e6edf3;padding:24px}.card{max-width:640px;border:1px solid #263448;border-radius:18px;background:#0f1621;padding:24px;box-shadow:0 24px 70px #0008}.eyebrow{color:#60a5fa;font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.1em}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{display:inline-block;padding:12px 16px;border-radius:10px;border:1px solid #3b82f6;color:#dbeafe;text-decoration:none}.actions a:first-child{background:#2563eb;color:white}code{color:#93c5fd}#status{color:#a7f3d0}</style>
</head>
<body><main class="card"><p class="eyebrow">8Z TRIP · LEGACY PWA BRIDGE</p><h1>PWA is now the LAB source</h1>
<p>The maintained application moved to <code>/Trip/new/</code>. This bridge never deletes your old browser state.</p>
<p id="status">Checking local state…</p>
<div class="actions"><a href="../new/?view=lab">Open unified LAB</a><a href="../new/?view=app">APP preview</a></div>
</main>
<script>
(() => {
 const OLD='8z_trip_pwa_backup_v1', NEW='8z_trip_backup_v2', RECEIPT='8z_trip_lab_pwa_migration_v1';
 let message='No legacy editor state needed migration.';
 try{
   const current=localStorage.getItem(NEW), legacy=localStorage.getItem(OLD);
   if(!current && legacy){
     const value=JSON.parse(legacy);
     if(value && typeof value==='object' && typeof value.t==='string' && (value.m===undefined || ['DRIVING','WALKING'].includes(value.m))){
       localStorage.setItem(NEW,legacy);
       localStorage.setItem(RECEIPT,JSON.stringify({version:1,copiedAt:Date.now(),from:OLD,to:NEW,via:'legacy-pwa-bridge'}));
       message='Legacy PWA editor state was copied to LAB. The old copy was kept unchanged.';
     } else message='Legacy state was found but did not pass the migration shape check; nothing was changed.';
   } else if(current && legacy) message='LAB already has state, so the legacy PWA copy was left untouched.';
 }catch(_){message='Browser storage could not be migrated here; nothing was deleted.';}
 document.getElementById('status').textContent=message;
 if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
 setTimeout(()=>{ if(!location.search.includes('stay=1')) location.replace('../new/?view=lab'); },2200);
})();
</script></body></html>
