<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8Z Trip Optimizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* --- RESET & BASICS --- */
    :root {
      --bg-body: #0f172a;       /* Deep Navy */
      --bg-card: #1e293b;       /* Slate Blue */
      --bg-input: #020617;      /* Almost Black */
      --text-main: #f8fafc;     /* White */
      --text-muted: #94a3b8;    /* Grey */
      --accent: #3b82f6;        /* Bright Blue */
      --accent-hover: #2563eb;
      --danger: #ef4444;        /* Red for Driving */
      --success: #10b981;       /* Green for Stats */
      --border: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 16px; /* Prevents iOS auto-zoom on inputs */
      padding-bottom: 120px; /* Space for bottom AI dock */
    }

    /* --- LAYOUT UTILITIES --- */
    .container {
      max-width: 600px; /* Mobile width focused */
      margin: 0 auto;
      padding: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    h2, h3 { margin: 0; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }

    /* --- HEADER --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 10px;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .brand span { color: var(--accent); }
    .nav-links button {
      background: none; border: none; color: var(--accent); font-size: 0.9rem; font-weight: 500; margin-left: 10px; cursor: pointer;
    }

    /* --- INPUTS --- */
    input[type="text"], textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    
    textarea { min-height: 140px; resize: vertical; margin-bottom: 12px; }

    /* --- BUTTONS --- */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    
    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }

    .btn-primary { background: var(--accent); color: white; width: 100%; }
    .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); width: 100%; }
    .btn-neutral { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); }
    
    .btn-mode { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); }
    .btn-mode.active { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-mode.secondary { /* Walking */ } 
    /* JS toggles class 'active' on walking/driving buttons */

    /* --- TREE LIBRARY --- */
    .tree-box {
      max-height: 180px;
      overflow-y: auto;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 12px;
    }
    .tree-node { margin-bottom: 4px; }
    .tree-header { cursor: pointer; padding: 4px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
    .tree-header:hover { color: var(--text-main); }
    .tree-group { padding-left: 16px; display: none; }
    .tree-group.open { display: block; }
    .tree-item { display: block; padding: 6px; cursor: pointer; color: var(--accent); font-size: 0.9rem; }
    .tree-item:hover { text-decoration: underline; }

    /* --- OPTIONS --- */
    .options-row {
      display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; font-size: 0.9rem; color: var(--text-muted);
    }
    label { display: flex; align-items: center; gap: 6px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

    /* --- STATS & MAP --- */
    .stats-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; }
    .stat-val { color: var(--text-main); font-weight: 700; }
    .stat-saved { color: var(--success); }

    #mapContainer {
      height: 250px;
      background: var(--bg-input);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
    }
    #mapPlaceholder {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted);
    }
    #map { width: 100%; height: 100%; }

    #routeList {
      list-style: none; padding: 0; margin: 0; font-size: 0.9rem; color: var(--text-muted);
      max-height: 150px; overflow-y: auto;
    }
    #routeList li { padding: 4px 0; border-bottom: 1px solid #334155; }

    /* --- AI BOTTOM DOCK (The "Chat") --- */
    #chatPanel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--accent);
      z-index: 999;
      display: flex; flex-direction: column;
      height: 60px; /* Collapsed height */
      transition: height 0.3s ease;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    #chatPanel.open { height: 60vh; } /* Expanded height */

    .chat-header {
      padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
      background: rgba(59, 130, 246, 0.1);
    }
    .chat-title { font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    
    #chatHistory {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: none; /* Hidden when collapsed */
      background: var(--bg-body);
    }
    #chatPanel.open #chatHistory { display: block; }

    .chat-msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; }
    .chat-msg.user { background: var(--border); color: var(--text-main); align-self: flex-end; margin-left: 20px; }
    .chat-msg.ai { background: rgba(59, 130, 246, 0.2); color: #bfdbfe; margin-right: 20px; }

    .chat-input-area {
      padding: 10px;
      background: var(--bg-card);
      display: flex; gap: 10px;
    }
    #chatInput { background: var(--bg-input); border: 1px solid var(--border); padding: 10px; border-radius: 20px; flex: 1; }
    #btnSendChat { width: 45px; background: var(--accent); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* --- HELP MODAL --- */
    #helpOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
      display: none; align-items: center; justify-content: center;
    }
    .modal-box {
      background: var(--bg-card); width: 90%; max-width: 500px; max-height: 80vh;
      overflow-y: auto; padding: 20px; border-radius: 12px; border: 1px solid var(--border);
    }
    .close-modal { float: right; background: none; color: var(--text-muted); font-size: 1.5rem; padding: 0; }

    /* --- DESKTOP TWEAK --- */
    @media (min-width: 800px) {
      .container { max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .card { height: 100%; }
      #chatPanel { position: relative; width: 100%; height: 400px; border-radius: 12px; border: 1px solid var(--border); }
      #chatPanel.open { height: 400px; }
      #chatHistory { display: block; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <div class="brand">8Z <span>Optimizer</span></div>
      <div class="nav-links">
        <button id="btnPlanWithAI">Plan w/ AI</button>
        <button id="btnAbout">About</button>
        <button id="btnHelp">Help</button>
      </div>
    </header>

    <div class="left-column">
      
      <div class="card">
        <h3>Plan Your Trip</h3>
        
        <input type="text" id="tripSearch" placeholder="Search saved trips..." style="margin-bottom:8px;">
        <div id="presetTree" class="tree-box">
          <div style="padding:10px; color:#64748b;">Loading library...</div>
        </div>

        <textarea id="input" placeholder="Enter stops here (e.g. Paris, London)..." spellcheck="false"></textarea>
        
        <div class="btn-grid">
          <button id="btnSave" class="btn-neutral">💾 Save</button>
          <button id="btnLoad" class="btn-neutral">📂 Load</button>
          <input type="file" id="fileLoader" hidden>
        </div>

        <div class="btn-grid">
          <button id="btnStandard" class="btn-primary">Optimize (Fast)</button>
          <button id="btnDeep" class="btn-secondary">Optimize (Deep)</button>
        </div>

        <div class="btn-grid">
          <button id="btnDriving" class="btn-mode active">🚗 Driving</button>
          <button id="btnWalking" class="btn-mode">🚶 Walking</button>
        </div>

        <div class="options-row">
          <label><input type="checkbox" id="chkRoundTrip" checked> Round Trip</label>
          <label><input type="checkbox" id="chkDirect"> Direct Line</label>
          <input type="checkbox" id="chkGoogleStyle" style="display:none;">
          <button id="btnCollapse" style="display:none;"></button>
          <button id="btnExpand" style="display:none;"></button>
        </div>
      </div>
    </div>

    <div class="right-column">
      
      <div class="card">
        <h3>Results</h3>
        
        <div class="stats-row">
          <div>Dist: <span id="distKm" class="stat-val">—</span></div>
          <div>Saved: <span id="savedKm" class="stat-saved">—</span></div>
        </div>

        <div id="mapContainer">
          <div id="mapPlaceholder">
            <p>Map Inactive</p>
            <button id="btnEnableMap" class="btn-primary" style="width:auto;">Load Map</button>
          </div>
          <div id="map"></div>
        </div>

        <ul id="routeList"></ul>
        <div id="links" style="margin-top:10px;"></div>
      </div>

    </div>

  </div>

  <div id="chatPanel">
    <div class="chat-header" onclick="this.parentElement.classList.toggle('open')">
      <div class="chat-title">✨ Gemini Assistant <small style="margin-left:10px; font-weight:400; opacity:0.7;">(Tap to Open)</small></div>
      <div style="display:none;">
        <select id="modelSelector"></select>
        <button id="btnCloseChat"></button>
        <button id="btnChatToggle"></button>
      </div>
    </div>
    
    <div id="chatHistory">
      <div class="chat-msg ai"><strong>Gemini:</strong> Hello! Ask me to "Add stops in Morocco".</div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Message Gemini...">
      <button id="btnSendChat">➤</button>
    </div>
  </div>

  <div id="helpOverlay">
    <div class="modal-box">
      <button id="btnCloseHelp" class="close-modal">×</button>
      <div id="helpBody"></div>
    </div>
  </div>

  <script src="trips.js"></script>
  <script src="app.js"></script>

</body>
</html>
