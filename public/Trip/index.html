<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trip Optimizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo-group">
        <div class="logo">8Z</div>
        <div class="titles">
          <h1>Trip Optimizer</h1>
          <small>Bojan Dobrečević</small>
        </div>
      </div>
      <nav>
        <button id="btnPlanWithAI" class="nav-link active">Plan with AI</button>
        <span class="divider">|</span>
        <button id="btnAbout" class="nav-link">About</button>
        <span class="divider">|</span>
        <button id="btnHelp" class="nav-link">Help</button>
      </nav>
    </div>
  </header>

  <main class="main-container">

    <div class="card">
      <div class="card-header">
        <h3>PLAN YOUR TRIP</h3>
        <button id="btnCollapse" style="display:none;"></button> 
      </div>

      <div class="card-body">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="tripSearch" placeholder="Search trips..." autocomplete="off">
        </div>

        <div id="presetTree" class="tree-container custom-scrollbar">
          </div>

        <p class="instruction-text">Select a trip above or <a href="#" id="linkHelp">see help</a>.</p>

        <textarea id="input" placeholder="Enter stops here..." spellcheck="false"></textarea>
        
        <div class="actions-grid">
          <div class="row-half">
            <button id="btnSave" class="btn-outline">💾 Save</button>
            <button id="btnLoad" class="btn-outline">📂 Load</button>
            <input type="file" id="fileLoader" hidden>
          </div>

          <div class="row-half">
            <button id="btnStandard" class="btn-primary">Optimize (Standard)</button>
            <button id="btnDeep" class="btn-primary-outline">Optimize (Precise)</button>
          </div>

          <div class="row-half">
            <button id="btnDriving" class="btn-mode active">🚗 Driving</button>
            <button id="btnWalking" class="btn-mode">🚶 Walking</button>
          </div>
        </div>

        <div class="options-row">
          <label class="chk-container">
            <input type="checkbox" id="chkRoundTrip" checked> 
            <span class="checkmark"></span> Round trip
          </label>
          <label class="chk-container">
            <input type="checkbox" id="chkDirect"> 
            <span class="checkmark"></span> Direct lines
          </label>
          <label class="chk-container">
            <input type="checkbox" id="chkGoogleStyle"> 
            <span class="checkmark"></span> Google Style
          </label>
        </div>
      </div>
    </div>

    <div class="card stats-card">
      <div class="card-header">
        <h3>ROUTE STATS</h3>
      </div>
      <div class="stats-grid">
        <div class="stat-box">
          <label>Distance</label>
          <span id="distKm" class="stat-value">—</span>
        </div>
        <div class="stat-box">
          <label>Saved</label>
          <span id="savedKm" class="stat-value">—</span>
        </div>
      </div>
      <div style="display:none;">
        <ul id="routeList"></ul>
        <div id="links"></div>
      </div>
    </div>

    <div id="mapContainer" class="map-wrapper" style="display:none; margin-top: 20px; height: 300px; border-radius: 8px; overflow:hidden;">
        <div id="map" style="width:100%; height:100%;"></div>
        <button id="btnEnableMap" style="display:none;">Enable Map</button> </div>

  </main>

  <div id="chatPanel" class="ai-panel">
    <div class="ai-header">
      <div class="ai-title">
        <span class="sparkle">✨</span> AI Travel Assistant
      </div>
      <button id="btnCloseChat" class="btn-close-ai">Close ×</button>
    </div>
    
    <div class="ai-controls">
      <label>Model:</label>
      <select id="modelSelector"></select>
    </div>

    <div id="chatHistory" class="ai-history custom-scrollbar">
      </div>

    <div class="ai-input-row">
      <button id="btnChatToggle" style="display:none;">Toggle</button> <input type="text" id="chatInput" placeholder="Ask Gemini to find places...">
      <button id="btnSendChat" class="btn-send">Send ➤</button>
    </div>
  </div>

  <div id="helpOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <button id="btnCloseHelp" class="modal-close">×</button>
      <div id="helpBody"></div>
    </div>
  </div>

  <script src="trips.js"></script> 
  <script src="app.js"></script>

</body>
</html>
