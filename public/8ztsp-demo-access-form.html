<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>8zTSP demo: access requests</title>
</head>
<body>
<!-- Hidden Netlify form for BD's e-mail notification of access requests to the protected demo /8zTSP/.
     The lock page posts here after /api/8ztsp-demo-access has stored the request (that record is the authoritative one). -->
<form name="8ztsp-demo-access" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="8ztsp-demo-access">
  <input type="hidden" name="subject" value="8zTSP demo: access request">
  <p><label>Do not fill this out: <input name="bot-field"></label></p>
  <input type="email" name="email">
  <textarea name="why"></textarea>
  <input type="text" name="received_at">
  <input type="text" name="ip">
  <input type="text" name="location">
  <input type="text" name="user_agent">
  <input type="text" name="language">
  <input type="text" name="timezone">
  <input type="text" name="referrer">
  <input type="text" name="page">
  <input type="text" name="request_id">
</form>
</body>
</html>
