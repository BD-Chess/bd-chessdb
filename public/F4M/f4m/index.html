<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1422"><title>Flip4M — glavna igra</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1422}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.switch{position:fixed;z-index:9999;right:14px;top:12px;padding:8px 11px;border-radius:999px;background:#101b2aee;color:#edf2f6;border:1px solid #42566d;font:600 12px/1.1 system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px #0006;backdrop-filter:blur(8px)}.switch:hover{border-color:#8ce3cf;color:#8ce3cf}@media(max-width:520px){.switch{top:auto;bottom:12px;right:10px;font-size:11px;padding:7px 10px}}</style></head><body><iframe id="game" src="app/" title="Flip4M"></iframe><a class="switch" href="/f4m/old/" title="Odpri staro različico / Open legacy version">↔ Stara / Old</a><script>const f=document.getElementById('game');f.addEventListener('load',()=>{try{const d=f.contentDocument,links=[...d.querySelectorAll('.topbar nav a')];const x=links.find(a=>a.getAttribute('href')==='/f4m/new/');if(x){x.href='/f4m/old/';x.removeAttribute('data-i18n');x.textContent='↔ Stara / Old';}const p=d.querySelector('[data-i18n="longThinkNote"]');if(p){p.removeAttribute('data-i18n');p.textContent='Velemojster/Grandmaster: do 60 s; Prvak/Champion: do 120 s. Zgodnje in enostavne pozicije dobijo manj časa; kompleksne lahko porabijo celoten maksimum.';}}catch(_){}});</script></body></html>
