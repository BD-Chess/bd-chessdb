<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#11251d">
  <title>ChessBest APP · iPhone preview</title>
  <script>
    (() => {
      const ua = navigator.userAgent || '';
      const phoneBrowser = navigator.userAgentData?.mobile === true ||
        /iPhone|iPod|Windows Phone|Android.+Mobile|Mobile.+Safari/i.test(ua);
      if (phoneBrowser) document.documentElement.classList.add('app-phone-browser');
    })();
  </script>
  <style id="bd-version-style">
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #101a16; color: #e7f4ec; }
    header { max-width: 1180px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: center; column-gap: 42px; row-gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
    .header-tools { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .bd-version-selector { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; letter-spacing: .06em; }
    .bd-version-selector a { display: inline-flex; align-items: center; min-height: 44px; padding: 3px 8px; color: #b5c9bb; text-decoration: none; border: 1px solid transparent; border-radius: 6px; }
    .bd-version-selector a:hover, .bd-version-selector a:focus-visible { color: white; border-color: #69977e; }
    .bd-version-selector a[aria-current="page"] { color: #bdf6ce; background: #16382b; border-color: #48765d; }
    .bd-version-dot { color: #819b8b; }
    main { display: flex; flex: 1 1 auto; flex-direction: column; align-items: center; justify-content: center; padding: 16px 16px 32px; }
    .preview-width { display: flex; align-items: center; gap: 8px; margin-left: 8px; color: #adc2b5; font-size: 12px; white-space: nowrap; }
    .preview-width select { min-height: 40px; border: 1px solid #53725e; border-radius: 8px; color: #e7f4ec; background: #1c3428; padding: 7px 9px; font: inherit; }
    .phone-frame { width: calc(var(--phone-width, 390px) + 12px); max-width: 100%; padding: 6px; background: #010705; border: 1px solid #59735f; border-radius: 32px; box-shadow: 0 18px 60px #0008; }
    iframe { display: block; width: 100%; height: clamp(500px, calc(100dvh - 170px), 874px); border: 0; border-radius: 26px; background: #101a16; }
    @media (max-width: 480px) {
      header { padding: 12px 10px; justify-content: center; }
      .header-tools { justify-content: center; gap: 10px 14px; }
      .preview-width { margin-left: 0; }
      main { padding: 0 8px 24px; }
    }
    .app-phone-browser body { min-height: 100dvh; background: #101a16; overflow: hidden; }
    .app-phone-browser body > header { display: none !important; }
    .app-phone-browser main { display: block; width: 100%; height: 100dvh; padding: 0; }
    .app-phone-browser .phone-frame {
      width: 100vw; max-width: none; height: 100dvh; padding: 0;
      border: 0; border-radius: 0; box-shadow: none; background: #101a16;
    }
    .app-phone-browser iframe { width: 100%; height: 100dvh; border-radius: 0; }
  </style>
</head>
<body>
  <header>
    <h1>ChessBest · APP preview</h1>
    <div class="header-tools">
      <nav class="bd-version-selector" aria-label="Application versions">
        <a href="../">CURRENT</a><span class="bd-version-dot" aria-hidden="true">·</span>
        <a href="../old/">PREVIOUS</a><span class="bd-version-dot" aria-hidden="true">·</span>
        <a href="../new/">LAB</a><span class="bd-version-dot" aria-hidden="true">·</span>
        <a href="./" aria-current="page">APP</a>
      </nav>
      <label class="preview-width">Preview width <select id="previewWidth" aria-label="Preview width">
        <option value="375">375 px</option><option value="390" selected>390 px</option>
        <option value="402">402 px</option><option value="430">430 px</option>
      </select></label>
    </div>
  </header>
  <main>
    <div class="phone-frame" id="phoneFrame">
      <iframe src="play.html?embedded=1&amp;build=20260929-ui5" title="ChessBest APP mobile interface" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </main>
  <script>
    document.getElementById('previewWidth').addEventListener('change', event => {
      document.getElementById('phoneFrame').style.setProperty('--phone-width', event.target.value + 'px');
    });
  </script>
</body>
</html>
