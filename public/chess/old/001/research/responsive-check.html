<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess responsive check</title>
<style>body{margin:12px;background:#e7eae5;font:14px system-ui}nav{display:flex;gap:12px;margin-bottom:12px}iframe{display:block;border:1px solid #888;background:#151a19}</style>
<nav><a href="?width=390">Phone 390</a><a href="?width=768">Tablet 768</a><a href="?width=1280">Desktop 1280</a><a href="?width=1536&height=900">HD with scaling</a><a href="?width=1920&height=1000">Full HD</a><a href="?width=3840&height=2000">4K</a><a href="../">Open board</a></nav>
<iframe title="Chess responsive viewport" src="../"></iframe>
<script>
  const params=new URLSearchParams(location.search);
  const requested=Number(params.get('width')), requestedHeight=Number(params.get('height'));
  const width=[390,768,1280,1366,1536,1920,2560,3840].includes(requested)?requested:390;
  const height=[700,768,844,900,1000,1024,1080,1400,2000,2160].includes(requestedHeight)?requestedHeight:width===390?844:width===768?1024:900;
  const frame=document.querySelector('iframe');
  frame.style.width=width+'px';frame.style.height=height+'px';
</script>
</html>
