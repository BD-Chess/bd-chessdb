<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>8Z Shield access log</title>
</head>
<body>
<form name="shield-access" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="shield-access">
  <p><label>Do not fill this out: <input name="bot-field"></label></p>
  <input type="email" name="email">
  <input type="text" name="accessed_at">
  <input type="text" name="ip">
  <input type="text" name="page">
  <input type="text" name="user_agent">
</form>
<p>8Z Shield access logging endpoint.</p>
</body>
</html>
