<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8Z Project — File Manager</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#08090d;--surface:#0f1117;--card:#13151d;--card-hover:#181b25;
  --border:#1e2130;--border-hi:#2a2e42;--text:#b8bcc8;--text-dim:#5e6275;
  --text-bright:#e4e6ee;--white:#f4f5f8;
  --audio:#f472b6;--flac:#f97316;--dna:#818cf8;--fasta:#34d399;
  --data:#fbbf24;--shared:#60a5fa;--dupe:#ef4444;--old-c:#6b7280;
  --green:#34d399;--dupe-bg:rgba(239,68,68,.06);--dupe-bd:rgba(239,68,68,.20);
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;line-height:1.55}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 15% 15%,rgba(244,114,182,.012) 0%,transparent 50%),radial-gradient(circle at 85% 85%,rgba(96,165,250,.012) 0%,transparent 50%)}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 5rem;position:relative;z-index:1}
header{text-align:center;padding:2.5rem 0 1.5rem}
header h1{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--white);letter-spacing:-.5px;margin-bottom:6px}
header h1 .a{color:var(--audio)} header h1 .b{color:var(--flac)}
header .sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:1.2rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;text-align:center}
.stat .num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700}
.stat .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
.alert-box{background:var(--dupe-bg);border:1px solid var(--dupe-bd);border-radius:var(--r);padding:14px 18px;margin-bottom:1.2rem}
.alert-box h3{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dupe);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.dupe-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;align-items:center}
.dupe-name{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;background:rgba(239,68,68,.08);border-radius:4px;color:var(--text)}
.dupe-eq{color:var(--dupe);font-size:11px;font-weight:600}
.alert-note{font-size:11.5px;color:var(--text-dim);margin-top:8px;line-height:1.5}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.toolbar .search{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--text-bright);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.toolbar .search:focus{border-color:var(--audio)} .toolbar .search::placeholder{color:var(--text-dim)}
.toggle-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);cursor:pointer;user-select:none;font-family:'JetBrains Mono',monospace}
.toggle-wrap input{display:none}
.toggle-track{width:32px;height:17px;background:var(--border);border-radius:9px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:var(--text-dim);border-radius:50%;transition:all .2s}
.toggle-wrap input:checked+.toggle-track{background:var(--audio)}
.toggle-wrap input:checked+.toggle-track::after{left:17px;background:var(--white)}
.tbtn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 11px;border-radius:20px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;transition:all .15s;user-select:none}
.tbtn:hover{border-color:var(--border-hi);background:var(--card-hover)}
.font-ctrl{display:flex;align-items:center;gap:0;margin-left:auto;border:1px solid var(--border);border-radius:20px;overflow:hidden}
.fbtn{background:var(--bg);border:none;color:var(--text-bright);width:30px;height:28px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;transition:all .12s;display:flex;align-items:center;justify-content:center}
.fbtn:hover{background:var(--card-hover);color:var(--white)}
.fbtn:active{background:var(--audio);color:var(--white)}
.flbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);min-width:32px;text-align:center;user-select:none}
.category{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.category:hover{border-color:var(--border-hi)}
.cat-header{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--card);cursor:pointer;user-select:none;transition:background .15s}
.cat-header:hover{background:var(--card-hover)}
.cat-header .arrow{font-size:10px;color:var(--text-dim);transition:transform .2s;width:14px;text-align:center}
.category.open .cat-header .arrow{transform:rotate(90deg)}
.cat-header .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-header .cat-name{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--text-bright);flex:1}
.cat-header .cat-count{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--text-dim)}
.cat-header .cat-size{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);min-width:55px;text-align:right}
.cat-body{display:none;background:var(--surface)} .category.open .cat-body{display:block}
.file-row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:6px 16px;border-top:1px solid rgba(255,255,255,.02);transition:background .1s}
.file-row:hover{background:var(--card-hover)}
.file-pip{width:4px;height:16px;border-radius:2px}
.file-info{min-width:0}
.file-name{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-bright);word-break:break-all}
.file-desc{font-size:11px;color:var(--text-dim);margin-top:1px;display:none;line-height:1.4}
.show-desc .file-desc{display:block}
.file-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.file-size{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-align:right;min-width:55px}
.file-type{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.04);color:var(--text-dim)}
.file-row.dim{opacity:.4} .file-row.old-dim{opacity:.6}
.badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;padding:1px 7px;border-radius:10px;letter-spacing:.3px;white-space:nowrap}
.badge-dupe{background:var(--dupe-bg);border:1px solid var(--dupe-bd);color:var(--dupe)}
.badge-old{background:rgba(107,114,128,.08);border:1px solid rgba(107,114,128,.20);color:var(--old-c)}
.badge-active{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.20);color:var(--green)}
.badge-start{background:rgba(244,114,182,.10);border:1px solid rgba(244,114,182,.25);color:var(--audio)}
.badge-empty{background:var(--dupe-bg);border:1px solid var(--dupe-bd);color:var(--dupe)}
.footer{text-align:center;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{flex-direction:column}}
</style>
</head>

const CATS=[
  {id:"audio",name:"8Z Audio Codec (.8za)",color:"var(--audio)",icon:"🎵"},
  {id:"flac",name:"8za2flac — FLAC Optimization",color:"var(--flac)",icon:"🔥"},
  {id:"dna",name:"DNA / RNA Research",color:"var(--dna)",icon:"🧬"},
  {id:"fasta",name:"FASTA Compression",color:"var(--fasta)",icon:"📦"},
  {id:"data",name:"Data Files",color:"var(--data)",icon:"📊"},
  {id:"shared",name:"Shared / Infrastructure",color:"var(--shared)",icon:"⚙️"},
];

const os={};CATS.forEach(c=>os[c.id]=true);

function fS(b){if(!b)return'0 B';if(b<1024)return b+' B';const k=b/1024;return k<1024?k.toFixed(1)+' KB':(k/1024).toFixed(1)+' MB'}
function bg(s){const m={dupe:'<span class="badge badge-dupe">⚠ DUPE</span>',old:'<span class="badge badge-old">archived</span>',active:'<span class="badge badge-active">active</span>',start:'<span class="badge badge-start">★ START</span>',empty:'<span class="badge badge-empty">EMPTY</span>'};return m[s]||''}

function render(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  const io=document.getElementById('dupeToggle').checked;
  let html='';
  for(const cat of CATS){
    let ff=F.filter(f=>f.c===cat.id);
    if(q)ff=ff.filter(f=>f.f.toLowerCase().includes(q)||(f.d||'').toLowerCase().includes(q));
    if(io)ff=ff.filter(f=>f.s==='dupe'||f.s==='empty'||f.s==='old');
    if(!ff.length&&q)continue;
    const sz=ff.reduce((a,f)=>a+f.sz,0);
    const ord={start:0,active:1,undefined:2,old:3,dupe:4,empty:5};
    ff.sort((a,b)=>(ord[a.s]??2)-(ord[b.s]??2)||a.f.localeCompare(b.f));
    const dp=ff.filter(f=>f.s==='dupe').length;
    html+=`<div class="category ${os[cat.id]?'open':''}" data-cat="${cat.id}"><div class="cat-header" onclick="tC('${cat.id}')"><span class="arrow">▶</span><span class="dot" style="background:${cat.color}"></span><span class="cat-name">${cat.icon} ${cat.name}</span>${dp?'<span class="badge badge-dupe">'+dp+'</span>':''}<span class="cat-count">${ff.length}</span><span class="cat-size">${fS(sz)}</span></div><div class="cat-body">`;
    for(const f of ff){
      const dm=f.s==='dupe'||f.s==='empty'?' dim':f.s==='old'?' old-dim':'';
      html+=`<div class="file-row${dm}"><span class="file-pip" style="background:${cat.color}"></span><div class="file-info"><div class="file-name">${f.f}</div><div class="file-desc">${f.d||''}</div></div><div class="file-meta">${bg(f.s)}<span class="file-type">${f.t}</span><span class="file-size">${fS(f.sz)}</span></div></div>`;
    }
    html+=`</div></div>`;
  }
  document.getElementById('categories').innerHTML=html;

  const aD=F.filter(f=>f.s==='dupe').length,aE=F.filter(f=>f.s==='empty').length;
  const aO=F.filter(f=>f.s==='old').length,aA=F.filter(f=>f.s==='active'||f.s==='start').length;
  const tot=F.reduce((a,f)=>a+f.sz,0),dSz=F.filter(f=>f.s==='dupe').reduce((a,f)=>a+f.sz,0);

  document.getElementById('headerSub').textContent=F.length+' files · '+fS(tot)+' · February 25, 2026';
  document.getElementById('statsRow').innerHTML=`
    <div class="stat"><div class="num" style="color:var(--white)">${F.length}</div><div class="label">Total</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${aA}</div><div class="label">Active</div></div>
    <div class="stat"><div class="num" style="color:var(--old-c)">${aO}</div><div class="label">Old</div></div>
    <div class="stat"><div class="num" style="color:var(--dupe)">${aD}</div><div class="label">Dupes</div></div>
    <div class="stat"><div class="num" style="color:var(--dupe)">${aE}</div><div class="label">Empty</div></div>
    <div class="stat"><div class="num" style="color:var(--text-dim)">${fS(dSz)}</div><div class="label">Wasted</div></div>`;

  const al=document.getElementById('dupeAlert');
  if(aD||aE){
    const gr={};F.filter(f=>f.s==='dupe').forEach(f=>{if(!gr[f.g])gr[f.g]=[f.g];gr[f.g].push(f.f)});
    let ah='<h3>⚠ Cleanup Recommended</h3>';
    for(const[o,ns]of Object.entries(gr)){ah+='<div class="dupe-group">'+ns.map((n,i)=>`<span class="dupe-name">${n}</span>${i<ns.length-1?'<span class="dupe-eq">=</span>':''}`).join('')+'</div>'}
    if(aE)ah+=`<div class="alert-note"><strong>Empty (0B):</strong> ${F.filter(f=>f.s==='empty').map(f=>f.f).join(', ')}</div>`;
    ah+=`<div class="alert-note"><strong>${aD} duplicates</strong> wasting ${fS(dSz)} + <strong>${aE} empty</strong> files. Toggle "Issues only" to filter.</div>`;
    al.innerHTML=ah;al.style.display='block';
  }
}
function tC(id){os[id]=!os[id];render()}
function toggleDesc(){document.body.classList.toggle('show-desc',document.getElementById('descToggle').checked)}
function expandAll(){CATS.forEach(c=>os[c.id]=true);render()}
function collapseAll(){CATS.forEach(c=>os[c.id]=false);render()}
let zm=100;
function adjFont(d){zm=Math.max(60,Math.min(150,zm+d*10));document.querySelector('.page').style.transform='scale('+zm/100+')';document.querySelector('.page').style.transformOrigin='top center';document.getElementById('fontLbl').textContent=zm+'%'}
render();
</script>
