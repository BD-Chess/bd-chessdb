<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETRES: The Rescue Protocol (Prototype)</title>
    <style>
        body {
            background-color: #050505; /* Deep black background  */
            color: #c7f0ff;
            font-family: 'Courier New', Courier, monospace; /* Sci-fi terminal feel */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 800px;
            border: 1px solid #333;
            background: radial-gradient(circle, #1a1a2e 0%, #050505 70%);
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .neon-text {
            text-shadow: 0 0 5px #c7f0ff, 0 0 10px #00aaff;
        }
        #status-message {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            font-size: 1.2em;
            color: #ff5555;
            text-shadow: 0 0 5px #ff0000;
            height: 30px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            color: #ff5555;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #333;
            color: #c7f0ff;
            border: 1px solid #00aaff;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <div id="ui-overlay" class="neon-text">
        <div>SCORE: <span id="score">0</span> [cite: 90]</div>
        <div>WAVE: <span id="wave">1</span></div>
        <div>CORE INTEGRITY: <span id="core-hp">100</span>% [cite: 75]</div>
    </div>
    <div id="status-message"></div>
    <div id="game-over">
        <div>TRANSMISSION LOST</div>
        <div style="font-size: 0.5em; margin-top: 10px;">Earth is Unmade. [cite: 49]</div>
        <button id="restart-btn">INITIATE RESCUE PROTOCOL</button>
    </div>
</div>

<script>
// --- Configuration & Constants ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

// Game Design Parameters
const RINGS = 3; // 3 concentric rings [cite: 76]
const CELLS_PER_RING = 36; // Standardized for v1 prototype simplicity
const ANGLE_STEP = (Math.PI * 2) / CELLS_PER_RING;
// Radii setup to define inner/middle/outer rings [cite: 76, 77]
const CORE_RADIUS = 60;
const RING_WIDTH = 50;
const RADII = [
    CORE_RADIUS + RING_WIDTH,     // Inner Ring (Index 0)
    CORE_RADIUS + RING_WIDTH * 2, // Middle Ring (Index 1)
    CORE_RADIUS + RING_WIDTH * 3  // Outer Ring (Index 2)
];
const MAX_CORE_HP = 100;

// Colors (Neon Sci-Fi aesthetic [cite: 96])
const COLORS = {
    background: '#050505',
    gridLines: '#222',
    ringActive: '#00aaff', // Highlight active ring [cite: 96]
    ringInactive: '#444',
    enemy: '#ff3333', // Clear enemy visuals [cite: 96]
    ghost: 'rgba(0, 255, 0, 0.3)', // Ghost preview [cite: 96]
    invalidGhost: 'rgba(255, 0, 0, 0.3)',
    pulse: '#ffffff',
    pieceColors: [
        '#00ffff', // I - Cyan
        '#ffff00', // O - Yellow
        '#aa00ff', // T - Purple
        '#00ff00', // S - Green
        '#ff0000', // Z - Red
        '#0000ff', // J - Blue
        '#ffaa00'  // L - Orange
    ]
};

// Tetromino Definitions (standard shapes)
// Coordinates are relative (ringOffset, angleOffset)
const TETROMINOES = [
    [[0,0], [0,1], [0,2], [0,3]], // I
    [[0,0], [0,1], [1,0], [1,1]], // O
    [[0,0], [1,-1], [1,0], [1,1]], // T
    [[0,0], [0,1], [1,-1], [1,0]], // S
    [[0,0], [0,-1], [1,0], [1,1]], // Z
    [[0,0], [0,1], [0,2], [1,0]], // J
    [[0,0], [0,1], [0,2], [1,2]]  // L
];

// --- Game State ---
let gameState = {
    running: false,
    score: 0,
    wave: 1,
    coreHP: MAX_CORE_HP,
    grid: [], // 2D array: grid[ring][angleIndex] holds color index or null
    activePiece: null,
    enemies: [],
    pulseActive: false,
    pulseRadius: 0,
    statusTextTimer: null
};

// --- Input Handling ---
// Controls based on GDD document 
const keys = {};
window.addEventListener('keydown', (e) => {
    if (!gameState.running) return;
    keys[e.code] = true;

    // Immediate actions
    if (e.code === 'KeyQ') rotatePiece(-1);
    if (e.code === 'KeyE') rotatePiece(1);
    if (e.code === 'KeyW') shiftRing(-1); // Shift inner
    if (e.code === 'KeyS') shiftRing(1);  // Shift outer
    if (e.code === 'Space') attemptDock();
});
window.addEventListener('keyup', (e) => keys[e.code] = false);
document.getElementById('restart-btn').addEventListener('click', initGame);

// --- Game Logic Core ---

function initGame() {
    gameState.running = true;
    gameState.score = 0;
    gameState.wave = 1;
    gameState.coreHP = MAX_CORE_HP;
    gameState.enemies = [];
    gameState.pulseActive = false;
    document.getElementById('game-over').style.display = 'none';
    updateUI();

    // Initialize Grid (0 = empty)
    gameState.grid = Array(RINGS).fill(null)
        .map(() => Array(CELLS_PER_RING).fill(null));

    spawnPiece();
    gameLoop();
}

// The main loop handles movement and drawing
function gameLoop() {
    if (!gameState.running) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update() {
    // Continuous controls (Orbiting) 
    if (gameState.activePiece) {
        if (keys['KeyA'] || keys['ArrowLeft']) gameState.activePiece.angleIdx -= 0.3;
        if (keys['KeyD'] || keys['ArrowRight']) gameState.activePiece.angleIdx += 0.3;
        // Wrap angle indices
         gameState.activePiece.angleIdx = (gameState.activePiece.angleIdx + CELLS_PER_RING) % CELLS_PER_RING;
    }

    // Enemy Spawning & Movement [cite: 72, 85]
    if (Math.random() < 0.01 * gameState.wave && gameState.enemies.length < 5 + gameState.wave) {
        spawnEnemy();
    }
    updateEnemies();

    // Gratitude Pulse Animation & Effect [cite: 89]
    if (gameState.pulseActive) {
        gameState.pulseRadius += 15;
        // Clear enemies hit by pulse [cite: 89]
        gameState.enemies = gameState.enemies.filter(e => e.distance > gameState.pulseRadius);

        if (gameState.pulseRadius > canvas.width) {
            gameState.pulseActive = false;
        }
    }

    if (gameState.coreHP <= 0) {
        gameOver();
    }
}

// --- Piece Mechanics ---

function spawnPiece() {
    const typeIdx = Math.floor(Math.random() * TETROMINOES.length);
    gameState.activePiece = {
        shape: JSON.parse(JSON.stringify(TETROMINOES[typeIdx])), // Deep copy
        colorIdx: typeIdx,
        // Start at outer ring [cite: 70]
        baseRingIdx: RINGS - 1,
        angleIdx: 0 // Can be fractional for smooth movement
    };
}

function rotatePiece(dir) {
    // Standard 2D rotation matrix applied to relative coordinates
    gameState.activePiece.shape = gameState.activePiece.shape.map(([r, a]) => [a * dir, r * -dir]);
}

function shiftRing(dir) {
    const newRing = gameState.activePiece.baseRingIdx + dir;
    // Bounds check for rings [cite: 80]
    if (newRing >= 0 && newRing < RINGS) {
        gameState.activePiece.baseRingIdx = newRing;
    }
}

// --- Docking & Validation Rules ---

function attemptDock() {
    const integerAngleIdx = Math.round(gameState.activePiece.angleIdx) % CELLS_PER_RING;
    const cellsToOccupy = getAbsoluteCells(gameState.activePiece, integerAngleIdx);

    // Rule: Bounds Check [cite: 80]
    for (let [r, a] of cellsToOccupy) {
        if (r < 0 || r >= RINGS) {
            showStatus("Out of bounds"); // Game shows why it failed [cite: 84]
            return;
        }
    }

    // Rule: Overlap Check [cite: 81]
    for (let [r, a] of cellsToOccupy) {
        if (gameState.grid[r][a] !== null) {
            showStatus("Cells occupied"); // [cite: 84]
            return;
        }
    }

    // Rule: Support Rule (No floating islands) [cite: 82, 83]
    if (!isGridEmpty() && !hasSupport(cellsToOccupy)) {
         showStatus("Must connect to structure"); // [cite: 83, 84]
         return;
    }

    // Dock successful: Commit to grid
    for (let [r, a] of cellsToOccupy) {
        gameState.grid[r][a] = gameState.activePiece.colorIdx;
    }

    gameState.score += 100;
    checkRingCompletion();
    spawnPiece();
    updateUI();
    showStatus("Communion.", 1000, "#00ff00"); // [cite: 41]
}

// Helper: Convert relative shape coords to absolute grid coords based on current position
function getAbsoluteCells(piece, currentAngleIdx) {
    return piece.shape.map(([rOff, aOff]) => {
        let finalRing = piece.baseRingIdx + rOff;
        // Wrap angle offset and normalize
        let finalAngle = (currentAngleIdx + aOff + CELLS_PER_RING) % CELLS_PER_RING;
        return [finalRing, finalAngle];
    });
}

// Helper for Support Rule [cite: 82]
function isGridEmpty() {
    return gameState.grid.every(ring => ring.every(cell => cell === null));
}

// Helper for Support Rule [cite: 83]
function hasSupport(cells) {
    // Check neighbors for every cell in the new piece
    for (let [r, a] of cells) {
        // 1. Angular neighbors (same ring, left/right) [cite: 83]
        let left = (a - 1 + CELLS_PER_RING) % CELLS_PER_RING;
        let right = (a + 1) % CELLS_PER_RING;
        if (gameState.grid[r][left] !== null || gameState.grid[r][right] !== null) return true;

        // 2. Radial neighbors (adjacent rings at same angle) [cite: 83]
        // (Simplified because we used uniform cell counts per ring)
        if (r > 0 && gameState.grid[r - 1][a] !== null) return true; // Inner neighbor
        if (r < RINGS - 1 && gameState.grid[r + 1][a] !== null) return true; // Outer neighbor
    }
    return false;
}

// --- Ring Completion & Pulse ---

function checkRingCompletion() {
    let completedRings = 0;
    for (let r = 0; r < RINGS; r++) {
        // A ring is "complete" when all its cells are filled [cite: 87]
        if (gameState.grid[r].every(cell => cell !== null)) {
            completedRings++;
        }
    }

    if (completedRings > 0) {
         // Rewards for completion [cite: 88]
        gameState.score += completedRings * 500;
        updateUI();

        // "Gratitude Pulse": When all rings complete [cite: 89]
        // For this prototype, let's trigger it if ALL rings are full at once.
        if (completedRings === RINGS) {
             triggerPulse();
        } else {
             showStatus("Ring Stabilized. 'We heard you.'"); // [cite: 88]
        }
    }
}

function triggerPulse() {
    // Gratitude Pulse: clears enemies, resets rings so you can build again [cite: 89]
    gameState.pulseActive = true;
    gameState.pulseRadius = CORE_RADIUS;
    // Reset grid (clearing stored structure to repair/rebuild) [cite: 89]
    gameState.grid = gameState.grid.map(ring => ring.fill(null));
    gameState.score += 5000;
    gameState.wave++;
    showStatus("GRATITUDE PULSE INITIATED", 2000, "#ffffff"); // [cite: 43]
    updateUI();
}


// --- Enemies (The Unmaking) ---

function spawnEnemy() {
    // Basic "Rock" type enemy [cite: 85]
    gameState.enemies.push({
        angle: Math.random() * Math.PI * 2,
        distance: canvas.width / 2 + 50, // Spawn outside screen
        speed: 1 + (gameState.wave * 0.2) // Level scales speed [cite: 91]
    });
}

function updateEnemies() {
    for (let i = gameState.enemies.length - 1; i >= 0; i--) {
        let e = gameState.enemies[i];
        // Enemies fly inward [cite: 72]
        e.distance -= e.speed;

        // Check collisions from outer ring inwards
        let hit = false;
        for (let r = RINGS - 1; r >= 0; r--) {
            if (e.distance < RADII[r]) {
                // Map enemy angle to grid index
                let angleIdx = Math.round((e.angle / (Math.PI * 2)) * CELLS_PER_RING) % CELLS_PER_RING;
                if (gameState.grid[r][angleIdx] !== null) {
                    // Enemy damages shield cell [cite: 72]
                    // Simplified damage model for prototype: 1 hit destroys cell
                    gameState.grid[r][angleIdx] = null;
                    gameState.enemies.splice(i, 1);
                    hit = true;
                    break;
                }
            }
        }

        // If it didn't hit a shield, check core collision
        if (!hit && e.distance < CORE_RADIUS) {
            gameState.coreHP -= 10;
            gameState.enemies.splice(i, 1);
            updateUI();
            // Flash screen red
        }
    }
}


// --- Rendering ---

function draw() {
    // Clear screen
    ctx.fillStyle = COLORS.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Geometry (Rings & Core)
    drawRings();

    // 2. Draw Docked Grid Pieces
    drawGrid();

    // 3. Draw Active Piece (Ghost & Real)
    if (gameState.activePiece) {
        drawActivePiece();
    }

    // 4. Draw Enemies
    drawEnemies();

    // 5. Draw Pulse Effect
    if (gameState.pulseActive) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, gameState.pulseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = COLORS.pulse;
        ctx.lineWidth = 5;
        ctx.stroke();
    }
}

// Helper to draw a single cell arc
function drawCell(ringIdx, angleIdx, color) {
    const innerR = ringIdx === 0 ? CORE_RADIUS : RADII[ringIdx-1];
    const outerR = RADII[ringIdx];
    const startA = angleIdx * ANGLE_STEP - Math.PI/2; // -PI/2 to start at top
    const endA = startA + ANGLE_STEP;

    ctx.beginPath();
    ctx.arc(centerX, centerY, innerR, startA, endA);
    ctx.arc(centerX, centerY, outerR, endA, startA, true); // Draw backward for inner arc
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
}


function drawRings() {
    // Draw Core
    ctx.beginPath();
    ctx.arc(centerX, centerY, CORE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.strokeStyle = COLORS.ringInactive;
    ctx.stroke();

    // Draw Rings
    for (let i = 0; i < RINGS; i++) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, RADII[i], 0, Math.PI * 2);
        // Highlight active ring [cite: 96]
        ctx.strokeStyle = (gameState.activePiece && gameState.activePiece.baseRingIdx === i)
            ? COLORS.ringActive : COLORS.ringInactive;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Draw radial grid lines for context
    ctx.strokeStyle = COLORS.gridLines;
    ctx.lineWidth = 0.5;
    for(let i=0; i<CELLS_PER_RING; i++) {
        let a = i * ANGLE_STEP;
        ctx.beginPath();
        ctx.moveTo(centerX + Math.cos(a)*CORE_RADIUS, centerY + Math.sin(a)*CORE_RADIUS);
        ctx.lineTo(centerX + Math.cos(a)*RADII[RINGS-1], centerY + Math.sin(a)*RADII[RINGS-1]);
        ctx.stroke();
    }
}

function drawGrid() {
    for (let r = 0; r < RINGS; r++) {
        for (let a = 0; a < CELLS_PER_RING; a++) {
            if (gameState.grid[r][a] !== null) {
                drawCell(r, a, COLORS.pieceColors[gameState.grid[r][a]]);
            }
        }
    }
}

function drawActivePiece() {
    const integerAngle = Math.round(gameState.activePiece.angleIdx) % CELLS_PER_RING;
    const cells = getAbsoluteCells(gameState.activePiece, integerAngle);

    // Validate placement for Ghost color (green valid / red invalid) [cite: 96]
    let valid = true;
    // Bounds check
    if (cells.some(([r, a]) => r < 0 || r >= RINGS)) valid = false;
    // Overlap check
    else if (cells.some(([r, a]) => gameState.grid[r][a] !== null)) valid = false;
    // Support check
    else if (!isGridEmpty() && !hasSupport(cells)) valid = false;

    const ghostColor = valid ? COLORS.ghost : COLORS.invalidGhost;
    cells.forEach(([r, a]) => {
         // Only draw if within reasonable bounds for visualization
        if(r >=0 && r < RINGS) drawCell(r, a, ghostColor);
    });

    // Draw the actual orbiting piece (smooth movement) [cite: 71]
    // We draw this slightly differently because it moves smoothly, not just on grid snaps
    const pieceColor = COLORS.pieceColors[gameState.activePiece.colorIdx];
    gameState.activePiece.shape.forEach(([rOff, aOff]) => {
        let rIdx = gameState.activePiece.baseRingIdx + rOff;
        if(rIdx < 0 || rIdx >= RINGS) return;

        let smoothAngleIdx = gameState.activePiece.angleIdx + aOff;
        const innerR = rIdx === 0 ? CORE_RADIUS : RADII[rIdx-1];
        const outerR = RADII[rIdx];
        const startA = smoothAngleIdx * ANGLE_STEP - Math.PI/2;
        const endA = startA + ANGLE_STEP;

        ctx.beginPath();
        ctx.arc(centerX, centerY, innerR + 5, startA + 0.05, endA - 0.05); // Slightly smaller for visual clarity
        ctx.arc(centerX, centerY, outerR - 5, endA - 0.05, startA + 0.05, true);
        ctx.closePath();
        ctx.fillStyle = pieceColor;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    });
}

function drawEnemies() {
    ctx.fillStyle = COLORS.enemy;
    gameState.enemies.forEach(e => {
        // Visual for "Rock" enemy [cite: 85]
        let x = centerX + Math.cos(e.angle) * e.distance;
        let y = centerY + Math.sin(e.angle) * e.distance;
        ctx.beginPath();
        // Draw a jagged shape
        ctx.moveTo(x, y-10);
        ctx.lineTo(x+10, y);
        ctx.lineTo(x, y+10);
        ctx.lineTo(x-10, y);
        ctx.closePath();
        ctx.fill();
    });
}

// --- UI Helpers ---

function updateUI() {
    document.getElementById('score').innerText = gameState.score;
    document.getElementById('wave').innerText = gameState.wave;
    document.getElementById('core-hp').innerText = gameState.coreHP;
}

function showStatus(msg, duration = 2000, color = '#ff5555') {
    const el = document.getElementById('status-message');
    el.innerText = msg;
    el.style.color = color;
    clearTimeout(gameState.statusTextTimer);
    gameState.statusTextTimer = setTimeout(() => {
        el.innerText = '';
    }, duration);
}

function gameOver() {
    gameState.running = false;
    // Game over + archive retrieval trigger [cite: 75]
    document.getElementById('game-over').style.display = 'flex';
}

// Start game on load
initGame();

</script>
</body>
</html>
