<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nara at Port Moresby harbour during rain</title>
  <desc id="desc">A stylised night harbour with a ferry, cold-box lights, rain, and Nara in a faded blue jacket seen from behind.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101b"/>
      <stop offset=".58" stop-color="#0d2135"/>
      <stop offset="1" stop-color="#050a11"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102b42"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#386d93"/>
      <stop offset="1" stop-color="#173d5c"/>
    </linearGradient>
    <radialGradient id="goldGlow">
      <stop offset="0" stop-color="#ffd997" stop-opacity=".95"/>
      <stop offset=".32" stop-color="#f3bd6b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f3bd6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70c9ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#70c9ff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#70c9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="rain" width="60" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(13)">
      <line x1="8" y1="0" x2="8" y2="38" stroke="#c9ecff" stroke-opacity=".18" stroke-width="3"/>
      <line x1="36" y1="15" x2="36" y2="65" stroke="#c9ecff" stroke-opacity=".10" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="180" r="270" fill="url(#goldGlow)" opacity=".58"/>
  <ellipse cx="780" cy="380" rx="680" ry="110" fill="url(#mist)" filter="url(#blur)"/>
  <path d="M0 430 C260 380 430 420 650 390 C900 355 1130 395 1600 340 L1600 640 L0 640 Z" fill="#081522"/>
  <path d="M0 495 C210 460 410 492 650 460 C910 424 1200 474 1600 420" fill="none" stroke="#5b91b5" stroke-opacity=".13" stroke-width="8"/>

  <!-- ferry -->
  <g transform="translate(640 250)">
    <path d="M0 190 L645 190 L710 235 L660 390 L70 390 L0 330 Z" fill="#172634" stroke="#7392a8" stroke-opacity=".38" stroke-width="4"/>
    <path d="M75 98 H540 L610 190 H30 Z" fill="#243747"/>
    <path d="M142 25 H470 L525 98 H88 Z" fill="#1b2b39"/>
    <rect x="176" y="48" width="250" height="34" rx="8" fill="#061019"/>
    <g fill="#ffd889">
      <rect x="188" y="56" width="38" height="18" rx="3"/>
      <rect x="240" y="56" width="38" height="18" rx="3"/>
      <rect x="292" y="56" width="38" height="18" rx="3"/>
      <rect x="344" y="56" width="38" height="18" rx="3"/>
    </g>
    <rect x="120" y="205" width="240" height="135" rx="10" fill="#dce7eb" opacity=".86"/>
    <rect x="142" y="227" width="105" height="14" rx="5" fill="#0e2636" opacity=".5"/>
    <rect x="376" y="224" width="150" height="90" rx="8" fill="#253845"/>
    <rect x="402" y="238" width="68" height="46" rx="4" fill="#0a131d"/>
    <circle cx="450" cy="270" r="5" fill="#6fe0b2"/>
    <path d="M590 240 L780 334 L780 370 L572 322 Z" fill="#1e3343" stroke="#7898ac" stroke-opacity=".25" stroke-width="3"/>
    <path d="M22 390 H675" stroke="#79c6ef" stroke-opacity=".14" stroke-width="5"/>
  </g>

  <!-- quay and water -->
  <path d="M0 604 H1090 L1220 680 H1600 V1000 H0 Z" fill="#111922"/>
  <path d="M1080 604 H1600 V1000 H1160 L1230 688 Z" fill="url(#water)"/>
  <path d="M1170 685 C1300 730 1450 705 1600 750" fill="none" stroke="#6cc9ff" stroke-opacity=".16" stroke-width="10"/>
  <path d="M1200 760 C1325 800 1460 775 1600 820" fill="none" stroke="#f4bd6a" stroke-opacity=".10" stroke-width="8"/>
  <rect x="925" y="535" width="40" height="128" rx="10" fill="#0a1119"/>
  <ellipse cx="945" cy="534" rx="40" ry="16" fill="#1a2a37"/>

  <!-- cold boxes departing -->
  <g transform="translate(1240 750)">
    <path d="M0 55 Q72 12 150 54 L130 100 H18 Z" fill="#172a38" stroke="#4c7894" stroke-opacity=".45" stroke-width="3"/>
    <rect x="43" y="24" width="44" height="28" rx="4" fill="#d9e4e8"/>
    <circle cx="78" cy="34" r="7" fill="#6fe0b2"/>
  </g>
  <g transform="translate(1425 670) scale(.72)">
    <path d="M0 55 Q72 12 150 54 L130 100 H18 Z" fill="#172a38" stroke="#4c7894" stroke-opacity=".45" stroke-width="3"/>
    <rect x="43" y="24" width="44" height="28" rx="4" fill="#d9e4e8"/>
    <circle cx="78" cy="34" r="7" fill="#6fe0b2"/>
  </g>

  <!-- Nara, viewed from behind / side -->
  <g transform="translate(250 465)">
    <ellipse cx="150" cy="465" rx="155" ry="35" fill="#000" opacity=".32" filter="url(#soft)"/>
    <path d="M112 95 C96 130 92 170 98 214 L70 438 C104 460 166 462 205 438 L198 204 C205 157 194 121 171 92 Z" fill="url(#jacket)" stroke="#7fb6d8" stroke-opacity=".25" stroke-width="4"/>
    <path d="M100 198 C58 260 50 350 66 425" fill="none" stroke="#244f70" stroke-width="40" stroke-linecap="round"/>
    <path d="M196 196 C232 268 235 349 211 428" fill="none" stroke="#244f70" stroke-width="38" stroke-linecap="round"/>
    <path d="M87 433 L55 520" stroke="#1b2d3b" stroke-width="42" stroke-linecap="round"/>
    <path d="M190 435 L215 520" stroke="#1b2d3b" stroke-width="42" stroke-linecap="round"/>
    <circle cx="145" cy="58" r="57" fill="#4d2c22"/>
    <path d="M91 57 C92 12 128 -8 165 4 C193 13 207 41 201 78 C179 54 144 45 91 57 Z" fill="#15191c"/>
    <path d="M117 91 C132 110 158 112 177 90" fill="none" stroke="#3b211b" stroke-width="9" stroke-linecap="round"/>
    <path d="M96 150 Q145 184 199 150" fill="none" stroke="#85b6d4" stroke-opacity=".24" stroke-width="4"/>
    <circle cx="230" cy="415" r="9" fill="none" stroke="#d9e7ee" stroke-width="5"/>
    <circle cx="231" cy="416" r="44" fill="url(#goldGlow)" opacity=".42"/>
  </g>

  <!-- relational geometry / subtle field -->
  <g fill="none" stroke="#f4bd6a" stroke-opacity=".16" stroke-width="2">
    <path d="M460 610 C690 530 920 530 1180 390"/>
    <path d="M455 650 C760 650 1000 560 1320 770"/>
    <path d="M500 560 C780 410 1020 430 1280 540"/>
  </g>
  <g fill="#f4bd6a">
    <circle cx="462" cy="611" r="5" opacity=".55"/>
    <circle cx="1180" cy="390" r="5" opacity=".48"/>
    <circle cx="1320" cy="770" r="5" opacity=".48"/>
    <circle cx="1280" cy="540" r="5" opacity=".42"/>
  </g>

  <rect width="1600" height="1000" fill="url(#rain)"/>
  <rect y="920" width="1600" height="80" fill="url(#mist)" opacity=".18"/>
</svg>
