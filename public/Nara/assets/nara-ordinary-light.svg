<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary Light at Wharf Three</title>
  <desc id="desc">A dark ferry at a rainy port, a red cold-chain alarm, a green route of rescue lights, and one restrained line of warm gold light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a11"/><stop offset=".55" stop-color="#10253a"/><stop offset="1" stop-color="#061019"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12344d"/><stop offset="1" stop-color="#05090f"/></linearGradient>
    <radialGradient id="warm"><stop stop-color="#ffe4ae"/><stop offset=".3" stop-color="#f4bd6a" stop-opacity=".42"/><stop offset="1" stop-color="#f4bd6a" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="rain" width="48" height="62" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><line x1="9" y1="0" x2="9" y2="42" stroke="#d4efff" stroke-opacity=".13" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <ellipse cx="1060" cy="180" rx="420" ry="210" fill="url(#warm)" opacity=".34"/>
  <path d="M0 520 H980 L1100 610 H1600 V800 H0 Z" fill="#111a23"/>
  <path d="M1040 520 H1600 V800 H1140 L1080 610 Z" fill="url(#sea)"/>
  <g transform="translate(310 160)">
    <path d="M0 170 H720 L790 220 L740 420 H60 L0 350 Z" fill="#172734" stroke="#7392a8" stroke-opacity=".33" stroke-width="4"/>
    <path d="M110 70 H570 L650 170 H40 Z" fill="#273b4a"/>
    <rect x="160" y="205" width="250" height="145" rx="12" fill="#dfe8ea" opacity=".84"/>
    <rect x="195" y="238" width="102" height="12" rx="4" fill="#193244" opacity=".55"/>
    <rect x="335" y="229" width="12" height="12" rx="3" fill="#ff5f70"/>
    <path d="M650 250 L930 380 L930 420 L626 326 Z" fill="#1f3546"/>
    <rect x="165" y="104" width="330" height="34" rx="7" fill="#071019"/>
    <g fill="#ffd993"><rect x="180" y="111" width="42" height="19" rx="3"/><rect x="236" y="111" width="42" height="19" rx="3"/><rect x="292" y="111" width="42" height="19" rx="3"/><rect x="348" y="111" width="42" height="19" rx="3"/></g>
  </g>
  <path d="M1040 620 C1190 650 1310 630 1600 700" fill="none" stroke="#61dcae" stroke-opacity=".26" stroke-width="7"/>
  <g fill="#6fe0b2"><circle cx="1160" cy="642" r="7"/><circle cx="1300" cy="656" r="6"/><circle cx="1450" cy="684" r="5"/></g>
  <path d="M310 650 C540 590 810 530 1030 320" fill="none" stroke="#f4bd6a" stroke-opacity=".28" stroke-width="3"/>
  <circle cx="310" cy="650" r="80" fill="url(#warm)" opacity=".45"/>
  <rect width="1600" height="800" fill="url(#rain)"/>
</svg>
