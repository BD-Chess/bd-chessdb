<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NCI Mirror Statistics - Dark Theme with Numbers</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        /* Dark Theme Color Palette */
        :root {
            --bg-body: #121212;      
            --bg-card: #1e1e1e;      
            --text-main: #e0e0e0;    
            --card-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .chart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .chart-box {
            width: 45%;
            min-width: 300px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        h3 {
            text-align: center;
            color: var(--text-main);
            margin-top: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <div class="chart-box">
            <h3>Distribution by File Count</h3>
            <canvas id="countChart"></canvas>
        </div>
        
        <div class="chart-box">
            <h3>Storage Footprint</h3>
            <canvas id="sizeChart"></canvas>
        </div>
    </div>

    <script>
        // 1. Register the DataLabels plugin globally
        Chart.register(ChartDataLabels);

        // 2. Set global Chart.js defaults for Dark Theme
        Chart.defaults.color = '#aaaaaa'; 
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)'; 

        // 3. Data extracted from the analysis report
        const labels = ['Documents', 'Images', 'HTML Pages', 'Audio/Video', 'Other', 'Web Assets'];
        const counts = [534, 1252, 1022, 6, 17, 155];
        const sizesMB = [974.83, 26.29, 19.29, 17.31, 6.35, 0.97]; 
        
        const bgColors = [
            '#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
        ];

        // 4. Render the Count Doughnut Chart
        const ctxCount = document.getElementById('countChart').getContext('2d');
        new Chart(ctxCount, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: counts,
                    backgroundColor: bgColors,
                    borderColor: '#1e1e1e', 
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { 
                        position: 'bottom',
                        labels: { color: '#e0e0e0' }
                    },
                    // Configure numbers on the pie chart
                    datalabels: {
                        color: '#ffffff',
                        font: { weight: 'bold', size: 12 },
                        formatter: (value) => {
                            // Hide labels for tiny slices so they don't overlap
                            return value > 20 ? value : '';
                        }
                    }
                }
            }
        });

        // 5. Render the Size Bar Chart
        const ctxSize = document.getElementById('sizeChart').getContext('2d');
        new Chart(ctxSize, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Size (MB)',
                    data: sizesMB,
                    backgroundColor: '#36A2EB',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                layout: {
                    padding: { top: 20 } // Add padding so top labels don't get cut off
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        type: 'logarithmic',
                        title: {
                            display: true,
                            text: 'Megabytes (Log Scale)',
                            color: '#e0e0e0'
                        },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    x: {
                        grid: { display: false } 
                    }
                },
                plugins: {
                    legend: { display: false },
                    // Configure numbers on the bar chart
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#e0e0e0',
                        font: { weight: 'bold', size: 11 },
                        formatter: (value) => value + ' MB'
                    }
                }
            }
        });
    </script>

</body>
</html>
