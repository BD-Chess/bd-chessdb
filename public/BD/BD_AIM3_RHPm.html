e Wissensschubladen empfehlen. Full RHP für komplexes Brainstorming, Architektur, Forschung oder mehrperspektivische Synthese empfehlen. RHPr + RHP nutzen, wenn beides gebraucht wird. Nur eine kurze Frage stellen, wenn die Wahl den finalen Prompt wesentlich verändert.","step01h":"Intent-Split","step01p":"Explizite Anfrage, implizites Ziel, echtes Deliverable, Zielgruppe, fehlenden Kontext und Nutzenkriterien neu formulieren.","step02h":"Mini-Linsenlauf","step02pHtml":"Fünf praktische Linsen nutzen: <span class=\"pill\">Builder</span><span class=\"pill\">Skeptic</span><span class=\"pill\">Simple Human</span><span class=\"pill\">Mapmaker</span><span class=\"pill\">Empiricist</span>. Jede Linse muss nicht-duplizierenden Wert liefern.","step03h":"Anti-lock Retrieval","step03p":"Aktive Wissensschubladen, fehlende Schubladen, gefährliche Annahmen und 2–3 erzwungene Linsen für den finalen Prompt auflisten.","step04h":"Prompt-Synthese","step04p":"Den finalen Session-Prompt mit Rolle, Ziel, Kontext, Dateien, Grenzen, Deliverables, Workflow, Checks, Stop-Bedingungen und Nicht-tun-Regeln schreiben.","step05h":"Agent-0-Check","step05p":"Vor dem Abschluss prüfen: ist es testbar, begrenzt, wiederaufnehmbar, nicht aufgebläht und ehrlich über Provenienz?","step06h":"Skill-Extraktion","step06p":"Wenn die Aufgabe schwer oder wiederholt ist, eine kompakte Skill Card erstellen: Name, wann nutzen, Inputs, Schritte, Validierung, Failure Modes und Version.","masterTitle":"Copy-Paste-Master-Prompt","masterIntro":"Nutze dies für die einfache Master-Version. Fülle die zwei Felder aus und kopiere einen kombinierten Promptblock für eine frische LLM-Session.","escalationTitle":"Eskalations-Gate","escalationTextHtml":"Der kopierte Prompt fordert das nächste Modell auf, das kleinste passende Protokoll zu wählen: standardmäßig bei <strong>RHPm</strong> bleiben, <strong>full RHPr</strong> für komplexes Prompting/Retrieval-Bias-Arbeit empfehlen, <strong>full RHP</strong> für komplexes Brainstorming und mehrperspektivische Architektur empfehlen oder beides nutzen, wenn beides nötig ist.","ariaMasterTop":"Obere Master-Prompt-Aktionen","btnCopyPrompt":"Prompt kopieren","btnPaste":"Einfügen","btnEmpty":"Leeren","titlePaste":"Zwischenablage in das fokussierte Feld einfügen oder standardmäßig in die menschliche Anfrage.","labelMasterRequest":"Menschliche Anfrage hier einfügen","phMasterRequest":"Rohe menschliche Anfrage hier einfügen.","labelMasterContext":"Kontext hier einfügen","phMasterContext":"Optional: Dateien, Kontext, Links, Grenzen, Baseline-Versionen oder was nicht geändert werden darf.","labelMasterPreview":"Kombinierter Prompt – Vorschau","ariaMasterBottom":"Untere Master-Prompt-Aktionen","templatesTitle":"Aufgabenspezifische Ergänzungen","tplCodeH":"Python / Code Builder","tplCodeListHtml":"<li>zu prüfende Dateien und Baseline-Version</li><li>CLI-Argumente und erwartete Outputs</li><li>Worker, Checkpoints, Resume</li><li>einzeiliger Fortschritt für CMD</li><li>Tests, Changelog, ZIP-Bundle</li>","tplHtmlH":"HTML / Website-Seite","tplHtmlListHtml":"<li>Rolle der Seite innerhalb der Website</li><li>Links zu verwandten Seiten</li><li>Mobile-Verhalten und Font-Kontrollen</li><li>keine Index-/Sitemap-Updates außer auf Anfrage</li><li>Autorschaft/Provenienz erhalten</li>","tplDocH":"Word / Dokument","tplDocListHtml":"<li>Zielgruppe, Zweck, Stil</li><li>Dokumentstruktur und Abschnittsreihenfolge</li><li>DOCX-Formatierung beim Bearbeiten erhalten</li><li>Zitate/Quellen behandeln</li><li>Finale Datei plus Änderungsnotiz</li>","tplReviewH":"Review / Audit","tplReviewListHtml":"<li>Scoring-Rubrik</li><li>was loben und was angreifen</li><li>erforderliche Evidenz</li><li>deduplizierte Vorschläge</li><li>umsetzbarer Patch-Plan</li>","positioningTitle":"Was RHPm ist — und was nicht","isTitle":"Ist","isText":"RHPm ist die leichte öffentliche Eingangstür in AIM³. Es hilft einem Menschen, einen starken Prompt für eine neue Session vorzubereiten, ohne die volle RHP/RHPr-Zeremonie manuell auszuführen, empfiehlt aber full RHPr oder full RHP, wenn die Aufgabe sie klar braucht.","isNotTitle":"Ist nicht","isNotText":"RHPm ist kein Ersatz für full RHP, kein autonomes Agenten-Runtime und kein Beweis, dass ein Ergebnis richtig ist. Es ist ein Werkzeug zur Prompt-Formung. Tests entscheiden weiterhin.","quote":"Prompts fragen. Loops wiederholen. Skills kumulieren. RHPm soll den ersten Prompt stark genug machen, damit die nächste Schleife am richtigen Ort startet.","footerTextHtml":"<strong>RHPm v0.3</strong> · Praktischer mehrsprachiger Entwurf. Gebaut als kompakte Brücke von roher menschlicher Anfrage zu starkem AI-Session-Prompt. Bleibt kleiner als full RHP/RHPr und empfiehlt Eskalation nur, wenn sie nützlich ist.","relatedHtml":"Verwandt: <a href=\"BD_AIM3.html\">AIM³</a> · <a href=\"BD_AIM3_RHPr.html\">RHPr</a> · <a href=\"BD_AIM3_RHP.html\">RHP</a> · <a href=\"BD_AIM3_RHP_Story.html\">Origin Story</a>","flashCopied":"Kopiert.","flashPasted":"Eingefügt.","flashEmptied":"Geleert.","copyFail":"Kopieren fehlgeschlagen. Text manuell auswählen.","pasteFail":"Einfügen fehlgeschlagen. Der Browser verlangt eventuell Strg+V.","cleared":"Geleert."},"it":{"documentTitle":"RHPm — AIM³ Prompt Builder · BD × AI Lab","navLanguage":"Lingua","toolbarOpen":"Apri","toolbarClose":"Chiudi","tag":"RHPm v0.3 · AIM³ Prompt Builder · ingresso pratico multilingue","titleHtml":"RHPm — Da <em>prompt grezzo</em><br>a forte prompt di sessione AI","subtitle":"Un builder compatto ispirato ad AIM³/RHPr/RHP che trasforma una richiesta umana grezza in un prompt preciso per una nuova sessione LLM — per codice, documenti, pagine web, review, ricerca o arene lunghe.","metaHtml":"<strong>Autorialità:</strong> i concetti e l’architettura originali AIM³/RHP/RHPr/RHPm sono di BD, sviluppati con LLM come collaboratori, builder, critici, revisori e partner di miglioramento. Articoli esterni e idee di loop-engineering sono patch successive, non l’origine.","whyTitle":"Perché esiste questa pagina","whyTextHtml":"<strong>AIM³ è il sistema operativo.</strong> <strong>RHPr apre i cassetti giusti.</strong> <strong>RHP coordina le prospettive.</strong> <strong>RHPm è la porta d’ingresso:</strong> un modo rapido per trasformare “fammi X” in un prompt di sessione chiaro che un modello forte può eseguire senza indovinare.","flow1":"prompt umano grezzo","flow2":"RHPm","flow3":"prompt di sessione forte","flow4":"costruisci / scrivi / testa","flow5":"skill se ripetuto","card1k":"I prompt chiedono","card1h":"Chiarisci l’intento","card1p":"Separa ciò che l’utente ha scritto da ciò che il compito probabilmente richiede: output, pubblico, file, vincoli, rischi, test.","card2k":"I loop ripetono","card2h":"Costruisci una sessione","card2p":"Il prodotto finale non è una risposta. È un prompt riutilizzabile per una nuova sessione che può ispezionare file, pianificare, eseguire, verificare e fermarsi.","card3k":"Le skill si accumulano","card3h":"Non pagare due volte","card3p":"Se un compito è difficile o ripetuto, il prompt chiede al modello successivo di estrarre una Skill Card per partire meglio in futuro.","forgeTitleHtml":"Prompt Forge <span>— modello interattivo</span>","forgeIntro":"Incolla una richiesta grezza. Questa pagina non chiama un’AI. Crea un forte prompt copia-incolla che chiede a una nuova sessione LLM di eseguire il protocollo RHPm compatto.","languageNote":"I prompt generati restano in inglese per affidabilità tra modelli. Includono: Preferred response language: {lang}.","labelRough":"Prompt umano grezzo","phRough":"Esempio: crea un’arena Python per testare varianti di trading. Deve usare worker, salvare progresso, riprendere e creare uno ZIP.","labelTaskType":"Tipo di compito","typeGeneral":"Compito generale / misto","typeCode":"Python / builder codice","typeHtml":"HTML / pagina web","typeDoc":"Word / paper / documento","typeReview":"Review / audit / scoring","typeResearch":"Ricerca / sviluppo idea","typeArena":"Arena lunga / benchmark","labelCeremony":"Livello di struttura","ceremonyAuto":"Auto — scegli la struttura minima necessaria","ceremonyLight":"Light — un prompt, risposta compatta","ceremonyMedium":"Medium — piano + risultato + controlli","ceremonyFull":"Full — specifica, test, rischi, prompt di riavvio","labelContext":"Contesto / file / vincoli","phContext":"Esempio: usa i file nella cartella progetto: BD_AIM3.html, BD_AIM3_RHP.html, BD_AIM3_RHPr.html. Preserva il formato. Non aggiornare pagine index salvo richiesta.","chkFiles":"di’ al modello quali file/cartelle ispezionare per primi","chkTests":"richiedi test / criteri di accettazione","chkProvenance":"preserva chiaramente autorialità e provenienza","chkNoBloat":"previeni esplicitamente bloat / pagine extra","chkResume":"aggiungi piano resume/recovery per compiti lunghi o di codice","chkSkill":"estrai una Skill Card se il compito è ripetuto o difficile","btnGenerate":"Genera prompt di sessione","btnCopyGenerated":"Copia prompt generato","btnExCode":"Esempio: arena Python","btnExHtml":"Esempio: pagina HTML","btnClear":"Pulisci","labelPromptOut":"Prompt generato per una nuova sessione LLM","phPromptOut":"Il prompt generato apparirà qui.","protocolTitle":"Il protocollo RHPm compatto","step00h":"Scelta del protocollo","step00p":"Usa RHPm di default. Raccomanda full RHPr per prompting complesso, retrieval bias, problemi bloccati o cassetti di conoscenza nascosti. Raccomanda full RHP per brainstorming complesso, architettura, ricerca o sintesi multi-prospettiva. Usa RHPr + RHP quando servono entrambi. Fai una sola domanda breve solo se la scelta cambia materialmente il prompt finale.","step01h":"Divisione dell’intento","step01p":"Riformula richiesta esplicita, obiettivo implicito, vero deliverable, pubblico, contesto mancante e cosa renderebbe utile il risultato.","step02h":"Mini passaggio di lenti","step02pHtml":"Usa cinque lenti pratiche: <span class=\"pill\">Builder</span><span class=\"pill\">Skeptic</span><span class=\"pill\">Simple Human</span><span class=\"pill\">Mapmaker</span><span class=\"pill\">Empiricist</span>. Ogni lente deve aggiungere valore non duplicato.","step03h":"Anti-lock retrieval","step03p":"Elenca cassetti di conoscenza attivi, cassetti mancanti, assunzioni pericolose e 2–3 lenti forzate da includere nel prompt finale.","step04h":"Sintesi del prompt","step04p":"Scrivi il prompt finale con ruolo, obiettivo, contesto, file, vincoli, deliverable, workflow, controlli, condizioni di stop e cosa non fare.","step05h":"Controllo Agent 0","step05p":"Prima di finalizzare, chiedi: è testabile, delimitato, recuperabile, non gonfio e onesto sulla provenienza?","step06h":"Estrazione skill","step06p":"Se il compito è difficile o ripetuto, crea una Skill Card compatta: nome, quando usarla, input, passi, validazione, failure mode e versione.","masterTitle":"Master prompt copia-incolla","masterIntro":"Usalo quando vuoi la versione master semplice. Compila i due campi e copia un unico blocco prompt per una sessione LLM nuova.","escalationTitle":"Gate di escalation","escalationTextHtml":"Il prompt copiato chiede al modello successivo di scegliere il protocollo adeguato più piccolo: restare con <strong>RHPm</strong> di default, raccomandare <strong>full RHPr</strong> per prompting/retrieval-bias complesso, <strong>full RHP</strong> per brainstorming e architettura multi-prospettiva, o entrambi quando servono entrambi.","ariaMasterTop":"Azioni master prompt in alto","btnCopyPrompt":"Copia prompt","btnPaste":"Incolla","btnEmpty":"Svuota","titlePaste":"Incolla dagli appunti nel campo attivo o, di default, nel campo richiesta umana.","labelMasterRequest":"Incolla qui la richiesta umana","phMasterRequest":"Incolla qui la richiesta umana grezza.","labelMasterContext":"Incolla qui il contesto","phMasterContext":"Opzionale: file, contesto, link, vincoli, versioni baseline o cosa non deve cambiare.","labelMasterPreview":"Anteprima prompt combinato","ariaMasterBottom":"Azioni master prompt in basso","templatesTitle":"Aggiunte specifiche per compito","tplCodeH":"Python / builder codice","tplCodeListHtml":"<li>file e versione baseline da ispezionare</li><li>argomenti CLI e output attesi</li><li>worker, checkpoint, resume</li><li>progresso a riga singola per CMD</li><li>test, changelog, bundle ZIP</li>","tplHtmlH":"HTML / pagina web","tplHtmlListHtml":"<li>ruolo della pagina nel sito</li><li>link a pagine correlate</li><li>comportamento mobile e controlli font</li><li>nessun aggiornamento index/sitemap salvo richiesta</li><li>preservare autorialità/provenienza</li>","tplDocH":"Word / documento","tplDocListHtml":"<li>pubblico, scopo, stile</li><li>struttura del documento e ordine sezioni</li><li>preservare formattazione DOCX durante l’editing</li><li>gestione citazioni/fonti</li><li>file finale più nota modifiche</li>","tplReviewH":"Review / audit","tplReviewListHtml":"<li>rubrica di punteggio</li><li>cosa lodare e cosa attaccare</li><li>evidenza richiesta</li><li>suggerimenti deduplicati</li><li>patch plan attuabile</li>","positioningTitle":"Cosa RHPm è — e cosa non è","isTitle":"È","isText":"RHPm è la porta pubblica leggera verso AIM³. Aiuta una persona a preparare un forte prompt per una nuova sessione senza eseguire manualmente tutta la cerimonia RHP/RHPr, ma raccomanda full RHPr o full RHP quando il compito ne ha chiaramente bisogno.","isNotTitle":"Non è","isNotText":"RHPm non sostituisce full RHP, non è un runtime agentico autonomo e non prova che un risultato sia corretto. È uno strumento di forma del prompt. I test decidono ancora.","quote":"I prompt chiedono. I loop ripetono. Le skill si accumulano. Il compito di RHPm è rendere il primo prompt abbastanza forte perché il loop successivo parta dal punto giusto.","footerTextHtml":"<strong>RHPm v0.3</strong> · Bozza pratica multilingue. Ponte compatto da richiesta umana grezza a forte prompt di sessione AI. Resta più piccolo di full RHP/RHPr e raccomanda escalation solo quando utile.","relatedHtml":"Correlati: <a href=\"BD_AIM3.html\">AIM³</a> · <a href=\"BD_AIM3_RHPr.html\">RHPr</a> · <a href=\"BD_AIM3_RHP.html\">RHP</a> · <a href=\"BD_AIM3_RHP_Story.html\">Origin Story</a>","flashCopied":"Copiato.","flashPasted":"Incollato.","flashEmptied":"Svuotato.","copyFail":"Copia fallita. Seleziona il testo manualmente.","pasteFail":"Incolla fallito. Il browser può richiedere Ctrl+V.","cleared":"Pulito."},"es":{"documentTitle":"RHPm — AIM³ Prompt Builder · BD × AI Lab","navLanguage":"Idioma","toolbarOpen":"Abrir","toolbarClose":"Cerrar","tag":"RHPm v0.3 · AIM³ Prompt Builder · entrada práctica multilingüe","titleHtml":"RHPm — De <em>prompt en bruto</em><br>a prompt fuerte de sesión AI","subtitle":"Un constructor compacto inspirado en AIM³/RHPr/RHP que convierte una petición humana en bruto en un prompt preciso para una nueva sesión LLM — para código, documentos, páginas web, revisiones, investigación o arenas largas.","metaHtml":"<strong>Autoría:</strong> los conceptos y la arquitectura originales de AIM³/RHP/RHPr/RHPm son de BD, desarrollados con LLMs como colaboradores, constructores, críticos, revisores y socios de mejora. Los artículos externos y las ideas de loop-engineering son parches posteriores, no el origen.","whyTitle":"Por qué existe esta página","whyTextHtml":"<strong>AIM³ es el OS.</strong> <strong>RHPr abre los cajones correctos.</strong> <strong>RHP coordina perspectivas.</strong> <strong>RHPm es la puerta de entrada:</strong> una forma rápida de convertir “hazme X” en un prompt claro de sesión que un modelo fuerte puede ejecutar sin adivinar.","flow1":"prompt humano en bruto","flow2":"RHPm","flow3":"prompt fuerte de sesión","flow4":"construir / escribir / probar","flow5":"skill si se repite","card1k":"Los prompts preguntan","card1h":"Aclara la intención","card1p":"Separa lo que el usuario escribió de lo que la tarea probablemente necesita: salida, audiencia, archivos, restricciones, riesgos, pruebas.","card2k":"Los loops repiten","card2h":"Construye una sesión","card2p":"El producto final no es una respuesta. Es un prompt reutilizable para una nueva sesión que puede inspeccionar archivos, planear, ejecutar, verificar y detenerse.","card3k":"Las skills se acumulan","card3h":"No pagues dos veces","card3p":"Si una tarea es difícil o repetida, el prompt pide al siguiente modelo extraer una Skill Card para que el trabajo futuro empiece más barato.","forgeTitleHtml":"Prompt Forge <span>— plantilla interactiva</span>","forgeIntro":"Pega una petición en bruto. Esta página no llama a una AI. Crea un prompt fuerte de copiar y pegar que pide a una nueva sesión LLM ejecutar el protocolo compacto RHPm.","languageNote":"Los prompts generados se mantienen en inglés por fiabilidad entre modelos. Incluyen: Preferred response language: {lang}.","labelRough":"Prompt humano en bruto","phRough":"Ejemplo: crea una arena Python para probar variantes de trading. Debe usar workers, guardar progreso, reanudar y crear un ZIP.","labelTaskType":"Tipo de tarea","typeGeneral":"Tarea general / mixta","typeCode":"Python / constructor de código","typeHtml":"HTML / página web","typeDoc":"Word / paper / documento","typeReview":"Revisión / auditoría / puntuación","typeResearch":"Investigación / desarrollo de ideas","typeArena":"Arena larga / benchmark","labelCeremony":"Nivel de estructura","ceremonyAuto":"Auto — elegir la estructura mínima necesaria","ceremonyLight":"Light — un prompt, respuesta compacta","ceremonyMedium":"Medium — plan + entregable + comprobaciones","ceremonyFull":"Full — especificación, pruebas, riesgos, prompt de reinicio","labelContext":"Contexto / archivos / restricciones","phContext":"Ejemplo: usa archivos en la carpeta del proyecto: BD_AIM3.html, BD_AIM3_RHP.html, BD_AIM3_RHPr.html. Conserva formato. No actualices páginas index salvo petición.","chkFiles":"decir al modelo qué archivos/carpetas inspeccionar primero","chkTests":"exigir pruebas / criterios de aceptación","chkProvenance":"preservar claramente autoría y procedencia","chkNoBloat":"evitar explícitamente bloat / páginas extra","chkResume":"añadir plan de reanudación/recuperación para tareas largas o de código","chkSkill":"extraer una Skill Card si la tarea se repite o es difícil","btnGenerate":"Generar prompt de sesión","btnCopyGenerated":"Copiar prompt generado","btnExCode":"Ejemplo: arena Python","btnExHtml":"Ejemplo: página HTML","btnClear":"Limpiar","labelPromptOut":"Prompt generado para una nueva sesión LLM","phPromptOut":"El prompt generado aparecerá aquí.","protocolTitle":"El protocolo RHPm compacto","step00h":"Elección de protocolo","step00p":"Usa RHPm por defecto. Recomienda full RHPr para prompting complejo, retrieval bias, problemas atascados o cajones de conocimiento ocultos. Recomienda full RHP para brainstorming complejo, arquitectura, investigación o síntesis multi-perspectiva. Usa RHPr + RHP cuando ambos sean necesarios. Haz una sola pregunta breve solo si la elección cambia materialmente el prompt final.","step01h":"Separar intención","step01p":"Reformula petición explícita, objetivo implícito, entregable real, audiencia, contexto faltante y qué haría útil el resultado.","step02h":"Mini pasada de lentes","step02pHtml":"Usa cinco lentes prácticas: <span class=\"pill\">Builder</span><span class=\"pill\">Skeptic</span><span class=\"pill\">Simple Human</span><span class=\"pill\">Mapmaker</span><span class=\"pill\">Empiricist</span>. Cada lente debe aportar valor no duplicado.","step03h":"Anti-lock retrieval","step03p":"Lista cajones de conocimiento activos, cajones faltantes, suposiciones peligrosas y 2–3 lentes forzadas que deben incluirse en el prompt final.","step04h":"Síntesis del prompt","step04p":"Escribe el prompt final con rol, objetivo, contexto, archivos, restricciones, entregables, flujo de trabajo, comprobaciones, condiciones de parada y qué no hacer.","step05h":"Chequeo Agent 0","step05p":"Antes de finalizar, pregunta: ¿es comprobable, acotado, recuperable, no inflado y honesto sobre procedencia?","step06h":"Extracción de skill","step06p":"Si la tarea es difícil o repetida, crea una Skill Card compacta: nombre, cuándo usar, entradas, pasos, validación, modos de fallo y versión.","masterTitle":"Master prompt de copiar y pegar","masterIntro":"Úsalo cuando quieras la versión maestra simple. Rellena los dos campos y copia un bloque combinado para una nueva sesión LLM.","escalationTitle":"Puerta de escalada","escalationTextHtml":"El prompt copiado pide al siguiente modelo elegir el protocolo adecuado más pequeño: quedarse con <strong>RHPm</strong> por defecto, recomendar <strong>full RHPr</strong> para prompting/retrieval-bias complejo, <strong>full RHP</strong> para brainstorming y arquitectura multi-perspectiva, o ambos cuando hagan falta.","ariaMasterTop":"Acciones superiores del master prompt","btnCopyPrompt":"Copiar prompt","btnPaste":"Pegar","btnEmpty":"Vaciar","titlePaste":"Pega el portapapeles en el campo enfocado o, por defecto, en la petición humana.","labelMasterRequest":"Pega aquí la petición humana","phMasterRequest":"Pega aquí la petición humana en bruto.","labelMasterContext":"Pega aquí el contexto","phMasterContext":"Opcional: archivos, contexto, enlaces, restricciones, versiones base o qué no debe cambiar.","labelMasterPreview":"Vista previa del prompt combinado","ariaMasterBottom":"Acciones inferiores del master prompt","templatesTitle":"Añadidos por tipo de tarea","tplCodeH":"Python / constructor de código","tplCodeListHtml":"<li>archivos y versión base a inspeccionar</li><li>argumentos CLI y salidas esperadas</li><li>workers, checkpoints, reanudación</li><li>progreso de una línea para CMD</li><li>pruebas, changelog, paquete ZIP</li>","tplHtmlH":"HTML / página web","tplHtmlListHtml":"<li>rol de la página dentro del sitio</li><li>enlaces a páginas relacionadas</li><li>comportamiento móvil y controles de fuente</li><li>sin actualizaciones de index/sitemap salvo petición</li><li>preservar autoría/procedencia</li>","tplDocH":"Word / documento","tplDocListHtml":"<li>audiencia, propósito, estilo</li><li>estructura del documento y orden de secciones</li><li>preservar formato DOCX al editar</li><li>manejo de citas/fuentes</li><li>archivo final más nota de cambios</li>","tplReviewH":"Revisión / auditoría","tplReviewListHtml":"<li>rúbrica de puntuación</li><li>qué elogiar y qué atacar</li><li>evidencia requerida</li><li>sugerencias deduplicadas</li><li>plan de parche accionable</li>","positioningTitle":"Qué es RHPm — y qué no es","isTitle":"Es","isText":"RHPm es la puerta pública ligera hacia AIM³. Ayuda a una persona a preparar un prompt fuerte para una nueva sesión sin ejecutar manualmente toda la ceremonia RHP/RHPr, pero recomienda full RHPr o full RHP cuando la tarea claramente los necesita.","isNotTitle":"No es","isNotText":"RHPm no sustituye full RHP, no es un runtime autónomo de agentes y no prueba que un resultado sea correcto. Es una herramienta de forma del prompt. Las pruebas siguen decidiendo.","quote":"Los prompts preguntan. Los loops repiten. Las skills se acumulan. La tarea de RHPm es hacer que el primer prompt sea lo bastante fuerte para que el siguiente loop empiece en el lugar correcto.","footerTextHtml":"<strong>RHPm v0.3</strong> · Borrador práctico multilingüe. Construido como puente compacto desde una petición humana en bruto a un prompt fuerte de sesión AI. Se mantiene más pequeño que full RHP/RHPr y recomienda escalada solo cuando es útil.","relatedHtml":"Relacionado: <a href=\"BD_AIM3.html\">AIM³</a> · <a href=\"BD_AIM3_RHPr.html\">RHPr</a> · <a href=\"BD_AIM3_RHP.html\">RHP</a> · <a href=\"BD_AIM3_RHP_Story.html\">Origin Story</a>","flashCopied":"Copiado.","flashPasted":"Pegado.","flashEmptied":"Vaciado.","copyFail":"Error al copiar. Selecciona el texto manualmente.","pasteFail":"Error al pegar. El navegador puede requerir Ctrl+V.","cleared":"Limpiado."},"fr":{"documentTitle":"RHPm — AIM³ Prompt Builder · BD × AI Lab","navLanguage":"Langue","toolbarOpen":"Ouvrir","toolbarClose":"Fermer","tag":"RHPm v0.3 · AIM³ Prompt Builder · porte d’entrée pratique multilingue","titleHtml":"RHPm — Du <em>prompt brut</em><br>au prompt fort de session AI","subtitle":"Un builder compact inspiré par AIM³/RHPr/RHP qui transforme une demande humaine brute en prompt précis pour une nouvelle session LLM — code, documents, pages web, revues, recherche ou arènes longues.","metaHtml":"<strong>Paternité :</strong> les concepts et l’architecture originaux AIM³/RHP/RHPr/RHPm sont de BD, développés avec des LLM comme collaborateurs, builders, critiques, relecteurs et partenaires d’amélioration. Les articles externes et idées de loop-engineering sont des ajouts ultérieurs, pas l’origine.","whyTitle":"Pourquoi cette page existe","whyTextHtml":"<strong>AIM³ est l’OS.</strong> <strong>RHPr ouvre les bons tiroirs.</strong> <strong>RHP coordonne les perspectives.</strong> <strong>RHPm est la porte d’entrée :</strong> un moyen rapide de transformer « fais-moi X » en prompt de session clair qu’un modèle fort peut exécuter sans deviner.","flow1":"prompt humain brut","flow2":"RHPm","flow3":"prompt de session fort","flow4":"construire / écrire / tester","flow5":"skill si répété","card1k":"Les prompts demandent","card1h":"Clarifier l’intention","card1p":"Séparer ce que l’utilisateur a écrit de ce dont la tâche a probablement besoin : sortie, public, fichiers, contraintes, risques, tests.","card2k":"Les boucles répètent","card2h":"Construire une session","card2p":"Le produit final n’est pas une réponse. C’est un prompt réutilisable pour une nouvelle session capable d’inspecter les fichiers, planifier, exécuter, vérifier et s’arrêter.","card3k":"Les skills s’accumulent","card3h":"Ne pas payer deux fois","card3p":"Si une tâche est difficile ou répétée, le prompt demande au modèle suivant d’extraire une Skill Card afin que le travail futur commence moins cher.","forgeTitleHtml":"Prompt Forge <span>— modèle interactif</span>","forgeIntro":"Collez une demande brute. Cette page n’appelle pas d’AI. Elle crée un prompt fort à copier-coller demandant à une nouvelle session LLM d’exécuter le protocole compact RHPm.","languageNote":"Les prompts générés restent par défaut en anglais pour la fiabilité entre modèles. Ils incluent : Preferred response language: {lang}.","labelRough":"Prompt humain brut","phRough":"Exemple : crée une arène Python pour tester des variantes de trading. Elle doit utiliser des workers, sauvegarder le progrès, reprendre et créer un ZIP.","labelTaskType":"Type de tâche","typeGeneral":"Tâche générale / mixte","typeCode":"Python / construction de code","typeHtml":"HTML / page web","typeDoc":"Word / article / document","typeReview":"Revue / audit / notation","typeResearch":"Recherche / développement d’idée","typeArena":"Arène longue / benchmark","labelCeremony":"Niveau de structure","ceremonyAuto":"Auto — choisir la structure minimale nécessaire","ceremonyLight":"Light — un prompt, réponse compacte","ceremonyMedium":"Medium — plan + livrable + contrôles","ceremonyFull":"Full — spécification, tests, risques, prompt de redémarrage","labelContext":"Contexte / fichiers / contraintes","phContext":"Exemple : utiliser les fichiers du dossier projet : BD_AIM3.html, BD_AIM3_RHP.html, BD_AIM3_RHPr.html. Préserver le format. Ne pas mettre à jour les pages index sauf demande.","chkFiles":"indiquer au modèle quels fichiers/dossiers inspecter d’abord","chkTests":"exiger tests / critères d’acceptation","chkProvenance":"préserver clairement la paternité et la provenance","chkNoBloat":"empêcher explicitement le bloat / les pages supplémentaires","chkResume":"ajouter un plan resume/recovery pour tâches longues ou de code","chkSkill":"extraire une Skill Card si la tâche est répétée ou difficile","btnGenerate":"Générer le prompt de session","btnCopyGenerated":"Copier le prompt généré","btnExCode":"Exemple : arène Python","btnExHtml":"Exemple : page HTML","btnClear":"Effacer","labelPromptOut":"Prompt généré pour une nouvelle session LLM","phPromptOut":"Le prompt généré apparaîtra ici.","protocolTitle":"Le protocole RHPm compact","step00h":"Choix du protocole","step00p":"Utiliser RHPm par défaut. Recommander full RHPr pour prompting complexe, biais de retrieval, problèmes bloqués ou tiroirs de connaissance cachés. Recommander full RHP pour brainstorming complexe, architecture, recherche ou synthèse multi-perspective. Utiliser RHPr + RHP si les deux sont nécessaires. Poser une seule question courte seulement si le choix change matériellement le prompt final.","step01h":"Séparer l’intention","step01p":"Reformuler la demande explicite, l’objectif implicite, le vrai livrable, le public, le contexte manquant et ce qui rendrait le résultat utile.","step02h":"Mini passage par les lentilles","step02pHtml":"Utiliser cinq lentilles pratiques : <span class=\"pill\">Builder</span><span class=\"pill\">Skeptic</span><span class=\"pill\">Simple Human</span><span class=\"pill\">Mapmaker</span><span class=\"pill\">Empiricist</span>. Chaque lentille doit ajouter une valeur non redondante.","step03h":"Anti-lock retrieval","step03p":"Lister les tiroirs de connaissance activés, les tiroirs manquants, les hypothèses dangereuses et 2–3 lentilles forcées à inclure dans le prompt final.","step04h":"Synthèse du prompt","step04p":"Écrire le prompt final avec rôle, objectif, contexte, fichiers, contraintes, livrables, workflow, contrôles, conditions d’arrêt et ce qu’il ne faut pas faire.","step05h":"Contrôle Agent 0","step05p":"Avant de finaliser, demander : est-ce testable, borné, récupérable, non gonflé et honnête sur la provenance ?","step06h":"Extraction de skill","step06p":"Si la tâche est difficile ou répétée, créer une Skill Card compacte : nom, quand l’utiliser, entrées, étapes, validation, modes d’échec et version.","masterTitle":"Master prompt à copier-coller","masterIntro":"Utilisez ceci pour la version maître simple. Remplissez les deux champs puis copiez un bloc prompt combiné pour une session LLM fraîche.","escalationTitle":"Porte d’escalade","escalationTextHtml":"Le prompt copié demande au modèle suivant de choisir le plus petit protocole adéquat : rester avec <strong>RHPm</strong> par défaut, recommander <strong>full RHPr</strong> pour prompting/retrieval-bias complexe, <strong>full RHP</strong> pour brainstorming et architecture multi-perspective, ou les deux si nécessaire.","ariaMasterTop":"Actions supérieures du master prompt","btnCopyPrompt":"Copier le prompt","btnPaste":"Coller","btnEmpty":"Vider","titlePaste":"Coller le presse-papiers dans le champ actif ou, par défaut, dans la demande humaine.","labelMasterRequest":"Coller ici la demande humaine","phMasterRequest":"Coller ici la demande humaine brute.","labelMasterContext":"Coller ici le contexte","phMasterContext":"Optionnel : fichiers, contexte, liens, contraintes, versions de base ou ce qui ne doit pas changer.","labelMasterPreview":"Aperçu du prompt combiné","ariaMasterBottom":"Actions inférieures du master prompt","templatesTitle":"Ajouts par type de tâche","tplCodeH":"Python / construction de code","tplCodeListHtml":"<li>fichiers et version de base à inspecter</li><li>arguments CLI et sorties attendues</li><li>workers, checkpoints, reprise</li><li>progression en une ligne pour CMD</li><li>tests, changelog, bundle ZIP</li>","tplHtmlH":"HTML / page web","tplHtmlListHtml":"<li>rôle de la page dans le site</li><li>liens vers pages liées</li><li>comportement mobile et contrôles de police</li><li>pas de mise à jour index/sitemap sauf demande</li><li>préserver paternité/provenance</li>","tplDocH":"Word / document","tplDocListHtml":"<li>public, objectif, style</li><li>structure du document et ordre des sections</li><li>préserver la mise en forme DOCX lors de l’édition</li><li>gestion citations/sources</li><li>fichier final plus note de changement</li>","tplReviewH":"Revue / audit","tplReviewListHtml":"<li>rubrique de score</li><li>quoi louer et quoi attaquer</li><li>preuves requises</li><li>suggestions dédupliquées</li><li>plan de patch actionnable</li>","positioningTitle":"Ce qu’est RHPm — et ce qu’il n’est pas","isTitle":"Est","isText":"RHPm est la porte publique légère vers AIM³. Il aide une personne à préparer un prompt fort pour une nouvelle session sans exécuter manuellement toute la cérémonie RHP/RHPr, tout en recommandant full RHPr ou full RHP quand la tâche en a clairement besoin.","isNotTitle":"N’est pas","isNotText":"RHPm ne remplace pas full RHP, n’est pas un runtime agentique autonome et ne prouve pas qu’un résultat est correct. C’est un outil de mise en forme du prompt. Les tests décident toujours.","quote":"Les prompts demandent. Les boucles répètent. Les skills s’accumulent. Le rôle de RHPm est de rendre le premier prompt assez fort pour que la boucle suivante démarre au bon endroit.","footerTextHtml":"<strong>RHPm v0.3</strong> · Brouillon pratique multilingue. Construit comme pont compact entre demande humaine brute et prompt fort de session AI. Reste plus petit que full RHP/RHPr et recommande l’escalade seulement quand elle est utile.","relatedHtml":"Liens : <a href=\"BD_AIM3.html\">AIM³</a> · <a href=\"BD_AIM3_RHPr.html\">RHPr</a> · <a href=\"BD_AIM3_RHP.html\">RHP</a> · <a href=\"BD_AIM3_RHP_Story.html\">Origin Story</a>","flashCopied":"Copié.","flashPasted":"Collé.","flashEmptied":"Vidé.","copyFail":"Copie échouée. Sélectionnez le texte manuellement.","pasteFail":"Collage échoué. Le navigateur peut demander Ctrl+V.","cleared":"Effacé."},"zh":{"documentTitle":"RHPm — AIM³ Prompt Builder · BD × AI Lab","navLanguage":"语言","toolbarOpen":"展开","toolbarClose":"收起","tag":"RHPm v0.3 · AIM³ Prompt Builder · 多语言实用入口","titleHtml":"RHPm — 从<em>粗略提示</em><br>到强 AI 会话提示","subtitle":"一个受 AIM³/RHPr/RHP 启发的紧凑构建器，把粗略的人类请求变成可用于新 LLM 会话的精确提示——适合代码、文档、网页、评审、研究或长时间 arena。","metaHtml":"<strong>作者与来源：</strong>AIM³/RHP/RHPr/RHPm 的原创概念和架构来自 BD，并与 LLM 作为协作者、构建者、批评者、评审者和改进伙伴共同发展。外部文章和 loop-engineering 想法是后来的补丁，不是源头。","whyTitle":"为什么有这个页面","whyTextHtml":"<strong>AIM³ 是 OS。</strong> <strong>RHPr 打开正确的抽屉。</strong> <strong>RHP 协调多种视角。</strong> <strong>RHPm 是入口：</strong>把“帮我做 X”快速变成清晰的会话提示，让强模型无需猜测即可执行。","flow1":"粗略人类提示","flow2":"RHPm","flow3":"强会话提示","flow4":"构建 / 写作 / 测试","flow5":"重复时提取 skill","card1k":"Prompt asks","card1h":"澄清意图","card1p":"区分用户写了什么，以及任务真正需要什么：输出、受众、文件、约束、风险、测试。","card2k":"Loops repeat","card2h":"构建会话","card2p":"最终产物不是答案，而是给新会话使用的可复用提示；它能检查文件、计划、执行、验证并停止。","card3k":"Skills compound","card3h":"不要付两次成本","card3p":"如果任务困难或重复，提示会要求下一个模型提取 Skill Card，让未来工作更省成本。","forgeTitleHtml":"Prompt Forge <span>— 交互模板</span>","forgeIntro":"粘贴粗略请求。本页面不会调用 AI。它会生成一个可复制的强提示，要求新的 LLM 会话运行紧凑 RHPm 协议。","languageNote":"为保证跨模型可靠性，生成的提示默认保持英文。它们会包含：Preferred response language: {lang}.","labelRough":"粗略人类提示","phRough":"示例：做一个 Python arena 来测试交易策略变体。需要支持 workers、保存进度、resume，并创建 ZIP。","labelTaskType":"任务类型","typeGeneral":"通用 / 混合任务","typeCode":"Python / 代码构建","typeHtml":"HTML / 网站页面","typeDoc":"Word / 论文 / 文档","typeReview":"评审 / 审计 / 打分","typeResearch":"研究 / 想法开发","typeArena":"长时间 arena / benchmark","labelCeremony":"结构强度","ceremonyAuto":"Auto — 选择最小必要结构","ceremonyLight":"Light — 一个提示，紧凑回答","ceremonyMedium":"Medium — 计划 + 产物 + 检查","ceremonyFull":"Full — 规格、测试、风险、重启提示","labelContext":"上下文 / 文件 / 约束","phContext":"示例：使用项目文件夹中的 BD_AIM3.html、BD_AIM3_RHP.html、BD_AIM3_RHPr.html。保留格式。除非要求，不要更新 index 页面。","chkFiles":"告诉模型先检查哪些文件/文件夹","chkTests":"要求测试 / 验收标准","chkProvenance":"清楚保留作者与来源","chkNoBloat":"明确防止膨胀 / 额外页面","chkResume":"为长任务或代码任务加入 resume/recovery 计划","chkSkill":"如果任务重复或困难，提取 Skill Card","btnGenerate":"生成会话提示","btnCopyGenerated":"复制生成提示","btnExCode":"示例：Python arena","btnExHtml":"示例：HTML 页面","btnClear":"清空","labelPromptOut":"用于新 LLM 会话的生成提示","phPromptOut":"生成的提示会显示在这里。","protocolTitle":"紧凑 RHPm 协议","step00h":"协议选择","step00p":"默认使用 RHPm。对复杂 prompting、retrieval bias、卡住或隐藏知识抽屉问题，建议 full RHPr。对复杂 brainstorming、架构、研究或多视角综合，建议 full RHP。两者都需要时使用 RHPr + RHP。只有当选择会实质改变最终提示时，才问一个简短问题。","step01h":"意图拆分","step01p":"重述明确请求、隐含目标、真实交付物、受众、缺失上下文，以及什么会让结果有用。","step02h":"小型视角检查","step02pHtml":"使用五个实用视角：<span class=\"pill\">Builder</span><span class=\"pill\">Skeptic</span><span class=\"pill\">Simple Human</span><span class=\"pill\">Mapmaker</span><span class=\"pill\">Empiricist</span>。每个视角必须提供不重复的价值。","step03h":"Anti-lock retrieval","step03p":"列出已激活的知识抽屉、缺失抽屉、危险假设，以及最终提示应包含的 2–3 个强制视角。","step04h":"提示合成","step04p":"写出最终会话提示，包括角色、目标、上下文、文件、约束、交付物、工作流、检查、停止条件和不要做什么。","step05h":"Agent 0 检查","step05p":"最终确定前检查：是否可测试、有边界、可恢复、不膨胀，并且诚实说明来源？","step06h":"Skill 提取","step06p":"如果任务困难或重复，创建紧凑 Skill Card：名称、使用场景、输入、步骤、验证、失败模式和版本。","masterTitle":"复制粘贴 Master Prompt","masterIntro":"需要简单 master 版本时使用。填写两个字段，然后复制一个组合提示块给新的 LLM 会话。","escalationTitle":"升级门","escalationTextHtml":"复制的提示会要求下一个模型选择最小合适协议：默认保持 <strong>RHPm</strong>；复杂 prompting/retrieval-bias 用 <strong>full RHPr</strong>；复杂 brainstorming 和多视角架构用 <strong>full RHP</strong>；两者都需要时同时使用。","ariaMasterTop":"Master prompt 顶部操作","btnCopyPrompt":"复制提示","btnPaste":"粘贴","btnEmpty":"清空","titlePaste":"把剪贴板内容粘贴到当前字段；默认粘贴到人类请求字段。","labelMasterRequest":"在此粘贴人类请求","phMasterRequest":"在此粘贴粗略人类请求。","labelMasterContext":"在此粘贴上下文","phMasterContext":"可选：文件、上下文、链接、约束、baseline 版本或不得更改的内容。","labelMasterPreview":"组合提示预览","ariaMasterBottom":"Master prompt 底部操作","templatesTitle":"按任务类型添加","tplCodeH":"Python / 代码构建","tplCodeListHtml":"<li>先检查文件和 baseline 版本</li><li>CLI 参数和预期输出</li><li>workers、checkpoints、resume</li><li>CMD 单行进度</li><li>测试、changelog、ZIP 包</li>","tplHtmlH":"HTML / 网站页面","tplHtmlListHtml":"<li>页面在网站中的角色</li><li>相关页面链接</li><li>移动端行为和字体控制</li><li>除非要求，不更新 index/sitemap</li><li>保留作者与来源</li>","tplDocH":"Word / 文档","tplDocListHtml":"<li>受众、目的、风格</li><li>文档结构和章节顺序</li><li>编辑时保留 DOCX 格式</li><li>引用/来源处理</li><li>最终文件加变更说明</li>","tplReviewH":"评审 / 审计","tplReviewListHtml":"<li>评分标准</li><li>要表扬什么、攻击什么</li><li>所需证据</li><li>去重建议</li><li>可执行 patch plan</li>","positioningTitle":"RHPm 是什么——不是什么","isTitle":"是","isText":"RHPm 是 AIM³ 的轻量公开入口。它帮助人类为新会话准备强提示，而不需要手动运行完整 RHP/RHPr 仪式；当任务明显需要时，它仍会建议 full RHPr 或 full RHP。","isNotTitle":"不是","isNotText":"RHPm 不是 full RHP 的替代品，不是自治 agent runtime，也不能证明结果正确。它只 const LANG_LABELS_EN = {en:'English', sl:'Slovenian', de:'German', it:'Italian', es:'Spanish', fr:'French', zh:'Simplified Chinese', ja:'Japanese'};
const LANG_LABELS_LOCAL = {en:'English', sl:'Slovenščina', de:'Deutsch', it:'Italiano', es:'Español', fr:'Français', zh:'简体中文', ja:'日本語'};
const LANG_KEY = 'rhpm_lang';
let currentLang = 'en';
function qs(id){return document.getElementById(id)}
function tr(key){return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key}
function scrollBar(){const h=document.documentElement; const pct=h.scrollTop/(h.scrollHeight-h.clientHeight)*100; const el=qs('scrollProg'); if(el) el.style.width=(isFinite(pct)?pct:0)+'%'}
window.addEventListener('scroll',scrollBar);
let fs=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--baseFont'))||17;
function fontDelta(d){fs=Math.max(15,Math.min(24,fs+d));document.documentElement.style.setProperty('--baseFont',fs+'px')}
function flash(msg){let el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#0f1729;border:1px solid rgba(0,229,255,.35);color:#00e5ff;padding:10px 16px;border-radius:999px;font-family:JetBrains Mono,monospace;font-size:12px;z-index:10001;box-shadow:0 12px 40px rgba(0,0,0,.4)';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}
function copyText(t){
  const text=String(t||'');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>flash(tr('flashCopied'))).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  try{const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); flash(tr('flashCopied'));}
  catch(e){alert(tr('copyFail'))}
}
function copyById(id){const el=qs(id); copyText((el && ('value' in el ? el.value : el.innerText)) || '')}
function expandAll(){document.querySelectorAll('details').forEach(d=>d.open=true)}
function collapseAll(){document.querySelectorAll('details').forEach(d=>d.open=false)}
function preferredLanguageLine(){return `${LANG_LABELS_EN[currentLang] || 'English'} (${currentLang})`}
function updateLanguageNotes(){
  const note = tr('languageNote').replace('{lang}', preferredLanguageLine());
  ['forgeLangNote','masterLangNote'].forEach(id=>{const el=qs(id); if(el) el.innerHTML = note.replace('Preferred response language:', '<strong>Preferred response language:</strong>')});
}
function applyI18n(lang){
  currentLang = I18N[lang] ? lang : 'en';
  document.documentElement.lang = currentLang;
  document.title = tr('documentTitle');
  const sel=qs('langSelect'); if(sel) sel.value=currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.getAttribute('data-i18n'))});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=tr(el.getAttribute('data-i18n-html'))});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.setAttribute('placeholder',tr(el.getAttribute('data-i18n-placeholder')))});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.setAttribute('title',tr(el.getAttribute('data-i18n-title')))});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',tr(el.getAttribute('data-i18n-aria')))});
  const navLabel=document.querySelector('label[for="langSelect"]'); if(navLabel) navLabel.textContent=tr('navLanguage');
  updateLanguageNotes();
  updateMasterPromptPreview();
  const out=qs('promptOut'); if(out && out.dataset.generated==='1') generatePrompt();
}
function setLanguage(lang){
  currentLang = I18N[lang] ? lang : 'en';
  try{localStorage.setItem(LANG_KEY,currentLang)}catch(e){}
  applyI18n(currentLang);
}
function initialLanguage(){
  try{const saved=localStorage.getItem(LANG_KEY); if(saved && I18N[saved]) return saved;}catch(e){}
  return 'en';
}
function buildMasterPrompt(){
