const links={rhpr:'https://www.mdlxdcc.org/bd/bd_aim3_rhpr',rhp:'https://www.mdlxdcc.org/bd/bd_aim3_rhp',aim3:'https://www.mdlxdcc.org/bd/bd_aim3',reasoning:'https://www.mdlxdcc.org/bd/bd_8z_reasoning'};

const answerLangEnglish={en:'English',sl:'Slovenian',de:'German',it:'Italian',es:'Spanish',fr:'French',zh:'Simplified Chinese',ja:'Japanese'};

function scrollBar(){const h=document.documentElement;const pct=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;const bar=qs('scrollProg');if(bar)bar.style.width=(isFinite(pct)?pct:0)+'%'}

let fs=17;function fontDelta(d){fs=Math.max(15,Math.min(24,fs+d));document.documentElement.style.setProperty('--baseFont',fs+'px')}
function flash(msg){let el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#0f1729;border:1px solid rgba(0,229,255,.35);color:#00e5ff;padding:10px 16px;border-radius:999px;font-family:JetBrains Mono,monospace;font-size:12px;z-index:10001;box-shadow:0 12px 40px rgba(0,0,0,.4)';document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}
function copyText(t){navigator.clipboard.writeText(t).then(()=>flash(tr('copied'))).catch(()=>alert(tr('copyFail')))}
function copyById(id){const el=qs(id);copyText(el?(el.value||el.innerText||''):'')}
function downloadText(filename,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);flash(tr('downloaded'))}
function populateLangSelects(){const page=qs('pageLang'), ans=qs('answerLang');const oldPage=page.value||localStorage.getItem('rhpm_page_lang')||'en';const oldAns=ans.value||localStorage.getItem('rhpm_answer_lang')||'en';page.innerHTML='';ans.innerHTML='';for(const code of langCodes){const o=document.createElement('option');o.value=code;o.textContent=LANG_NAMES[code][code]||answerLangEnglish[code];page.appendChild(o)}const pageLang=LANG_NAMES[oldPage]?oldPage:'en';for(const code of langCodes){const o=document.createElement('option');o.value=code;o.textContent=(LANG_NAMES[pageLang]&&LANG_NAMES[pageLang][code])||answerLangEnglish[code];ans.appendChild(o)}page.value=pageLang;ans.value=answerLangEnglish[oldAns]?oldAns:'en'}
function applyTranslations(){const l=qs('pageLang')?.value||'en';document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');el.textContent=tr(key)});document.querySelectorAll('[data-placeholder]').forEach(el=>{const key=el.getAttribute('data-placeholder');el.placeholder=tr(key)});const title=qs('titleMain');if(title)title.textContent=tr('title');populateAnswerLabelsOnly();updateMasterPromptPreview()}
function populateAnswerLabelsOnly(){const ans=qs('answerLang');if(!ans)return;const val=ans.value||'en';const pageLang=qs('pageLang')?.value||'en';ans.innerHTML='';for(const code of langCodes){const o=document.createElement('option');o.value=code;o.textContent=(LANG_NAMES[pageLang]&&LANG_NAMES[pageLang][code])||answerLangEnglish[code];ans.appendChild(o)}ans.value=val}

function setAnswerSameAsPage(){const p=qs('pageLang')?.value||'en';qs('answerLang').value=p;localStorage.setItem('rhpm_answer_lang',p);updateMasterPromptPreview();const out=qs('promptOut');if(out&&out.value.trim())generatePrompt()}
function selectedAnswerLanguageEnglish(){return answerLangEnglish[qs('answerLang')?.value||'en']||'English'}
function preferredLanguageBlock(){const lang=selectedAnswerLanguageEnglish();return `PREFERRED RESPONSE LANGUAGE:
${lang}
Use English internally for protocol/lens/validation planning if needed, but write the final human-facing answer strictly in ${lang} unless the user asks otherwise. Keep protocol names such as AIM³, RHPm, RHPr, RHP, Engineer, Falsifier, Child, Cartographer, and Agent 0 in English if clearer.`}
function provenanceBlock(){return `Authorship/provenance rule when relevant:
AIM³/RHP/RHPr/RHPm originate from BD’s architecture and concepts; LLMs are collaborators, reviewers, builders, critics, and improvement partners. Do not rewrite provenance as if BD merely compiled outside ideas.`}
function reasoningBlock(){return `## REASONING MODE (8Z) — how to think while you work
Apply these rules while improving the prompt, and write the final prompt so the next session applies them while executing. Full method: ${links.reasoning}

R1. Limits need proof. Treat “impossible / can’t / not allowed” as claims requiring evidence. If evidence is weak, surface the unstated assumption instead of obeying the limit.
R2. Decompose before dismissing. Convert broad objections into smaller testable subproblems.
R3. Question the question. Look for hidden premises, wrong drawers, stale assumptions, missing files, or a better framing.
R4. Never exclude before the arena. Keep candidate paths alive until tests, baselines, MDL comparison, or concrete constraints kill them.
R5. Follow the surprise. If an odd result, user seed, or cross-domain bridge carries signal, preserve it long enough to test.
R6. Transfer structure across domains. Look for reusable mechanism, not surface analogy.
R7. Verify before claiming. Use tests, manual checks, visual inspection, citations, or acceptance criteria where possible.
R8. Capture the learning. If this becomes a repeated workflow, extract a compact machine-readable Skill Card.`}
function compactProtocolBlock(forceGuide=false){return `## RHPm protocol to run internally

0. GUIDE MODE / QUESTIONNAIRE
${forceGuide?'Ask up to 5 focused practical questions first before producing the final prompt, unless the request already answers them explicitly.':'If the rough request is clear enough, do not ask questions. Build the improved prompt directly. If guessing would materially reduce quality, ask up to 5 focused practical questions first, then wait for the user.'}
Questions should prioritize: exact deliverable, audience/user level, files/links/context, constraints/forbidden changes, checks/tests, and output format.

1. PROTOCOL CHOICE / MDL ESCALATION GATE
Choose the smallest adequate path:
- RHPm only: normal rough-request → strong-prompt work.
- Full RHPr recommended: retrieval-bias, wrong knowledge drawer, messy/stale context, or the model may keep answering the wrong question. Reference: ${links.rhpr}
- Full RHP recommended: complex brainstorming, architecture, theory, strategy, cross-domain synthesis, or high-stakes multi-perspective ideation. Reference: ${links.rhp}
- RHPr + RHP: use both if the task needs retrieval repair and multi-perspective synthesis.
Active contradiction check: before choosing, look for anomalies, conflicting constraints, missing files, stale assumptions, or signs that the current framing is wrong.

2. INTENT SPLIT
Separate explicit request, implied goal, real deliverable, audience/user, files/links/context to inspect first, constraints, forbidden changes, and what good looks like.

3. MINI-RHP LENS PASS
Use these lenses internally to improve the final prompt. Do not merely label sections as Engineer/Falsifier/Child/Cartographer/Agent 0 unless that improves clarity.
- Engineer: deliverable, implementation/editing path, files/tools, packaging
- Falsifier: hidden assumptions, failure modes, misleading phrasing, scope traps
- Child: simplest human meaning, obvious UX/reader need, thing experts may miss
- Cartographer: relevant domains, missing drawers, adjacent references, negative lens to avoid
- Agent 0 / Empiricist: tests, baselines, visual/manual checks, acceptance criteria, rollback/recovery

4. RESONANCE GUARD
If the prompt has many restrictions and they conflict, trigger SEIZURE check: list contradictions and suggest relaxation points.
If the prompt lacks concrete acceptance criteria, trigger NOISE check: propose 3 specific constraints or tests.
Aim for resonance: enough structure to execute, enough freedom to discover a better path.

5. CONTEXT HYGIENE
Attach only useful context. Name files/folders/baseline versions. State what must not change. If context is too large, ask for specific files or summarize before acting. Do not guess from an overloaded context window.

6. PROMPT SYNTHESIS
Write the final prompt for a fresh LLM session. Include role, goal, context, files to inspect first, constraints, deliverables, workflow, checks, output format, stop conditions, and what not to do.

7. AGENT 0 VALIDATION
Before finalizing, check that the prompt makes the result testable, bounded, recoverable, honest about provenance, and not bloated. Require a fitness function where possible: tests, manual/visual checks, baselines, controls, rollback, or acceptance criteria.

8. OPTIONAL MULTI-LLM FEEDBACK LOOP
For important, uncertain, or public-facing prompts, provide a separate review prompt another LLM can use. If feedback is later returned, score each review by usefulness, dedupe suggestions, reject generic advice, and produce a revised final prompt.

9. OPTIONAL SKILL EXTRACTION
If the task is hard or likely to repeat, ask the next model to output a machine-readable Skill Card JSON.`}
function skillJsonBlock(){return `If useful, output a machine-readable Skill Card JSON:
{
  "skill_name": "",
  "purpose": "",
  "when_to_use": [],
  "when_not_to_use": [],
  "inputs": [],
  "outputs": [],
  "steps": [],
  "validation": [],
  "failure_modes": [],
  "rollback": [],
  "examples": [],
  "version": "0.1",
  "status": "draft"
}`}
function buildMasterPrompt(){const rough=(qs('masterHumanRequest')?.value||'').trim()||'[paste the rough human request here]';const ctx=(qs('masterContext')?.value||'').trim()||'[optional: paste files, context, links, constraints, baseline versions, or what must not change]';return `# RHPm — AIM³ Prompt Builder

You are running RHPm. Your job is NOT to answer my rough request directly. Your job is to convert it into the strongest practical prompt for a fresh LLM session. Keep the result compact, copy-paste usable, and action-oriented.

${provenanceBlock()}

## Rough human request
${rough}

## Context / files / constraints
${ctx}

## Language
${preferredLanguageBlock()}

${reasoningBlock()}

${compactProtocolBlock(false)}

## Output format
Return only:
1. The improved prompt.
2. A very short note explaining the biggest prompt-design choices.
3. Optional: one separate review prompt if this task is important or uncertain.`}
function updateMasterPromptPreview(){const el=qs('masterPreview');if(el)el.value=buildMasterPrompt()}
function taskTypeGuidance(t){const m={code:'For code: require runnable files, test commands, smoke tests, error handling, reproducibility, and clear packaging.',html:'For HTML: inspect the actual target file first, modify only allowed files, preserve mobile UX/style, validate JS, check links/buttons/language toggles, and return a ready-to-publish file or ZIP.',doc:'For documents: preserve formatting/structure, make minimal text edits, and provide a changelog.',spreadsheet:'For spreadsheets: use spreadsheet tools, keep formulas/audit trail clear, validate data, and do not use PDF/docx tooling unless explicitly requested.',image:'For images: specify exact visual goal, style, aspect ratio, text constraints, references, safety limits, and acceptance criteria.',review:'For reviews: inspect the target source first, cite evidence, separate facts from opinions, score with a rubric, and list fixes.',research:'For research: separate hypotheses, evidence, experiments, falsifiers, and next smallest tests.',arena:'For arenas: require resume safety, seeds/logs, worker controls, manifests, outputs, and result analysis.'};return m[t]||'For general tasks: keep the prompt direct, bounded, testable, and context-aware.'}
function buildSessionPrompt(){const rough=(qs('roughPrompt')?.value||'').trim()||'[paste rough human request here]';const files=(qs('fileTree')?.value||'').trim();const ctx=(qs('contextFiles')?.value||'').trim();const task=qs('taskType')?.value||'general';const cer=qs('ceremony')?.value||'auto';const guide=qs('chkGuide')?.checked;let extras=[];if(qs('chkFiles')?.checked)extras.push('Inspect the named files/folders first before editing or judging.');if(qs('chkTests')?.checked)extras.push('Include concrete checks, tests, acceptance criteria, or manual/visual validation.');if(qs('chkProvenance')?.checked)extras.push('Preserve authorship/provenance exactly where relevant.');if(qs('chkNoBloat')?.checked)extras.push('Do not bloat the deliverable, create unrelated files, or modify unrelated pages.');if(qs('chkResume')?.checked)extras.push('For long/coding tasks, include resume/recovery/rollback logic.');if(qs('chkSkill')?.checked)extras.push(skillJsonBlock());return `# RHPm-generated session prompt

You are helping with a real task. Do not answer generically. Use the files/context first, then produce the requested deliverable.

${provenanceBlock()}

## User request
${rough}

## Files / folder tree / baseline to inspect first
${files||'[not provided]'}

## Other context / constraints
${ctx||'[not provided]'}

## Language
${preferredLanguageBlock()}

## Task type
${task}
${taskTypeGuidance(task)}

## Ceremony / depth
${cer} — use the smallest adequate structure. Do not over-protocol a simple task, but do not skip validation for a risky task.

${reasoningBlock()}

${compactProtocolBlock(guide)}

## Extra requirements
${extras.length?extras.map(x=>'- '+x).join('\n'):'- Keep the result compact, practical, and testable.'}

## Deliverables
Return the improved result in the most useful form for the task. If files are created or modified, provide download links or a ZIP. Include a short changelog and validation notes.

## Do not do
Do not invent file contents you did not inspect. Do not silently change unrelated files. Do not hide uncertainty. Do not replace BD provenance with generic “AI-generated” provenance.`}
function buildReviewPrompt(){const p=qs('promptOut')?.value||buildSessionPrompt();return `You are reviewing this RHPm-generated prompt before it is used.

Score it from 0–100 for:
1. clarity and executability,
2. context hygiene,
3. missing constraints/files,
4. validation/tests/acceptance criteria,
5. risk of bloat or wrong-drawer retrieval,
6. language/provenance correctness.

Then give the smallest concrete patch that would improve it. Do not rewrite everything unless necessary.

PROMPT TO REVIEW:

${p}`}
function generatePrompt(){const out=qs('promptOut'), rev=qs('reviewOut');out.value=buildSessionPrompt();if(qs('chkReviewPrompt')?.checked)rev.value=buildReviewPrompt();else rev.value='';flash(tr('generated'))}
function copyReviewPromptFromForge(){if(!qs('chkReviewPrompt')?.checked){flash(tr('reviewDisabled'));return}const rev=qs('reviewOut');if(!rev.value.trim())rev.value=buildReviewPrompt();copyText(rev.value)}
function downloadMasterPrompt(){downloadText('BD_AIM3_RHPm_master_prompt.txt',buildMasterPrompt())}
function downloadGeneratedPrompt(){const out=qs('promptOut');if(!out.value.trim())generatePrompt();downloadText('RHPm_generated_session_prompt.txt',out.value)}
function clearMaster(){qs('masterHumanRequest').value='';qs('masterContext').value='';updateMasterPromptPreview();flash(tr('cleared'))}
function clearForge(){['roughPrompt','fileTree','contextFiles','promptOut','reviewOut'].forEach(id=>{const el=qs(id);if(el)el.value=''});flash(tr('cleared'))}
function loadExample(kind){const l=qs('pageLang')?.value||'en';const ex=(EXAMPLES[l]&&EXAMPLES[l][kind])||EXAMPLES.en[kind];if(!ex)return;qs('roughPrompt').value=ex[0];qs('contextFiles').value=ex[1];if(kind==='html')qs('taskType').value='html';if(kind==='code')qs('taskType').value='code';if(kind==='spreadsheet')qs('taskType').value='spreadsheet';if(kind==='image')qs('taskType').value='image';generatePrompt()}
function init(){populateLangSelects();applyTranslations();qs('pageLang').addEventListener('change',()=>{localStorage.setItem('rhpm_page_lang',qs('pageLang').value);applyTranslations();const out=qs('promptOut');if(out&&out.value.trim())generatePrompt()});qs('answerLang').addEventListener('change',()=>{localStorage.setItem('rhpm_answer_lang',qs('answerLang').value);updateMasterPromptPreview();const out=qs('promptOut');if(out&&out.value.trim())generatePrompt()});['masterHumanRequest','masterContext'].forEach(id=>qs(id).addEventListener('input',updateMasterPromptPreview));updateMasterPromptPreview()}
