<style>
:root{color-scheme:dark;--bg:#040812;--bg2:#081321;--panel:#0d1727;--panel2:#121f34;--line:#29415f;--text:#f2f7ff;--muted:#b7c6d8;--cyan:#67e0d7;--blue:#79c0ff;--gold:#ffd56a;--green:#70e0a7;--red:#ff8c9b;--scale:1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-height:100svh;background:radial-gradient(circle at 8% -6%,#173446,transparent 30rem),linear-gradient(180deg,var(--bg),var(--bg2));font-size:calc(18px * var(--scale));line-height:1.55;color:var(--text)}a{color:var(--cyan)}button,input{font:inherit}.top{position:sticky;top:0;z-index:30;background:#040812ee;backdrop-filter:blur(14px);border-bottom:1px solid #28405d}.topin{width:min(1100px,calc(100% - 20px));margin:auto;min-height:58px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:.77rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button,.tools a{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#0d1829;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.tools button:hover,.tools a:hover{border-color:var(--cyan)}
.loading{min-height:calc(100svh - 59px);display:grid;place-items:center;padding:24px}.gate{width:min(660px,100%);padding:clamp(24px,6vw,44px);border:1px solid #31506a;border-radius:28px;background:linear-gradient(180deg,#101c30,#091321);box-shadow:0 24px 80px #0008}.ey{color:var(--cyan);font-size:.72rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.gate h1{font-size:clamp(2.6rem,10vw,4.8rem);line-height:.95;letter-spacing:-.05em;margin:.35em 0}.gate p{color:var(--muted)}.small{font-size:.78rem;color:#8fa2b9}
.vault-wrap{width:min(1100px,calc(100% - 24px));margin:0 auto;padding:28px 0 80px}.hero{padding:clamp(20px,5vw,34px);border:1px solid #31506a;border-radius:28px;background:linear-gradient(140deg,#112539,#0c1625);box-shadow:0 20px 60px #0006}.kicker{color:var(--gold);font-size:.74rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(2.4rem,8vw,4.7rem);line-height:.95;letter-spacing:-.05em;margin:.3em 0}.lead{color:var(--muted);max-width:62rem}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.status-grid div{padding:13px;border:1px solid var(--line);border-radius:15px;background:#081321}.status-grid strong,.status-grid span{display:block}.status-grid span{font-size:.82rem;color:var(--muted);margin-top:3px}.toolbar2{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.toolbar2 label{display:block;font-weight:900;margin-bottom:7px}.toolbar2 input{width:100%;min-height:48px;border:1px solid #49627d;border-radius:12px;background:#050d19;color:#fff;padding:11px 13px}.hint{margin:.7em 0 0;color:var(--muted);font-size:.82rem}
.rich{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:clamp(16px,4vw,28px);overflow:hidden}.rich h1,.rich h2,.rich h3{letter-spacing:-.025em;line-height:1.15}.rich h2{margin-top:1.6em;padding-top:.4em;border-top:1px solid #243a55}.rich table{width:100%;border-collapse:collapse;margin:1em 0;display:block;overflow-x:auto}.rich th,.rich td{padding:10px 12px;border:1px solid #29415f;vertical-align:top;text-align:left;min-width:150px}.rich th{background:#122239;color:#fff}.rich tr:nth-child(even) td{background:#0a1423}.rich code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#07111e;border:1px solid #243b55;border-radius:7px;padding:.12em .35em;word-break:break-word}.rich pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07111e;border:1px solid #243b55;border-radius:14px;padding:14px;overflow-x:auto}.rich li{margin:.35em 0}.rich blockquote{border-left:4px solid var(--cyan);margin-left:0;padding-left:14px;color:var(--muted)}.secret-value{display:inline-block;filter:blur(6px);user-select:none;cursor:pointer;transition:filter .16s ease,background .16s ease}.secret-value.revealed{filter:none;user-select:text;background:#152d29;border-color:#3a8b79}.copy-secret{margin-left:6px;border:1px solid #35566e;border-radius:8px;background:#0a1826;color:var(--cyan);font-size:.76rem;font-weight:800;padding:3px 7px;cursor:pointer}.copy-secret.ok{color:var(--green);border-color:#38745b}.appendix{margin-top:18px;border:1px solid #37506d;border-radius:20px;background:#0c1728;overflow:hidden}.appendix>summary{cursor:pointer;padding:17px 19px;font-weight:900;color:var(--gold)}.details-body{border:0;border-top:1px solid #37506d;border-radius:0}.footnote{margin-top:18px;padding:16px;border-left:4px solid var(--gold);background:#171b1c;border-radius:0 14px 14px 0;color:var(--muted)}.search-hidden{display:none!important}.no-results{margin:14px 0;padding:14px;border:1px solid #6d4d34;border-radius:14px;background:#26190f;color:#ffd4a3}
@media(max-width:700px){.status-grid{grid-template-columns:1fr}.topin{padding:7px 0}.tools{width:100%}.tools>*{flex:1 1 auto;text-align:center}.rich{padding:14px}.rich th,.rich td{min-width:180px}.vault-wrap{width:min(100% - 14px,1100px);padding-top:14px}}
@media print{body:before{content:'Tiskanje zasebnega sefa je onemogočeno.';display:block;padding:30px;font:700 20px system-ui}body>*{display:none!important}}
