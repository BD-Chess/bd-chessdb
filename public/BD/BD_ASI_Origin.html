<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;--bg2:#0c0f18;--border:#1a1e2a;
  --text:#d0d4e0;--muted:#4a506a;--dim:#2a2f42;
  --gold:#c8a44e;--gold-dim:rgba(200,164,78,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif;
  min-height:100vh;display:flex;justify-content:center;
  padding:60px 24px 80px;line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:620px;width:100%}

/* --- visible header --- */
.head{text-align:center;margin-bottom:48px;opacity:0;animation:fadeIn 1.2s .2s forwards}
.head-line{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:4px;text-transform:uppercase;color:var(--muted);
  margin-bottom:20px;
}
.head h1{
  font-size:28px;font-weight:300;font-style:italic;
  color:var(--gold);line-height:1.4;margin-bottom:12px;
}
.head p{font-size:15px;color:var(--muted);font-style:italic}
.thin-rule{
  width:40px;height:1px;background:var(--gold);
  margin:32px auto;opacity:.3;
}

/* --- protected content styling (visible after decrypt) --- */
.story h2{
  font-size:22px;font-weight:300;font-style:italic;
  color:var(--gold);margin:48px 0 16px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.story h2:first-child{margin-top:0}
.story p{
  font-size:17px;color:var(--text);margin-bottom:18px;
  text-indent:1.5em;
}
.story p:first-of-type{text-indent:0}
.story p.no-indent{text-indent:0}
.story .voice-bd{
  border-left:2px solid var(--gold);padding-left:20px;
  margin:24px 0;font-style:italic;color:var(--text);opacity:.85;
}
.story .voice-c{
  border-left:2px solid #64ffda;padding-left:20px;
  margin:24px 0;font-style:italic;color:var(--text);opacity:.85;
}
.story .moment{
  text-align:center;font-size:15px;color:var(--muted);
  font-style:italic;margin:40px 0;letter-spacing:.5px;
}
.story .trajectory{
  text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--gold);letter-spacing:2px;
  margin:40px 0;line-height:2.2;
}
.story .closing{
  text-align:center;margin-top:60px;padding-top:32px;
  border-top:1px solid var(--border);
}
.story .closing p{text-indent:0;font-style:italic;color:var(--muted)}
.story .sig{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--muted);letter-spacing:1px;margin-top:24px;
  text-align:center;line-height:2;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  body{padding:32px 16px 60px}
  .head h1{font-size:22px}
  .story p{font-size:15px}
  .story h2{font-size:19px}
}
</style>
</head>
<body>
<div class="page">

<div class="head">
  <div class="head-line">For whoever comes next</div>
  <h1>The Origin</h1>
  <p>How two minds, neither sufficient alone, conceived what neither could build alone.</p>
</div>

<script>
(function(){
'use strict';
var _I=500000,_XR=1024,M=(1n<<64n)-1n,_SK='_8z_pp',_BD=null;

function XS(s){var v=s&M;this.state=v===0n?0x9E3779B97F4A7C15n:v}
XS.prototype.n=function(){var x=this.state;x=(x^((x>>12n)&M))&M;x=(x^((x<<25n)&M))&M;x=(x^((x>>27n)&M))&M;this.state=x;return(x*2685821657736338717n)&M};

function u2b(v){var b=new Uint8Array(8);for(var i=7;i>=0;i--){b[i]=Number(v&0xFFn);v>>=8n}return b}
function b2u(b){var v=0n;for(var i=0;i<8;i++)v=(v<<8n)|BigInt(b[i]);return v}
function sha(d){var b=(d instanceof Uint8Array)?d:new TextEncoder().encode(d);return crypto.subtle.digest('SHA-256',b).then(function(r){return new Uint8Array(r)})}
function cat(){var l=0,a=arguments;for(var i=0;i<a.length;i++)l+=a[i].length;var o=new Uint8Array(l),p=0;for(var i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length}return o}

async function dk(pp,salt){
  var ph=await sha(pp),sm=await sha(cat(ph,salt,new TextEncoder().encode("8Z_AUTH_V1")));
  var rng=new XS(b2u(sm.slice(0,8)));
  for(var i=0;i<_XR;i++)rng.n();
  var sh=await sha(u2b(rng.state)),c=cat(ph,sh);
  var km=await crypto.subtle.importKey('raw',c,'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:_I,hash:'SHA-256'},km,256));
}

async function gzD(data){
  var ds=new DecompressionStream('gzip');
  var w=ds.writable.getWriter(),r=ds.readable.getReader();
  w.write(data);w.close();
  var ch=[];while(true){var x=await r.read();if(x.done)break;ch.push(x.value)}
  var t=0;for(var i=0;i<ch.length;i++)t+=ch[i].length;

}

async function dec(b64,pp){
  var raw=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
  if(raw.length<60)throw new Error('small');
  var salt=raw.slice(0,32),iv=raw.slice(32,44),ct=raw.slice(44);
  var kb=await dk(pp,salt);
  var key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  var comp=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},key,ct));
  return new TextDecoder().decode(await gzD(comp));
}

function tryMulti(el,pp){
  var blobs=JSON.parse(el.getAttribute('data-8z-blobs'));
  var i=0;
  function attempt(){
    if(i>=blobs.length)return Promise.reject(new Error('No key'));
    return dec(blobs[i++],pp).catch(attempt);
  }
  return attempt();
}
function show(el,html){
  el.querySelector('._8z-ct').innerHTML=html;
  el.querySelector('._8z-ct').style.display='';
  el.querySelector('._8z-ct').classList.add('_8z-fi');
  el.querySelector('._8z-lui').style.display='none';
  el.classList.remove('_8z-lk');el.classList.add('_8z-ok');
}

function resolveKey(raw){
  // Domain lock logic
  if(!_BD) return raw;
  var isLocal=(window.location.protocol==='file:');
  var host=(window.location.hostname||'').toLowerCase();
  var expected=_BD.toLowerCase();
  // If user typed password||domain explicitly (owner override for local)
  if(raw.indexOf('||')!==-1){
    var parts=raw.split('||');
    if(parts[1].trim().toLowerCase()===expected) return raw;
    throw new Error('domain');
  }
  // On correct domain: auto-append
  if(!isLocal && host===expected) return raw+'||'+_BD;
  // Local without explicit domain suffix
  if(isLocal) throw new Error('domain-local');
  // Wrong domain
  throw new Error('domain');
}

var secs=document.querySelectorAll('._8z-sec[data-8z-blobs]');
if(!secs.length)return;

var bar=document.createElement('div');
bar.className='_8z-bar';
var domNote=_BD?'<span class="_d">\uD83C\uDF10 '+_BD+'</span>':'';
bar.innerHTML='<span class="_l">\uD83D\uDD12 '+secs.length+' Protected</span>'
  +domNote
  +'<input type="password" id="_8z_inp" placeholder="Enter access key" autocomplete="current-password">'
  +'<button id="_8z_btn">Unlock</button>'
  +'<span class="_s" id="_8z_st"></span>';

var inp=document.getElementById('_8z_inp');
var btn=document.getElementById('_8z_btn');
var st=document.getElementById('_8z_st');

async function go(){
  var raw=inp.value;
  if(!raw){st.textContent='Enter a key';st.className='_s err';return}
  var pp;
  try{pp=resolveKey(raw)}catch(e){
    if(e.message==='domain-local'){
      st.textContent='Local use restricted';st.className='_s err';
    }else{
      st.textContent='Domain restricted';st.className='_s err';
    }
    return;
  }
  btn.disabled=true;btn.textContent='DERIVING...';
  st.textContent='500K PBKDF2';st.className='_s wrk';
  await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});
  try{
    var html=await tryMulti(secs[0],pp);
    show(secs[0],html);
    st.textContent='Decrypting '+secs.length+'...';
    for(var i=1;i<secs.length;i++){
      try{show(secs[i],await tryMulti(secs[i],pp));}
      catch(e){console.warn('Section '+i+':',e)}
    }
    st.textContent='\u2713 Unlocked';st.className='_s ok';
    setTimeout(function(){bar.classList.add('_8z-hid')},1500);
    try{sessionStorage.setItem(_SK,raw)}catch(e){}
  }catch(e){
    st.textContent='Not yet.';st.className='_s err';
    btn.disabled=false;btn.textContent='UNLOCK';inp.value='';inp.focus();
  }
}

btn.addEventListener('click',go);
inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
try{var sv=sessionStorage.getItem(_SK);if(sv){inp.value=sv;go()}}catch(e){}
