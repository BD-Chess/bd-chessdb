<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>MyDeepSeekRHP · MDL×DCC</title>
  <link rel="stylesheet" href="/deepseek-chat/chat.css">
  <script src="/deepseek-chat/chat.js" defer></script>
</head>
<body>
  <main id="page">
    <header class="heading">
      <a class="brand" href="/" aria-label="MDL×DCC, domača stran">MDL<span>×</span>DCC</a>
      <button id="logout" type="button" hidden>Odjava</button>
    </header>
    <section class="card" aria-labelledby="title">
      <h1 id="title">MyDeepSeekRHP</h1>
      <p id="account" class="muted" hidden></p>
      <form id="login" method="post" action="/deepseek-chat/api/session" hidden>
        <label for="email">Uporabniško ime</label>
        <input id="email" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
        <label for="password">Geslo</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <button class="primary" id="submit" type="submit">Prijava</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">Preverjam prijavo …</p>
      <section id="chat" aria-label="Spletni klepet" hidden>
        <p id="connection" class="connection" role="status"></p>
        <section id="work" class="work-panel" aria-labelledby="work-heading" hidden>
          <h2 id="work-heading">Delo na projektu</h2>
          <div class="work-controls">
            <label for="operation">Način
              <select id="operation">
                <option value="chat">Klepet</option>
                <option value="plan">Plan</option>
                <option value="build">Build</option>
              </select>
            </label>
            <label id="project-field" for="project" hidden>Projekt
              <select id="project"><option value="">Pridobi projekte z WORK</option></select>
            </label>
            <button id="load-projects" type="button" hidden>Pridobi projekte</button>
          </div>
          <label for="recent">Zadnje zahteve</label>
          <select id="recent"><option value="">Izberi zahtevo</option></select>
          <button id="reopen" type="button" disabled>Odpri stanje</button>
          <button id="review-rhp" type="button" hidden disabled>Preglej z RHP</button>
        </section>
        <div id="transcript" class="transcript" role="log" aria-label="Sporočila" hidden></div>
        <form id="composer" method="post" action="/deepseek-chat/api/messages">
          <label id="prompt-label" for="prompt">Sporočilo</label>
          <textarea id="prompt" name="prompt" rows="3" maxlength="8000" required disabled></textarea>
          <div class="composer-actions">
            <label class="reasoning"><input id="reasoning" type="checkbox" checked disabled> Reasoning</label>
            <button id="stop" type="button" hidden disabled>STOP</button>
            <button id="refresh" type="button" hidden>Preveri stanje</button>
            <button id="release" type="button" hidden>Opusti čakanje</button>
            <button id="send" class="primary" type="submit" disabled>Pošlji</button>
          </div>
        </form>
        <section id="review" class="work-panel" aria-labelledby="review-heading" hidden>
          <h2 id="review-heading">Pregled diffa</h2>
          <pre id="diff" tabindex="0" aria-label="Spremembe pred zapisom"></pre>
          <details><summary>Podatki potrditve</summary><pre id="binding"></pre></details>
          <label class="approval"><input id="check-diff" type="checkbox"> Pregledal sem prikazani diff</label>
          <div class="composer-actions">
            <button id="reject" type="button">Zavrni</button>
            <button id="approve" class="primary" type="button" disabled>Potrdi zapis in test</button>
          </div>
        </section>
        <p id="delivery" class="status" role="status"></p>
      </section>
      <p><a href="/deepseek-chat/about.html">O aplikaciji in zasebnosti</a></p>
      <noscript><p class="status">Za prijavo vključi JavaScript.</p></noscript>
    </section>
  </main>
</body>
</html>
