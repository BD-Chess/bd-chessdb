:root{--bg:#0d141b;--panel:#131d26;--text:#eaf1f7;--muted:#a9b9c7;--line:#2a3a49;--accent:#63b5f6;--bad:#ff8f8f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 30%,#173047 0,#0d141b 46%,#090e13 100%);color:var(--text);font:16px/1.5 Inter,Segoe UI,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
.lock{width:min(460px,100%);background:rgba(19,29,38,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.45);backdrop-filter:blur(16px)}
.mark{width:68px;height:68px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:#142c3d;border:1px solid #2f5872;font-size:31px}
h1{font-size:28px;line-height:1.1;text-align:center;margin:0 0 8px}
.sub{color:var(--muted);text-align:center;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
input{min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0d141b;color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,181,246,.12)}
button{padding:13px 18px;border-radius:12px;border:0;background:var(--accent);color:#07121a;font:700 14px/1 Segoe UI,system-ui;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#st{min-height:22px;margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.foot{margin-top:18px;text-align:center;color:#708394;font-size:11px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .38s ease}

const MASK=(1n<<64n)-1n;
class XS{constructor(s){let v=s&MASK;this.state=v===0n?0x9E3779B97F4A7C15n:v}n(){let x=this.state;x=(x^((x>>12n)&MASK))&MASK;x=(x^((x<<25n)&MASK))&MASK;x=(x^((x>>27n)&MASK))&MASK;this.state=x;return(x*2685821657736338717n)&MASK}}
function u2b(v){const b=new Uint8Array(8);for(let i=7;i>=0;i--){b[i]=Number(v&0xFFn);v>>=8n}return b}
function b2u(b){let v=0n;for(let i=0;i<8;i++)v=(v<<8n)|BigInt(b[i]);return v}
async function sha(d){const b=(d instanceof Uint8Array)?d:new TextEncoder().encode(d);return new Uint8Array(await crypto.subtle.digest('SHA-256',b))}
function cat(...a){let l=0;for(const x of a)l+=x.length;const o=new Uint8Array(l);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o}

async function gunzip(comp){if(!('DecompressionStream' in window))throw new Error('unsupported');const stream=new Blob([comp]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
async function dec(b64,pp){const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const salt=raw.slice(0,32),iv=raw.slice(32,44),ct=raw.slice(44);const kb=await dk(pp,salt);const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);const comp=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,ct));return new TextDecoder().decode(await gunzip(comp))}
async function unlock(){const inp=document.getElementById('p'),btn=document.getElementById('b'),st=document.getElementById('st'),box=document.getElementById('lock');const pp=inp.value;if(!pp)return;btn.disabled=true;st.textContent='Odklepanje…';try{const html=await dec(BLOB,pp);document.open();document.write(html);document.close()}catch(e){btn.disabled=false;st.textContent=e&&e.message==='unsupported'?'Ta brskalnik ne podpira potrebnega DecompressionStream API.':'Napačno geslo.';inp.value='';inp.focus();box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake')}}
document.getElementById('b').addEventListener('click',unlock);
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
