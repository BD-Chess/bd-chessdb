*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 30%,#173047 0,#0d141b 46%,#090e13 100%);color:var(--text);font:16px/1.5 Inter,Segoe UI,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
.lock{width:min(460px,100%);background:rgba(19,29,38,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.45);backdrop-filter:blur(16px)}

.sub{color:var(--muted);text-align:center;margin:0 0 22px}

input{min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0d141b;color:var(--text);font:inherit;outline:none}

const MASK=(1n<<64n)-1n;
class XS{constructor(s){let v=s&MASK;this.state=v===0n?0x9E3779B97F4A7C15n:v}n(){let x=this.state;x=(x^((x>>12n)&MASK))&MASK;x=(x^((x<<25n)&MASK))&MASK;x=(x^((x>>27n)&MASK))&MASK;this.state=x;return(x*2685821657736338717n)&MASK}}
function u2b(v){const b=new Uint8Array(8);for(let i=7;i>=0;i--){b[i]=Number(v&0xFFn);v>>=8n}return b}
function b2u(b){let v=0n;for(let i=0;i<8;i++)v=(v<<8n)|BigInt(b[i]);return v}
async function sha(d){const b=(d instanceof Uint8Array)?d:new TextEncoder().encode(d);return new Uint8Array(await crypto.subtle.digest('SHA-256',b))}
function cat(...a){let l=0;for(const x of a)l+=x.length;const o=new Uint8Array(l);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o}
