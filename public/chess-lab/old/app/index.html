<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#11251d">
  <title>ChessBest APP · iPhone preview</title>
  <script>
    (() => {
      const ua = navigator.userAgent || '';
      const tabletBrowser = /iPad|Tablet|PlayBook|Silk/i.test(ua);
      const phoneBrowser = !tabletBrowser && (navigator.userAgentData?.mobile === true ||
        /iPhone|iPod|Windows Phone|Android.+Mobile/i.test(ua));
      if (phoneBrowser) document.documentElement.classList.add('app-phone-browser');
    })();
  </script>
  <style id="bd-version-style">
    :root { --phone-width: 402px; --phone-height: 874px; color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #101a16; color: #e7f4ec; }
    header { width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 24px; display: grid; grid-template-columns: minmax(160px, 1fr) auto; align-items: center; column-gap: 20px; }
    h1 { justify-self: start; margin: 0; font-size: 18px; letter-spacing: .01em; }
    .header-tools { display: contents; }
    .bd-version-selector { justify-self: center; display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; letter-spacing: .06em; }
    .bd-version-selector a { display: inline-flex; align-items: center; min-height: 44px; padding: 3px 8px; color: #b5c9bb; text-decoration: none; border: 1px solid transparent; border-radius: 6px; }
    .bd-version-selector a:hover, .bd-version-selector a:focus-visible { color: white; border-color: #69977e; }
    .bd-version-selector a[aria-current="page"] { color: #bdf6ce; background: #16382b; border-color: #48765d; }
    .bd-version-dot { color: #819b8b; }
    main { display: flex; flex: 1 1 auto; flex-direction: column; align-items: center; justify-content: center; padding: 16px 16px 32px; }
    .preview-width { justify-self: end; display: flex; align-items: center; gap: 8px; margin-left: 0; color: #adc2b5; font-size: 12px; white-space: nowrap; }
    .preview-width select { min-height: 40px; border: 1px solid #53725e; border-radius: 8px; color: #e7f4ec; background: #1c3428; padding: 7px 9px; font: inherit; }
    .preview-stage { position: relative; flex: 0 0 auto; width: 416px; height: 888px; }
    .phone-frame { position: absolute; top: 0; left: 0; width: calc(var(--phone-width) + 14px); height: calc(var(--phone-height) + 14px); transform-origin: top left; padding: 6px; background: #010705; border: 1px solid #59735f; border-radius: 32px; box-shadow: 0 18px 60px #0008; }
    iframe { display: block; width: 100%; height: var(--phone-height); border: 0; border-radius: 26px; background: #101a16; }
    .preview-system-bar { position: absolute; top: 28px; left: 7px; right: 7px; display: flex; justify-content: space-between; align-items: center; padding: 0 39px; height: 22px; pointer-events: none; color: #f2f4ef; font: 600 17px/1 system-ui, sans-serif; }
    .preview-system-status { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .preview-signal { font-size: 11px; letter-spacing: -2px; padding-right: 3px; }
    .preview-battery { position: relative; width: 24px; height: 12px; border: 1px solid currentColor; border-radius: 3px; }
    .preview-battery::before { content: ""; position: absolute; inset: 2px; border-radius: 1px; background: currentColor; }
    .preview-battery::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 4px; background: currentColor; }
    @media (max-width: 700px) {
      header { grid-template-columns: minmax(0, 1fr) auto; column-gap: 6px; padding-inline: 10px; }
      h1 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .bd-version-selector { gap: 2px; font-size: 9px; }
      .bd-version-selector a { padding-inline: 2px; }
      .preview-width { min-width: 0; max-width: 100%; }
      .preview-width select { min-width: 0; max-width: 100%; }
      .preview-width-label { display: none; }
    }
    @media (max-width: 480px) {
      header { padding: 12px 10px; justify-content: center; }
      .header-tools { justify-content: center; gap: 10px 14px; }
      .preview-width { margin-left: 0; }
      main { padding: 0 8px 24px; }
    }
    .app-phone-browser body { min-height: 100dvh; background: #101a16; overflow: hidden; }
    .app-phone-browser body > header { display: none !important; }
    .app-phone-browser main { display: block; width: 100%; height: 100dvh; padding: 0; }
    .app-phone-browser .preview-stage { width: 100%; height: 100dvh; }
    .app-phone-browser .preview-system-bar { display: none; }
    .app-phone-browser .phone-frame {
      position: static; width: 100vw; max-width: none; height: 100dvh; padding: 0; transform: none;
      border: 0; border-radius: 0; box-shadow: none; background: #101a16;
    }
    .app-phone-browser iframe { width: 100%; height: 100dvh; border-radius: 0; }
  </style>
</head>
<body>
  <header>
    <h1>ChessBest · APP preview</h1>
    <div class="header-tools">
      <label class="preview-width"><span class="preview-width-label">Preview width</span> <select id="previewWidth" aria-label="Preview width">
        <option value="375">375 px</option><option value="390">390 px</option>
        <option value="402" selected>402 px · iPhone 16 Pro</option><option value="430">430 px</option>
      </select></label>
    </div>
  </header>
  <main>
    <div class="preview-stage" id="previewStage">
    <div class="phone-frame" id="phoneFrame">
      <iframe src="play.html?embedded=1&amp;build=20260930-device1" title="ChessBest APP mobile interface" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
      <div class="preview-system-bar" aria-hidden="true"><span>09:41</span><span class="preview-system-status"><span class="preview-signal">▂▄▆▉</span><span>5G</span><span class="preview-battery"></span></span></div>
    </div>
    </div>
  </main>
  <script src="js/app-preview.js"></script>
</body>
</html>
