 stena</text><text x="98" y="443" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Loči obe poti tekočine</text><text x="98" y="467" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Prenos toplote zahteva T-profil</text><path d="M354 429H409L492 445" fill="none" stroke="#c8d694" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><circle cx="70" cy="591" r="16" fill="#72c8ee"/><text x="70" y="597" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">3</text><text x="98" y="598" fill="#72c8ee" font-size="22" text-anchor="start" font-weight="600">Hladni obroč</text><text x="98" y="626" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Povratek hladnih kapsul</text><text x="98" y="650" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Zunanji volumen je manjši</text><path d="M353 612H404L464 560" fill="none" stroke="#72c8ee" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><circle cx="838" cy="215" r="16" fill="#c8d694"/><text x="838" y="221" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">4</text><text x="866" y="222" fill="#c8d694" font-size="22" text-anchor="start" font-weight="600">Zgornji prehod</text><text x="866" y="250" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Kandidatna rotorska komora</text><text x="866" y="274" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Brez podrobne izvedbe tesnil</text><path d="M815 232H727L687 219" fill="none" stroke="#c8d694" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><circle cx="838" cy="405" r="16" fill="#70d5b0"/><text x="838" y="411" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">5</text><text x="866" y="412" fill="#70d5b0" font-size="22" text-anchor="start" font-weight="600">Indukcijske cone</text><text x="866" y="440" f