<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">En vložek. Celoten cikel.</title><desc id="desc">Konceptualno zaporedje segrevanja, shranjevanja dela, impulznega izhoda ter hlajenja in reseta. Shema ne prikazuje časov ali izmerjene energije.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7fc9bc" stroke-width="1.5"/></marker></defs><rect width="1200" height="600" rx="22" fill="#0b1920"/><g font-family="Arial, sans-serif"><text x="42" y="43" fill="#a8c8bb" font-size="15">DGTE-P/L · ZAPOREDJE DELOVANJA</text><text x="42" y="86" fill="#e4ece8" font-size="30">En vložek. Celoten cikel.</text><rect x="34" y="130" width="277" height="330" rx="14" fill="#12272e" stroke="#36525b"/><text x="54" y="169" font-size="14" fill="#efb184">01 / SEGRIJ</text><rect x="52" y="230" width="76" height="72" rx="6" fill="#6e4b30" stroke="#efb184"/><path d="M125 230l-7 12 14 12 -14 12 14 12 -14 12 7 12" fill="none" stroke="#dbe8e7" stroke-width="3"/><path d="M130 266H165" stroke="#dbe8e7" stroke-width="6"/><path d="M165 266l8 -11 12 22 12 -22 12 22 8 -11h12" fill="none" stroke="#efc685" stroke-width="3"/><rect x="274" y="244" width="23" height="45" rx="3" fill="#2c6470" stroke="#86cee9"/><path d="M281 252v29m5 -29v29m5 -29v29" stroke="#efb184" stroke-width="2"/><path d="M59 208h45" stroke="#efb184" stroke-width="3" marker-end="url(#a)"/><text x="52" y="355" fill="#e4ece8" font-size="15">Vložek se razširi.</text><text x="52" y="386" fill="#b2c5c1" font-size="13">Toplota povzroči hod.</text><rect x="325" y="130" width="277" height="330" rx="14" fill="#12272e" stroke="#36525b"/><text x="345" y="169" font-size="14" fill="#efb184">02 / NAPNI</text><rect x="343" y="230" width="76" height="72" rx="6" fill="#6e4b30" stroke="#efb184"/><path d="M416 230l-7 12 14 12 -14 12 14 12 -14 12 7 12" fill="none" stroke="#dbe8e7" stroke-width="3"/><path d="M421 266H481" stroke="#dbe8e7" stroke-width="6"/><path d="M481 266l8 -11 12 22 12 -22 12 22 8 -11h12" fill="none" stroke="#efc685" stroke-width="3"/><rect x="565" y="244" width="23" height="45" rx="3" fill="#2c6470" stroke="#86cee9"/><path d="M572 252v29m5 -29v29m5 -29v29" stroke="#efb184" stroke-width="2"/><path d="M527 215v24h12" fill="none" stroke="#c5d6a4" stroke-width="5"/><text x="343" y="355" fill="#e4ece8" font-size="15">Vzmet shrani delo.</text><text x="343" y="386" fill="#b2c5c1" font-size="13">Zapah zadrži mehanizem.</text><rect x="616" y="130" width="277" height="330" rx="14" fill="#12272e" stroke="#36525b"/><text x="636" y="169" font-size="14" fill="#efb184">03 / SPROSTI</text><rect x="634" y="230" width="76" height="72" rx="6" fill="#6e4b30" stroke="#efb184"/><path d="M707 230l-7 12 14 12 -14 12 14 12 -14 12 7 12" fill="none" stroke="#dbe8e7" stroke-width="3"/><path d="M712 266H772" stroke="#dbe8e7" stroke-width="6"/><path d="M772 266l8 -11 12 22 12 -22 12 22 8 -11h12" fill="none" stroke="#efc685" stroke-width="3"/><rect x="856" y="244" width="23" height="45" rx="3" fill="#2c6470" stroke="#86cee9"/><path d="M863 252v29m5 -29v29m5 -29v29" stroke="#efb184" stroke-width="2"/><path d="M776 210h72" stroke="#7fc9bc" stroke-width="3" marker-end="url(#a)"/><text x="634" y="355" fill="#e4ece8" font-size="15">Vzmet požene generator.</text><text x="634" y="386" fill="#b2c5c1" font-size="13">Kratek uporaben impulz.</text><rect x="907" y="130" width="277" height="330" rx="14" fill="#12272e" stroke="#36525b"/><text x="927" y="169" font-size="14" fill="#86cee9">04 / OHLADI / RESET</text><rect x="925" y="230" width="76" height="72" rx="6" fill="#254956" stroke="#86cee9"/><path d="M998 230l-7 12 14 12 -14 12 14 12 -14 12 7 12" fill="none" stroke="#dbe8e7" stroke-width="3"/><path d="M1003 266H1038" stroke="#dbe8e7" stroke-width="6"/><path d="M1038 266l8 -11 12 22 12 -22 12 22 8 -11h12" fill="none" stroke="#efc685" stroke-width="3"/><rect x="1147" y="244" width="23" height="45" rx="3" fill="#2c6470" stroke="#86cee9"/><path d="M1154 252v29m5 -29v29m5 -29v29" stroke="#efb184" stroke-width="2"/><path d="M1127 210h-66" stroke="#86cee9" stroke-width="3" marker-end="url(#a)"/><text x="925" y="355" fill="#e4ece8" font-size="15">Vložek se skrči.</text><text x="925" y="386" fill="#b2c5c1" font-size="13">Povratni hod stane energijo.</text><path d="M1115 480v24H83v-24" fill="none" stroke="#7fc9bc" stroke-width="2" marker-end="url(#a)"/><text x="600" y="535" text-anchor="middle" fill="#c5d6a4" font-size="17">Vedno merimo oba hoda, toploto, izgube in čas celotnega cikla.</text><text x="600" y="574" text-anchor="middle" fill="#97aaa9" font-size="13">Konceptualno zaporedje · ni v merilu · impulzna moč ni povprečna moč</text></g></svg>