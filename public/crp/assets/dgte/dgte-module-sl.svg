<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">DGTE — izmenljiv termični vložek in impulzni izhod</title><desc id="d">Konceptualni 2D prerez termičnega aktuatorja, mehanske vzmeti in zapaha, hladnega magnetnega generatorja ter treh možnih izhodov. Stanja: hladno pripravljeno, toplo napeto, ohlajeno sproži. Ni načrt za izdelavo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#88d4bb"/></marker></defs><rect width="1200" height="720" rx="20" fill="#0b1c24"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="48" font-size="15" fill="#9fceb9" font-weight="600">DGTE / RHP R2 / PREDLAGANA RAZVOJNA ARHITEKTURA</text><text x="38" y="91" font-size="29" fill="#dce8e6" font-weight="600">Toplota počasi polni. Uporaben dogodek sproži izhod.</text><text x="38" y="124" font-size="18" fill="#a9bbb9" font-weight="400">Izmenljiv termični vložek · isti merilni prenos · trije primerjalni izhodi</text><rect x="38" y="164" width="330" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="57" y="197" font-size="15" fill="#b7d4c7" font-weight="600">1 / TERMALNI VLOŽEK</text><rect x="402" y="164" width="355" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="421" y="197" font-size="15" fill="#b7d4c7" font-weight="600">2 / PRENOS IN POMNILNIK</text><rect x="791" y="164" width="371" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="810" y="197" font-size="15" fill="#b7d4c7" font-weight="600">3 / UPORABNO BREME</text><rect x="83" y="253" width="197" height="139" rx="18" fill="#243f48" stroke="#d4e4df" stroke-width="2"/><rect x="96" y="265" width="137" height="115" rx="8" fill="#efb077" fill-opacity="0.3333"/><path d="M114 269V375" stroke="#efb077" stroke-width="3"/><path d="M141 269V375" stroke="#efb077" stroke-width="3"/><path d="M168 269V375" stroke="#efb077" stroke-width="3"/><path d="M195 269V375" stroke="#efb077" stroke-width="3"/><path d="M222 269V375" stroke="#efb077" stroke-width="3"/><path d="M244 265Q219 322 244 380" fill="none" stroke="#dce8e6" stroke-width="4"/><path d="M244 322H348" stroke="#dce8e6" stroke-width="9"/><text x="109" y="323" font-size="16" fill="#dce8e6" font-weight="400">PCM / plin / para</text><text x="82" y="235" font-size="17" fill="#efb077" font-weight="400">T(t) iz okolja ali procesa</text><text x="67" y="420" font-size="16" fill="#a9bbb9" font-weight="400">Meritev: F(x,T), p(V,T), čas, Q</text><text x="67" y="448" font-size="15" fill="#a9bbb9" font-weight="400">Visokotlačna izvedba še ni izbrana.</text><path d="M347 322H418" stroke="#88d4bb" stroke-width="3" marker-end="url(#a)"/><path d="M434 318H454L467 296L485 340L503 296L521 340L539 296L557 340L575 318H595" fill="none" stroke="#e9bf81" stroke-width="3"/><rect x="602" y="263" width="117" height="111" rx="12" fill="#1c3b43" stroke="#a6d2b5"/><text x="618" y="300" font-size="18" fill="#a6d2b5" font-weight="600">ZAPAH</text><text x="623" y="334" font-size="22" fill="#e9bf81" font-weight="400">0 → 1</text><text x="430" y="236" font-size="16" fill="#e9bf81" font-weight="400">Vzmet / akumulator + prosti tek</text><text x="429" y="416" font-size="16" fill="#a9bbb9" font-weight="400">Magnet, prenos in elektronika</text><text x="429" y="442" font-size="15" fill="#a9bbb9" font-weight="400">ostanejo termično ločeni od vložka.</text><path d="M721 322H803" stroke="#88d4bb" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="222" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="255" font-size="18" fill="#bde3d4" font-weight="400">A · mehanski bit / števec</text><rect x="825" y="291" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="324" font-size="18" fill="#bde3d4" font-weight="400">B · neposreden pomik</text><rect x="825" y="360" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="393" font-size="18" fill="#bde3d4" font-weight="400">C · magnet → DC → breme</text><text x="825" y="450" font-size="16" fill="#a9bbb9" font-weight="400">Primerjamo vsak izhod posebej.</text><rect x="38" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="55" y="565" font-size="17" fill="#b6d9ca" font-weight="600">HLADNO · PRIPRAVLJENO</text><text x="55" y="596" font-size="15" fill="#a9bbb9" font-weight="400">Brez porabe za stalno čakanje</text><rect x="429" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="446" y="565" font-size="17" fill="#b6d9ca" font-weight="600">TOPLO · NAPETO</text><text x="446" y="596" font-size="15" fill="#a9bbb9" font-weight="400">Topli prag pripravi mehanski bit</text><rect x="820" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="837" y="565" font-size="17" fill="#b6d9ca" font-weight="600">OHLAJENO · DOGODEK</text><text x="837" y="596" font-size="15" fill="#a9bbb9" font-weight="400">Hladni prag sprosti izhod in reset</text><path d="M385 580H420M775 580H810" stroke="#88d4bb" stroke-width="2" marker-end="url(#a)"/><text x="38" y="670" font-size="18" fill="#bde3d4" font-weight="400">Sklenjen cikel: izhod − reset − preklop − lastna raba; prednapetost ni pridelek.</text><text x="38" y="702" font-size="15" fill="#a9bbb9" font-weight="400">Konceptualni 2D prerez; ni v merilu. Delovni medij, tlak in izvedba ostajajo predmet meritve.</text></g></svg>