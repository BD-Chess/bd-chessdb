<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="vt vd"><title id="vt">DGTE-VS — one-body vapor buoyancy oscillator</title><desc id="vd">One capsule shown in two successive states, with closed rope loop, two pulleys, dry generator, heating and cooling stations. Bath thermal profile and losses remain open.</desc><rect width="1200" height="720" rx="20" fill="#0b1c24"/><defs><marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#efb077"/></marker><marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#88c7e8"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="48" font-size="15" fill="#9fceb9" font-weight="600">DGTE-VS / RESEARCH BRANCH</text><text x="38" y="91" font-size="26" fill="#dce8e6" font-weight="600">Large phase-change ΔV. One capsule. Two-way power take-off.</text><text x="38" y="124" font-size="17" fill="#a9bbb9" font-weight="400">Sealed phase-change fluid · dry generator · no rotary crossovers</text><rect x="436" y="207" width="305" height="429" rx="32" fill="#193742" stroke="#aec4c8" stroke-width="2"/><rect x="451" y="222" width="275" height="77" rx="15" fill="#88c7e8" fill-opacity="0.1961"/><rect x="451" y="547" width="275" height="73" rx="15" fill="#efb077" fill-opacity="0.2510"/><path d="M488 226V596Q488 614 505 614Q522 614 522 596V226Q522 208 505 208Q488 208 488 226Z" fill="none" stroke="#a6d2b5" stroke-width="3"/><circle cx="505" cy="225" r="17" fill="#203b44" stroke="#a6d2b5"/><circle cx="505" cy="597" r="17" fill="#203b44" stroke="#a6d2b5"/><path d="M505 225V179H815" fill="none" stroke="#a6d2b5" stroke-width="3"/><rect x="817" y="153" width="240" height="58" rx="12" fill="#174238" stroke="#88d4bb"/><text x="840" y="179" font-size="17" fill="#bde3d4" font-weight="600">DRY GENERATOR</text><text x="840" y="202" font-size="15" fill="#bde3d4" font-weight="400">→ DC</text><g stroke="#efb077" stroke-width="2"><ellipse cx="619" cy="452" rx="65" ry="81" fill="#efb077" fill-opacity="0.1569"/><rect x="589" y="510" width="60" height="27" rx="8" fill="#334c54"/><path d="M589 524H522"/></g><g stroke="#88c7e8" stroke-width="2" stroke-dasharray="6 4"><rect x="589" y="315" width="60" height="41" rx="12" fill="#88c7e8" fill-opacity="0.1020"/><path d="M589 340H522"/></g><path d="M703 509V368" stroke="#efb077" stroke-width="3" marker-end="url(#va)"/><path d="M557 367V491" stroke="#88c7e8" stroke-width="3" marker-end="url(#vb)"/><text x="570" y="265" font-size="16" fill="#88c7e8" font-weight="600">COOLING STATION</text><text x="570" y="586" font-size="16" fill="#efb077" font-weight="600">HEATING STATION</text><text x="38" y="241" font-size="20" fill="#efb077" font-weight="600">LARGE EXTERNAL DISPLACEMENT</text><text x="38" y="274" font-size="17" fill="#a9bbb9" font-weight="400">Vapor expands the compliant envelope.</text><text x="38" y="300" font-size="17" fill="#a9bbb9" font-weight="400">Sealed working-fluid mass stays constant.</text><path d="M354 275H397L553 414" fill="none" stroke="#efb077" stroke-width="1.5"/><text x="38" y="418" font-size="20" fill="#a6d2b5" font-weight="600">CLOSED ROPE LOOP</text><text x="38" y="451" font-size="17" fill="#a9bbb9" font-weight="400">Two branches maintain rope tension.</text><text x="38" y="477" font-size="17" fill="#a9bbb9" font-weight="400">Both pulley losses must be subtracted.</text><path d="M354 449H398L488 490" fill="none" stroke="#a6d2b5" stroke-width="1.5"/><text x="800" y="300" font-size="19" fill="#88c7e8" font-weight="600">SMALL COLD DISPLACEMENT</text><text x="800" y="333" font-size="17" fill="#a9bbb9" font-weight="400">Condensation enables the return stroke.</text><text x="800" y="359" font-size="16" fill="#a9bbb9" font-weight="400">Dashed: another phase of the same body.</text><path d="M781 328H757L651 337" fill="none" stroke="#88c7e8" stroke-width="1.5"/><text x="800" y="453" font-size="19" fill="#bde3d4" font-weight="600">DECISIVE MEASUREMENTS</text><text x="800" y="486" font-size="17" fill="#a9bbb9" font-weight="400">F(z), V(z), T(z), p(z), time, Q</text><text x="800" y="512" font-size="17" fill="#a9bbb9" font-weight="400">Complete-cycle input and output</text><text x="800" y="538" font-size="15" fill="#a9bbb9" font-weight="400">Convection and early condensation</text><text x="800" y="564" font-size="17" fill="#a9bbb9" font-weight="400">remain critical open constraints.</text><text x="38" y="680" font-size="17" fill="#a9bbb9" font-weight="400">Comparative test concept; no selected fluid or qualified membrane. Not to scale.</text></g></svg>