<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">DGTE — predlagani koaksialni cikel</title><desc id="desc">Konceptualni vzdolžni prerez in prečni prerez. Osrednji topli dvižni kanal in hladni zunanji obroč ločuje rekuperatorska stena. Gibanje kapsul je pogojeno z izmerjenim obratom vzgona.</desc><defs><linearGradient id="shell" x2="1" y2="0"><stop stop-color="#263e49"/><stop offset=".38" stop-color="#142d38"/><stop offset=".75" stop-color="#304d57"/><stop offset="1" stop-color="#112833"/></linearGradient><linearGradient id="hot" x2="0" y2="1"><stop stop-color="#e99a6038"/><stop offset="1" stop-color="#e99a6010"/></linearGradient><linearGradient id="cold" x2="1" y2="0"><stop stop-color="#72c8ee35"/><stop offset="1" stop-color="#72c8ee12"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c3039" stroke-width=".7"/></pattern><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-elec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="820" rx="24" fill="#0b1920"/><rect x="24" y="24" width="1152" height="772" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-s