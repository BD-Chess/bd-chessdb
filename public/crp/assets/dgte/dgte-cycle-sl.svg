ee" opacity=".42"/><path d="M-11 -8H11M-11 8H11" stroke="#72c8ee" opacity=".6"/></g><rect x="539" y="305" width="118" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><rect x="664" y="305" width="81" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><rect x="539" y="435" width="118" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><rect x="664" y="435" width="81" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><rect x="539" y="550" width="118" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><rect x="664" y="550" width="81" height="20" rx="5" fill="none" stroke="#70d5b0" stroke-width="2.4"/><text x="598" y="287" fill="#f4a36c" font-size="14" text-anchor="middle" font-weight="600">TOPLO ↑</text><text x="710" y="287" fill="#72c8ee" font-size="13" text-anchor="middle" font-weight="600">HLADNO ↓</text><circle cx="70" cy="197" r="16" fill="#f4a36c"/><text x="70" y="203" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">1</text><text x="98" y="204" fill="#f4a36c" font-size="22" text-anchor="start" font-weight="600">Dovod toplote</text><text x="98" y="232" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Zunanji vir → topli krog</text><text x="98" y="256" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Obrat vzgona je treba izmeriti</text><path d="M335 215H413L548 295" fill="none" stroke="#f4a36c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><circle cx="70" cy="348" r="16" fill="#c8d694"/><text x="70" y="354" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">2</text><text x="98" y="355" fill="#c8d694" font-size="22" text-anchor="start" font-weight="600">Vračanje toplote</text><text x="98" y="383" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Protitočna tokova tekočine</text><text x="98" y="407" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Kapsule ostanejo v svojih kanalih</text><path d="M348 364H410L533 405" fill="none" stroke="#c8d694" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><circle cx="70" cy="509" r="16" fill="#70d5b0"/><text x="70" y="515" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">3</text><text x="98" y="516" fill="#70d5b0" font-size="22" text-anchor="start" font-weight="600">Električni odvzem</text><text x="98" y="544" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Magneti + tuljave → usmernik → DC</text><text x="98" y="568" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Odvzem hkrati zavira gibanje</text><path d="M350 525H413L539 560" fill="none" stroke="#70d5b0" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-elec)"/><circle cx="818" cy="204" r="16" fill="#c8d694"/><text x="818" y="210" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">4</text><text x="846" y="211" fill="#c8d694" font-size="22" text-anchor="start" font-weight="600">Zgornji prehod</text><text x="846" y="239" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Mokri rotor / izravnana zapora</text><text x="846" y="263" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Izmeri delo in prenos tekočine</text><path d="M797 221H726" fill="none" stroke="#c8d694" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><circle cx="818" cy="358" r="16" fill="#72c8ee"/><text x="818" y="364" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">5</text><text x="846" y="365" fill="#72c8ee" font-size="22" text-anchor="start" font-weight="600">Odvod toplote</text><text x="846" y="393" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Hladni ponor sprejme toploto</text><text x="846" y="417" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Kapsula se skrči in se spusti</text><path d="M747 377H797" fill="none" stroke="#72c8ee" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><circle cx="818" cy="505" r="16" fill="#c8d694"/><text x="818" y="511" fill="#0b1920" font-size="16" text-anchor="middle" font-weight="700">6</text><text x="846" y="512" fill="#c8d694" font-size="22" text-anchor="start" font-weight="600">Spodnji prehod</text><text x="846" y="540" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Vrne kapsulo v topli kanal</text><text x="846" y="564" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">Prehod porablja koristno delo</text><path d="M797 529H778V637H727" fill="none" stroke="#c8d694" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><text x="85" y="665" fill="#a8bab8" font-size="13" text-anchor="start" font-weight="600">PREČNI PREREZ</text><circle cx="143" cy="724" r="43" fill="url(#cold)" stroke="#72c8ee"/><circle cx="143" cy="724" r="23" fill="#0b1920" stroke="#c8d694" stroke-width="5"/><circle cx="143" cy="724" r="18" fill="#f4a36c" fill-opacity="0.3333"/><text x="205" y="707" fill="#72c8ee" font-size="15" text-anchor="start" font-weight="400">Zunanji obroč: hladni povratek</text><text x="205" y="731" fill="#c8d694" font-size="15" text-anchor="start" font-weight="400">Stena: rekuperator</text><text x="205" y="755" fill="#f4a36c" font-size="15" text-anchor="start" font-weight="400">Sredina: topli dvižni kanal</text><text x="574" y="717" fill="#a8bab8" font-size="15" text-anchor="start" font-weight="400">Položaji tuljav in zunanji krogi so shematski.</text><text x="574" y="743" fill="#a8bab8" font-size="15" text-anchor="start" font-weight="400">Sprememba notranjosti mora spremeniti izpodriv.</text><text x="574" y="769" fill="#a8bab8" font-size="15" text-anchor="start" font-weight="400">Časi, temperaturni profil in neto delo zahtevajo poskus.</text></g></sv