<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">DGTE capsule — the buoyancy condition</title><desc id="desc">Cold compact and warm expanded versions of a fixed-mass capsule. Bellows are a candidate external displacement mechanism, not a qualified design.</desc><defs><linearGradient id="shell" x2="1" y2="0"><stop stop-color="#263e49"/><stop offset=".38" stop-color="#142d38"/><stop offset=".75" stop-color="#304d57"/><stop offset="1" stop-color="#112833"/></linearGradient><linearGradient id="hot" x2="0" y2="1"><stop stop-color="#e99a6038"/><stop offset="1" stop-color="#e99a6010"/></linearGradient><linearGradient id="cold" x2="1" y2="0"><stop stop-color="#72c8ee35"/><stop offset="1" stop-color="#72c8ee12"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c3039" stroke-width=".7"/></pattern><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-elec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="650" rx="24" fill="#0b1920"/><rect x="24" y="24" width="1152" height="602" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="56" fill="#c8d694" font-size="15" text-anchor="start" font-weight="600">DGTE / 02</text><text x="44" y="94" fill="#eaf1ee" font-size="30" text-anchor="start" font-weight="600">The capsule has to change what it displaces.</text><text x="44" y="126" fill="#a8bab8" font-size="18" text-anchor="start" font-weight="400">Same sealed mass m · external displaced volume V(T,p) must change enough</text><rect x="198" y="210" width="150" height="205" rx="46" fill="#72c8ee" fill-opacity="0.0824" stroke="#72c8ee" stroke-width="2.5"/><rect x="244" y="245.0" width="58" height="135" rx="18" fill="#596d7b" stroke="#d4e3e7"/><text x="273" y="317.5" fill="#eaf1ee" font-size="16" text-anchor="middle" font-weight="600">MAG</text><path d="M200 234l-14 5 14 5M346 234l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 251l-14 5 14 5M346 251l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 268l-14 5 14 5M346 268l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 285l-14 5 14 5M346 285l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 302l-14 5 14 5M346 302l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 319l-14 5 14 5M346 319l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 336l-14 5 14 5M346 336l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 353l-14 5 14 5M346 353l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 370l-14 5 14 5M346 370l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 387l-14 5 14 5M346 387l14 5-14 5" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M383 250v125" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><rect x="750" y="180" width="150" height="265" rx="46" fill="#f4a36c" fill-opacity="0.0824" stroke="#f4a36c" stroke-width="2.5"/><rect x="796" y="245.0" width="58" height="135" rx="18" fill="#596d7b" stroke="#d4e3e7"/><text x="825" y="317.5" fill="#eaf1ee" font-size="16" text-anchor="middle" font-weight="600">MAG</text><path d="M752 204l-14 5 14 5M898 204l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 221l-14 5 14 5M898 221l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 238l-14 5 14 5M898 238l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 255l-14 5 14 5M898 255l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 272l-14 5 14 5M898 272l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 289l-14 5 14 5M898 289l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 306l-14 5 14 5M898 306l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 323l-14 5 14 5M898 323l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 340l-14 5 14 5M898 340l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 357l-14 5 14 5M898 357l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 374l-14 5 14 5M898 374l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 391l-14 5 14 5M898 391l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M752 408l-14 5 14 5M898 408l14 5-14 5" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M935 405v-185" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><text x="273" y="170" fill="#72c8ee" font-size="20" text-anchor="middle" font-weight="600">COLD · COMPACT</text><text x="825" y="162" fill="#f4a36c" font-size="20" text-anchor="middle" font-weight="600">WARM · EXPANDED</text><text x="273" y="464" fill="#72c8ee" font-size="21" text-anchor="middle" font-weight="600">ρbath,c · Vc &lt; m → down</text><text x="825" y="484" fill="#f4a36c" font-size="21" text-anchor="middle" font-weight="600">ρbath,h · Vh &gt; m → up</text><path d="M405 298H672" fill="none" stroke="#f4a36c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><text x="539" y="278" fill="#f4a36c" font-size="16" text-anchor="middle" font-weight="400">HEAT IN</text><path d="M672 367H405" fill="none" stroke="#72c8ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="539" y="398" fill="#72c8ee" font-size="16" text-anchor="middle" font-weight="400">HEAT OUT</text><text x="436" y="222" fill="#c8d694" font-size="16" text-anchor="start" font-weight="400">Candidate: compliant envelope</text><text x="436" y="247" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400">+ sealed PCM + magnet carrier</text><text x="44" y="554" fill="#70d5b0" font-size="25" text-anchor="start" font-weight="600">Fz = g [ ρbath(T,p) · Vdisplaced(T,p) − m ]</text><text x="44" y="593" fill="#a8bab8" font-size="18" text-anchor="start" font-weight="400">A rigid sealed shell does not change buoyancy merely because its internal PCM melts.</text><text x="44" y="622" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400">Measure mass, external volume, pressure response, hysteresis and loaded motion.</text></g></svg>