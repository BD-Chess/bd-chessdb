<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Claude · DGTE-MV</title><desc id="desc">Koncept: ujemane podtlačne parne vrečke v ločenih toplih in hladnih poteh. Vrvna zanka poganja zunanji generator. Hidravlična ločitev na dnu še ni rešena.</desc><defs><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="850" rx="24" fill="#0b1920"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="52" fill="#c8d694" font-size="15" text-anchor="start" font-weight="600"><tspan x="44" dy="0">CLAUDE / DGTE-MV · R1 / 19 OCT 2026</tspan></text><text x="44" y="91" fill="#eaf1ee" font-size="31" text-anchor="start" font-weight="600"><tspan x="44" dy="0">Dve poti. Drugačno delovno telo.</tspan></text><text x="44" y="121" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Konceptualni prikaz · ni v merilu · brez dokončane zasnove tlačne posode</tspan></text><rect x="345" y="202" width="510" height="535" rx="30" fill="#122931" stroke="#45636d"/><rect x="361" y="325" width="230" height="383" rx="12" fill="#f4a36c" stroke="#f4a36c" fill-opacity="0.1"/><rect x="609" y="325" width="230" height="383" rx="12" fill="#72c8ee" stroke="#72c8ee" fill-opacity="0.1"/><rect x="594" y="305" width="12" height="370" rx="0" fill="#45636d" stroke="#c8d694"/><path d="M361 325H589M611 325H839" fill="none" stroke="#a8bab8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="600" y="184" fill="#c8d694" font-size="18" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">ZAPRT VRH · p_vrh ≈ 4,25 kPa*</tspan></text><text x="600" y="310" fill="#a8bab8" font-size="15" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">suhi zgornji prehod</tspan></text><path d="M450 679V272Q450 242 480 242H720Q750 242 750 272V679Q750 709 720 709H480Q450 709 450 679" fill="none" stroke="#c8d694" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="478" cy="270" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="722" cy="270" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="478" cy="681" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="722" cy="681" r="26" fill="none" stroke="#45636d" stroke-width="2"/><ellipse cx="450" cy="620" rx="22" ry="25.52" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M437.9 626.16q12.100000000000001 -6.6 24.200000000000003 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="450" cy="520" rx="31" ry="35.96" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M432.95 528.68q17.05 -9.299999999999999 34.1 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="450" cy="425" rx="42" ry="48.72" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M426.9 436.76q23.1 -12.6 46.2 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="750" cy="400" rx="8" ry="14" fill="#72c8ee" stroke="#eaf1ee"/><ellipse cx="750" cy="510" rx="8" ry="14" fi