<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="vt vd"><title id="vt">DGTE-VS — enotelesni parni vzgonski oscilator</title><desc id="vd">Koncept ene kapsule z veliko spremembo izpodriva, v dveh prikazanih fazah. Sklenjena vrvna zanka z zgornjo in spodnjo jermenico omogoči odvzem na obeh poteh; generator je nad kopeljo. Ogrevanje in hlajenje na postajah; toplotni profil kopeli, kondenzacija in trenje zahtevajo meritev.</desc><rect width="1200" height="720" rx="20" fill="#0b1c24"/><defs><marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#efb077"/></marker><marker id="vb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#88c7e8"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="48" font-size="15" fill="#9fceb9" font-weight="600">DGTE-VS / RAZISKOVALNA VEJA</text><text x="38" y="91" font-size="29" fill="#dce8e6" font-weight="600">Velik fazni ΔV. Ena kapsula. Odvzem na obeh poteh.</text><text x="38" y="124" font-size="17" fill="#a9bbb9" font-weight="400">Izparilni medij je zaprt · generator je zunaj kopeli · oba rotacijska prehoda odpadeta</text><rect x="436" y="207" width="305" height="429" rx="32" fill="#193742" stroke="#aec4c8" stroke-width="2"/><rect x="451" y="222" width="275" height="77" rx="15" fill="#88c7e8" fill-opacity="0.1961"/><rect x="451" y="547" width="275" height="73" rx="15" fill="#efb077" fill-opacity="0.2510"/><path d="M488 226V596Q488 614 505 614Q522 614 522 596V226Q522 208 505 208Q488 208 488 226Z" fill="none" stroke="#a6d2b5" stroke-width="3"/><circle cx="505" cy="225" r="17" fill="#203b44" stroke="#a6d2b5"/><circle cx="505" cy="597" r="17" fill="#203b44" stroke="#a6d2b5"/><path d="M505 225V179H815" fill="none" stroke="#a6d2b5" stroke-width="3"/><rect x="817" y="153" width="240" height="58" rx="12" fill="#174238" stroke="#88d4bb"/><text x="840" y="179" font-size="17" fill="#bde3d4" font-weight="600">SUHI GENERATOR</text><text x="840" y="202" font-size="15" fill="#bde3d4" font-weight="400">→ DC</text><g stroke="#efb077" stroke-width="2"><ellipse cx="619" cy="452" rx="65" ry="81" fill="#efb077" fill-opacity="0.1569"/><rect x="589" y="510" width="60" height="27" rx="8" fill="#334c54"/><path d="M589 524H522"/></g><g stroke="#88c7e8" stroke-width="2" stroke-dasharray="6 4"><rect x="589" y="315" width="60" height="41" rx="12" fill="#88c7e8" fill-opacity="0.1020"/><path d="M589 340H522"/></g><path d="M703 509V368" stroke="#efb077" stroke-width="3" marker-end="url(#va)"/><path d="M557 367V491" stroke="#88c7e8" stroke-width="3" marker-end="url(#vb)"/><text x="570" y="265" font-size="16" fill="#88c7e8" font-weight="600">HLADILNA POSTAJA</text><text x="570" y="586" font-size="16" fill="#efb077" font-weight="600">GRELNA POSTAJA</text><text x="38" y="241" font-size="20" fill="#efb077" font-weight="600">VELIK ZUNANJI IZPODRIV</text><text x="38" y="274" font-size="17" fill="#a9bbb9" font-weight="400">Uparjanje napihne podajni del.</text><text x="38" y="300" font-size="17" fill="#a9bbb9" font-weight="400">Masa zaprtega medija ostane ista.</text><path d="M354 275H397L553 414" fill="none" stroke="#efb077" stroke-width="1.5"/><text x="38" y="418" font-size="20" fill="#a6d2b5" font-weight="600">SKLENJEN VRVNI PRENOS</text><text x="38" y="451" font-size="17" fill="#a9bbb9" font-weight="400">Dve veji ohranita napetost vrvi.</text><text x="38" y="477" font-size="17" fill="#a9bbb9" font-weight="400">Trenje obeh jermenic se odšteje.</text><path d="M354 449H398L488 490" fill="none" stroke="#a6d2b5" stroke-width="1.5"/><text x="800" y="300" font-size="19" fill="#88c7e8" font-weight="600">MAJHEN HLADNI IZPODRIV</text><text x="800" y="333" font-size="17" fill="#a9bbb9" font-weight="400">Kondenzacija omogoči spust.</text><text x="800" y="359" font-size="16" fill="#a9bbb9" font-weight="400">Črtkano: druga faza istega telesa.</text><path d="M781 328H757L651 337" fill="none" stroke="#88c7e8" stroke-width="1.5"/><text x="800" y="453" font-size="19" fill="#bde3d4" font-weight="600">MERITVE, KI ODLOČAJO</text><text x="800" y="486" font-size="17" fill="#a9bbb9" font-weight="400">F(z), V(z), T(z), p(z), čas, Q</text><text x="800" y="512" font-size="17" fill="#a9bbb9" font-weight="400">Vhod/izhod celotnega cikla</text><text x="800" y="538" font-size="15" fill="#a9bbb9" font-weight="400">Konvekcija in prezgodnja kondenzacija</text><text x="800" y="564" font-size="17" fill="#a9bbb9" font-weight="400">sta odprti nosilni omejitvi.</text><text x="38" y="680" font-size="17" fill="#a9bbb9" font-weight="400">Zasnova za primerjalni preizkus; brez izbranega fluida ali kvalificirane membrane. Ni v merilu.</text></g></svg>