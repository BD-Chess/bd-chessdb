<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Claude · DGTE-MV</title><desc id="desc">Concept: matched subatmospheric vapor bags in separate hot and cold legs. Rope loop drives an external generator. Hydraulic separation at the bottom is unresolved.</desc><defs><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="850" rx="24" fill="#0b1920"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="52" fill="#c8d694" font-size="15" text-anchor="start" font-weight="600"><tspan x="44" dy="0">CLAUDE / DGTE-MV · R1 / 19 OCT 2026</tspan></text><text x="44" y="91" fill="#eaf1ee" font-size="31" text-anchor="start" font-weight="600"><tspan x="44" dy="0">Two travel legs. A different working body.</tspan></text><text x="44" y="121" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Conceptual interpretation · not to scale · no resolved pressure-vessel design</tspan></text><rect x="345" y="202" width="510" height="535" rx="30" fill="#122931" stroke="#45636d"/><rect x="361" y="325" width="230" height="383" rx="12" fill="#f4a36c" stroke="#f4a36c" fill-opacity="0.1"/><rect x="609" y="325" width="230" height="383" rx="12" fill="#72c8ee" stroke="#72c8ee" fill-opacity="0.1"/><rect x="594" y="305" width="12" height="370" rx="0" fill="#45636d" stroke="#c8d694"/><path d="M361 325H589M611 325H839" fill="none" stroke="#a8bab8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="600" y="184" fill="#c8d694" font-size="18" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">SEALED HEADSPACE · p_top ≈ 4.25 kPa*</tspan></text><text x="600" y="310" fill="#a8bab8" font-size="15" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">dry top transfer</tspan></text><path d="M450 679V272Q450 242 480 242H720Q750 242 750 272V679Q750 709 720 709H480Q450 709 450 679" fill="none" stroke="#c8d694" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="478" cy="270" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="722" cy="270" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="478" cy="681" r="26" fill="none" stroke="#45636d" stroke-width="2"/><circle cx="722" cy="681" r="26" fill="none" stroke="#45636d" stroke-width="2"/><ellipse cx="450" cy="620" rx="22" ry="25.52" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M437.9 626.16q12.100000000000001 -6.6 24.200000000000003 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="450" cy="520" rx="31" ry="35.96" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M432.95 528.68q17.05 -9.299999999999999 34.1 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="450" cy="425" rx="42" ry="48.72" fill="#f4a36c" fill-opacity=".20" stroke="#f4a36c" stroke-width="2"/><path d="M426.9 436.76q23.1 -12.6 46.2 0" fill="none" stroke="#f4a36c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="750" cy="400" rx="8" ry="14" fill="#72c8ee" stroke="#eaf1ee"/><ellipse cx="750" cy="510" rx="8" ry="14" fill="#72c8ee" stroke="#eaf1ee"/><ellipse cx="750" cy="620" rx="8" ry="14" fill="#72c8ee" stroke="#eaf1ee"/><path d="M536 627V389" fill="none" stroke="#f4a36c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><path d="M676 389V627" fill="none" stroke="#72c8ee" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="477" y="359" fill="#f4a36c" font-size="18" text-anchor="middle" font-weight="600"><tspan x="477" dy="0">HOT · 90 °C*</tspan></text><text x="723" y="359" fill="#72c8ee" font-size="18" text-anchor="middle" font-weight="600"><tspan x="723" dy="0">COLD · 25 °C*</tspan></text><path d="M749 270H927" fill="none" stroke="#70d5b0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/><rect x="930" y="227" width="226" height="82" rx="12" fill="#122931" stroke="#70d5b0"/><text x="1043" y="258" fill="#70d5b0" font-size="19" text-anchor="middle" font-weight="600"><tspan x="1043" dy="0">Dry generator</tspan></text><text x="1043" y="285" fill="#a8bab8" font-size="16" text-anchor="middle" font-weight="400"><tspan x="1043" dy="0">magnetic coupling</tspan></text><text x="44" y="247" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Pressure control / gas trap</tspan><tspan x="44" dy="23.799999999999997">maintenance work counted</tspan></text><path d="M294 245H329V270H345" fill="none" stroke="#c8d694" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="407" fill="#f4a36c" font-size="18" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Vapor expands on ascent</tspan><tspan x="44" dy="25.2">1 L at bottom → 6.92 L*</tspan><tspan x="44" dy="25.2">thin compliant envelope</tspan></text><path d="M294 415H398" fill="none" stroke="#f4a36c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="558" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">External source loop</tspan><tspan x="44" dy="23.799999999999997">keeps the hot bath hot</tspan></text><path d="M294 565H361" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><text x="44" y="668" fill="#f4a36c" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Boiling at the bottom</tspan><tspan x="44" dy="23.799999999999997">p_bottom ≈ 29.26 kPa*</tspan></text><path d="M294 672H390" fill="none" stroke="#f4a36c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="905" y="386" fill="#72c8ee" font-size="17" text-anchor="start" font-weight="400"><tspan x="905" dy="0">Condense, then descend</tspan><tspan x="905" dy="23.799999999999997">dense liquid + carrier</tspan></text><path d="M904 397H813L762 400" fill="none" stroke="#72c8ee" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="905" y="482" fill="#c8d694" font-size="17" text-anchor="start" font-weight="400"><tspan x="905" dy="0">Rope / belt takes work</tspan><tspan x="905" dy="23.799999999999997">to the dry generator</tspan><tspan x="905" dy="23.799999999999997">no magnet in each bag</tspan></text><text x="905" y="580" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="905" dy="0">External sink loop</tspan><tspan x="905" dy="23.799999999999997">keeps the cold bath cold</tspan></text><path d="M839 586H894" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="905" y="678" fill="#c8d694" font-size="17" text-anchor="start" font-weight="400"><tspan x="905" dy="0">Insulating divider</tspan><tspan x="905" dy="23.799999999999997">hydraulic transfer: OPEN</tspan></text><path d="M905 688H869V724H601V689" fill="none" stroke="#c8d694" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><text x="44" y="787" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="44" dy="0">* Model example: water working fluid, 3 m bath, constant ρ_bath = 850 kg/m³.</tspan></text><text x="44" y="817" fill="#a8bab8" font-size="16" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Separate fluid circuits and bottom mixing need resolution; the model does not prove the full machine.</tspan></text></g></svg>