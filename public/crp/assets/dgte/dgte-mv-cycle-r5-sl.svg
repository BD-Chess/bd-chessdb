<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Claude · DGTE-MV cycle</title><desc id="desc">Štiri idealna stanja vodne parne vrečke: vrenje pri spodnjem tlaku, raztezanje med dvigom, kondenzacija pri zgornjem tlaku, tekoči spust.</desc><defs><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="600" rx="24" fill="#0b1920"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="52" fill="#c8d694" font-size="15" text-anchor="start" font-weight="600"><tspan x="44" dy="0">CLAUDE / DGTE-MV · MODELNO ZAPOREDJE</tspan></text><text x="44" y="91" fill="#eaf1ee" font-size="29" text-anchor="start" font-weight="600"><tspan x="44" dy="0">Ena vrečka. Ena sklenjena termodinamična zanka.</tspan></text><rect x="44" y="143" width="266" height="320" rx="12" fill="#122931" stroke="#45636d"/><text x="64" y="175" fill="#f4a36c" font-size="16" text-anchor="start" font-weight="600"><tspan x="64" dy="0">01</tspan></text><text x="64" y="212" fill="#eaf1ee" font-size="22" text-anchor="start" font-weight="600"><tspan x="64" dy="0">Vrenje</tspan></text><ellipse cx="176" cy="280" rx="27" ry="36" fill="#f4a36c" fill-opacity=".15" stroke="#f4a36c" stroke-width="2"/><path d="M106 294V256" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><text x="64" y="369" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="64" dy="0">p = 29.26 kPa</tspan><tspan x="64" dy="23.799999999999997">25 → 90 °C</tspan><tspan x="64" dy="23.799999999999997">tekočina → 1 L pare</tspan></text><rect x="326" y="143" width="266" height="320" rx="12" fill="#122931" stroke="#45636d"/><text x="346" y="175" fill="#f4a36c" font-size="16" text-anchor="start" font-weight="600"><tspan x="346" dy="0">02</tspan></text><text x="346" y="212" fill="#eaf1ee" font-size="22" text-anchor="start" font-weight="600"><tspan x="346" dy="0">Dvig in raztezanje</tspan></text><ellipse cx="458" cy="280" rx="45" ry="52" fill="#f4a36c" fill-opacity=".15" stroke="#f4a36c" stroke-width="2"/><path d="M388 310V246" fill="none" stroke="#f4a36c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><text x="346" y="369" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="346" dy="0">29,26 → 4,25 kPa</tspan><tspan x="346" dy="23.799999999999997">topla pot · 90 °C</tspan><tspan x="346" dy="23.799999999999997">1 → 6,92 L</tspan></text><rect x="608" y="143" width="266" height="320" rx="12" fill="#122931" stroke="#45636d"/><text x="628" y="175" fill="#72c8ee" font-size="16" text-anchor="start" font-weight="600"><tspan x="628" dy="0">03</tspan></text><text x="628" y="212" fill="#eaf1ee" font-size="22" text-anchor="start" font-weight="600"><tspan x="628" dy="0">Kondenzacija</tspan></text><ellipse cx="740" cy="280" rx="9" ry="15" fill="#72c8ee"/><path d="M670 248V311" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="628" y="369" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="628" dy="0">p = 4,25 kPa</tspan><tspan x="628" dy="23.799999999999997">90 → 25 °C</tspan><tspan x="628" dy="23.799999999999997">para → tekočina</tspan></text><rect x="890" y="143" width="266" height="320" rx="12" fill="#122931" stroke="#45636d"/><text x="910" y="175" fill="#72c8ee" font-size="16" text-anchor="start" font-weight="600"><tspan x="910" dy="0">04</tspan></text><text x="910" y="212" fill="#eaf1ee" font-size="22" text-anchor="start" font-weight="600"><tspan x="910" dy="0">Tekoči povratek</tspan></text><ellipse cx="1022" cy="280" rx="9" ry="15" fill="#72c8ee"/><path d="M952 248V311" fill="none" stroke="#72c8ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="910" y="369" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400"><tspan x="910" dy="0">4,25 → 29,26 kPa</tspan><tspan x="910" dy="23.799999999999997">hladna pot · 25 °C</tspan><tspan x="910" dy="23.799999999999997">majhna prostornina</tspan></text><path d="M1075 483V509H175V484" fill="none" stroke="#c8d694" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-gold)"/><text x="600" y="548" fill="#c8d694" font-size="19" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Primer z vodo · W = 56,63 J · Q_toplo = 506,59 J · idealni W/Q = 11,18 %</tspan></text><text x="600" y="579" fill="#a8bab8" font-size="16" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Pred ovojem, prenosom, generatorjem in lastno rabo; čas cikla ni izmerjen.</tspan></text></g></svg>