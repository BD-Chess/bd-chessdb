<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">DGTE — replaceable thermal cartridge and pulse output</title><desc id="d">Conceptual cutaway of a stationary thermal cartridge, spring, latch and cold generator; three alternative outputs. Not a fabrication plan.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#88d4bb"/></marker></defs><rect width="1200" height="720" rx="20" fill="#0b1c24"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="48" font-size="15" fill="#9fceb9" font-weight="600">DGTE / RHP R2 / PROPOSED DEVELOPMENT ARCHITECTURE</text><text x="38" y="91" font-size="26" fill="#dce8e6" font-weight="600">Heat charges slowly. A useful event releases the output.</text><text x="38" y="124" font-size="18" fill="#a9bbb9" font-weight="400">Replaceable thermal cartridge · common measurement rig · three output comparisons</text><rect x="38" y="164" width="330" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="57" y="197" font-size="15" fill="#b7d4c7" font-weight="600">1 / THERMAL CARTRIDGE</text><rect x="402" y="164" width="355" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="421" y="197" font-size="15" fill="#b7d4c7" font-weight="600">2 / TRANSMISSION &amp; STORAGE</text><rect x="791" y="164" width="371" height="316" rx="14" fill="#142c35" stroke="#46636a"/><text x="810" y="197" font-size="15" fill="#b7d4c7" font-weight="600">3 / USEFUL LOAD</text><rect x="83" y="253" width="197" height="139" rx="18" fill="#243f48" stroke="#d4e4df" stroke-width="2"/><rect x="96" y="265" width="137" height="115" rx="8" fill="#efb077" fill-opacity="0.3333"/><path d="M114 269V375" stroke="#efb077" stroke-width="3"/><path d="M141 269V375" stroke="#efb077" stroke-width="3"/><path d="M168 269V375" stroke="#efb077" stroke-width="3"/><path d="M195 269V375" stroke="#efb077" stroke-width="3"/><path d="M222 269V375" stroke="#efb077" stroke-width="3"/><path d="M244 265Q219 322 244 380" fill="none" stroke="#dce8e6" stroke-width="4"/><path d="M244 322H348" stroke="#dce8e6" stroke-width="9"/><text x="109" y="323" font-size="16" fill="#dce8e6" font-weight="400">PCM / gas / vapor</text><text x="82" y="235" font-size="17" fill="#efb077" font-weight="400">T(t) from ambient or process</text><text x="67" y="420" font-size="16" fill="#a9bbb9" font-weight="400">Measure: F(x,T), p(V,T), time, Q</text><text x="67" y="448" font-size="15" fill="#a9bbb9" font-weight="400">Pressure rating: not yet selected.</text><path d="M347 322H418" stroke="#88d4bb" stroke-width="3" marker-end="url(#a)"/><path d="M434 318H454L467 296L485 340L503 296L521 340L539 296L557 340L575 318H595" fill="none" stroke="#e9bf81" stroke-width="3"/><rect x="602" y="263" width="117" height="111" rx="12" fill="#1c3b43" stroke="#a6d2b5"/><text x="618" y="300" font-size="18" fill="#a6d2b5" font-weight="600">LATCH</text><text x="623" y="334" font-size="22" fill="#e9bf81" font-weight="400">0 → 1</text><text x="430" y="236" font-size="16" fill="#e9bf81" font-weight="400">Spring / accumulator + freewheel</text><text x="429" y="416" font-size="16" fill="#a9bbb9" font-weight="400">Magnet, transmission, electronics</text><text x="429" y="442" font-size="15" fill="#a9bbb9" font-weight="400">stay outside the thermal core.</text><path d="M721 322H803" stroke="#88d4bb" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="222" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="255" font-size="18" fill="#bde3d4" font-weight="400">A · mechanical bit / counter</text><rect x="825" y="291" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="324" font-size="18" fill="#bde3d4" font-weight="400">B · direct mechanical stroke</text><rect x="825" y="360" width="300" height="54" rx="9" fill="#123c3c" stroke="#88d4bb"/><text x="840" y="393" font-size="18" fill="#bde3d4" font-weight="400">C · magnet → DC → load</text><text x="825" y="450" font-size="16" fill="#a9bbb9" font-weight="400">Compare each output separately.</text><rect x="38" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="55" y="565" font-size="17" fill="#b6d9ca" font-weight="600">COLD · READY</text><text x="55" y="596" font-size="15" fill="#a9bbb9" font-weight="400">No continuous powered polling required</text><rect x="429" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="446" y="565" font-size="17" fill="#b6d9ca" font-weight="600">HOT · CHARGED</text><text x="446" y="596" font-size="15" fill="#a9bbb9" font-weight="400">Hot threshold arms the mechanical bit</text><rect x="820" y="535" width="342" height="91" rx="11" fill="#132d36" stroke="#45626a"/><text x="837" y="565" font-size="17" fill="#b6d9ca" font-weight="600">COOLED · EVENT</text><text x="837" y="596" font-size="15" fill="#a9bbb9" font-weight="400">Cold threshold releases and resets</text><path d="M385 580H420M775 580H810" stroke="#88d4bb" stroke-width="2" marker-end="url(#a)"/><text x="38" y="670" font-size="18" fill="#bde3d4" font-weight="400">Closed cycle: output − reset − switching − auxiliaries; preload is not harvest.</text><text x="38" y="702" font-size="15" fill="#a9bbb9" font-weight="400">Conceptual 2D cutaway; not to scale. Fluid, pressure and hardware remain unqualified.</text></g></svg>