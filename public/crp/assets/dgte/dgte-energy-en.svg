<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">DGTE — energy and measurement boundary</title><desc id="desc">External heat enters an engine boundary, heat is rejected to a sink, rectified electricity powers auxiliaries and a net load. Recuperation stays inside the boundary. No arrow widths encode data.</desc><defs><linearGradient id="shell" x2="1" y2="0"><stop stop-color="#263e49"/><stop offset=".38" stop-color="#142d38"/><stop offset=".75" stop-color="#304d57"/><stop offset="1" stop-color="#112833"/></linearGradient><linearGradient id="hot" x2="0" y2="1"><stop stop-color="#e99a6038"/><stop offset="1" stop-color="#e99a6010"/></linearGradient><linearGradient id="cold" x2="1" y2="0"><stop stop-color="#72c8ee35"/><stop offset="1" stop-color="#72c8ee12"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c3039" stroke-width=".7"/></pattern><marker id="a-hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f4a36c"/></marker><marker id="a-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#72c8ee"/></marker><marker id="a-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8d694"/></marker><marker id="a-elec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70d5b0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8bab8"/></marker></defs><rect width="1200" height="650" rx="24" fill="#0b1920"/><rect x="24" y="24" width="1152" height="602" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="56" fill="#c8d694" font-size="15" text-anchor="start" font-weight="600">DGTE / 03</text><text x="44" y="94" fill="#eaf1ee" font-size="30" text-anchor="start" font-weight="600">Every input. Every loss. One net result.</text><text x="44" y="126" fill="#a8bab8" font-size="18" text-anchor="start" font-weight="400">Qualitative energy map · arrows are not proportional to power</text><rect x="346" y="186" width="486" height="294" rx="23" fill="#16303b" stroke="#607b83" stroke-dasharray="7 5"/><text x="589" y="219" fill="#a8bab8" font-size="14" text-anchor="middle" font-weight="600">MEASURED SYSTEM BOUNDARY</text><text x="589" y="275" fill="#eaf1ee" font-size="24" text-anchor="middle" font-weight="600">Thermal → buoyancy → motion</text><text x="589" y="308" fill="#70d5b0" font-size="21" text-anchor="middle" font-weight="400">→ coils → rectification → gross DC</text><text x="589" y="368" fill="#c8d694" font-size="19" text-anchor="middle" font-weight="400">Recuperation: internal heat recovery</text><path d="M439 390Q589 445 739 390" fill="none" stroke="#c8d694" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-rec)"/><text x="589" y="447" fill="#a8bab8" font-size="17" text-anchor="middle" font-weight="400">Transfer + drag + electrical losses</text><text x="66" y="278" fill="#f4a36c" font-size="20" text-anchor="start" font-weight="600">HEAT SOURCE</text><text x="66" y="310" fill="#f4a36c" font-size="27" text-anchor="start" font-weight="400">Q̇in</text><path d="M215 295H325" fill="none" stroke="#f4a36c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-hot)"/><path d="M851 295H951" fill="none" stroke="#70d5b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-elec)"/><text x="979" y="280" fill="#70d5b0" font-size="20" text-anchor="start" font-weight="600">NET LOAD</text><text x="979" y="314" fill="#70d5b0" font-size="27" text-anchor="start" font-weight="400">Pnet</text><path d="M590 482V542" fill="none" stroke="#72c8ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-cold)"/><text x="590" y="576" fill="#72c8ee" font-size="21" text-anchor="middle" font-weight="600">COLD SINK · Q̇out</text><path d="M876 295V420H849" fill="none" stroke="#70d5b0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-elec)"/><text x="881" y="448" fill="#a8bab8" font-size="17" text-anchor="start" font-weight="400">Auxiliary draw</text><text x="881" y="471" fill="#a8bab8" font-size="15" text-anchor="start" font-weight="400">pumps / crossovers / controls</text><text x="44" y="616" fill="#eaf1ee" font-size="20" text-anchor="start" font-weight="400">Pnet = PDC,gross − Paux     |     steady cycle: all boundary energy flows must close</text></g></svg>