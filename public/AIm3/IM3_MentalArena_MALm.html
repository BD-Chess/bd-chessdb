async function gunzip(data){const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter(),reader=ds.readable.getReader();w.write(data);w.close();const parts=[];let n=0;while(true){const r=await reader.read();if(r.done)break;parts.push(r.value);n+=r.value.length}const o=new Uint8Array(n);let p=0;for(const x of parts){o.set(x,p);p+=x.length}return o}
function boundPassphrase(value){const host=String(location.hostname||'').toLowerCase(),protocol=String(location.protocol||''),live=(host===atob(H1)||host===atob(H2)),local=(protocol==='file:'||host==='localhost'||host==='127.0.0.1'||host==='::1'||host==='[::1]'),suffix=atob(LS);if(live)return value+suffix;if(local&&value.endsWith(suffix))return value;throw new Error('access');}
async function unlock(){const b=document.getElementById('go'),s=document.getElementById('status'),pw=document.getElementById('pw').value;b.disabled=true;s.className='';s.textContent='Deriving 8Z key…';try{const effective=boundPassphrase(pw),bin=atob(PAYLOAD),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);const salt=buf.slice(0,32),iv=buf.slice(32,44),ct=buf.slice(44),kb=await derive(effective,salt),key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']),comp=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,ct)),plain=await gunzip(comp),page=new TextDecoder().decode(plain);s.className='ok';s.textContent='Unlocked.';document.open();document.write(page);document.close();}catch(e){s.className='bad';s.textContent='Unlock failed: wrong passphrase or damaged file.';b.disabled=false;}}
document.getElementById('go').addEventListener('click',unlock);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
