<style>
:root{
  --bg:#020409;--surface:rgba(15,23,41,0.82);
  --border:rgba(0,229,255,0.10);--border2:rgba(0,229,255,0.22);
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.12);--cyan-glow:rgba(0,229,255,0.25);
  --gold:#f59e0b;--gold-dim:rgba(245,158,11,0.12);
  --green:#34d399;--green-dim:rgba(52,211,153,0.12);
  --rose:#ff6b8a;--rose-dim:rgba(255,107,138,0.12);
  --text:#e2e8f4;--muted:#5e7192;--subtle:#1a2540;
  --cell-size:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  background:radial-gradient(circle at 20% 18%,rgba(16,120,80,0.22),transparent 32%),radial-gradient(circle at 80% 70%,rgba(0,229,255,0.08),transparent 28%),linear-gradient(180deg,#090b10,#06070a);
  color:var(--text);font-family:'Rajdhani',sans-serif;font-size:17px;line-height:1.6;
  display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:.30;pointer-events:none;z-index:0}
body::before{width:42vw;height:42vw;left:-8vw;top:-12vh;background:radial-gradient(circle,rgba(52,211,153,0.30),transparent 72%);animation:flA 18s ease-in-out infinite}
body::after{width:38vw;height:38vw;right:-10vw;bottom:-18vh;background:radial-gradient(circle,rgba(0,229,255,0.12),transparent 72%);animation:flB 24s ease-in-out infinite}
@keyframes flA{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(5vw,4vh,0)}}
@keyframes flB{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-4vw,-6vh,0)}}
.noise{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.page{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:40px}
.header{width:100%;max-width:1800px;padding:12px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
.logo{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;color:var(--cyan);letter-spacing:.3em;text-transform:uppercase}
.logo span{color:var(--gold)}
.timer{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:600;color:var(--muted);letter-spacing:.1em}
.title-block{text-align:center;padding:4px 20px 0}
.title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.4rem,3.5vw,2.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.title .accent{color:var(--cyan)}
.subtitle{font-family:'Cormorant Garamond',serif;font-size:.95rem;font-style:italic;color:var(--muted);margin-top:2px}
.status{text-align:center;font-size:.75rem;color:var(--muted);min-height:1.2em;margin:2px 0;font-family:'JetBrains Mono',monospace}
.status.win{color:var(--gold);font-weight:600}
.status.err{color:var(--rose)}
.main{
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"left center right";
  gap:24px;padding:6px 24px;max-width:1800px;width:100%;align-content:start;
}
.col-left{grid-area:left;display:flex;flex-direction:column;gap:10px;min-width:280px;max-width:420px;justify-self:end}
.col-center{grid-area:center;display:flex;flex-direction:column;align-items:center}
.col-right{grid-area:right;display:flex;flex-direction:column;gap:10px;min-width:280px;max-width:420px}
@media(max-width:1000px){
  .main{grid-template-columns:1fr;grid-template-areas:"center" "left" "right";justify-items:center}
  .col-left,.col-right{max-width:600px;min-width:0;width:100%;justify-self:center}
}
.grid-wrap{
  background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px;
  box-shadow:0 0 60px rgba(0,229,255,0.04),0 0 120px rgba(52,211,153,0.02);backdrop-filter:blur(12px);
}
.grid{display:inline-grid;gap:0}
.cell{
  width:var(--cell-size);height:var(--cell-size);
  background:rgba(11,17,32,0.7);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:calc(var(--cell-size)*0.42);font-weight:700;
  color:var(--text);cursor:pointer;position:relative;transition:background .12s,border-color .12s;text-transform:uppercase;
}
.cell:hover{background:var(--subtle);border-color:var(--border2)}
.cell.selected{background:var(--cyan-dim)!important;border-color:var(--cyan)!important;box-shadow:0 0 10px var(--cyan-glow)}
.cell.word-highlight{background:rgba(0,229,255,0.04)}
.cell.black{background:#060a14!important;border-color:rgba(0,0,0,0.3)!important;cursor:default;pointer-events:none}
.cell.correct{color:var(--green)!important}.cell.error{color:var(--rose)!important;border-color:var(--rose)!important;background:var(--rose-dim)!important}
.cell .clue-num{position:absolute;top:1px;left:3px;font-size:calc(var(--cell-size)*0.20);font-weight:600;color:var(--gold);line-height:1;pointer-events:none}
@keyframes winPulse{0%,100%{box-shadow:0 0 8px var(--gold-dim)}50%{box-shadow:0 0 20px rgba(245,158,11,0.4)}}
.cell.win-anim{animation:winPulse 1s ease-in-out 3;color:var(--gold)!important}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;backdrop-filter:blur(8px)}
.panel-title{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:600;color:var(--cyan);letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px;cursor:pointer;user-select:none}
.clue-list{max-height:520px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.clue-item{font-size:.9rem;padding:5px 8px;border-radius:4px;cursor:pointer;display:flex;gap:6px;line-height:1.35;transition:background .12s}
.clue-item:hover{background:var(--cyan-dim)}
.clue-item.active{background:var(--cyan-dim);border-left:2px solid var(--cyan)}
.clue-item.solved{color:var(--green);opacity:0.6}
.clue-num-label{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);min-width:24px;flex-shrink:0}
.clue-text{color:var(--muted)}.clue-item.active .clue-text{color:var(--text)}
.btn{font-family:'JetBrains Mono',monospace;font-size:.74rem;font-weight:700;background:rgba(11,17,32,0.6);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:4px;cursor:pointer;transition:all .12s;width:100%;text-align:center;letter-spacing:.06em}
.btn:hover{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}
.btn.gold{border-color:var(--gold);color:var(--gold)}.btn.gold:hover{background:var(--gold-dim)}
.btn.green{border-color:var(--green);color:var(--green)}.btn.green:hover{background:var(--green-dim)}
.btn.rose{border-color:var(--rose);color:var(--rose)}.btn.rose:hover{background:var(--rose-dim)}
.btn-row{display:flex;gap:5px}.btn-row .btn{flex:1}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.metric-label{font-size:.76rem;color:var(--muted)}
.metric-value{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:700}
.bar-wrap{height:3px;background:rgba(11,17,32,0.5);border-radius:2px;margin-top:3px;overflow:hidden}
.bar{height:100%;border-radius:2px;transition:width .4s ease}.bar.green{background:var(--green)}.bar.gold{background:var(--gold)}
.diff-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
</style>
</head>

<button class="btn gold" onclick="loadPuzzle('hard')">Težka 13×13</button>
<button class="btn rose" onclick="loadPuzzle('expert')">Ekspert 15×15</button>

<div class="btn-row" style="margin-top:6px;max-width:450px;width:100%">

let puzzle=null,playerGrid=null,selectedR=-1,selectedC=-1,direction='across',activeClue=null,timerInterval=null,seconds=0,errorCount=0,solved=false;

function loadPuzzle(d){
  puzzle=PUZZLES[d];if(!puzzle)return;solved=false;errorCount=0;
  playerGrid=Array.from({length:puzzle.rows},()=>Array(puzzle.cols).fill(''));
  selectedR=-1;selectedC=-1;activeClue=null;direction='across';
  setCellSize(puzzle.cols);buildGrid();buildClueList('across');buildClueList('down');
  startTimer();updateMetrics();
  setStatus(puzzle.rows+'×'+puzzle.cols+' križanka naložena','');
  for(let r=0;r<puzzle.rows;r++)for(let c=0;c<puzzle.cols;c++)if(puzzle.mask[r][c]){selectCell(r,c);return}
}

function buildGrid(){
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns='repeat('+puzzle.cols+',var(--cell-size))';
  g.style.gridTemplateRows='repeat('+puzzle.rows+',var(--cell-size))';
  g.innerHTML='';
  for(let r=0;r<puzzle.rows;r++)for(let c=0;c<puzzle.cols;c++){
    const cell=document.createElement('div');
    cell.className='cell'+(puzzle.mask[r][c]?'':' black');
    cell.dataset.r=r;cell.dataset.c=c;
    if(puzzle.mask[r][c]){
      cell.onclick=()=>selectCell(r,c);
      let numAdded=false;
      for(const dir of['across','down'])if(!numAdded&&puzzle.clues[dir])for(const[num,cl]of Object.entries(puzzle.clues[dir])){
        if(cl.r===r&&cl.c===c){const s=document.createElement('span');s.className='clue-num';s.textContent=num;cell.appendChild(s);numAdded=true;break}
      }
    }
    g.appendChild(cell);
  }
  render();
}

function render(){
  if(!puzzle)return;
  const wc=getWordCells(selectedR,selectedC,direction);
  const ws=new Set(wc.map(([r,c])=>r+'_'+c));
  document.querySelectorAll('.cell').forEach(cell=>{
    const r=+cell.dataset.r,c=+cell.dataset.c;
    if(!puzzle.mask[r]?.[c])return;
    cell.classList.remove('selected','word-highlight','correct','error');
    if(r===selectedR&&c===selectedC)cell.classList.add('selected');
    else if(ws.has(r+'_'+c))cell.classList.add('word-highlight');
    const ns=cell.querySelector('.clue-num');
    cell.textContent=playerGrid[r][c];
    if(ns)cell.prepend(ns);
  });
}

function buildClueList(dir){
  const el=document.getElementById(dir==='across'?'cluesAcross':'cluesDown');
  el.innerHTML='';if(!puzzle.clues[dir])return;
  const nums=Object.keys(puzzle.clues[dir]).map(Number).sort((a,b)=>a-b);
  for(const num of nums){
    const cl=puzzle.clues[dir][num];
    const item=document.createElement('div');item.className='clue-item';item.id='clue_'+dir+'_'+num;
    item.innerHTML='<span class="clue-num-label">'+num+'.</span><span class="clue-text">'+cl.text+'</span>';
    item.onclick=()=>{direction=dir;selectCell(cl.r,cl.c)};
    el.appendChild(item);
  }
}

function highlightClue(dir,num){
  document.querySelectorAll('.clue-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('clue_'+dir+'_'+num);
  if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'})}
}

function findClueForCell(r,c,dir){
  if(!puzzle.clues[dir])return null;
  for(const[num,cl]of Object.entries(puzzle.clues[dir])){
    const cells=getWordCellsFromClue(cl,dir);
    if(cells.some(([cr,cc])=>cr===r&&cc===c))return parseInt(num);
  }
  return null;
}

function getWordCells(r,c,dir){
  if(r<0||!puzzle||!puzzle.mask[r]?.[c])return[];
  const cells=[];
  if(dir==='across'){let sc=c;while(sc>0&&puzzle.mask[r][sc-1])sc--;for(let cc=sc;cc<puzzle.cols&&puzzle.mask[r][cc];cc++)cells.push([r,cc])}
  else{let sr=r;while(sr>0&&puzzle.mask[sr-1]?.[c])sr--;for(let rr=sr;rr<puzzle.rows&&puzzle.mask[rr]?.[c];rr++)cells.push([rr,c])}
  return cells;
}
function getWordCellsFromClue(cl,dir){
  const cells=[];
  if(dir==='across')for(let i=0;i<cl.len;i++)cells.push([cl.r,cl.c+i]);
  else for(let i=0;i<cl.len;i++)cells.push([cl.r+i,cl.c]);
  return cells;
}

function selectCell(r,c){
  if(!puzzle||!puzzle.mask[r]?.[c])return;
  if(r===selectedR&&c===selectedC)direction=direction==='across'?'down':'across';
  selectedR=r;selectedC=c;
  const num=findClueForCell(r,c,direction);
  if(num!==null){activeClue={dir:direction,num};highlightClue(direction,num)}
  else{const od=direction==='across'?'down':'across';const n2=findClueForCell(r,c,od);
    if(n2!==null){direction=od;activeClue={dir:od,num:n2};highlightClue(od,n2)}}
  render();
}

function advanceCursor(){
  if(direction==='across'){let nc=selectedC+1;while(nc<puzzle.cols&&!puzzle.mask[selectedR][nc])nc++;if(nc<puzzle.cols)selectCell(selectedR,nc)}
  else{let nr=selectedR+1;while(nr<puzzle.rows&&!puzzle.mask[nr]?.[selectedC])nr++;if(nr<puzzle.rows)selectCell(nr,selectedC)}
}
function retreatCursor(){
  if(direction==='across'){let nc=selectedC-1;while(nc>=0&&!puzzle.mask[selectedR][nc])nc--;if(nc>=0)selectCell(selectedR,nc)}
  else{let nr=selectedR-1;while(nr>=0&&!puzzle.mask[nr]?.[selectedC])nr--;if(nr>=0)selectCell(nr,selectedC)}
}
function nextWord(){
  if(!activeClue)return;const dir=activeClue.dir;
  const nums=Object.keys(puzzle.clues[dir]).map(Number).sort((a,b)=>a-b);
  const idx=nums.indexOf(activeClue.num);let ni=(idx+1)%nums.length;
  if(ni===0){const od=dir==='across'?'down':'across';if(puzzle.clues[od]){direction=od;const on=Object.keys(puzzle.clues[od]).map(Number).sort((a,b)=>a-b);const cl=puzzle.clues[od][on[0]];selectCell(cl.r,cl.c);return}}
  const cl=puzzle.clues[dir][nums[ni]];selectCell(cl.r,cl.c);
}

document.addEventListener('keydown',e=>{
  if(!puzzle||solved||selectedR<0)return;
  if(e.key==='Tab'||e.key===' '){e.preventDefault();direction=direction==='across'?'down':'across';selectCell(selectedR,selectedC);return}
  if(e.key==='Enter'){e.preventDefault();nextWord();return}
  if(e.key==='ArrowRight'){e.preventDefault();let c=selectedC+1;while(c<puzzle.cols&&!puzzle.mask[selectedR][c])c++;if(c<puzzle.cols)selectCell(selectedR,c);return}
  if(e.key==='ArrowLeft'){e.preventDefault();let c=selectedC-1;while(c>=0&&!puzzle.mask[selectedR][c])c--;if(c>=0)selectCell(selectedR,c);return}
  if(e.key==='ArrowDown'){e.preventDefault();let r=selectedR+1;while(r<puzzle.rows&&!puzzle.mask[r]?.[selectedC])r++;if(r<puzzle.rows)selectCell(r,selectedC);return}
  if(e.key==='ArrowUp'){e.preventDefault();let r=selectedR-1;while(r>=0&&!puzzle.mask[r]?.[selectedC])r--;if(r>=0)selectCell(r,selectedC);return}
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();if(playerGrid[selectedR][selectedC])playerGrid[selectedR][selectedC]='';else{retreatCursor();playerGrid[selectedR][selectedC]=''}render();updateMetrics();return}
  const ch=e.key.toUpperCase();
  if(/^[A-ZČŠŽ]$/.test(ch)){e.preventDefault();playerGrid[selectedR][selectedC]=ch;render();advanceCursor();updateMetrics();checkWin()}
});

function checkAll(){
  if(!puzzle)return;let ok=true;
  document.querySelectorAll('.cell').forEach(cell=>{
    const r=+cell.dataset.r,c=+cell.dataset.c;if(!puzzle.mask[r]?.[c])return;
    cell.classList.remove('correct','error');
    const p=playerGrid[r][c],s=puzzle.solution[r][c];
    if(!p){ok=false;return}
    if(p===s)cell.classList.add('correct');else{cell.classList.add('error');ok=false;errorCount++}
  });
  updateMetrics();if(ok)winGame();else setStatus('Preverjeno — poišči rdeče celice','err');
}
function revealWord(){if(!puzzle||selectedR<0)return;getWordCells(selectedR,selectedC,direction).forEach(([r,c])=>{playerGrid[r][c]=puzzle.solution[r][c]});render();updateMetrics();checkWin()}
function revealAll(){if(!puzzle)return;for(let r=0;r<puzzle.rows;r++)for(let c=0;c<puzzle.cols;c++)if(puzzle.mask[r][c])playerGrid[r][c]=puzzle.solution[r][c];render();updateMetrics();setStatus('Rešitev prikazana','')}
function checkWin(){if(!puzzle||solved)return;for(let r=0;r<puzzle.rows;r++)for(let c=0;c<puzzle.cols;c++)if(puzzle.mask[r][c]&&playerGrid[r][c]!==puzzle.solution[r][c])return;winGame()}
function winGame(){solved=true;stopTimer();setStatus('✦ REŠENO v '+fmtTime(seconds)+'! ✦','win');document.querySelectorAll('.cell:not(.black)').forEach((cell,i)=>{setTimeout(()=>cell.classList.add('win-anim'),i*25)})}

function updateMetrics(){
  if(!puzzle)return;let filled=0,total=0,wt=0,ws=0;
  for(let r=0;r<puzzle.rows;r++)for(let c=0;c<puzzle.cols;c++)if(puzzle.mask[r][c]){total++;if(playerGrid[r][c])filled++}
  const pct=Math.round(filled/total*100);
  document.getElementById('mProgress').textContent=pct+'%';document.getElementById('barProgress').style.width=pct+'%';
  for(const dir of['across','down'])if(puzzle.clues[dir])for(const[num,cl]of Object.entries(puzzle.clues[dir])){
    wt++;const cells=getWordCellsFromClue(cl,dir);
    if(cells.every(([r,c])=>playerGrid[r][c]===puzzle.solution[r][c])){ws++;const el=document.getElementById('clue_'+dir+'_'+num);if(el)el.classList.add('solved')}
  }
  document.getElementById('mWords').textContent=ws+' / '+wt;
  document.getElementById('barWords').style.width=wt?(ws/wt*100)+'%':'0';
  document.getElementById('mErrors').textContent=errorCount;
}

function startTimer(){stopTimer();seconds=0;document.getElementById('timer').textContent='00:00';timerInterval=setInterval(()=>{seconds++;document.getElementById('timer').textContent=fmtTime(seconds)},1000)}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function togglePanel(dir){const el=document.getElementById(dir==='across'?'cluesAcross':'cluesDown');el.style.display=el.style.display==='none'?'':'none'}
function setStatus(msg,cls){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(cls||'')}
window.addEventListener('resize',()=>{if(puzzle)setCellSize(puzzle.cols)});
loadPuzzle('easy');
</script>
