<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t09 d09">
<title id="t09">Magnet in tuljava, 17. oktober 1831</title>
<desc id="d09">Tri sličice z isto tuljavo na papirnatem valju, vezano na galvanometer. Ko magnet potisneš noter, se igla odkloni v desno; ko magnet v tuljavi miruje, je igla na ničli; ko ga izvlečeš ven, se igla odkloni v levo.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
<!-- helix on a paper cylinder, drawn over the magnet (paper is semi-opaque) -->
<g id="coil" stroke-linecap="round" stroke-linejoin="round">
<rect x="-22" y="170" width="44" height="110" fill="#F3EEE2" fill-opacity="0.62" stroke="#5B6663" stroke-width="1.6"/>
<ellipse cx="0" cy="170" rx="22" ry="5" fill="none" stroke="#5B6663" stroke-width="1.6"/>
<g stroke="#A24A1A" stroke-width="2.1">
<line x1="-22" y1="174" x2="22" y2="179"/>
<line x1="-22" y1="179" x2="22" y2="184"/>
<line x1="-22" y1="184" x2="22" y2="189"/>
<line x1="-22" y1="189" x2="22" y2="194"/>
<line x1="-22" y1="194" x2="22" y2="199"/>
<line x1="-22" y1="199" x2="22" y2="204"/>
<line x1="-22" y1="204" x2="22" y2="209"/>
<line x1="-22" y1="209" x2="22" y2="214"/>
<line x1="-22" y1="214" x2="22" y2="219"/>
<line x1="-22" y1="219" x2="22" y2="224"/>
<line x1="-22" y1="224" x2="22" y2="229"/>
<line x1="-22" y1="229" x2="22" y2="234"/>
<line x1="-22" y1="234" x2="22" y2="239"/>
<line x1="-22" y1="239" x2="22" y2="244"/>
<line x1="-22" y1="244" x2="22" y2="249"/>
<line x1="-22" y1="249" x2="22" y2="254"/>
<line x1="-22" y1="254" x2="22" y2="259"/>
<line x1="-22" y1="259" x2="22" y2="264"/>
<line x1="-22" y1="264" x2="22" y2="269"/>
<line x1="-22" y1="269" x2="22" y2="274"/>
</g>
<path d="M22,179 H44 V345 H30" fill="none" stroke="#A24A1A" stroke-width="2.2"/>
<path d="M-14,276 V318.5" fill="none" stroke="#A24A1A" stroke-width="2.2"/>
<circle cx="0" cy="345" r="30" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.4"/>
<path d="M-18.4,329.6 A24,24 0 0 1 18.4,329.6" fill="none" stroke="#5B6663" stroke-width="1.5"/>
<g stroke="#1F2A28" stroke-width="1.8">
<line x1="0" y1="319" x2="0" y2="325"/>
<line x1="-15.4" y1="326.6" x2="-12.5" y2="330.1"/>
<line x1="15.4" y1="326.6" x2="12.5" y2="330.1"/>
</g>
</g>
<g id="needle">
<path d="M0,322 L3,345 L0,352 L-3,345 Z" fill="#1F2A28" stroke="#1F2A28" stroke-width="1" stroke-linejoin="round"/>
<circle cx="0" cy="345" r="3.5" fill="#1F2A28"/>
</g>
</defs>
<rect x="0" y="0" width="640" height="400" rx="10" fill="#F3EEE2"/>
<g stroke="#5B6663" stroke-width="1.2" stroke-opacity="0.7">
<line x1="235" y1="48" x2="235" y2="384"/>
<line x1="445" y1="48" x2="445" y2="384"/>
</g>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- panel 1: magnet pushed in -->
<rect x="123" y="55" width="14" height="75" fill="#2A766C" stroke="#1F2A28" stroke-width="2"/>
<rect x="123" y="130" width="14" height="75" fill="#A24A1A" stroke="#1F2A28" stroke-width="2"/>
<use xlink:href="#coil" transform="translate(130,0)"/>
<line x1="157" y1="72" x2="157" y2="148" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ah)"/>
<use xlink:href="#needle" transform="translate(130,0) rotate(40,0,345)"/>
<!-- panel 2: magnet at rest inside -->
<rect x="333" y="124" width="14" height="75" fill="#2A766C" stroke="#1F2A28" stroke-width="2"/>
<rect x="333" y="199" width="14" height="75" fill="#A24A1A" stroke="#1F2A28" stroke-width="2"/>
<use xlink:href="#coil" transform="translate(340,0)"/>
<use xlink:href="#needle" transform="translate(340,0)"/>
<!-- panel 3: magnet pulled out -->
<rect x="543" y="45" width="14" height="75" fill="#2A766C" stroke="#1F2A28" stroke-width="2"/>
<rect x="543" y="120" width="14" height="75" fill="#A24A1A" stroke="#1F2A28" stroke-width="2"/>
<use xlink:href="#coil" transform="translate(550,0)"/>
<line x1="577" y1="148" x2="577" y2="72" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ah)"/>
<use xlink:href="#needle" transform="translate(550,0) rotate(-40,0,345)"/>
<!-- leaders for shared labels -->
<g stroke="#1F2A28" stroke-width="1.4">
<line x1="101" y1="86" x2="121" y2="86"/>
<line x1="101" y1="216" x2="106" y2="216"/>
</g>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="130" y="30" text-anchor="middle">potisneš noter</text>
<text x="340" y="30" text-anchor="middle">magnet miruje v tuljavi</text>
<text x="550" y="30" text-anchor="middle">izvlečeš ven</text>
<text x="98" y="72" text-anchor="end">paličasti</text>
<text x="98" y="90" text-anchor="end">magnet</text>
<text x="98" y="108" text-anchor="end">¾ × 8½ palca</text>
<text x="98" y="202" text-anchor="end">tuljava,</text>
<text x="98" y="220" text-anchor="end">220 čevljev</text>
<text x="98" y="238" text-anchor="end">žice</text>
<text x="326" y="152" text-anchor="end" font-weight="bold">S</text>
<text x="312" y="246" text-anchor="end" font-weight="bold">N</text>
<text x="130" y="309" text-anchor="middle" font-size="16">0</text>
<text x="340" y="309" text-anchor="middle" font-size="16">0</text>
<text x="550" y="309" text-anchor="middle" font-size="16">0</text>
</g>
<text x="628" y="392" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
