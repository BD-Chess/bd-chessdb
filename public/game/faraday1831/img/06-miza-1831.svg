<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 130 640 230" width="640" height="230" role="img" aria-labelledby="t06 d06">
<title id="t06">Faradayeva miza v Royal Institution, avgust 1831</title>
<desc id="d06">Na mizi v vrsti, nepovezano: baterija iz treh korit z bakreno in cinkovo ploščo, tuljava bakrene žice z ovitjem iz niti, kosi mehkega železa (palica, kvader, kratka paličica), jeklena magneta (podkev in paličasti) ter galvanometer z iglo na ničli.</desc>
<rect x="0" y="130" width="640" height="230" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- battery: three trough cells, each with a copper and a zinc plate -->
