<path d="M46.5,178 Q59,162 71.5,178"/>
<path d="M86.5,178 Q99,162 111.5,178"/>
</g>
<!-- spool of thread-covered copper wire -->
<rect x="161" y="176" width="56" height="96" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<g stroke="#A24A1A" stroke-width="2.2">
<line x1="161" y1="181" x2="217" y2="181"/>
