<line x1="25" y1="210" x2="53" y2="210"/>
<line x1="65" y1="210" x2="93" y2="210"/>
<line x1="105" y1="210" x2="133" y2="210"/>
</g>
<g fill="#A24A1A" stroke="#1F2A28" stroke-width="1.6">
<rect x="29" y="178" width="5" height="94"/>
