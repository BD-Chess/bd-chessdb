<use xlink:href="#turn" transform="rotate(42)"/>
<use xlink:href="#turn" transform="rotate(48)"/>
<use xlink:href="#turn" transform="rotate(54)"/>
</g>
<!-- side A leads: switch and battery -->
<g fill="none" stroke="#A24A1A" stroke-width="2.4">
<path d="M270,107.5 V70 H230"/>
<path d="M164,70 H37 V158"/>
<path d="M270,272.5 V290 H162 V140 H146.4 V158"/>
</g>
