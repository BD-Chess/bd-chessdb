<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t07 d07">
<title id="t07">Faradayev obroč iz mehkega železa, 29. avgust 1831</title>
<desc id="d07">Obroč iz mehkega železa z dvema ločenima navitjema. Navitje A je prek stikala vezano na baterijo z desetimi pari plošč, navitje B pa po dolgi žici na galvanometer. Med navitjema je na železu viden presledek.</desc>
<defs>
<line id="turn" x1="60" y1="0" x2="102" y2="0"/>
</defs>
<rect x="0" y="0" width="640" height="380" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- soft iron ring -->
<path d="M425,190 A95,95 0 1 0 235,190 A95,95 0 1 0 425,190 Z M397,190 A67,67 0 1 0 263,190 A67,67 0 1 0 397,190 Z" fill="#C7CCC8" fill-rule="evenodd" stroke="#1F2A28" stroke-width="2.4"/>
<!-- coil A (left half) and coil B (right half), separate, with bare iron between -->
<path d="M274.4,275.5 A102,102 0 0 1 274.4,104.5 L297.3,139.7 A60,60 0 0 0 297.3,240.3 Z" fill="#A24A1A" fill-opacity="0.18" stroke="none"/>
<path d="M385.6,104.5 A102,102 0 0 1 385.6,275.5 L362.7,240.3 A60,60 0 0 0 362.7,139.7 Z" fill="#A24A1A" fill-opacity="0.18" stroke="none"/>
<g transform="translate(330,190)" stroke="#A24A1A" stroke-width="2.4">
