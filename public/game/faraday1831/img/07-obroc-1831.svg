<line x1="588.6" y1="165.5" x2="585.4" y2="169.3"/>
</g>
<path d="M568,165 L571,190 L568,197 L565,190 Z" fill="#1F2A28" stroke="#1F2A28" stroke-width="1"/>
<circle cx="568" cy="190" r="3.5" fill="#1F2A28"/>
<!-- leader for the ring label -->
<line x1="330" y1="322" x2="330" y2="288" stroke="#1F2A28" stroke-width="1.4"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="197" y="98" text-anchor="middle">stikalo</text>
<text x="91" y="234" text-anchor="middle">baterija</text>
<text x="91" y="252" text-anchor="middle">(10 parov plošč)</text>
<text x="230" y="152" text-anchor="end">stran A</text>
<text x="432" y="152">stran B</text>
<text x="470" y="54" text-anchor="middle">dolga žica</text>
<text x="568" y="140" text-anchor="middle">galvanometer</text>
<text x="330" y="338" text-anchor="middle">mehko železo, zunanji premer 6 palcev,</text>
<text x="330" y="356" text-anchor="middle">debelina 7/8 palca</text>
</g>
<text x="628" y="370" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
