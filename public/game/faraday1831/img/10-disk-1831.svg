<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t10 d10">
<title id="t10">Faradayev bakreni disk med poloma velikega magneta, 28. oktober 1831</title>
<desc id="d10">Velik sestavljen podkvasti magnet leži vodoravno; njegova pola N in S sta obrnjena drug proti drugemu z ozko režo. Navpični bakreni disk na vodoravni osi z ročico se z robom vrti skozi režo. Drsni stik na osi in drsni stik na robu med poloma vodita do galvanometra z odklonjeno iglo. Poševna projekcija: pol N je pred diskom, pol S za njim.</desc>
