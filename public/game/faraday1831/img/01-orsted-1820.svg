<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t01 d01">
<title id="t01">Ørstedov poskus, 1820: tok v žici odkloni magnetno iglo</title>
<desc id="d01">Ravna žica s sponkama plus in minus, pod njo kompasna igla na osi: brez toka vzporedna z žico, s tokom zasukana za približno 70 stopinj.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- wire with terminals -->
<line x1="87" y1="80" x2="553" y2="80" stroke="#A24A1A" stroke-width="3"/>
<circle cx="80" cy="80" r="7" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.2"/>
<circle cx="560" cy="80" r="7" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.2"/>
<!-- current arrow -->
<line x1="270" y1="56" x2="368" y2="56" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ah)"/>
<!-- rest position, dashed, parallel to the wire -->
<path d="M232,230 L320,221 L408,230 L320,239 Z" fill="none" stroke="#5B6663" stroke-width="2" stroke-dasharray="6 5"/>
<!-- deflected needle, turned about 70 degrees -->
<g transform="translate(320,230) rotate(-70)" stroke="#1F2A28" stroke-width="1.6">
<path d="M0,-9 L88,0 L0,9 Z" fill="#A24A1A"/>
<path d="M0,-9 L-88,0 L0,9 Z" fill="#2A766C"/>
</g>
<circle cx="320" cy="230" r="5" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="64" y="88" text-anchor="end" font-size="24">+</text>
<text x="576" y="88" font-size="24">−</text>
<text x="319" y="44" text-anchor="middle">tok</text>
<text x="420" y="235">brez toka</text>
<text x="364" y="152">s tokom</text>
<text x="337" y="140" text-anchor="end" font-weight="bold">N</text>
<text x="280" y="322" text-anchor="end" font-weight="bold">S</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
