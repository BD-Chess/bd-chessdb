<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t04 d04">
<title id="t04">Aragojev poskus z vrtečim se bakrenim diskom, Pariz 1824</title>
<desc id="d04">Bakren disk na navpični osi z ročico spodaj. Nad njim na niti visi magnetna igla, ki se zasuče v isto smer, kot se vrti disk.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- stand with thread -->
<line x1="90" y1="50" x2="90" y2="330" stroke="#1F2A28" stroke-width="5"/>
<rect x="68" y="330" width="44" height="8" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<line x1="90" y1="50" x2="300" y2="50" stroke="#1F2A28" stroke-width="4"/>
<line x1="300" y1="50" x2="300" y2="146" stroke="#1F2A28" stroke-width="1.4"/>
<!-- needle: S verdigris left, N copper right -->
<path d="M300,143 L375,150 L300,157 Z" fill="#A24A1A" stroke="#1F2A28" stroke-width="1.6"/>
<path d="M300,143 L225,150 L300,157 Z" fill="#2A766C" stroke="#1F2A28" stroke-width="1.6"/>
<circle cx="300" cy="150" r="3.5" fill="#F3EEE2" stroke="#1F2A28" stroke-width="1.6"/>
<!-- needle follows: curved arrow below it -->
<path d="M217.3,159.5 A88,16 0 0 0 382.7,159.5" fill="none" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ah)"/>
<!-- vertical axle and crank under the disk -->
<line x1="300" y1="286" x2="300" y2="324" stroke="#1F2A28" stroke-width="8"/>
<line x1="300" y1="286" x2="300" y2="324" stroke="#F3EEE2" stroke-width="3.5"/>
<line x1="300" y1="325" x2="352" y2="333" stroke="#1F2A28" stroke-width="5"/>
<line x1="352" y1="333" x2="352" y2="349" stroke="#1F2A28" stroke-width="7"/>
<!-- copper disk in perspective, with its edge -->
<path d="M130,240 V246 A170,44 0 0 0 470,246 V240" fill="#F3EEE2" stroke="none"/>
<path d="M130,240 V246 A170,44 0 0 0 470,246 V240" fill="#A24A1A" fill-opacity="0.38" stroke="#A24A1A" stroke-width="2.5"/>
<ellipse cx="300" cy="240" rx="170" ry="44" fill="#F3EEE2"/>
<ellipse cx="300" cy="240" rx="170" ry="44" fill="#A24A1A" fill-opacity="0.2" stroke="#A24A1A" stroke-width="2.5"/>
<ellipse cx="300" cy="240" rx="10" ry="3.5" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<!-- disk rotation arrow -->
<path d="M182.5,250.3 A125,30 0 0 0 417.5,250.3" fill="none" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ah)"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="310" y="104">magnetna igla na niti</text>
<text x="392" y="186">igla gre za diskom</text>
<text x="482" y="238">bakren disk</text>
<text x="482" y="256">se vrti</text>
<text x="226" y="139" text-anchor="middle" font-weight="bold">S</text>
<text x="374" y="139" text-anchor="middle" font-weight="bold">N</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
