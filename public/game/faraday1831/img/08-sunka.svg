<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t08 d08">
<title id="t08">Shema: sunka igle galvanometra ob vklopu in izklopu toka</title>
<desc id="d08">Dva časovna poteka. Zgoraj tok v strani A: nič, ob vklopu skok navzgor, stalna vrednost, ob izklopu padec na nič. Spodaj igla galvanometra na strani B: kratek sunek navzgor ob vklopu, med stalnim tokom na ničli, kratek sunek navzdol ob izklopu. Shema, ne meritev.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<!-- guides at switch on / switch off -->
<g stroke="#5B6663" stroke-width="1.6" stroke-dasharray="5 5">
<line x1="260" y1="52" x2="260" y2="330"/>
<line x1="470" y1="52" x2="470" y2="330"/>
</g>
<!-- zero lines -->
<g stroke="#5B6663" stroke-width="1.2" stroke-opacity="0.7">
<line x1="40" y1="120" x2="610" y2="120"/>
<line x1="40" y1="250" x2="610" y2="250"/>
</g>
<!-- time axis -->
<line x1="40" y1="330" x2="614" y2="330" stroke="#1F2A28" stroke-width="2" marker-end="url(#ah)"/>
<!-- top trace: current in side A -->
<path d="M40,120 H260 V70 H470 V120 H610" stroke="#A24A1A" stroke-width="2.6"/>
<!-- bottom trace: galvanometer needle on side B -->
<path d="M40,250 H260 L264,190 L270,262 L276,244 L282,254 L288,248 L294,251 L300,250 H470 L474,310 L480,238 L486,256 L492,246 L498,252 L504,249 L510,250 H610" stroke="#1F2A28" stroke-width="2.4"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="260" y="44" text-anchor="middle">vklop</text>
<text x="470" y="44" text-anchor="middle">izklop</text>
<text x="44" y="106">tok v strani A</text>
<text x="44" y="176">igla galvanometra (stran B)</text>
<text x="385" y="224" text-anchor="middle">stalni tok:</text>
<text x="385" y="241" text-anchor="middle">igla na ničli</text>
<text x="32" y="125" text-anchor="end" font-size="14">0</text>
<text x="32" y="255" text-anchor="end" font-size="14">0</text>
<text x="608" y="318" text-anchor="end">čas</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">shema, ne meritev</text>
</svg>
