<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t03 d03">
<title id="t03">Newmanova naprava za prikaz vrtenja, januar 1822</title>
<desc id="d03">Dve stekleni posodi z živim srebrom. Levo: pritrjen magnet, okoli katerega kroži prosto viseča žica. Desno: pritrjena žica, okoli katere kroži magnet, privezan z nitjo na dno. Obe posodi sta vezani na isti dovod do baterije.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- mercury in both vessels -->
<path d="M112,192 V272 Q112,288 128,288 H212 Q228,288 228,272 V192 Z" fill="#A7AFB4"/>
<path d="M332,192 V272 Q332,288 348,288 H432 Q448,288 448,272 V192 Z" fill="#A7AFB4"/>
<g stroke="#5B6663" stroke-width="1.6">
<line x1="112" y1="192" x2="228" y2="192"/>
<line x1="332" y1="192" x2="448" y2="192"/>
</g>
<!-- top bar on a pillar: joins the hanging wire (left) and the fixed wire (right) -->
<line x1="280" y1="78" x2="280" y2="302" stroke="#1F2A28" stroke-width="5"/>
<rect x="262" y="302" width="36" height="7" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<rect x="164" y="70" width="232" height="8" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<!-- LEFT: back of circling path -->
<path d="M136,214 A34,9 0 0 1 204,214" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4"/>
<!-- LEFT: fixed upright magnet in a socket -->
<rect x="161" y="172" width="18" height="54" fill="#A24A1A" stroke="#1F2A28" stroke-width="2"/>
<rect x="161" y="226" width="18" height="52" fill="#2A766C" stroke="#1F2A28" stroke-width="2"/>
<rect x="154" y="274" width="32" height="13" fill="#5B6663" fill-opacity="0.35" stroke="#1F2A28" stroke-width="2"/>
<!-- LEFT: freely hanging wire -->
<line x1="170" y1="78" x2="170" y2="84" stroke="#1F2A28" stroke-width="2.4"/>
<circle cx="170" cy="88" r="4" fill="none" stroke="#A24A1A" stroke-width="2.2"/>
<line x1="171" y1="92" x2="204" y2="218" stroke="#A24A1A" stroke-width="2.6"/>
<!-- LEFT: front of circling path -->
<path d="M136,214 A34,9 0 0 0 199.4,218.5" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<!-- RIGHT: back of circling path -->
<path d="M354,206 A36,9 0 0 1 426,206" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4"/>
<!-- RIGHT: fixed vertical wire -->
<line x1="390" y1="78" x2="390" y2="262" stroke="#A24A1A" stroke-width="3"/>
<!-- RIGHT: thread from the bottom to the lower pole -->
<line x1="372" y1="263" x2="386" y2="286" stroke="#1F2A28" stroke-width="1.6"/>
<circle cx="386" cy="286" r="2.5" fill="#1F2A28"/>
<!-- RIGHT: floating magnet, tilted, N above the mercury -->
<g transform="translate(372,262) rotate(-10.3)" stroke="#1F2A28" stroke-width="2">
<rect x="-7" y="-89" width="14" height="45" fill="#A24A1A"/>
<rect x="-7" y="-44" width="14" height="44" fill="#2A766C"/>
</g>
<!-- RIGHT: front of circling path -->
<path d="M426,206 A36,9 0 0 1 358.8,210.5" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<!-- glass vessels -->
<g fill="none" stroke="#5B6663" stroke-opacity="0.6" stroke-width="2.5">
<path d="M103,135 L110,141 V272 Q110,290 128,290 H212 Q230,290 230,272 V141 L237,135"/>
<path d="M323,135 L330,141 V272 Q330,290 348,290 H432 Q450,290 450,272 V141 L457,135"/>
</g>
<!-- leads through the vessel bottoms, one path to the battery -->
<g fill="none" stroke="#A24A1A" stroke-width="2.4">
<path d="M206,276 V326 H520"/>
<path d="M426,276 V312 H520"/>
</g>
<g fill="#F3EEE2" stroke="#1F2A28" stroke-width="2">
<circle cx="524" cy="312" r="4"/>
<circle cx="524" cy="326" r="4"/>
</g>
<!-- leaders -->
<g stroke="#1F2A28" stroke-width="1.4">
<line x1="104" y1="246" x2="126" y2="246"/>
<line x1="470" y1="282" x2="381" y2="276"/>
</g>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="170" y="40" text-anchor="middle">žica kroži okoli magneta</text>
<text x="390" y="40" text-anchor="middle">magnet kroži okoli žice</text>
<text x="154" y="186" text-anchor="end" font-weight="bold">N</text>
<text x="368" y="184" font-weight="bold">N</text>
<text x="100" y="251" text-anchor="end">živo srebro</text>
<text x="474" y="287">nit</text>
<text x="534" y="324">do baterije</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
