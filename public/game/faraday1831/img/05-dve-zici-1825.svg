<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t05 d05">
<title id="t05">Faradayev neuspeli poskus z dvema vzporednima žicama, 28. november 1825</title>
<desc id="d05">Dve dolgi vzporedni žici, ločeni z dvema plastema papirja. Zgornja je vezana na baterijo in po njej teče tok. Spodnja je vezana na galvanometer, katerega igla miruje na ničli.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- battery: four cells, copper and zinc plates -->
<g fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.2">
<rect x="252" y="54" width="30" height="36" rx="2"/>
<rect x="288" y="54" width="30" height="36" rx="2"/>
<rect x="324" y="54" width="30" height="36" rx="2"/>
<rect x="360" y="54" width="30" height="36" rx="2"/>
</g>
<g stroke="#A24A1A" stroke-width="3">
<line x1="261" y1="46" x2="261" y2="84"/>
<line x1="297" y1="46" x2="297" y2="84"/>
<line x1="333" y1="46" x2="333" y2="84"/>
<line x1="369" y1="46" x2="369" y2="84"/>
</g>
<g stroke="#5B6663" stroke-width="3">
<line x1="273" y1="46" x2="273" y2="84"/>
<line x1="309" y1="46" x2="309" y2="84"/>
<line x1="345" y1="46" x2="345" y2="84"/>
<line x1="381" y1="46" x2="381" y2="84"/>
</g>
<g fill="none" stroke="#1F2A28" stroke-width="2">
<path d="M273,46 Q285,34 297,46"/>
<path d="M309,46 Q321,34 333,46"/>
<path d="M345,46 Q357,34 369,46"/>
</g>
<!-- top wire, connected to the battery -->
<path d="M261,46 H110 V170 H530 V46 H381" fill="none" stroke="#A24A1A" stroke-width="2.5"/>
<line x1="284" y1="150" x2="356" y2="150" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ah)"/>
<!-- two layers of paper between the wires -->
<g fill="#FBF8F0" stroke="#5B6663" stroke-width="1.4">
<rect x="100" y="174" width="440" height="7"/>
<rect x="100" y="181" width="440" height="7"/>
</g>
<!-- bottom wire, connected to the galvanometer -->
<path d="M284,282 H130 V192 H510 V282 H356" fill="none" stroke="#A24A1A" stroke-width="2.5"/>
<!-- galvanometer, needle at zero -->
<circle cx="320" cy="282" r="36" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.4"/>
<path d="M298.8,264.2 A28,28 0 0 1 341.2,264.2" fill="none" stroke="#5B6663" stroke-width="1.5"/>
<g stroke="#1F2A28" stroke-width="1.8">
<line x1="320" y1="250" x2="320" y2="257"/>
<line x1="301.3" y1="259.7" x2="305.8" y2="265.1"/>
<line x1="338.7" y1="259.7" x2="334.2" y2="265.1"/>
</g>
<path d="M320,257 L323,282 L320,289 L317,282 Z" fill="#1F2A28" stroke="#1F2A28" stroke-width="1"/>
<circle cx="320" cy="282" r="3.5" fill="#1F2A28"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="321" y="114" text-anchor="middle">baterija</text>
<text x="320" y="140" text-anchor="middle">tok</text>
<text x="548" y="179">dve plasti</text>
<text x="548" y="197">papirja</text>
<text x="320" y="240" text-anchor="middle" font-size="16">0</text>
<text x="320" y="342" text-anchor="middle">galvanometer: igla miruje</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
