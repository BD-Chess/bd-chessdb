<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t02 d02">
<title id="t02">Faradayevo elektromagnetno vrtenje, 3.–4. september 1821</title>
<desc id="d02">Prerez globoke steklene posode z živim srebrom. V sredini pokončen magnet, pritrjen v vosek. Z nosilca visi žica, ki se spodaj potopi v živo srebro in kroži okoli magneta. Dovoda vodita do baterije.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1F2A28"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- mercury -->
<path d="M197,165 V280 Q197,298 215,298 H305 Q323,298 323,280 V165 Z" fill="#A7AFB4"/>
<line x1="197" y1="165" x2="323" y2="165" stroke="#5B6663" stroke-width="1.6"/>
<!-- back half of the circling path (behind magnet) -->
<path d="M224,202 A36,10 0 0 1 296,202" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4"/>
<!-- magnet: N copper on top, S verdigris below -->
<rect x="250" y="148" width="20" height="57" fill="#A24A1A" stroke="#1F2A28" stroke-width="2"/>
<rect x="250" y="205" width="20" height="62" fill="#2A766C" stroke="#1F2A28" stroke-width="2"/>
<!-- wax lump holding the magnet -->
<path d="M234,297 C230,281 238,264 251,259 L269,259 C282,264 290,281 286,297 Z" fill="#E4D7AE" stroke="#1F2A28" stroke-width="2"/>
<!-- bracket with hook -->
<line x1="455" y1="56" x2="455" y2="326" stroke="#1F2A28" stroke-width="5"/>
<rect x="437" y="326" width="36" height="8" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2"/>
<line x1="455" y1="60" x2="262" y2="60" stroke="#1F2A28" stroke-width="4"/>
<line x1="262" y1="60" x2="262" y2="69" stroke="#1F2A28" stroke-width="2.4"/>
<!-- freely hanging wire -->
<circle cx="262" cy="74" r="4.5" fill="none" stroke="#A24A1A" stroke-width="2.2"/>
<line x1="263" y1="79" x2="294" y2="206" stroke="#A24A1A" stroke-width="2.6"/>
<!-- front half of the circling path, with arrow -->
<path d="M296,202 A36,10 0 0 1 228.8,207" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<!-- glass vessel -->
<path d="M188,105 L195,111 V280 Q195,300 215,300 H305 Q325,300 325,280 V111 L332,105" fill="none" stroke="#5B6663" stroke-opacity="0.6" stroke-width="2.5"/>
<!-- battery and leads -->
<path d="M459,66 H560 V252" fill="none" stroke="#A24A1A" stroke-width="2.4"/>
<path d="M300,284 V342 H480 V275 H500" fill="none" stroke="#A24A1A" stroke-width="2.4"/>
<rect x="500" y="252" width="110" height="46" rx="4" fill="#F3EEE2" stroke="#1F2A28" stroke-width="2.2"/>
<!-- label leaders -->
<g stroke="#1F2A28" stroke-width="1.4">
<line x1="189" y1="196" x2="248" y2="238"/>
<line x1="333" y1="206" x2="300" y2="204"/>
<line x1="189" y1="246" x2="214" y2="246"/>
<line x1="189" y1="288" x2="240" y2="286"/>
</g>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1F2A28">
<text x="244" y="161" text-anchor="end" font-weight="bold">N</text>
<text x="185" y="201" text-anchor="end">magnet, pritrjen</text>
<text x="185" y="251" text-anchor="end">živo srebro</text>
<text x="185" y="293" text-anchor="end">vosek</text>
<text x="280" y="106">žica visi prosto</text>
<text x="338" y="200">žica kroži</text>
<text x="338" y="218">okoli magneta</text>
<text x="555" y="280" text-anchor="middle">baterija</text>
</g>
<text x="628" y="350" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#5B6663">rekonstrukcija</text>
</svg>
