<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t05 d05">
<title id="t05">Tok po cevi: hitrost ob steni je nič, v sredini največja (parabolični profil)</title>
<desc id="d05">Vzdolžni prerez cevi. Puščice hitrosti so v sredini najdaljše, proti stenama krajše, ob steni je hitrost nič; konice puščic ležijo na paraboli. Levo višji tlak, desno nižji. Pretok je sorazmeren razliki tlakov in četrti potenci polmera cevi.</desc>
