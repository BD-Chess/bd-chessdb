<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t03 d03">
<title id="t03">Kocka vode med plastmi: na zgornjo in spodnjo ploskev delujeta različno veliki strižni sili</title>
<desc id="d03">Levo: plasti tekočine, hitrost narašča z višino vse hitreje; označena je majhna kocka. Desno, povečano: kocka vode. Hitrejša plast nad njo jo vleče naprej z daljšo puščico, počasnejša plast pod njo jo zadržuje s krajšo puščico. Razlika sil premakne kocko.</desc>
