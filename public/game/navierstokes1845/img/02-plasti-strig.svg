<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t02 d02">
<title id="t02">Strig med ploščama: plasti tekočine drsijo druga ob drugi</title>
<desc id="d02">Tekočina med spodnjo mirujočo ploščo in zgornjo ploščo, ki se giblje s hitrostjo V. Puščice hitrosti enakomerno rastejo od nič ob spodnji plošči do V ob zgornji. Plasti drsijo druga ob drugi.</desc>
