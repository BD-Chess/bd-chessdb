<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t07 d07">
<title id="t07">Gladka žogica in žogica z jamicami: različno široka sled za njima</title>
<desc id="d07">Tok prihaja z leve. Zgoraj gladka žogica: tok se odlepi že pred njeno najširšo točko, sled za njo je široka, upor velik. Spodaj žogica z jamicami: tok se drži površine dlje in se odlepi šele za najširšo točko, sled je ožja, upor manjši.</desc>
