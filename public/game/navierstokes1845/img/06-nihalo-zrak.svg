<title id="t06">Nihalo v zraku: počasen tok zraka okoli kroglice in Stokesov zakon upora</title>
<desc id="d06">Levo: nihalo z majhno kroglico, ki niha v zraku. Desno, povečano: tokovnice zraka okoli kroglice pri počasnem gibanju; spredaj in zadaj so zrcalno enake in segajo daleč od kroglice. Spodaj Stokesov zakon iz leta 1851: upor je 6 pi krat viskoznost krat polmer krat hitrost.</desc>
