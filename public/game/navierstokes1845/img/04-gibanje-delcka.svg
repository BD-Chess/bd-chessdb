<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t04 d04">
<title id="t04">Gibanje majhnega kvadratka tekočine: premik, vrtenje, deformacija</title>
<desc id="d04">Trije prikazi. Črtkano kvadratek prej, polno potem. Levo premik: kvadratek se premakne, oblika ostane. Sredina vrtenje: kvadratek se zasuka okoli središča. Desno deformacija: kvadratek se v eni diagonali raztegne, v drugi stisne in postane romb.</desc>
