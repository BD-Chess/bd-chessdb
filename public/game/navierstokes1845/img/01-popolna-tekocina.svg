<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t01 d01">
<title id="t01">Popolna tekočina (Euler): tok okoli telesa je spredaj in zadaj enak, zato upora ni</title>
<desc id="d01">Levo: tokovnice popolne tekočine okoli okroglega telesa, zrcalno enake pred telesom in za njim. Puščici tlaka spredaj in zadaj sta enako dolgi, zato je upor enak nič. Desno, manjša slika: resnična voda; za telesom nastane sled z vrtinci.</desc>
