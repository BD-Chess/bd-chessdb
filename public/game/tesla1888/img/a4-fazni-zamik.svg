<title id="a4ft">Dvofazni generator: napetosti z zamikom 90 stopinj, shema</title>
<desc id="a4fd">Dve generatorski navitji sta shematsko prikazani pravokotno drugo na drugo. Na ločenih časovnih oseh sta napetosti sinusni in za četrt periode zamaknjeni; vrh druge je prej kakor vrh prve. Dejanski zamik tokov je poleg napetosti odvisen od priključene obremenitve.</desc>
