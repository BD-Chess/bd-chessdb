<text x="561" y="153">čas</text><text x="561" y="273">čas</text>
<text x="20" y="318">90° = T/4 pri stalni frekvenci vrtenja.</text>
<text x="20" y="342">Obremenjena tokova nista nujno zamaknjena za 90°.</text>
