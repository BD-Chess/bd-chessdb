<text x="20" y="29" font-size="18" font-weight="700">Dve pravokotni navitji, dva časovna poteka</text>
<text x="20" y="54">Fazni zamik napetosti: četrt periode.</text>
<text x="145" y="91" text-anchor="middle">B</text>
<text x="232" y="178">A</text>
<text x="145" y="279" text-anchor="middle">skupna vrtilna os</text>
<text x="273" y="117" fill="#2A766C" font-weight="700">U₁</text>
<text x="273" y="237" fill="#A24A1A" font-weight="700">U₂</text>
