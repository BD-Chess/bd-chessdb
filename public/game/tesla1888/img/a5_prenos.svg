<g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#1F2A28">
<text x="20" y="29" font-size="18" font-weight="700">Od elektrarne do mesta: dvig in spust napetosti</text>
<text x="20" y="56">Izmenični tok, manjše izgube na dolgem vodu.</text>
<text x="75" y="125" text-anchor="middle">elektrarna</text>
<text x="75" y="230" text-anchor="middle">generator</text>
<text x="197" y="124" text-anchor="middle">dvig U</text>
<text x="197" y="230" text-anchor="middle">trafo 1</text>
<text x="321" y="124" text-anchor="middle">visoka U</text>
<text x="321" y="230" text-anchor="middle">daljnovod</text>
<text x="445" y="124" text-anchor="middle">spust U</text>
<text x="445" y="230" text-anchor="middle">trafo 2</text>
<text x="564" y="124" text-anchor="middle">porabniki</text>
<text x="564" y="246" text-anchor="middle">zaščita</text>
<text x="20" y="293">Varovalka, odklop in ozemljeno ohišje ob porabnikih.</text>
<text x="20" y="319">Izgube na vodu: I²R; pri isti moči višja U zniža I.</text>
<text x="20" y="342">Blokovna shema, ne izvedbeni načrt omrežja.</text>
