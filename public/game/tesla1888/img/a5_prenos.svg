<title id="a5pt">Električni prenos od slapu do mesta: shema</title>
<desc id="a5pd">Elektrarna napaja transformator, ki za daljnovod zviša izmenično napetost in zniža tok. Drugi transformator napetost pri mestu zniža, tam pa so ponazorjene varovalka, odklop in ozemljitev kovinskega ohišja. Diagram prikazuje tok energije po blokih, ne dejanskega ožičenja.</desc>
