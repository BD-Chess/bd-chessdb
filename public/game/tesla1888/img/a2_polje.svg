<text x="20" y="29" font-size="18" font-weight="700">Mirujoča navitja, vrteče se polje</text>
<text x="20" y="54">Dve skupini s časovnim zamikom četrt periode.</text>
<text x="76" y="192">A</text><text x="379" y="192">A</text>
