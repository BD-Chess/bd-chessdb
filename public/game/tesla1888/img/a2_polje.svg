<title id="a2t">Vrteče se magnetno polje: didaktična rekonstrukcija</title>
<desc id="a2d">Štiri mirujoča navitja tvorijo vodoravno skupino A in navpično skupino B okoli rotorja. Štiri različno označene puščice prikazujejo smer skupnega polja v zaporednih četrtinah periode. Če obrnemo časovni vrstni red faz, se obrne tudi smer vrtenja polja.</desc>
