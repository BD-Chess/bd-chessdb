<title id="a1t">Komutator in iskrenje: poenostavljena shema</title>
<desc id="a1d">Dva položaja vrtljivega navitja sta prikazana s segmentoma komutatorja in nepremičnima ščetkama. Po polovici obrata se segmenta pri ščetkah zamenjata, s tem pa tudi smer toka v navitju glede na rotor. Drsni stik je označen kot mesto možnega iskrenja.</desc>
