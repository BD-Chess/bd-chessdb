<g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#1F2A28">
<text x="20" y="29" font-size="18" font-weight="700">Zakaj se prevodni rotor vrti?</text>
<text x="20" y="54">Indukcijski navor: didaktična shema</text>
<text x="353" y="107" font-weight="600">Vrteče se polje</text>
<text x="353" y="135">Rotor sledi počasneje</text>
<text x="353" y="189">Sklenjeni inducirani tok</text>
<text x="353" y="216">Magnetni odziv ustvari navor</text>
<text x="215" y="297" text-anchor="middle">prevodni rotor</text>
<text x="20" y="320">Zdrs: vrtilna hitrost rotorja je manjša od hitrosti polja.</text>
<text x="20" y="343">Izvedba strasbourškega modela iz 1883 ni potrjena.</text>
</g>
