<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="a3it a3id">
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<title id="a3it">Indukcijski navor in zdrs: današnja shema</title>
<desc id="a3id">Zunanje magnetno polje se vrti v isti smeri kot prevodni rotor, toda hitreje od njega. V rotorju je ponazorjena sklenjena pot induciranega toka, katerega magnetni odziv omogoča navor. Pri enaki vrtilni hitrosti bi v idealnem indukcijskem motorju pogonski indukcijski navor izginil.</desc>
