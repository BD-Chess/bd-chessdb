<g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#1F2A28">
<text x="20" y="29" font-size="18" font-weight="700">Tri možnosti napajanja dvofaznega motorja</text>
<text x="20" y="54">Število vodnikov in tokovne poti: shema.</text>
<text x="115" y="100" text-anchor="middle" font-size="17" font-weight="600">4 vodi</text>
<text x="320" y="100" text-anchor="middle" font-size="17" font-weight="600">3 vodi</text>
<text x="526" y="100" text-anchor="middle" font-size="17" font-weight="600">2 voda</text>
<text x="54" y="116" text-anchor="middle">vir</text><text x="175" y="116" text-anchor="middle">motor</text>
<text x="259" y="116" text-anchor="middle">vir</text><text x="381" y="116" text-anchor="middle">motor</text>
<text x="462" y="132" text-anchor="middle">vir</text>
<text x="553" y="166" text-anchor="middle">lokalni</text>
<text x="553" y="188" text-anchor="middle">zamik</text>
<text x="553" y="210" text-anchor="middle">R/L</text>
<text x="115" y="250" text-anchor="middle">dva ločena kroga</text>
<text x="320" y="238" text-anchor="middle">skupni: 1,41 I</text>
<text x="320" y="256" text-anchor="middle">pri zamiku 90°</text>
<text x="526" y="250" text-anchor="middle">motor z vejama</text>
<text x="20" y="297">Približno 15 % manj bakra: enaka gostota toka in dolžine.</text>
<text x="20" y="338">Pri dveh vodih je zamik odvisen od vezja in bremena.</text>
