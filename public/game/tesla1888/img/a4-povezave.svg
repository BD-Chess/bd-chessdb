<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="a4pt a4pd">
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<title id="a4pt">Štiri-, tri- in dvožično napajanje: shema</title>
<desc id="a4pd">Prva skica prikazuje dva ločena dvožična fazna tokokroga. Druga prikazuje dve fazni veji in skupni povratni vodnik, ki ob enakih tokovih z zamikom 90 stopinj prenaša približno 1,41-kratni tok ene veje. Tretja prikazuje dva dovodna vodnika ter krajevno vezje, ki ustvari fazni zamik pri motorju.</desc>
