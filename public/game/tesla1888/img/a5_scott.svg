</g>
<g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#1F2A28">
<text x="20" y="29" font-size="18" font-weight="700">Niagara → Buffalo: dvofazno v trifazno</text>
<text x="20" y="54">Črte prikazujejo faze, ne števila vodnikov.</text>
<text x="100" y="124" text-anchor="middle" font-size="17" font-weight="600">Niagara</text>
<text x="100" y="151" text-anchor="middle">2 fazi, 90°</text>
<text x="100" y="231" text-anchor="middle">25 Hz · 2.200 V</text>
<text x="329" y="124" text-anchor="middle" font-size="17" font-weight="600">Scottova vezava</text>
<text x="329" y="149" text-anchor="middle">transformatorji</text>
<text x="329" y="245" text-anchor="middle">2 fazi → 3 faze</text>
<text x="550" y="124" text-anchor="middle" font-size="17" font-weight="600">Buffalo</text>
<text x="550" y="148" text-anchor="middle">3 faze, 120°</text>
<text x="550" y="232" text-anchor="middle">11.000 V</text>
<text x="550" y="251" text-anchor="middle">1896</text>
<text x="20" y="310">Prenos v Buffalo se začne novembra 1896.</text>
<text x="20" y="339">Odcepi navitij in dejansko ožičenje niso prikazani.</text>
</g>
</svg>
