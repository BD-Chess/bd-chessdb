<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="a5st a5sd">
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<title id="a5st">Niagara in Buffalo: shema Scottove vezave</title>
<desc id="a5sd">Na levi je niagarska dvofazna proizvodnja s frekvenco 25 hercev in napetostjo 2200 voltov. Scottova transformatorska vezava na sredini prilagodi dve fazi s kotom 90 stopinj v tri faze s kotom 120 stopinj in zviša prenosno napetost. Na desni je trifazni vod proti Buffalu pri 11000 voltih.</desc>
