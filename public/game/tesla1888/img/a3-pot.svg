<text x="20" y="29" font-size="18" font-weight="700">Od Pariza do Strasbourga, 1882–1884</text>
<text x="20" y="54">Prostorska in časovna shema, ne zemljevid poti.</text>
<text x="122" y="123" font-size="17" font-weight="600">Pariz</text>
<text x="97" y="213" font-size="16">Ivry-sur-Seine</text>
<text x="451" y="137" font-size="17" font-weight="600">Strasbourg</text>
<text x="56" y="231">bližnji mesti</text>
<text x="408" y="231">vzhodneje</text>
<text x="108" y="306" text-anchor="middle">1882</text>
<text x="325" y="306" text-anchor="middle">1883</text>
<text x="541" y="306" text-anchor="middle">1884</text>
<text x="20" y="338">Strasbourg: poslovni zapisi 14. 10. 1883–24. 2. 1884.</text>
