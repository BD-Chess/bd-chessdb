<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="a3pt a3pd">
<rect x="0" y="0" width="640" height="360" rx="10" fill="#F3EEE2"/>
<title id="a3pt">Pariz, Ivry in Strasbourg: orientacijska shema</title>
<desc id="a3pd">V poenostavljenem prostorskem prikazu sta Pariz in bližnji Ivry-sur-Seine na zahodu, Strasbourg pa vzhodneje. Spodaj je časovna os let 1882 do 1884 z označenim obdobjem ohranjenih strasbourških poslovnih zapisov. Natančna pot in morebitni vmesni postanki niso narisani.</desc>
