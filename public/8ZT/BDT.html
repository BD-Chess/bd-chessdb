function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function deriveKey(keyMaterial,salt,iter){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(keyMaterial),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
function keyMaterialFromInput(value){const raw=String(value||'').trim();if(raw.includes('||'))return raw;return raw+'||'+String(location.hostname||'').toLowerCase();}
async function unlock(input){const keyMaterial=keyMaterialFromInput(input);const key=await deriveKey(keyMaterial,b64ToBytes(PAYLOAD.salt),PAYLOAD.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(PAYLOAD.iv),additionalData:b64ToBytes(PAYLOAD.aad)},key,b64ToBytes(PAYLOAD.ct));return new TextDecoder().decode(pt);}
function initPage(){let scale=parseFloat(localStorage.getItem('bdtFontScale')||'1');function apply(){document.documentElement.style.setProperty('--fontScale',scale.toFixed(2));localStorage.setItem('bdtFontScale',scale.toFixed(2));}window.fontStep=(d)=>{scale=Math.max(.82,Math.min(1.42,scale+d));apply();};window.fontReset=()=>{scale=1;apply();};window.setLang=(lang)=>{document.querySelectorAll('.lang-panel').forEach(el=>el.hidden=el.dataset.lang!==lang);document.documentElement.lang=lang;document.querySelectorAll('[data-lang-btn]').forEach(b=>b.classList.toggle('active',b.dataset.langBtn===lang));localStorage.setItem('bdtLang',lang);window.scrollTo({top:0,behavior:'smooth'});};apply();setLang(localStorage.getItem('bdtLang')||'sl');}
document.getElementById('unlockForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='';try{const html=await unlock(document.getElementById('pw').value);document.getElementById('gate').hidden=true;const app=document.getElementById('app');app.hidden=false;app.innerHTML='<div class="topbar"><div class="topbar-inner"><a class="brand" href="#">BDT · BD HSR/PiX</a><div class="tools"><button data-lang-btn="sl" onclick="setLang('sl')">SL</button><button data-lang-btn="en" onclick="setLang('en')">EN</button><button onclick="fontStep(-0.08)">A−</button><button onclick="fontReset()">A</button><button onclick="fontStep(0.08)">A+</button></div></div></div>'+html;initPage();}catch(err){msg.textContent='Dostop ni dovoljen ali geslo ni pravilno.';}});
