function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function decText(a){return new TextDecoder().decode(a);}
function dom(){return String.fromCharCode(...D);}
function hostOk(h){return (h||'').toLowerCase().replace(/\.$/,'')===dom();}
async function keyFrom(secret){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(S),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function openPage(secret){
 const key=await keyFrom(secret);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(I)},key,b64(C));
 const doc=decText(plain);
 document.open();document.write(doc);document.close();
}
async function tryOpen(pw){
 const raw=(pw||'').trim(); if(!raw) throw new Error('empty');
 let secret='';
 if(raw.includes('||')){ secret=raw; }
 else { if(!hostOk(location.hostname)) throw new Error('x'); secret=raw+'||'+dom(); }
 await openPage(secret);
}
document.getElementById('f').addEventListener('submit', async e=>{
 e.preventDefault(); const m=document.getElementById('m'); m.textContent='';
 try{ await tryOpen(document.getElementById('pw').value); }catch(err){ m.textContent='Dostop ni uspel.'; }
});
['copy','cut','paste','contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{capture:true}));
document.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if(e.key==='PrintScreen'||e.key==='F12'||(e.ctrlKey&&['c','x','s','p','u','a'].includes(k))||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();e.stopPropagation();}
},true);
