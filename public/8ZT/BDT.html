const CANON_HINT = '7d39f0';
function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function sha256Hex(s){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s||'')));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function cleanHost(s){return String(s||'').trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0].replace(/:\d+$/,'').replace(/^www\.www\./,'www.');}
async function deriveKey(material,salt,iter){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(material),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function unlock(input){
 const raw=String(input||'').trim();
 const sep=raw.indexOf('||');
 const visibleHost=cleanHost(location.hostname);
 const suppliedHost=(sep>=0?cleanHost(raw.slice(sep+2)):'');
 const proofHost=suppliedHost||visibleHost;
 const hostOk=proofHost&&((await sha256Hex(proofHost))===HOST_SHA256);
 if(!hostOk)throw new Error('ACCESS_DENIED');
 const pass=(sep>=0?raw.slice(0,sep):raw);
 const keyMaterial=pass+'||'+proofHost;
 const key=await deriveKey(keyMaterial,b64ToBytes(PAYLOAD.salt),PAYLOAD.iter);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(PAYLOAD.iv),additionalData:b64ToBytes(PAYLOAD.aad)},key,b64ToBytes(PAYLOAD.ct));
 return new TextDecoder().decode(pt);
}
function installGuards(){
 const block=e=>{try{e.preventDefault();e.stopPropagation();}catch(_){} return false;};
 ['contextmenu','copy','cut','paste','selectstart','dragstart','drop'].forEach(ev=>document.addEventListener(ev,block,{capture:true}));
 document.addEventListener('keydown',async e=>{
   const k=(e.key||'').toLowerCase();
   const blocked=(e.ctrlKey||e.metaKey)&&['c','x','v','s','p','u','a'].includes(k) ||
                 e.key==='F12' || e.key==='PrintScreen' ||
                 ((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k));
   if(blocked){block(e); if(e.key==='PrintScreen'&&navigator.clipboard){try{await navigator.clipboard.writeText('');}catch(_){}} showShieldFlash();}
 },{capture:true});
 window.addEventListener('beforeprint',showShieldFlash);
 window.addEventListener('afterprint',hideShieldFlash);
}
function showShieldFlash(){let f=document.getElementById('shieldFlash');if(f){f.classList.add('show');setTimeout(()=>f.classList.remove('show'),900);}}
function hideShieldFlash(){let f=document.getElementById('shieldFlash');if(f)f.classList.remove('show');}
function initPage(){let scale=parseFloat(localStorage.getItem('bdtFontScale')||'1');function apply(){document.documentElement.style.setProperty('--fontScale',scale.toFixed(2));localStorage.setItem('bdtFontScale',scale.toFixed(2));}window.fontStep=(d)=>{scale=Math.max(.82,Math.min(1.42,scale+d));apply();};window.fontReset=()=>{scale=1;apply();};window.setLang=(lang)=>{document.querySelectorAll('.lang-panel').forEach(el=>el.hidden=el.dataset.lang!==lang);document.documentElement.lang=lang;document.querySelectorAll('[data-lang-btn]').forEach(b=>b.classList.toggle('active',b.dataset.langBtn===lang));localStorage.setItem('bdtLang',lang);window.scrollTo({top:0,behavior:'smooth'});};apply();setLang(localStorage.getItem('bdtLang')||'sl');installGuards();}
document.getElementById('unlockForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='';try{const html=await unlock(document.getElementById('pw').value);document.getElementById('gate').hidden=true;const app=document.getElementById('app');app.hidden=false;app.innerHTML='<div class="topbar"><div class="topbar-inner"><a class="brand" href="#">BDT · BD HSR/PiX</a><div class="tools"><button data-lang-btn="sl" onclick="setLang(\'sl\')">SL</button><button data-lang-btn="en" onclick="setLang(\'en\')">EN</button><button onclick="fontStep(-0.08)">A−</button><button onclick="fontReset()">A</button><button onclick="fontStep(0.08)">A+</button></div></div></div>'+html;initPage();}catch(err){msg.textContent='Dostop ni dovoljen ali geslo ni pravilno.';}});
installGuards();
</script>
</body>
</html>
