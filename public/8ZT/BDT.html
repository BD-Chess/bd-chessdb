const te=new TextEncoder();
function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function derive(secret){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BOX.salt),iterations:BOX.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
function secretFromInput(raw){raw=String(raw||'').trim();if(raw.includes('||'))return raw;return raw+'||'+String(location.hostname||'').toLowerCase();}
async function unlock(raw){const key=await derive(secretFromInput(raw));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.iv)},key,b64(BOX.data));return new TextDecoder().decode(plain);}
function preGuards(){const stop=e=>{e.preventDefault();e.stopPropagation();return false;};['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,stop,{capture:true}));document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','v','s','p','u','a','i','j'].includes(k))return stop(e);if(k==='f12'||k==='printscreen')return stop(e);},{capture:true});}
preGuards();
document.getElementById('unlock').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.textContent='';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(ex){err.textContent='Dostop ni uspel.';}
});
})();
</script>
