<style>
:root{--bg:#070914;--panel:#101624;--card:#111b2c;--line:#26344f;--line2:#39506f;--text:#edf4ff;--muted:#a8b5c9;--dim:#78879e;--cyan:#67e8f9;--green:#2ef2a3;--gold:#ffd76a;--red:#ff6b84;--violet:#bd93f9;--orange:#ffb86c;--fontScale:1;--radius:20px;}
*{box-sizing:border-box} html{scroll-behavior:smooth;scroll-padding-top:88px} body{margin:0;min-height:100vh;background:radial-gradient(circle at 13% -8%,rgba(103,232,249,.15),transparent 34rem),radial-gradient(circle at 92% 4%,rgba(46,242,163,.10),transparent 31rem),radial-gradient(circle at 52% 100%,rgba(189,147,249,.10),transparent 38rem),linear-gradient(180deg,#060812,#080b14);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:calc(18px * var(--fontScale));line-height:1.72;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-underline-offset:.18em} code,pre{font-family:Consolas,Menlo,ui-monospace,monospace} .wrap,.page{width:min(1280px,calc(100% - 28px));margin:auto}
.lock{min-height:100vh;display:grid;place-items:center;padding:30px} .lock-card{width:min(680px,100%);border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(17,27,44,.96),rgba(9,14,25,.96));box-shadow:0 24px 90px rgba(0,0,0,.42);padding:clamp(24px,5vw,42px)} .lock-card h1{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:10px 0 14px;letter-spacing:-.055em} .eyebrow{color:var(--cyan);font-size:.74em;text-transform:uppercase;letter-spacing:.18em;font-weight:900} .muted{color:var(--muted)}
input[type=password]{width:100%;padding:15px 16px;border:1px solid var(--line2);border-radius:15px;background:#0a1020;color:var(--text);font-size:1.05em;outline:none} input[type=password]:focus{border-color:var(--cyan)} button{appearance:none;border:1px solid var(--line2);background:#0d1425;color:var(--text);border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer} button:hover,button.active{border-color:var(--cyan);color:var(--cyan)} .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .error{color:var(--red);margin-top:12px;font-weight:800}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,9,20,.88);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)} .topbar-inner{width:min(1280px,calc(100% - 28px));margin:auto;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap} .brand{font-weight:950;color:#fff;text-decoration:none} .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero{padding:clamp(42px,8vw,96px) 0 38px;border-bottom:1px solid var(--line)} h1{font-size:clamp(2.5rem,7vw,5.7rem);line-height:.98;margin:12px 0 18px;letter-spacing:-.065em} h2{font-size:clamp(1.65rem,3.8vw,2.7rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.035em} h3{font-size:1.14em;color:var(--gold);margin:0 0 10px} p{margin:0 0 16px} .subtitle,.lead{color:#dce8fb;font-size:1.12em;max-width:1040px}
.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px} .badges span,.tag{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.04);color:var(--muted);font-size:.82em;font-weight:800} .nav{position:sticky;top:64px;z-index:80;margin:0 -14px;padding:10px 14px;background:rgba(7,9,20,.82);backdrop-filter:blur(12px);display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line)} .nav a{white-space:nowrap;text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:.82em;font-weight:850} .nav a:hover{color:var(--cyan);border-color:var(--cyan)}
section.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(18,27,46,.94),rgba(11,17,31,.86));box-shadow:0 22px 70px rgba(0,0,0,.27);padding:clamp(21px,4vw,42px);margin:28px 0} .callout{border:1px solid rgba(255,215,106,.28);background:rgba(255,215,106,.08);border-radius:18px;padding:18px;margin:20px 0;color:#ffedbd} .verdict-panel{border-color:rgba(46,242,163,.28)!important} .grid{display:grid;gap:16px} .cards{grid-template-columns:repeat(4,minmax(0,1fr))} .metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 0} .card,.metric,.source-group{border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035);padding:17px} .card .k,.metric span{display:block;color:var(--dim);font-size:.74em;text-transform:uppercase;letter-spacing:.12em;font-weight:900} .card .v,.metric strong{display:block;color:#fff;font-size:1.35em;line-height:1.1;font-weight:950;margin:7px 0} .metric strong{color:var(--green);font-size:1.55em} .metric small{display:block;color:var(--muted)}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:20px 0} th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left} th{background:rgba(255,255,255,.055);color:#fff;font-size:.8em;text-transform:uppercase;letter-spacing:.08em} td{color:var(--muted)} tr:last-child td{border-bottom:0} .sources{padding-bottom:48px} .source-group{margin:14px 0} .source-group ul{columns:2;column-gap:34px;margin:0;padding-left:22px} .source-group li{break-inside:avoid;margin:0 0 9px;color:var(--muted)} .footer{padding:38px 0 70px;color:var(--dim);font-size:.9em;text-align:center}
[hidden]{display:none!important} #app,#app *{-webkit-tap-highlight-color:transparent} #app.protected,#app.protected *{user-select:none!important;-webkit-user-select:none!important;-ms-user-select:none!important;-webkit-touch-callout:none!important} #app.privacy-blur{filter:blur(18px);pointer-events:none;transition:filter .12s ease} body.no-printing *{display:none!important} @media print{html,body{background:#000!important} body *{display:none!important;visibility:hidden!important} body:before{content:"";display:block!important;min-height:100vh;background:#000!important}}
@media(max-width:980px){.cards,.metrics{grid-template-columns:1fr 1fr}.source-group ul{columns:1}.nav{top:104px}} @media(max-width:640px){body{font-size:calc(17px * var(--fontScale))}.cards,.metrics{grid-template-columns:1fr}.topbar-inner{align-items:flex-start;padding:10px 0}.nav{top:112px}table{font-size:.9em}th,td{padding:9px 8px}}
</style>

function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function sha256Hex(s){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s||'')));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function cleanToken(s){return String(s||'').trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0].replace(/:\d+$/,'').replace(/\.$/,'');}
function splitSecret(raw){const s=String(raw||'').trim();const p=s.indexOf('||');if(p>=0)return{pw:s.slice(0,p),token:cleanToken(s.slice(p+2))};return{pw:s,token:cleanToken(location.hostname)};}
async function deriveKey(material,salt,iter){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(material),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function unlock(input){if(!window.crypto||!crypto.subtle)throw new Error('NO_CRYPTO');const parts=splitSecret(input);if(!parts.pw||!parts.token)throw new Error('ACCESS_DENIED');if((await sha256Hex(parts.token))!==TOKEN_SHA256)throw new Error('ACCESS_DENIED');const key=await deriveKey(parts.pw+'||'+parts.token,b64ToBytes(PAYLOAD.salt),PAYLOAD.iter);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(PAYLOAD.iv),additionalData:b64ToBytes(PAYLOAD.aad)},key,b64ToBytes(PAYLOAD.ct));return new TextDecoder().decode(pt);}
function installContentProtection(){const app=document.getElementById('app');if(!app||app.dataset.protectInstalled==='1')return;app.dataset.protectInstalled='1';app.classList.add('protected');const stop=e=>{try{e.preventDefault();e.stopPropagation();}catch(_){}return false;};['contextmenu','copy','cut','paste','dragstart','drop','selectstart'].forEach(ev=>app.addEventListener(ev,stop,true));document.addEventListener('keydown',e=>{const k=String(e.key||'').toLowerCase();const mod=e.ctrlKey||e.metaKey;if(e.key==='PrintScreen'){stop(e);try{navigator.clipboard&&navigator.clipboard.writeText('');}catch(_){}app.classList.add('privacy-blur');setTimeout(()=>app.classList.remove('privacy-blur'),900);return false;}if(mod&&['a','c','x','s','p','u'].includes(k)){return stop(e);}if(mod&&e.shiftKey&&['i','j','c'].includes(k)){return stop(e);}if(e.key==='F12'){return stop(e);}},true);window.addEventListener('beforeprint',()=>document.body.classList.add('no-printing'));window.addEventListener('afterprint',()=>document.body.classList.remove('no-printing'));document.addEventListener('visibilitychange',()=>{if(document.hidden)app.classList.add('privacy-blur');else setTimeout(()=>app.classList.remove('privacy-blur'),250);});}
function initPage(){let scale=parseFloat(localStorage.getItem('bdtFontScale')||'1');function apply(){document.documentElement.style.setProperty('--fontScale',scale.toFixed(2));localStorage.setItem('bdtFontScale',scale.toFixed(2));}window.fontStep=(d)=>{scale=Math.max(.82,Math.min(1.42,scale+d));apply();};window.fontReset=()=>{scale=1;apply();};window.setLang=(lang)=>{document.querySelectorAll('.lang-panel').forEach(el=>el.hidden=el.dataset.lang!==lang);document.documentElement.lang=lang;document.querySelectorAll('[data-lang-btn]').forEach(b=>b.classList.toggle('active',b.dataset.langBtn===lang));localStorage.setItem('bdtLang',lang);window.scrollTo({top:0,behavior:'smooth'});};apply();setLang(localStorage.getItem('bdtLang')||'sl');installContentProtection();}
