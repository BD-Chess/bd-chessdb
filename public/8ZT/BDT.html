const te = new TextEncoder();
function b64(s){ const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
async function derive(secret){
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BOX.salt),iterations:BOX.iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
}
function secretFromInput(raw){
  raw = String(raw||'').trim();
  if(raw.includes('||')) return raw;
  return raw + '||' + String(location.hostname||'').toLowerCase();
}
async function unlock(raw){
  const key = await derive(secretFromInput(raw));
  const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.iv)}, key, b64(BOX.data));
  return new TextDecoder().decode(plain);
}
function guards(){
  const stop=e=>{e.preventDefault();e.stopPropagation();return false;};
  ['copy','cut','paste','contextmenu','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,stop,{capture:true}));
  document.addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if(e.ctrlKey||e.metaKey){ if(['c','x','v','s','p','u','a','i','j'].includes(k)) return stop(e); }
    if(k==='f12'||k==='printscreen'){ try{navigator.clipboard&&navigator.clipboard.writeText('');}catch(_){} return stop(e); }
  },{capture:true});
  window.addEventListener('blur',()=>document.body.classList.add('blur-lock'));
  window.addEventListener('focus',()=>document.body.classList.remove('blur-lock'));
}
function initTools(){
  document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{
    const lang=btn.getAttribute('data-lang');
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{el.hidden = el.getAttribute('data-i18n')!==lang;});
  }));
  let scale=1;
  function apply(){document.documentElement.style.setProperty('--fontScale', String(scale));}
  document.querySelectorAll('[data-font]').forEach(btn=>btn.addEventListener('click',()=>{
    const v=btn.getAttribute('data-font');
    if(v==='down') scale=Math.max(.82, scale-.08); else if(v==='up') scale=Math.min(1.38, scale+.08); else scale=1;
    apply();
  }));
}
document.getElementById('unlock').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.getElementById('app').innerHTML=html;
    guards(); initTools();
    history.replaceState(null, document.title, location.pathname);
  }catch(ex){err.textContent='Dostop ni uspel.';}
});
})();
</script>
