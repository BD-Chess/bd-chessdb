
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZ</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c10;--bg2:#12151c;--border:#2a2f3c;--text:#e8eaf0;--muted:#5a6275;--gold:#ffd740;--red:#ef4444;--green:#22c55e;--mono:'JetBrains Mono',monospace;--body:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
body.unlocked{display:block}
.v{width:min(92vw,360px);text-align:center;animation:fi .6s ease}
@keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sh{animation:sh .4s ease}
.logo{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:.75}
.sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:28px}
input{width:100%;padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;transition:border-color .2s;margin-bottom:12px}
input:focus{border-color:var(--gold)}input::placeholder{color:var(--muted)}
button{width:100%;padding:14px;background:transparent;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
button:hover{background:rgba(255,215,64,.08)}button:disabled{opacity:.35;cursor:wait}
.st{font-family:var(--mono);font-size:12px;margin-top:16px;min-height:32px;line-height:1.5;color:var(--muted)}
.st.w{color:var(--gold)}.st.e{color:var(--red)}.st.ok{color:var(--green)}
.f{display:none;width:100%;height:100vh;border:none;background:#fff}
body.unlocked .v{display:none}body.unlocked .f{display:block}
.note{margin-top:22px;font-size:11px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="v" id="V">
  <div class="logo">8Z·Vault</div>
  <div class="sub">Remote 8Z vault loader · ZZ</div>
  <input id="P" type="password" placeholder="Passphrase" autocomplete="off">
  <button id="B" onclick="go()">Unlock</button>
  <div class="st" id="S"></div>
  <div class="note">
    Loader at GitHub / vault at Netlify is fine, but Netlify must allow cross-origin fetches from your GitHub Pages domain.
  </div>
</div>
<iframe class="f" id="F" sandbox="allow-scripts allow-same-origin"></iframe>

<script>
'use strict';

/*
Required on Netlify for cross-origin fetch from GitHub Pages:

/*
  Access-Control-Allow-Origin: *
  Access-Control-Allow-Methods: GET, HEAD, OPTIONS

Safer alternative:
  Access-Control-Allow-Origin: https://YOURNAME.github.io
*/

const VAULT_URL = 'https://remarkable-sopapillas-d3e79a.netlify.app/ZZ.8zv';
const PREFERRED_HTML = 'ZZ';
const MAGIC = new Uint8Array([0x38,0x5A,0x56,0x31]);
const M64 = (1n << 64n) - 1n;
let openedObjectUrls = [];

class XS {
  constructor(s) {
    let v = s & M64;
    this.state = v === 0n ? 0x9E3779B97F4A7C15n : v;
  }
  n() {
    let x = this.state;
    x = (x ^ ((x >> 12n) & M64)) & M64;
    x = (x ^ ((x << 25n) & M64)) & M64;
    x = (x ^ ((x >> 27n) & M64)) & M64;
    this.state = x;
    return (x * 2685821657736338717n) & M64;
  }
}

function u2b(v) {
  const b = new Uint8Array(8);
  for (let i = 7; i >= 0; i--) {
    b[i] = Number(v & 0xFFn);
    v >>= 8n;
  }
  return b;
}

function b2u(b) {
  let v = 0n;
  for (let i = 0; i < 8; i++) v = (v << 8n) | BigInt(b[i]);
  return v;
}

async function h(d) {
  const b = (d instanceof Uint8Array) ? d : new TextEncoder().encode(d);
  return new Uint8Array(await crypto.subtle.digest('SHA-256', b));
}

function cat(...a) {
  let l = 0;
  for (const x of a) l += x.length;
  const o = new Uint8Array(l);
  let p = 0;
  for (const x of a) {
    o.set(x, p);
    p += x.length;
  }
  return o;
}

async function dk(pp, salt) {
  const ph = await h(pp);
  const sm = await h(cat(ph, salt, new TextEncoder().encode("8Z_AUTH_V1")));
  const r = new XS(b2u(sm.slice(0, 8)));
  for (let i = 0; i < 1024; i++) r.n();
  const sh = await h(u2b(r.state));
  const c = cat(ph, sh);
  const km = await crypto.subtle.importKey('raw', c, 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 10000000, hash: 'SHA-256' },
    km,
    256
  ));
}

async function gunzipBytes(data) {
  const ds = new DecompressionStream('gzip');
  const w = ds.writable.getWriter();
  const rd = ds.readable.getReader();
  await w.write(data);
  await w.close();

  const chunks = [];
  while (true) {
    const { done, value } = await rd.read();
    if (done) break;
    chunks.push(value);
  }

  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) {
    out.set(c, off);
    off += c.length;
  }
  return out;
}

async function decryptBundle(blob, pp) {
  const buf = new Uint8Array(blob);
  if (buf.length < 52) throw new Error('Vault too small');
  for (let i = 0; i < 4; i++) if (buf[i] !== MAGIC[i]) throw new Error('Bad vault magic');

  const salt = buf.slice(8, 40);
  const iv   = buf.slice(40, 52);
  const ct   = buf.slice(52);

  const keyBytes = await dk(pp, salt);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const compressed = new Uint8Array(
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, ct)
  );
  const plain = await gunzipBytes(compressed);
  return JSON.parse(new TextDecoder().decode(plain));
}

async function decryptSectionB64(b64, pp) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

  const salt = buf.slice(0, 32);
  const iv   = buf.slice(32, 44);
  const ct   = buf.slice(44);

  const keyBytes = await dk(pp, salt);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const compressed = new Uint8Array(
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, key, ct)
  );
  const plain = await gunzipBytes(compressed);
  return new TextDecoder().decode(plain);
}

function findMainHtml(bundle) {
  const keys = Object.keys(bundle);
  const htmls = keys.filter(k => /\.html?$/i.test(k));
  if (!htmls.length) throw new Error('No HTML file inside bundle');

  if (PREFERRED_HTML) {
    const pref = PREFERRED_HTML.toLowerCase();
    const exact = htmls.find(k => k.toLowerCase() === pref || k.toLowerCase() === pref + '.html' || k.toLowerCase() === pref + '.htm');
    if (exact) return exact;
    const stem = htmls.find(k => k.toLowerCase().replace(/\.html?$/i, '') === pref.replace(/\.html?$/i, ''));
    if (stem) return stem;
  }
  return htmls[0];
}

function maybeExtractInnerPayload(html) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const payload = doc.getElementById('_8zD');
    const form = doc.getElementById('_8zForm');
    if (payload && form) return payload.textContent.trim();
  } catch (_) {}
  return null;
}

function ext(name) {
  const m = /\.([^.?#/]+)(?:[?#].*)?$/i.exec(name);
  return m ? m[1].toLowerCase() : '';
}

function mimeFromName(name) {
  switch (ext(name)) {
    case 'css': return 'text/css;charset=utf-8';
    case 'js': return 'text/javascript;charset=utf-8';
    case 'json': return 'application/json;charset=utf-8';
    case 'svg': return 'image/svg+xml;charset=utf-8';
    case 'html':
    case 'htm': return 'text/html;charset=utf-8';
    case 'txt': return 'text/plain;charset=utf-8';
    default: return 'text/plain;charset=utf-8';
  }
}

function cleanupObjectUrls() {
  for (const u of openedObjectUrls) URL.revokeObjectURL(u);
  openedObjectUrls = [];
}

function buildBundleUrlMap(bundle, mainKey) {
  cleanupObjectUrls();
  const map = new Map();
  const basenameCount = new Map();

  for (const name of Object.keys(bundle)) {
    const base = name.split('/').pop();
    basenameCount.set(base, (basenameCount.get(base) || 0) + 1);
  }

  for (const [name, content] of Object.entries(bundle)) {
    if (name === mainKey) continue;
    const url = URL.createObjectURL(new Blob([content], { type: mimeFromName(name) }));
    openedObjectUrls.push(url);
    map.set(name, url);

    const base = name.split('/').pop();
    if ((basenameCount.get(base) || 0) === 1 && !map.has(base)) {
      map.set(base, url);
    }
    if (!map.has('./' + base)) map.set('./' + base, url);
  }
  return map;
}

function rewriteRefs(html, bundle, mainKey) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const map = buildBundleUrlMap(bundle, mainKey);
  const els = doc.querySelectorAll('[src],[href]');

  for (const el of els) {
    for (const attr of ['src', 'href']) {
      const val = el.getAttribute(attr);
      if (!val) continue;
      if (/^(https?:|data:|blob:|mailto:|tel:|#)/i.test(val)) continue;

      const bare = val.split('#')[0].split('?')[0];
      const repl = map.get(val) || map.get(bare) || map.get(bare.replace(/^\.\//, ''));
      if (repl) el.setAttribute(attr, repl);
    }
  }

  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function setStatus(msg, cls) {
  const st = document.getElementById('S');
  st.textContent = msg;
  st.className = cls ? 'st ' + cls : 'st';
}

document.getElementById('P').addEventListener('keydown', e => {
  if (e.key === 'Enter') go();
});

async function go() {
  const pp = document.getElementById('P').value;
  if (!pp) return;

  const btn = document.getElementById('B');
  const v = document.getElementById('V');
  btn.disabled = true;

  try {
    setStatus('Fetching vault...', 'w');
    const resp = await fetch(VAULT_URL, { cache: 'no-store', mode: 'cors' });
    if (!resp.ok) throw new Error('Vault fetch failed: HTTP ' + resp.status);

    const blob = await resp.arrayBuffer();

    setStatus('Decrypting bundle...', 'w');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const bundle = await decryptBundle(blob, pp);

    const mainKey = findMainHtml(bundle);
    let html = bundle[mainKey];
    if (typeof html !== 'string') throw new Error('Main HTML is not text');

    const innerPayload = maybeExtractInnerPayload(html);
    if (innerPayload) {
      setStatus('Decrypting protected page...', 'w');
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      html = await decryptSectionB64(innerPayload, pp);
    }

    html = rewriteRefs(html, bundle, mainKey);

    document.getElementById('F').srcdoc = html;
    document.body.classList.add('unlocked');
    setStatus('Unlocked', 'ok');
  } catch (e) {
    console.error(e);
    let msg = 'Unlock failed';
    if ((e && typeof e.message === 'string' && e.message.includes('fetch failed')) || e instanceof TypeError) {
      msg = 'Fetch blocked. Check Netlify CORS headers.';
    }
    setStatus(msg, 'e');
    v.classList.remove('sh');
    void v.offsetWidth;
    v.classList.add('sh');
    document.getElementById('P').value = '';
    document.getElementById('P').focus();
  }

  btn.disabled = false;
}
</script>
</body>
</html>
