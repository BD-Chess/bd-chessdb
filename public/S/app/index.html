<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#08101d">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-title" content="8zSudoku">
 <link rel="manifest" href="./manifest.webmanifest">
 <link rel="apple-touch-icon" href="./icon-180.png">
 <title>8zSudoku APP · iPhone preview</title>
 <style>
  *,*::before,*::after{box-sizing:border-box}
  html{background:#070c16;color:#e5edfa;font:16px/1.45 system-ui,sans-serif}
  body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 30%,#15344d 0,#0b1526 42%,#070c16 90%)}
  a{color:#b7eafe}
  .site-nav{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:14px max(16px,calc((100vw - 1160px)/2));font-size:.73rem;font-weight:800;letter-spacing:.07em}
  .site-nav a{padding:9px 11px;border-radius:12px;text-decoration:none;color:#9eb2ce}
  .site-nav a:hover,.site-nav a:focus-visible{color:white;background:#223650;outline:none}
  .site-nav a[aria-current=page]{color:#67e5f5;background:#113749}
  main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px 40px}
  h1{font-size:1.35rem;line-height:1.15;margin:0;text-align:center;letter-spacing:.02em}
  .subtitle{margin:0;color:#a5b6d0;text-align:center;font-size:.87rem}
  .preview-tools{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin:4px 0 2px}
  .preview-tools button,.preview-tools a{min-height:40px;padding:8px 12px;border:1px solid #4e6782;border-radius:11px;background:#122239;color:#e5edfa;text-decoration:none;font:700 .82rem system-ui;cursor:pointer}
  .preview-tools button[aria-pressed=true]{background:#124553;border-color:#68e6ef;color:#9cfaff}
  .preview-tools button:focus-visible,.preview-tools a:focus-visible{outline:3px solid #fbba57;outline-offset:2px}
  .device{--device-width:390px;position:relative;flex:none;width:calc(var(--device-width) + 18px);height:862px;padding:0 9px;border:3px solid #758397;border-radius:51px;background:#030710;box-shadow:0 0 0 2px #192537,0 25px 80px #000b,0 0 60px #14d2ec20}
  .screen{position:relative;height:100%;overflow:hidden;border-radius:39px;background:#080e1a}
  .island{position:absolute;z-index:2;top:8px;left:50%;transform:translateX(-50%);width:114px;height:28px;border-radius:18px;background:#03040a;pointer-events:none}
  .safe-top{height:43px;background:#080e1a}
  iframe{display:block;width:100%;height:calc(100% - 68px);border:0;background:#080e1a}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:118px;height:4px;border-radius:5px;background:#d8e5f8b8;pointer-events:none}
  body.unframed .device{width:var(--device-width);height:818px;padding:0;border:0;border-radius:0;box-shadow:0 15px 35px #0008}
  body.unframed .screen{border-radius:0}
  body.unframed .island,body.unframed .safe-top,body.unframed .home{display:none}
  body.unframed iframe{height:100%}
  .note{max-width:560px;margin:0;color:#879dbb;text-align:center;font-size:.74rem}
  @media(max-width:480px){main{padding-inline:0}.site-nav{justify-content:center;padding-inline:2px}.site-nav a{padding:7px 6px;font-size:.62rem}.device{max-width:100vw}}
 </style>
</head>
<body>
 <nav class="site-nav" aria-label="8zSudoku versions">
  <a href="../">CURRENT</a><a href="../old/">PREVIOUS</a><a href="../new/">LAB</a><a href="./" aria-current="page">APP</a>
 </nav>
 <main>
  <h1>8zSudoku · APP</h1>
  <p class="subtitle">iPhone preview — the same mobile game surface as the APP edition.</p>
  <div class="preview-tools" role="group" aria-label="iPhone display width">
   <button type="button" data-width="375">375</button><button type="button" data-width="390">390</button><button type="button" data-width="402">402</button><button type="button" data-width="430">430</button>
   <button type="button" id="toggleFrame" aria-pressed="false">Open without frame</button>
   <button type="button" id="appPwaOpen">Install app / Offline</button>
  </div>
  <div class="device" id="device"><div class="screen"><div class="island" aria-hidden="true"></div><div class="safe-top" aria-hidden="true"></div><iframe id="game" title="8zSudoku APP game" allow="fullscreen"></iframe><div class="home" aria-hidden="true"></div></div></div>
  <p class="note">Play and Learn use one game. APP storage is separate from LAB and CURRENT.</p>
 </main>
 <script>
 (()=>{
  const params=new URLSearchParams(location.search),allowed=['375','390','402','430'];
  const device=document.getElementById('device'),buttons=[...document.querySelectorAll('[data-width]')],frame=document.getElementById('toggleFrame');
  let width=allowed.includes(params.get('width'))?params.get('width'):'390';
  const draw=()=>{device.style.setProperty('--device-width',width+'px');buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===width)));frame.setAttribute('aria-pressed',String(document.body.classList.contains('unframed')));frame.textContent=document.body.classList.contains('unframed')?'Show iPhone frame':'Open without frame';};
  buttons.forEach(b=>b.addEventListener('click',()=>{width=b.dataset.width;draw();}));
  frame.addEventListener('click',()=>{document.body.classList.toggle('unframed');draw();});
  const game=document.getElementById('game');game.src='./app.html'+location.hash;
  window.addEventListener('hashchange',()=>{game.contentWindow?.location.replace('./app.html'+location.hash);});
  draw();
 })();
 </script>
 <script src="./pwa.js"></script>
</body>
</html>
