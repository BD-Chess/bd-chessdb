
# DualFrame AI R&D: public page, authenticated API only.
[functions."dualframe-*"]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/api/df/auth"
  to = "/.netlify/functions/dualframe-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/df/*"
  to = "/.netlify/functions/dualframe-api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/Nara/dualframe-lab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/Nara/dualframe-lab/cmarvel-01/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
# END DualFrame AI R&D
